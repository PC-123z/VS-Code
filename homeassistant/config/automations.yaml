  - trigger: state
    entity_id:
    - media_player.bedroom_tv
    to:
    - paused
    - idle
    id: paused
  - trigger: state
    entity_id: media_player.bedroom_tv
    to: 'off'
    id: tv_off
  - device_id: 7501054a9a45dcff214f4cf4f9c143ef
    domain: media_player
    entity_id: 3cd6130d1d36d755abf52c6ebdb4aeab
    type: playing
    trigger: device
    id: playing
  - device_id: 7501054a9a45dcff214f4cf4f9c143ef
    domain: media_player
    entity_id: 3cd6130d1d36d755abf52c6ebdb4aeab
    type: paused
    trigger: device
    id: paused
  - device_id: 7501054a9a45dcff214f4cf4f9c143ef
    domain: media_player
    entity_id: 3cd6130d1d36d755abf52c6ebdb4aeab
    type: idle
    trigger: device
    id: paused
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: playing
      - condition: or
        conditions:
        - condition: state
          entity_id: light.bedroom_ceiling_1
          state: 'on'
        - condition: state
          entity_id: light.bedroom_ceiling_2
          state: 'on'
        - condition: state
          entity_id: light.bedroom_lamp_1
          state: 'on'
        - condition: state
          entity_id: light.bedroom_lamp_2
          state: 'on'
      sequence:
      - action: automation.turn_off
        target:
          entity_id: automation.big_bedroom_smart_motion_presence
      - action: switch.turn_off
        target:
          entity_id:
          - switch.al_big_bedroom
          - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_color_big_bedroom_al
          - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_brightness_big_bedroom_al
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.al_big_bedroom
          lights:
          - light.bedroom_ceiling_1
          - light.bedroom_ceiling_2
          - light.bedroom_lamp_1
          - light.bedroom_lamp_2
          manual_control: true
      - alias: Pre-stage Nanoleaf at 1% to avoid flash-to-white
        action: light.turn_on
        target:
          entity_id: light.nano_sand_dune
        data:
          brightness_pct: 1
          color_temp_kelvin: '{{ tv_kelvin | int }}'
      - parallel:
        - action: light.turn_on
          target:
            entity_id:
            - light.bedroom_ceiling_1
            - light.bedroom_ceiling_2
            - light.bedroom_lamp_1
            - light.bedroom_lamp_2
          data:
            brightness_pct: '{{ playing_brightness | int }}'
            color_temp_kelvin: '{{ tv_kelvin | int }}'
            transition: 3
        - action: light.turn_on
          target:
            entity_id: light.nano_sand_dune
          data:
            brightness_pct: '{{ playing_nano_brightness | int }}'
            color_temp_kelvin: '{{ tv_kelvin | int }}'
            transition: 3
        - action: fan.turn_on
          target:
            entity_id: fan.big_bedroom_fan
          data:
            percentage: 25
    - conditions:
      - condition: trigger
        id: paused
      sequence:
      - alias: Pre-stage Nanoleaf at 1% to avoid flash-to-white
        action: light.turn_on
        target:
          entity_id: light.nano_sand_dune
        data:
          brightness_pct: 1
          color_temp_kelvin: '{{ tv_kelvin | int }}'
      - parallel:
        - action: light.turn_on
          target:
            entity_id:
            - light.bedroom_ceiling_1
            - light.bedroom_ceiling_2
            - light.bedroom_lamp_1
            - light.bedroom_lamp_2
          data:
            brightness_pct: '{{ paused_brightness | int }}'
            color_temp_kelvin: '{{ tv_kelvin | int }}'
            transition: 3
        - action: light.turn_on
          target:
            entity_id: light.nano_sand_dune
          data:
            brightness_pct: '{{ paused_nano_brightness | int }}'
            color_temp_kelvin: '{{ tv_kelvin | int }}'
            transition: 3
    - conditions:
      - condition: trigger
        id: tv_off
      sequence:
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.al_big_bedroom
          lights:
          - light.bedroom_ceiling_1
          - light.bedroom_ceiling_2
          - light.bedroom_lamp_1
          - light.bedroom_lamp_2
          manual_control: false
      - action: switch.turn_on
        target:
          entity_id:
          - switch.al_big_bedroom
          - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_color_big_bedroom_al
          - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_brightness_big_bedroom_al
      - action: automation.turn_on
        target:
          entity_id: automation.big_bedroom_smart_motion_presence
      - action: adaptive_lighting.apply
        continue_on_error: true
        data:
          entity_id: switch.al_big_bedroom
          lights:
          - light.bedroom_ceiling_1
          - light.bedroom_ceiling_2
          - light.bedroom_lamp_1
          - light.bedroom_lamp_2
          transition: 3
          adapt_color: true
          adapt_brightness: true
          prefer_rgb_color: true
      - action: light.turn_off
        target:
          entity_id: light.nano_sand_dune
        data:
          transition: 3
  variables:
    sun_elev: '{{ state_attr(''sun.sun'', ''elevation'') | float(0) }}'
    tv_kelvin: '{% if sun_elev > 10 %}4000 {% elif sun_elev > -6 %}2700 {% else %}2200
      {% endif %}'
    paused_brightness: '{% if sun_elev > 10 %}60 {% elif sun_elev > -6 %}35 {% else
      %}15 {% endif %}'
    playing_brightness: '{% if sun_elev > 10 %}15 {% elif sun_elev > -6 %}5 {% else
      %}2 {% endif %}'
    paused_nano_brightness: '{{ [paused_brightness | int, 20] | min }}'
    playing_nano_brightness: '{{ [playing_brightness | int, 20] | min }}'
  mode: restart
- id: '1776965023589'
  alias: 'Office/Bedroom 2: Smart Motion & Presence'
  description: AL daytime, sleep mode evening. Handles motion 07:00-22:30 only. Stands
    down when bedroom2_occupied is on (Bedtime Routine has taken over). Hard cutoff
    at 22:30 - no motion response after that until 07:00.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.bedroom2_sensor_apollo_radar_moving_target
    to:
    - 'on'
    id: detected
  - trigger: state
    entity_id:
    - binary_sensor.bedroom_2_sensor_group
    to:
    - 'off'
    for:
      minutes: 20
    id: stopped
  - trigger: state
    entity_id: switch.adaptive_lighting_sleep_mode_office
    to: 'on'
    id: sleep_on
  - trigger: state
    entity_id: switch.adaptive_lighting_sleep_mode_office
    to: 'off'
    id: sleep_off
  - trigger: time
    at: '23:45:00'
    id: lights_out
  - trigger: time
    at: 00:00:00
    id: midnight_override_reset
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sleep_on
      - alias: Skip if dimmer override is active
        condition: state
        entity_id: input_boolean.bedroom2_manual_override
        state: 'off'
      - alias: Skip if room already occupied - avoid waking a sleeping person
        condition: state
        entity_id: input_boolean.bedroom2_occupied
        state: 'off'
      - alias: Skip if lights are already off - don't turn on lights in an empty room
        condition: state
        entity_id: light.ribbon
        state: 'on'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.ribbon
        data:
          effect: Sleep Mode
      - action: light.turn_on
        target:
          entity_id: light.fluttershy
        data:
          effect: Sleep Mode
      - delay:
          seconds: 1
      - action: light.turn_on
        target:
          entity_id: light.ribbon
        data:
          brightness_pct: 3
      - action: light.turn_on
        target:
          entity_id: light.fluttershy
        data:
          brightness_pct: 3
    - conditions:
      - condition: trigger
        id: sleep_off
      sequence:
      - condition: state
        entity_id: input_boolean.bedroom2_occupied
        state: 'off'
      - choose:
        - conditions:
          - condition: time
            after: '15:30:00'
            before: '19:30:00'
            weekday:
            - mon
            - tue
            - wed
            - thu
            - fri
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.ribbon
            data:
              effect: Jungle
          - action: light.turn_on
            target:
              entity_id: light.fluttershy
            data:
              effect: Flow
        - conditions: []
          sequence:
          - action: light.turn_off
            target:
              entity_id:
              - light.ribbon
              - light.fluttershy
              - light.bedroom_2
            data:
              transition: 2
    - conditions:
      - condition: trigger
        id: lights_out
      sequence:
      - alias: Skip lights_out if dimmer override is active (keep lights as set)
        condition: state
        entity_id: input_boolean.bedroom2_manual_override
        state: 'off'
      - action: light.turn_off
        target:
          entity_id:
          - light.ribbon
          - light.fluttershy
          - light.office_1
          - light.office_2
        data:
          transition: 15
    - conditions:
      - condition: trigger
        id: midnight_override_reset
      sequence:
      - alias: Clear override at midnight so automations resume normally
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.bedroom2_manual_override
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.adaptive_lighting_office
          lights:
          - light.office
          manual_control: false
      - alias: Do NOT re-enable AL here — it would immediately turn ribbon/fluttershy
          back on. Good Morning routine handles re-enabling AL at wake time.
        action: light.turn_off
        target:
          entity_id:
          - light.ribbon
          - light.fluttershy
          - light.office_1
          - light.office_2
        data:
          transition: 30
    - conditions:
      - condition: trigger
        id: detected
      - alias: Hard block - Smart Motion only active 07:00 to 22:30
        condition: time
        after: 07:00:00
        before: '22:30:00'
      - alias: Stand down if Bedtime Routine has taken over
        condition: state
        entity_id: input_boolean.bedroom2_occupied
        state: 'off'
      sequence:
      - alias: Skip all light changes if manual override is active
        condition: state
        entity_id: input_boolean.bedroom2_manual_override
        state: 'off'
      - choose:
        - alias: Sleep mode active - gentle red bump only, no bright flash
          conditions:
          - condition: state
            entity_id: switch.adaptive_lighting_sleep_mode_office
            state: 'on'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.ribbon
            data:
              brightness_pct: 8
              rgb_color:
              - 255
              - 62
              - 1
              transition: 2
          - action: light.turn_on
            target:
              entity_id: light.fluttershy
            data:
              brightness_pct: 8
              rgb_color:
              - 255
              - 62
              - 1
              transition: 2
        - conditions:
          - condition: time
            after: '22:15:00'
            before: '22:30:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.office
            data:
              brightness_pct: 4
              rgb_color:
              - 255
              - 62
              - 1
              transition: 2
          - action: light.turn_off
            target:
              entity_id:
              - light.ribbon
              - light.fluttershy
            data:
              transition: 2
        - conditions:
          - condition: time
            after: '15:30:00'
            before: '19:30:00'
            weekday:
            - mon
            - tue
            - wed
            - thu
            - fri
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.office
            data:
              transition: 2
          - if:
            - condition: state
              entity_id: switch.adaptive_lighting_office
              state: 'on'
            - condition: template
              value_template: "{{ 'light.office' not in\n   (state_attr('switch.adaptive_lighting_office',
                'manual_control') | default([])) }}\n"
            then:
            - action: adaptive_lighting.apply
              continue_on_error: true
              data:
                entity_id: switch.adaptive_lighting_office
                lights:
                - light.office
                transition: 2
                adapt_color: true
                adapt_brightness: true
          - action: light.turn_on
            target:
              entity_id: light.ribbon
            data:
              effect: Jungle
          - action: light.turn_on
            target:
              entity_id: light.fluttershy
            data:
              effect: Flow
        - conditions:
          - condition: time
            after: 06:30:00
            before: '22:15:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.office
            data:
              transition: 2
          - if:
            - condition: state
              entity_id: switch.adaptive_lighting_office
              state: 'on'
            - condition: template
              value_template: "{{ 'light.office' not in\n   (state_attr('switch.adaptive_lighting_office',
                'manual_control') | default([])) }}\n"
            then:
            - action: adaptive_lighting.apply
              continue_on_error: true
              data:
                entity_id: switch.adaptive_lighting_office
                lights:
                - light.office
                transition: 2
                adapt_color: true
                adapt_brightness: true
        - conditions: []
          sequence:
          - action: light.turn_off
            target:
              entity_id:
              - light.ribbon
              - light.fluttershy
              - light.office_1
              - light.office_2
            data:
              transition: 2
    - conditions:
      - condition: trigger
        id: stopped
      - alias: Skip if hard-off window (11:45 PM - 7 AM) - let Bedtime/Morning routines
          own this
        condition: time
        after: 07:00:00
        before: '23:45:00'
      sequence:
      - alias: Clear manual override when room has been empty 20 minutes
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.bedroom2_manual_override
      - alias: Clear manual_control so AL can take over on next motion
        action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.adaptive_lighting_office
          lights:
          - light.office
          manual_control: false
      - alias: Re-enable AL switches so they're ready for next motion
        action: switch.turn_on
        target:
          entity_id:
          - switch.adaptive_lighting_office
          - switch.adaptive_lighting_adapt_color_office
          - switch.adaptive_lighting_adapt_brightness_office
      - alias: Re-enable sleep mode if it should be active (after 22:15)
        if:
        - condition: time
          after: '22:15:00'
          before: 06:30:00
        then:
        - action: switch.turn_on
          target:
            entity_id: switch.adaptive_lighting_sleep_mode_office
      - action: light.turn_off
        target:
          entity_id:
          - light.ribbon
          - light.fluttershy
          - light.office_1
          - light.office_2
        data:
          transition: 30
  mode: restart
- id: '1776981794880'
  alias: Departure - Start Window on Climatization
