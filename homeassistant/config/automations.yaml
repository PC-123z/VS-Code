          - action: light.turn_on
            target:
              entity_id: light.nano_sand_dune
            data:
              brightness_pct: 50
              transition: 5
        - conditions:
          - condition: time
            after: '22:00:00'
            before: '23:00:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.bedroom
            data:
              transition: 30
          - action: adaptive_lighting.apply
            continue_on_error: true
            data:
              entity_id: switch.al_big_bedroom
              lights:
              - light.bedroom_ceiling_1
              - light.bedroom_ceiling_2
              - light.bedroom_lamp_1
              - light.bedroom_lamp_2
              transition: 30
              adapt_color: true
              adapt_brightness: true
              prefer_rgb_color: true
          - action: light.turn_on
            target:
              entity_id: light.nano_sand_dune
            data:
              rgb_color:
              - 255
              - 100
              - 0
              brightness_pct: 30
              transition: 5
        - conditions:
          - condition: time
            after: '23:00:00'
            before: 07:00:00
          sequence:
          - choose:
            - alias: Sleep mode already on - go straight to red to avoid white flash
              conditions:
              - condition: state
                entity_id: switch.al_sleep_mode_big_bedroom
                state: 'on'
              sequence:
              - action: light.turn_on
                target:
                  entity_id: light.bedroom
                data:
                  brightness_pct: 10
                  rgb_color:
                  - 255
                  - 30
                  - 0
                  transition: 30
              - action: light.turn_on
                target:
                  entity_id: light.nano_sand_dune
                data:
                  brightness_pct: 10
                  rgb_color:
                  - 255
                  - 30
                  - 0
                  transition: 30
            default:
            - action: light.turn_on
              target:
                entity_id: light.bedroom
              data:
                transition: 30
            - action: adaptive_lighting.apply
              continue_on_error: true
              data:
                entity_id: switch.al_big_bedroom
                lights:
                - light.bedroom_ceiling_1
                - light.bedroom_ceiling_2
                - light.bedroom_lamp_1
                - light.bedroom_lamp_2
                transition: 30
                adapt_color: true
                adapt_brightness: true
                prefer_rgb_color: true
            - action: light.turn_on
              target:
                entity_id: light.nano_sand_dune
              data:
                rgb_color:
                - 255
                - 30
                - 0
                brightness_pct: '{{ [50 - ((now().hour * 60 + now().minute - 23 *
                  60) / 60 * 48) | round(0), 2] | max }}'
                transition: 30
    - conditions:
      - condition: trigger
        id: stopped
      - alias: Skip if override is active - overridden lights hold until the 30-min
          reset
        condition: state
        entity_id: input_boolean.big_bedroom_manual_override
        state: 'off'
      sequence:
      - alias: Turn lights off first before re-enabling AL to prevent race condition
        action: light.turn_off
        target:
          entity_id:
          - light.nano_sand_dune
          - light.bedroom_ceiling_1
          - light.bedroom_ceiling_2
          - light.bedroom_lamp_1
          - light.bedroom_lamp_2
        data:
          transition: 15
      - alias: Wait for transition to complete before re-enabling AL
        delay:
          seconds: 16
      - alias: Clear manual_control so AL can take over on next motion
        action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.al_big_bedroom
          lights:
          - light.bedroom_ceiling_1
          - light.bedroom_ceiling_2
          - light.bedroom_lamp_1
          - light.bedroom_lamp_2
          manual_control: false
      - alias: Re-enable AL switches so they're ready for next motion
        action: switch.turn_on
        target:
          entity_id:
          - switch.al_big_bedroom
          - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_color_big_bedroom_al
          - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_brightness_big_bedroom_al
      - alias: Re-enable sleep mode if it should be active (after 23:00)
        if:
        - condition: time
          after: '23:00:00'
          before: 07:00:00
        then:
        - action: switch.turn_on
          target:
            entity_id: switch.al_sleep_mode_big_bedroom
      - action: input_select.select_option
        target:
          entity_id: input_select.bedroom_scene_mode
        data:
          option: al
        enabled: false
  mode: restart
- id: '1775504917028'
  alias: 'Living Room: Smart Motion & Presence'
