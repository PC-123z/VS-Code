- id: '1778500000000'
  alias: 'System: Global Daily Automation Reset'
  description: 'Daily safety-net reset that runs after the morning sleep mode unwind.
    Clears

    all manual override flags, ensures motion/presence automations are enabled,

    re-enables AL switches house-wide, clears stuck manual_control flags, and

    resets scene mode selectors. Runs at 07:30 M-F and 10:15 Sat-Sun.

    '
  triggers:
  - trigger: time
    at: 07:30:00
    id: weekday_reset
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  - trigger: time
    at: '11:45:00'
    id: weekend_reset
    weekday:
    - sat
    - sun
  conditions:
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: trigger
        id: weekday_reset
      - condition: time
        weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
    - condition: and
      conditions:
      - condition: trigger
        id: weekend_reset
      - condition: time
        weekday:
        - sat
        - sun
  actions:
  - alias: Clear all manual override input booleans
    action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.bedroom2_manual_override
      - input_boolean.kitchen_manual_override
      - input_boolean.dining_room_manual_override
      - input_boolean.big_bedroom_manual_override
  - alias: Re-enable garage auto-close (in case it was disabled for garage work)
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.garage_auto_close_enabled
  - alias: Ensure all motion/presence automations are enabled
    action: automation.turn_on
    target:
      entity_id:
      - automation.kitchen_on
      - automation.bathroom_smart_motion_presence
      - automation.big_bedroom_smart_motion_presence
      - automation.living_room_smart_motion_presence
      - automation.dining_room_smart_motion_presence
      - automation.office_bedroom_2_smart_motion_presence_2
  - alias: Disable all sleep mode flags (catches any stuck ones)
    action: switch.turn_off
    target:
      entity_id:
      - switch.al_sleep_mode_hallway
      - switch.al_sleep_mode_kitchen
      - switch.al_sleep_mode_kitchen_main
      - switch.al_sleep_mode_big_bedroom
      - switch.al_sleep_mode_living_room
      - switch.al_sleep_mode_dining_room_bottom
      - switch.al_sleep_mode_dining_room_top
      - switch.al_sleep_mode_bathroom
      - switch.al_sleep_mode_bathroom_main
      - switch.adaptive_lighting_sleep_mode_office
  - alias: Re-enable all AL switches house-wide
    action: switch.turn_on
    target:
      entity_id:
      - switch.al_hallway
      - switch.al_kitchen
      - switch.al_kitchen_main
      - switch.al_big_bedroom
      - switch.al_living_room
      - switch.al_dining_room_bottom
      - switch.al_dining_room_top
      - switch.al_bathroom
      - switch.al_bathroom_main
      - switch.adaptive_lighting_office
      - switch.adaptive_lighting_adapt_color_office
      - switch.adaptive_lighting_adapt_brightness_office
  - alias: Clear all manual_control flags so AL resumes adapting
    action: adaptive_lighting.set_manual_control
    continue_on_error: true
    data:
      entity_id: switch.al_hallway
      manual_control: false
  - action: adaptive_lighting.set_manual_control
    continue_on_error: true
    data:
      entity_id: switch.al_kitchen
      manual_control: false
  - action: adaptive_lighting.set_manual_control
    continue_on_error: true
    data:
      entity_id: switch.al_kitchen_main
      manual_control: false
  - action: adaptive_lighting.set_manual_control
    continue_on_error: true
    data:
      entity_id: switch.al_big_bedroom
      manual_control: false
  - action: adaptive_lighting.set_manual_control
    continue_on_error: true
    data:
      entity_id: switch.al_living_room
      manual_control: false
  - action: adaptive_lighting.set_manual_control
    continue_on_error: true
    data:
      entity_id: switch.al_dining_room_bottom
      manual_control: false
  - action: adaptive_lighting.set_manual_control
    continue_on_error: true
    data:
      entity_id: switch.al_dining_room_top
      manual_control: false
  - action: adaptive_lighting.set_manual_control
    continue_on_error: true
    data:
      entity_id: switch.al_bathroom
      manual_control: false
  - action: adaptive_lighting.set_manual_control
    continue_on_error: true
    data:
      entity_id: switch.al_bathroom_main
      manual_control: false
  - action: adaptive_lighting.set_manual_control
    continue_on_error: true
    data:
      entity_id: switch.adaptive_lighting_office
      manual_control: false
  - alias: Reset scene mode selectors back to default
    action: input_select.select_option
    continue_on_error: true
    target:
      entity_id: input_select.office_scene_mode
    data:
      option: al
  - alias: Notify that reset completed
    action: notify.mobile_app_pc_iphone
    data:
      title: Daily Automation Reset
      message: 'House-wide reset complete: overrides cleared, motion automations enabled,
        AL restored.'
    enabled: false
  mode: single
- id: '1775373515241'
  alias: 'Bathroom: Smart Motion & Presence (Split Color/White)'
  triggers:
  - trigger: state
    entity_id: binary_sensor.bathroom_motion
    to: 'on'
    id: detected
  - trigger: state
    entity_id: binary_sensor.bathroom_motion
    to: 'off'
    id: stopped
  - trigger: state
    entity_id: binary_sensor.bathroom_motion
    to: 'off'
    for:
      minutes: 15
    id: catch_all
  - trigger: state
    entity_id: binary_sensor.bathroom_motion
    to: 'off'
    for:
      minutes: 30
    id: hard_off
  - trigger: state
    entity_id:
    - light.bathroom_shower
    - light.bathroom_tub_1
    - light.bathroom_tub_2
    - light.bathroom_back
    - light.bathroom_main_lights
    to: 'on'
    for:
      minutes: 45
    id: failsafe
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: detected
      sequence:
      - condition: template
        value_template: "{% set lights = [\n  'light.bathroom_shower',\n  'light.bathroom_tub_1',\n
          \ 'light.bathroom_tub_2',\n  'light.bathroom_back',\n  'light.bathroom_main_lights'\n]
          %} {{ lights | select('is_state', 'on') | list | count == 0 }}\n"
      - choose:
        - conditions:
          - condition: state
            entity_id: switch.al_sleep_mode_bathroom
            state: 'on'
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.bathroom_shower
              - light.bathroom_tub_1
              - light.bathroom_tub_2
              - light.bathroom_back
            data:
              brightness_pct: 3
              rgb_color:
              - 139
              - 0
              - 0
              transition: 1
        - conditions:
          - condition: time
            after: '20:30:00'
            before: '23:45:00'
          sequence:
          - action: scene.turn_on
            target:
              entity_id: scene.bathroom_blood_moon
            data:
              transition: 1
          - action: light.turn_on
            target:
              entity_id: light.bathroom_main_lights
            data:
              transition: 1
          - condition: template
            value_template: "{{ 'light.bathroom_main_lights' not in\n   state_attr('switch.al_bathroom_main',
              'manual_control') }}\n"
          - action: adaptive_lighting.apply
            continue_on_error: true
            data:
              entity_id: switch.al_bathroom_main
              lights:
              - light.bathroom_main_lights
              transition: 1
              adapt_color: true
              adapt_brightness: true
        - conditions:
          - condition: time
            after: '23:45:00'
            before: 06:30:00
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.bathroom_shower
              - light.bathroom_tub_1
              - light.bathroom_tub_2
              - light.bathroom_back
            data:
              brightness_pct: 2
              transition: 1
          - condition: template
            value_template: "{{ 'light.bathroom_shower' not in\n   state_attr('switch.al_bathroom',
              'manual_control') }}\n"
          - action: adaptive_lighting.apply
            continue_on_error: true
            data:
              entity_id: switch.al_bathroom
              lights:
              - light.bathroom_shower
              - light.bathroom_tub_1
              - light.bathroom_tub_2
              - light.bathroom_back
              transition: 1
              adapt_color: true
              adapt_brightness: false
        - conditions:
          - condition: sun
            before: sunrise
          - condition: time
            after: 06:30:00
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.bathroom_shower
              - light.bathroom_tub_1
              - light.bathroom_tub_2
              - light.bathroom_back
            data:
              transition: 1
          - condition: template
            value_template: "{{ 'light.bathroom_shower' not in\n   state_attr('switch.al_bathroom',
              'manual_control') }}\n"
          - action: adaptive_lighting.apply
            continue_on_error: true
            data:
              entity_id: switch.al_bathroom
              lights:
              - light.bathroom_shower
              - light.bathroom_tub_1
              - light.bathroom_tub_2
              - light.bathroom_back
              transition: 1
              adapt_color: true
              adapt_brightness: true
        - conditions: []
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.bathroom_main_lights
            data:
              transition: 1
          - condition: template
            value_template: "{{ 'light.bathroom_main_lights' not in\n   state_attr('switch.al_bathroom_main',
              'manual_control') }}\n"
          - action: adaptive_lighting.apply
            continue_on_error: true
            data:
              entity_id: switch.al_bathroom_main
              lights:
              - light.bathroom_main_lights
              transition: 1
              adapt_color: true
              adapt_brightness: true
          - action: light.turn_on
            target:
              entity_id:
              - light.bathroom_shower
              - light.bathroom_tub_1
              - light.bathroom_tub_2
              - light.bathroom_back
            data:
              transition: 1
          - condition: template
            value_template: "{{ 'light.bathroom_shower' not in\n   state_attr('switch.al_bathroom',
              'manual_control') }}\n"
          - action: adaptive_lighting.apply
            continue_on_error: true
            data:
              entity_id: switch.al_bathroom
              lights:
              - light.bathroom_shower
              - light.bathroom_tub_1
              - light.bathroom_tub_2
              - light.bathroom_back
              transition: 1
              adapt_color: true
              adapt_brightness: true
    - conditions:
      - condition: trigger
        id: stopped
      sequence:
      - wait_for_trigger:
        - trigger: state
          entity_id: binary_sensor.bathroom_motion
          to: 'on'
        timeout: 00:02:00
        continue_on_timeout: true
      - condition: state
        entity_id: binary_sensor.bathroom_motion
        state: 'off'
      - wait_for_trigger:
        - trigger: state
          entity_id: binary_sensor.bathroom_motion
          to: 'on'
        timeout: "{{ '00:10:00' if (now().hour >= 23 or now().hour < 7)\n   else '00:15:00'
          }}\n"
        continue_on_timeout: true
      - condition: state
        entity_id: binary_sensor.bathroom_motion
        state: 'off'
      - action: light.turn_off
        target:
          entity_id:
          - light.bathroom_shower
          - light.bathroom_tub_1
          - light.bathroom_tub_2
          - light.bathroom_back
          - light.bathroom_main_lights
        data:
          transition: 300
    - conditions:
      - condition: trigger
        id: catch_all
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.bathroom_shower
          - light.bathroom_tub_1
          - light.bathroom_tub_2
          - light.bathroom_back
          - light.bathroom_main_lights
        data:
          transition: 300
    - conditions:
      - condition: trigger
