    domain: alarm_control_panel
    entity_id: 3d13bb77598c9f789d866e1a6e340482
    type: is_disarmed
  actions:
  - device_id: 8ff1d1903114cafb085278be116a1e9b
    domain: alarm_control_panel
    entity_id: 3d13bb77598c9f789d866e1a6e340482
    type: arm_home
  mode: single
- id: '1749150000000'
  alias: 'Living Room: Turn off TV when PS5 and Apple TV both off'
  description: When PS5 turns off and no Apple TV is playing, announce and turn off
    the TV after 30 seconds.
  triggers:
  - trigger: state
    entity_id: binary_sensor.ps5_living_room
