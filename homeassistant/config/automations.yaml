  conditions: []
  actions:
  - alias: Start 35-minute auto-stop timer immediately - set first so a re-trigger
      or interruption later in this script can never prevent it from arming
    action: timer.start
    target:
      entity_id: timer.bedroom_sleep_audio
    data:
      duration: 00:35:00
  - alias: Disable motion automation
    action: automation.turn_off
    target:
      entity_id: automation.big_bedroom_smart_motion_presence
    data:
      stop_actions: true
  - alias: Mark asleep so nothing re-arms lighting until Good Morning
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.big_bedroom_asleep
  - alias: Turn off AL switches and set manual control
    action: switch.turn_off
    target:
      entity_id:
      - switch.al_big_bedroom
      - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_color_big_bedroom_al
      - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_brightness_big_bedroom_al
  - action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.al_big_bedroom
      lights:
      - light.bedroom_ceiling_1
      - light.bedroom_ceiling_2
      - light.bedroom_lamp_1
      - light.bedroom_lamp_2
      manual_control: true
  - alias: Set bedroom color to deep red (preserve brightness if already on)
    choose:
    - conditions:
      - condition: state
        entity_id: light.bedroom
        state: 'on'
      sequence:
      - alias: Already on - just shift color, keep current brightness
        action: light.turn_on
        target:
          entity_id: light.bedroom
        data:
          rgb_color:
          - 255
          - 30
          - 0
          transition: 2
    default:
    - alias: Off - turn on at 40% red
      action: light.turn_on
      target:
        entity_id: light.bedroom
      data:
        rgb_color:
        - 255
        - 30
        - 0
        brightness_pct: 40
        transition: 1
  - alias: Nanoleaf to deep red 2%
    action: light.turn_on
    target:
      entity_id: light.nano_sand_dune
    data:
      rgb_color:
      - 255
      - 30
      - 0
      brightness_pct: 2
      transition: 1
  - alias: Fade to 4% over 30 seconds
    action: light.turn_on
    target:
      entity_id: light.bedroom
    data:
      brightness_pct: 4
      transition: 30
  - alias: Turn off bedroom TV
    action: media_player.turn_off
    target:
      entity_id: media_player.bedroom_tv_2
  - alias: Set alarm to Home/Stay
    action: alarm_control_panel.alarm_arm_home
    target:
      entity_id: alarm_control_panel.3302_alarm
  - alias: Set bedroom fan to 50%
    action: fan.turn_on
    target:
      entity_id: fan.big_bedroom_fan
    data:
      percentage: 50
    enabled: false
  - alias: Turn on purifier at 25%
    action: fan.turn_on
    target:
      entity_id: fan.bedroom_purifier
    data:
      percentage: 25
  - alias: Turn on air circulator at 25%
    action: fan.turn_on
    target:
      entity_id: fan.air_circulator
    data:
      percentage: 25
  - alias: Set Sonos volume to 12%
    action: media_player.volume_set
    target:
      entity_id: media_player.bedroom_2
    data:
      volume_level: 0.12
  - alias: Play white noise via Music Assistant (with retry)
    repeat:
      sequence:
      - continue_on_error: true
        action: music_assistant.play_media
        target:
          entity_id: media_player.bedroom_2
        data:
          media_id: ytmusic://playlist/VLPLOS9HJPmm92-46p6EL6vUxfuZ6AGVDkRG
          media_type: playlist
          radio_mode: false
      - continue_on_error: true
        action: media_player.shuffle_set
        target:
          entity_id: media_player.bedroom_2
        data:
          shuffle: true
      - alias: Give playback a few seconds to start
        wait_template: '{{ is_state(''media_player.bedroom_2'', ''playing'') }}'
        timeout:
          seconds: 8
        continue_on_timeout: true
      until:
      - alias: Exit the loop once it is playing, or after two attempts. Must be an
          until condition, not a stop action - stop would end the whole automation
          run and skip every step after this repeat.
        condition: or
        conditions:
        - condition: state
          entity_id: media_player.bedroom_2
          state: playing
        - condition: template
          value_template: '{{ repeat.index >= 2 }}'
  - alias: Notify if white noise still isn't playing after retry
    if:
    - condition: not
      conditions:
      - condition: state
        entity_id: media_player.bedroom_2
        state: playing
    then:
    - action: notify.mobile_app_pc_iphone
      data:
        title: White noise didn't start
        message: Bedroom Sonos didn't start playing after two tries - speaker may
          be offline.
