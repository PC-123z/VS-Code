          sequence:
          - action: light.turn_on
            target:
              entity_id: light.bedroom
            data:
              transition: 5
          - action: adaptive_lighting.apply
            continue_on_error: true
            data:
              entity_id: switch.al_big_bedroom
              lights:
              - light.bedroom_ceiling_1
              - light.bedroom_ceiling_2
              - light.bedroom_lamp_1
              - light.bedroom_lamp_2
              transition: 5
              adapt_color: true
              adapt_brightness: true
              prefer_rgb_color: true
          - action: select.select_option
            target:
              entity_id: select.nanoleaf_dynamic_scenes
            data:
              option: Lightscape
          - action: light.turn_on
            target:
              entity_id: light.nano_sand_dune
            data:
              brightness_pct: 70
              transition: 5
        - conditions:
          - condition: time
            after: '15:00:00'
            before: '18:00:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.bedroom
            data:
              transition: 5
          - action: adaptive_lighting.apply
            continue_on_error: true
            data:
              entity_id: switch.al_big_bedroom
              lights:
              - light.bedroom_ceiling_1
              - light.bedroom_ceiling_2
              - light.bedroom_lamp_1
              - light.bedroom_lamp_2
              transition: 5
              adapt_color: true
              adapt_brightness: true
              prefer_rgb_color: true
          - action: select.select_option
            target:
              entity_id: select.nanoleaf_dynamic_scenes
            data:
              option: Jungle
          - action: light.turn_on
            target:
              entity_id: light.nano_sand_dune
            data:
              brightness_pct: 70
              transition: 5
        - conditions:
          - condition: time
            after: '18:00:00'
            before: '20:00:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.bedroom
            data:
              transition: 5
          - action: adaptive_lighting.apply
            continue_on_error: true
            data:
              entity_id: switch.al_big_bedroom
              lights:
              - light.bedroom_ceiling_1
              - light.bedroom_ceiling_2
              - light.bedroom_lamp_1
              - light.bedroom_lamp_2
              transition: 5
              adapt_color: true
              adapt_brightness: true
