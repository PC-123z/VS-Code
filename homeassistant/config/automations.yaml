    trigger: device
    id: btn1_press
  - device_id: c6078582c306e2d78ad6c4e84d2b6e7c
    domain: hue
    type: initial_press
    subtype: 2
    unique_id: office-dimmer-btn2-bright-up
    trigger: device
    id: btn2_press
  - device_id: c6078582c306e2d78ad6c4e84d2b6e7c
    domain: hue
