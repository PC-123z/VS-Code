- id: '1749150000000'
  alias: 'Living Room: Turn off TV when PS5 and Apple TV both off'
  description: When PS5 turns off and no Apple TV is playing, announce and turn off
    the TV after 30 seconds.
  triggers:
  - trigger: state
    entity_id: binary_sensor.ps5_living_room
    to: 'off'
    for:
      seconds: 30
  conditions:
  - condition: state
    entity_id: binary_sensor.ps5_living_room
    state: 'off'
  - condition: template
    value_template: "{{ states('media_player.appletv_5') != 'playing'\n   and states('media_player.appletv_6')
      != 'playing'\n   and states('media_player.appletv_14') != 'playing' }}\n"
  - condition: state
    entity_id: media_player.living_room_tv_2
    state: 'on'
  actions:
  - if:
    - condition: time
      after: 09:00:00
      before: '21:00:00'
    then:
    - action: notify.send_message
      target:
        entity_id: notify.living_room_dot_announce
      data:
        message: The PS5 has been turned off. The TV will turn off in 30 seconds.
  - delay:
      seconds: 30
  - condition: state
    entity_id: binary_sensor.ps5_living_room
    state: 'off'
  - condition: template
    value_template: "{{ states('media_player.appletv_5') != 'playing'\n   and states('media_player.appletv_6')
      != 'playing'\n   and states('media_player.appletv_14') != 'playing' }}\n"
  - action: media_player.turn_off
    target:
      entity_id: media_player.living_room_tv_2
    data: {}
  mode: single
- id: washer_announcement
  alias: Washer Announcement
  description: 5 min warning and done announcement between 8AM and 10:30PM
  triggers:
  - trigger: template
    id: five_minutes
    value_template: "{{ states('sensor.washer_machine_state') == 'run'\n   and states('sensor.washer_completion_time')
      not in ['unavailable', 'unknown', 'none']\n   and (as_timestamp(states('sensor.washer_completion_time'))
      - as_timestamp(now())) | int <= 300\n   and (as_timestamp(states('sensor.washer_completion_time'))
      - as_timestamp(now())) | int > 0 }}"
  - trigger: state
    id: done
    entity_id: sensor.washer_machine_state
    from: run
    to: stop
  conditions:
  - condition: time
    after: 08:00:00
    before: '22:30:00'
  actions:
  - if:
    - condition: template
      value_template: '{{ trigger.id == ''five_minutes'' }}'
    then:
    - action: notify.send_message
      target:
        entity_id: notify.living_room_dot_announce
      data:
        message: The washer will be done in 5 minutes.
    - action: notify.send_message
      target:
        entity_id: notify.echo_show_kitchen_announce
      data:
        message: The washer will be done in 5 minutes.
    - action: tts.speak
      target:
        entity_id: tts.piper
      data:
        cache: false
        media_player_entity_id: media_player.bedroom
        message: The washer will be done in 5 minutes.
    else:
    - action: notify.send_message
      target:
        entity_id: notify.living_room_dot_announce
      data:
        message: The washer is done!
    - action: notify.send_message
      target:
        entity_id: notify.echo_show_kitchen_announce
      data:
        message: The washer is done!
    - action: tts.speak
      target:
        entity_id: tts.piper
      data:
        cache: false
        media_player_entity_id: media_player.bedroom
        message: The washer is done!
  mode: single
