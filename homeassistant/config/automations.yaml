- id: '1776981901284'
  alias: Departure - Monitor Garage and Arm Based on Occupancy
  description: When Volvo cable is disconnected during departure window and Paul or
    the car leaves, check for motion and arm accordingly.
  triggers:
  - trigger: state
    entity_id: sensor.volvo_xc60_charging_connection_status
    to: disconnected
  conditions:
  - condition: state
    entity_id: timer.departure_window
    state: active
  actions:
  - alias: Wait for Paul or car to leave
    wait_for_trigger:
    - trigger: state
      entity_id: person.paul
      to: not_home
    - trigger: state
      entity_id: device_tracker.bcpro_204982_08b8
      to:
      - not_home
      - unavailable
    timeout:
      minutes: 15
    continue_on_timeout: false
  - alias: Wait for motion to clear or timeout after 1 minute
    wait_template: '{{ is_state(''binary_sensor.goodbye_motion_sensors'', ''off'')
      }}'
    timeout:
      hours: 0
      minutes: 1
      seconds: 0
      milliseconds: 0
    continue_on_timeout: true
  - alias: Check if motion was detected (someone home)
    if:
    - condition: state
      entity_id: binary_sensor.goodbye_motion_sensors
      state: 'on'
    then:
    - alias: Someone is home - alert and set alarm to home
      sequence:
      - action: notify.mobile_app_pc_iphone
        data:
          title: Motion Detected
          message: Motion detected after you left. Setting alarm to home mode.
      - action: alarm_control_panel.alarm_arm_home
        target:
          entity_id: alarm_control_panel.3302_alarm
        data:
          code: ''
    else:
    - alias: No motion - house is empty, run goodbye routine
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.goodbye_routine_main
  - alias: Cancel the departure window timer
    action: timer.cancel
    target:
      entity_id: timer.departure_window
  mode: single
