      seconds: 30
  - condition: state
    entity_id: binary_sensor.ps5_living_room
    state: 'off'
  - condition: template
    value_template: "{{ states('media_player.appletv_5') != 'playing'\n   and states('media_player.appletv_6')
      != 'playing'\n   and states('media_player.appletv_14') != 'playing' }}\n"
  - action: media_player.turn_off
    target:
      entity_id: media_player.living_room_tv_2
