              radio_mode: false
          - continue_on_error: true
            action: media_player.shuffle_set
            target:
              entity_id: media_player.office_2
            data:
              shuffle: true
          - alias: Give playback a few seconds to start
            wait_template: '{{ is_state(''media_player.office_2'', ''playing'') }}'
            timeout:
              seconds: 8
            continue_on_timeout: true
          - alias: Stop repeating once it's actually playing
            if:
            - condition: state
              entity_id: media_player.office_2
              state: playing
            then:
            - stop: Playback confirmed
      - alias: Notify if sleep music still isn't playing after retry
        if:
        - condition: not
          conditions:
          - condition: state
            entity_id: media_player.office_2
            state: playing
        then:
        - action: notify.mobile_app_pc_iphone
          data:
            title: Bedroom 2 sleep music didn't start
            message: Office/Bedroom 2 speaker didn't start playing after two tries
              - speaker may be offline.
      - alias: Let it play 40 minutes or until 11:15pm, whichever comes first
        wait_for_trigger:
        - trigger: time
          at: '23:15:00'
        timeout:
          minutes: 40
      - alias: Stop sleep music
        action: media_player.media_stop
        continue_on_error: true
        target:
          entity_id: media_player.office_2
    - conditions:
      - condition: trigger
        id: occupied_set
      - alias: Bedtime Routine active window - 10:00pm to 6am
        condition: time
        after: '22:00:00'
        before: 06:00:00
      sequence:
      - alias: Fan on - stays on until Good Morning routine turns it off
        action: fan.turn_on
        data:
          percentage: 25
        target:
          entity_id: fan.bedroom2_fan
        enabled: true
      - alias: Play sleep music regardless of dimmer override - a button press to
          adjust lights shouldn't silently skip the music too
        action: media_player.volume_set
        target:
          entity_id: media_player.office_2
        data:
          volume_level: 0.15
      - alias: Play sleep music via Music Assistant (with retry)
        repeat:
