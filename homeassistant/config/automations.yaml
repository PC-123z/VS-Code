- id: '1778500000000'
  alias: 'System: Global Daily Automation Reset'
  description: 'Daily safety-net reset that runs after the morning sleep mode unwind.
    Clears

    all manual override flags, ensures motion/presence automations are enabled,

    re-enables AL switches house-wide, clears stuck manual_control flags, and

    resets scene mode selectors. Runs at 07:30 M-F and 10:15 Sat-Sun.

    '
  triggers:
  - trigger: time
    at: 07:30:00
    id: weekday_reset
  - trigger: time
    at: '10:15:00'
    id: weekend_reset
  conditions:
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: trigger
        id: weekday_reset
      - condition: time
        weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
    - condition: and
      conditions:
      - condition: trigger
        id: weekend_reset
      - condition: time
        weekday:
        - sat
        - sun
  actions:
  - alias: Clear all manual override input booleans
    action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.bedroom2_manual_override
      - input_boolean.kitchen_manual_override
      - input_boolean.dining_room_manual_override
      - input_boolean.big_bedroom_manual_override
  - alias: Re-enable garage auto-close (in case it was disabled for garage work)
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.garage_auto_close_enabled
  - alias: Ensure all motion/presence automations are enabled
    action: automation.turn_on
    target:
      entity_id:
      - automation.kitchen_on
      - automation.bathroom_smart_motion_presence
      - automation.big_bedroom_smart_motion_presence
      - automation.living_room_smart_motion_presence
      - automation.dining_room_smart_motion_presence
      - automation.office_bedroom_2_smart_motion_presence_2
  - alias: Disable all sleep mode flags (catches any stuck ones)
    action: switch.turn_off
    target:
      entity_id:
      - switch.al_sleep_mode_hallway
      - switch.al_sleep_mode_kitchen
      - switch.al_sleep_mode_kitchen_main
      - switch.al_sleep_mode_big_bedroom
      - switch.al_sleep_mode_living_room
      - switch.al_sleep_mode_dining_room_bottom
      - switch.al_sleep_mode_dining_room_top
      - switch.al_sleep_mode_bathroom
      - switch.al_sleep_mode_bathroom_main
      - switch.adaptive_lighting_sleep_mode_office
  - alias: Re-enable all AL switches house-wide
    action: switch.turn_on
    target:
      entity_id:
      - switch.al_hallway
      - switch.al_kitchen
      - switch.al_kitchen_main
      - switch.al_big_bedroom
      - switch.al_living_room
      - switch.al_dining_room_bottom
      - switch.al_dining_room_top
      - switch.al_bathroom
      - switch.al_bathroom_main
      - switch.adaptive_lighting_office
      - switch.adaptive_lighting_adapt_color_office
      - switch.adaptive_lighting_adapt_brightness_office
  - alias: Clear all manual_control flags so AL resumes adapting
    action: adaptive_lighting.set_manual_control
    continue_on_error: true
    data:
      entity_id: switch.al_hallway
      manual_control: false
  - action: adaptive_lighting.set_manual_control
    continue_on_error: true
    data:
      entity_id: switch.al_kitchen
      manual_control: false
  - action: adaptive_lighting.set_manual_control
    continue_on_error: true
    data:
      entity_id: switch.al_kitchen_main
      manual_control: false
  - action: adaptive_lighting.set_manual_control
    continue_on_error: true
    data:
      entity_id: switch.al_big_bedroom
      manual_control: false
  - action: adaptive_lighting.set_manual_control
    continue_on_error: true
    data:
      entity_id: switch.al_living_room
      manual_control: false
  - action: adaptive_lighting.set_manual_control
    continue_on_error: true
    data:
      entity_id: switch.al_dining_room_bottom
      manual_control: false
  - action: adaptive_lighting.set_manual_control
    continue_on_error: true
    data:
      entity_id: switch.al_dining_room_top
      manual_control: false
  - action: adaptive_lighting.set_manual_control
    continue_on_error: true
    data:
      entity_id: switch.al_bathroom
      manual_control: false
  - action: adaptive_lighting.set_manual_control
    continue_on_error: true
    data:
      entity_id: switch.al_bathroom_main
      manual_control: false
  - action: adaptive_lighting.set_manual_control
    continue_on_error: true
    data:
      entity_id: switch.adaptive_lighting_office
      manual_control: false
  - alias: Reset scene mode selectors back to default
    action: input_select.select_option
    continue_on_error: true
    target:
      entity_id: input_select.office_scene_mode
    data:
      option: al
  - alias: Notify that reset completed
    action: notify.mobile_app_pc_iphone
    data:
      title: Daily Automation Reset
      message: 'House-wide reset complete: overrides cleared, motion automations enabled,
        AL restored.'
    enabled: false
  mode: single
- id: '1775373515241'
  alias: 'Bathroom: Smart Motion & Presence (Split Color/White)'
  triggers:
  - trigger: state
    entity_id: binary_sensor.bathroom_motion
    to: 'on'
    id: detected
  - trigger: state
    entity_id: binary_sensor.bathroom_motion
    to: 'off'
    id: stopped
  - trigger: state
    entity_id: binary_sensor.bathroom_motion
    to: 'off'
    for:
      minutes: 15
    id: catch_all
  - trigger: state
    entity_id: binary_sensor.bathroom_motion
    to: 'off'
    for:
      minutes: 30
    id: hard_off
  - trigger: state
    entity_id:
    - light.bathroom_shower
    - light.bathroom_tub_1
    - light.bathroom_tub_2
    - light.bathroom_back
    - light.bathroom_main_lights
    to: 'on'
    for:
      minutes: 45
    id: failsafe
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: detected
      sequence:
      - condition: template
        value_template: "{% set lights = [\n  'light.bathroom_shower',\n  'light.bathroom_tub_1',\n
          \ 'light.bathroom_tub_2',\n  'light.bathroom_back',\n  'light.bathroom_main_lights'\n]
          %} {{ lights | select('is_state', 'on') | list | count == 0 }}\n"
      - choose:
        - conditions:
          - condition: state
            entity_id: switch.al_sleep_mode_bathroom
            state: 'on'
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.bathroom_shower
              - light.bathroom_tub_1
              - light.bathroom_tub_2
              - light.bathroom_back
            data:
              brightness_pct: 3
              rgb_color:
              - 139
              - 0
              - 0
              transition: 1
        - conditions:
          - condition: time
            after: '20:30:00'
            before: '23:45:00'
          sequence:
          - action: scene.turn_on
            target:
              entity_id: scene.bathroom_blood_moon
            data:
              transition: 1
          - action: light.turn_on
            target:
              entity_id: light.bathroom_main_lights
            data:
              transition: 1
          - condition: template
            value_template: "{{ 'light.bathroom_main_lights' not in\n   state_attr('switch.al_bathroom_main',
              'manual_control') }}\n"
          - action: adaptive_lighting.apply
            continue_on_error: true
            data:
              entity_id: switch.al_bathroom_main
              lights:
              - light.bathroom_main_lights
              transition: 1
              adapt_color: true
              adapt_brightness: true
        - conditions:
          - condition: time
            after: '23:45:00'
            before: 06:30:00
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.bathroom_shower
              - light.bathroom_tub_1
              - light.bathroom_tub_2
              - light.bathroom_back
            data:
              brightness_pct: 2
              transition: 1
          - condition: template
            value_template: "{{ 'light.bathroom_shower' not in\n   state_attr('switch.al_bathroom',
              'manual_control') }}\n"
          - action: adaptive_lighting.apply
            continue_on_error: true
            data:
              entity_id: switch.al_bathroom
              lights:
              - light.bathroom_shower
              - light.bathroom_tub_1
              - light.bathroom_tub_2
              - light.bathroom_back
              transition: 1
              adapt_color: true
              adapt_brightness: false
        - conditions:
          - condition: sun
            before: sunrise
          - condition: time
            after: 06:30:00
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.bathroom_shower
              - light.bathroom_tub_1
              - light.bathroom_tub_2
              - light.bathroom_back
            data:
              transition: 1
          - condition: template
            value_template: "{{ 'light.bathroom_shower' not in\n   state_attr('switch.al_bathroom',
              'manual_control') }}\n"
          - action: adaptive_lighting.apply
            continue_on_error: true
            data:
              entity_id: switch.al_bathroom
              lights:
              - light.bathroom_shower
              - light.bathroom_tub_1
              - light.bathroom_tub_2
              - light.bathroom_back
              transition: 1
              adapt_color: true
              adapt_brightness: true
        - conditions: []
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.bathroom_main_lights
            data:
              transition: 1
          - condition: template
            value_template: "{{ 'light.bathroom_main_lights' not in\n   state_attr('switch.al_bathroom_main',
              'manual_control') }}\n"
          - action: adaptive_lighting.apply
            continue_on_error: true
            data:
              entity_id: switch.al_bathroom_main
              lights:
              - light.bathroom_main_lights
              transition: 1
              adapt_color: true
              adapt_brightness: true
          - action: light.turn_on
            target:
              entity_id:
              - light.bathroom_shower
              - light.bathroom_tub_1
              - light.bathroom_tub_2
              - light.bathroom_back
            data:
              transition: 1
          - condition: template
            value_template: "{{ 'light.bathroom_shower' not in\n   state_attr('switch.al_bathroom',
              'manual_control') }}\n"
          - action: adaptive_lighting.apply
            continue_on_error: true
            data:
              entity_id: switch.al_bathroom
              lights:
              - light.bathroom_shower
              - light.bathroom_tub_1
              - light.bathroom_tub_2
              - light.bathroom_back
              transition: 1
              adapt_color: true
              adapt_brightness: true
    - conditions:
      - condition: trigger
        id: stopped
      sequence:
      - wait_for_trigger:
        - trigger: state
          entity_id: binary_sensor.bathroom_motion
          to: 'on'
        timeout: 00:02:00
        continue_on_timeout: true
      - condition: state
        entity_id: binary_sensor.bathroom_motion
        state: 'off'
      - wait_for_trigger:
        - trigger: state
          entity_id: binary_sensor.bathroom_motion
          to: 'on'
        timeout: "{{ '00:10:00' if (now().hour >= 23 or now().hour < 7)\n   else '00:15:00'
          }}\n"
        continue_on_timeout: true
      - condition: state
        entity_id: binary_sensor.bathroom_motion
        state: 'off'
      - action: light.turn_off
        target:
          entity_id:
          - light.bathroom_shower
          - light.bathroom_tub_1
          - light.bathroom_tub_2
          - light.bathroom_back
          - light.bathroom_main_lights
        data:
          transition: 300
    - conditions:
      - condition: trigger
        id: catch_all
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.bathroom_shower
          - light.bathroom_tub_1
          - light.bathroom_tub_2
          - light.bathroom_back
          - light.bathroom_main_lights
        data:
          transition: 300
    - conditions:
      - condition: trigger
        id: hard_off
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.bathroom_shower
          - light.bathroom_tub_1
          - light.bathroom_tub_2
          - light.bathroom_back
          - light.bathroom_main_lights
        data:
          transition: 5
    - conditions:
      - condition: trigger
        id: failsafe
      - condition: state
        entity_id: binary_sensor.bathroom_motion
        state: 'off'
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.bathroom_shower
          - light.bathroom_tub_1
          - light.bathroom_tub_2
          - light.bathroom_back
          - light.bathroom_main_lights
        data:
          transition: 10
  mode: queued
  max: 10
- id: '1775434776744'
  alias: 'Kitchen: Purifier Auto Control'
  description: 'Runs overnight 12AM-6AM. Also runs when kitchen is vacant for 15+
    minutes. Turns off when motion is detected outside overnight window.

    '
  triggers:
  - trigger: time
    at: 00:00:00
    id: overnight_on
  - trigger: time
    at: 06:00:00
    id: overnight_off
  - trigger: state
    entity_id: binary_sensor.kitchen_sensor_group
    to: 'off'
    for:
      minutes: 15
    id: kitchen_vacant
  - trigger: state
    entity_id: binary_sensor.kitchen_sensor_group
    to: 'on'
    id: kitchen_occupied
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - overnight_on
        - kitchen_vacant
      sequence:
      - action: fan.turn_on
        target:
          entity_id: fan.kitchen_purifier
    - conditions:
      - condition: trigger
        id:
        - overnight_off
        - kitchen_occupied
      sequence:
      - condition: not
        conditions:
        - condition: time
          after: 00:00:00
          before: 06:00:00
      - action: fan.turn_off
        target:
          entity_id: fan.kitchen_purifier
  mode: single
- id: '1775436929701'
  alias: 'Kitchen: Range Light Auto Off'
  description: Turns off range light if left on for 10 minutes.
  triggers:
  - trigger: state
    entity_id:
    - light.range_light
    to:
    - 'on'
    for:
      hours: 0
      minutes: 2
      seconds: 0
  actions:
  - action: light.turn_off
    target:
      entity_id: light.range_light
  mode: single
- id: '1775471409248'
  alias: '*Big Bedroom: Smart Motion & Presence'
  description: Presence-based lighting with time-based Nanoleaf scenes and 30-minute
    timeout.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.big_bedroom_sensor_group
    to:
    - 'on'
    id: detected
  - trigger: state
    entity_id:
    - binary_sensor.big_bedroom_sensor_group
    to:
    - 'off'
    for:
      hours: 0
      minutes: 10
      seconds: 0
    id: stopped
  - trigger: state
    entity_id:
    - switch.al_sleep_mode_big_bedroom
    to: 'on'
    id: sleep_on
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sleep_on
      - alias: Skip if dimmer override is active
        condition: state
        entity_id: input_boolean.big_bedroom_manual_override
        state: 'off'
      sequence:
      - condition: state
        entity_id: binary_sensor.big_bedroom_sensor_group
        state: 'on'
      - action: switch.turn_off
        target:
          entity_id: switch.al_big_bedroom
      - action: light.turn_on
        target:
          entity_id: light.bedroom
        data:
          brightness_pct: 10
          rgb_color:
          - 255
          - 30
          - 0
          transition: 30
      - action: light.turn_on
        target:
          entity_id: light.nano_sand_dune
        data:
          brightness_pct: 10
          rgb_color:
          - 255
          - 30
          - 0
          transition: 30
    - conditions:
      - condition: trigger
        id: detected
      - condition: state
        entity_id: switch.al_sleep_mode_big_bedroom
        state: 'off'
      - alias: Skip if dimmer override is active
        condition: state
        entity_id: input_boolean.big_bedroom_manual_override
        state: 'off'
      sequence:
      - choose:
        - conditions:
          - condition: time
            after: 07:00:00
            before: '10:00:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.bedroom
            data:
              transition: 5
          - action: adaptive_lighting.apply
            continue_on_error: true
            data:
              entity_id: switch.al_big_bedroom
              lights:
              - light.bedroom_ceiling_1
              - light.bedroom_ceiling_2
