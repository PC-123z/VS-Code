- id: '1775434776744'
  alias: 'Kitchen: Purifier Auto Control'
  description: 'Runs overnight 12AM-6AM. Also runs when kitchen is vacant for 15+
    minutes. Turns off when motion is detected outside overnight window.

    '
  triggers:
  - trigger: time
    at: 00:00:00
    id: overnight_on
  - trigger: time
    at: 06:00:00
    id: overnight_off
  - trigger: state
    entity_id: binary_sensor.kitchen_sensor_group
    to: 'off'
    for:
      minutes: 15
    id: kitchen_vacant
  - trigger: state
    entity_id: binary_sensor.kitchen_sensor_group
    to: 'on'
    id: kitchen_occupied
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - overnight_on
        - kitchen_vacant
      sequence:
      - action: fan.turn_on
        target:
          entity_id: fan.kitchen_purifier
    - conditions:
      - condition: trigger
        id:
        - overnight_off
        - kitchen_occupied
      sequence:
      - condition: not
        conditions:
        - condition: time
          after: 00:00:00
          before: 06:00:00
      - action: fan.turn_off
        target:
          entity_id: fan.kitchen_purifier
  mode: single
