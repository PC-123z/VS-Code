          color_temp_kelvin: '{{ tv_kelvin | int }}'
          transition: 3
      - choose:
        - conditions:
          - condition: state
            entity_id: binary_sensor.kitchen_sensor_group
            state: 'on'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.kitchen_main_lights
            data:
              brightness_pct: 5
              transition: 3
        default:
        - action: light.turn_off
          target:
            entity_id: light.kitchen_main_lights
      - action: light.turn_off
        target:
          entity_id: light.galaxy_projector
      - condition: state
        entity_id: binary_sensor.dining_room_sensor_group
        state: 'on'
      - action: light.turn_on
        metadata: {}
        target:
          label_id: dining_room_top
        data:
          brightness_pct: 2
      - action: light.turn_on
        metadata: {}
        target:
          label_id: dining_room_bottom
        data:
          brightness_pct: 2
      - type: turn_off
        device_id: a239769fc8575407917d2a4a56682e94
        entity_id: d265a36c8203e2b0bc3ea9ae06afdf73
        domain: light
    - conditions:
      - condition: trigger
        id: paused
      sequence:
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.al_living_room
          lights:
          - light.living_room
          manual_control: false
      - action: switch.turn_on
        target:
          entity_id: switch.al_living_room
      - action: automation.turn_on
        target:
          entity_id: automation.living_room_smart_motion_presence
      - action: adaptive_lighting.apply
        continue_on_error: true
        data:
          entity_id: switch.al_living_room
          lights:
          - light.living_room
          transition: 3
          adapt_color: true
          adapt_brightness: true
          prefer_rgb_color: true
      - action: light.turn_on
        target:
          entity_id: light.galaxy_projector
    - conditions:
      - condition: trigger
        id: tv_off
      sequence:
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.al_living_room
          lights:
          - light.living_room
          manual_control: false
      - action: switch.turn_on
        target:
          entity_id: switch.al_living_room
      - action: automation.turn_on
        target:
          entity_id: automation.living_room_smart_motion_presence
      - alias: Only restore lights if someone is actually in the room
        if:
        - condition: state
          entity_id: binary_sensor.living_room_sensor_group
          state: 'on'
        then:
        - action: adaptive_lighting.apply
          continue_on_error: true
          data:
            entity_id: switch.al_living_room
            lights:
            - light.living_room
            transition: 3
            adapt_color: true
            adapt_brightness: true
            prefer_rgb_color: true
        - action: light.turn_on
          target:
            entity_id: light.galaxy_projector
        else:
        - action: fan.turn_off
          target:
            entity_id: fan.living_room_fan
        - action: light.turn_off
          target:
            entity_id:
            - light.living_room
            - light.galaxy_projector
          data:
            transition: 3
  variables:
    sun_elev: '{{ state_attr(''sun.sun'', ''elevation'') | float(0) }}'
    tv_kelvin: '{% if sun_elev > 10 %}4000 {% elif sun_elev > -6 %}2700 {% else %}2200
      {% endif %}'
    playing_brightness: '{% if sun_elev > 10 %}15 {% elif sun_elev > -6 %}5 {% else
      %}2 {% endif %}'
  mode: restart
