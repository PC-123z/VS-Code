  max: 4
- id: '1777484175033'
  alias: Arrival Latch - Set on Phone/Beacon Arrival
  description: Sets the arrival latch when any early arrival signal fires (phone geofence,
    iOS Shortcut webhook, or BT beacon going home). These fire ~15-25s before the
    garage opens, so the latch captures them so the garage-open automation can read
    them later. Auto-clears after 15 min or on disarm (see companion automation).
  triggers:
  - alias: iPhone app person.paul arrives home
    trigger: state
    entity_id: person.paul
    from: not_home
    to: home
  - alias: BT beacon away -> home (Paul just arrived)
    trigger: state
    entity_id: device_tracker.bcpro_204982_08b8
    from:
    - not_home
    - unavailable
    to: home
  - alias: iOS Shortcut geofence webhook
    trigger: webhook
    webhook_id: paul_arrived_home
    allowed_methods:
    - POST
    local_only: false
  conditions: []
  actions:
  - alias: Set the arrival latch
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.arrival_recent
  mode: single
- id: '1777484175034'
  alias: Arrival Latch - Clear after 15 min or on Disarm
  description: Clears both arrival latches (beacon/phone and garage-open) 15 minutes
    after either was set, or as soon as the alarm is disarmed (so a stale latch never
    lingers or wrongly satisfies the two-factor check on some unrelated future event).
  triggers:
  - alias: Arrival latch has been on for 15 minutes
    trigger: state
    entity_id: input_boolean.arrival_recent
    to: 'on'
    for:
      minutes: 15
  - alias: Garage-open latch has been on for 15 minutes
    trigger: state
    entity_id: input_boolean.garage_open_recent
    to: 'on'
    for:
      minutes: 15
  - alias: Alarm disarmed
    trigger: state
    entity_id: alarm_control_panel.3302_alarm
    to: disarmed
  conditions: []
  actions:
  - alias: Clear both arrival latches
    action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.arrival_recent
      - input_boolean.garage_open_recent
  mode: single
- id: '1748800000004'
  alias: 'Welcome Home: Stop All Music When Kitchen Unoccupied 15 Min'
  description: Kitchen is the anchor for the welcome home session. When it has been
    empty for 15 minutes, stop all music, unjoin satellite rooms, and clear the active
    flag. Bathroom handles itself via its own kitchen_stopped trigger.
  triggers:
  - trigger: state
    entity_id: binary_sensor.kitchen_sensor_group
    to: 'off'
    for:
      minutes: 15
  conditions:
  - condition: state
    entity_id: input_boolean.welcome_home_active
    state: 'on'
  actions:
  - alias: Clear welcome home flag
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.welcome_home_active
  - alias: Unjoin satellite rooms
    continue_on_error: true
    action: media_player.unjoin
    target:
      entity_id:
      - media_player.bedroom
      - media_player.bedroom_2
      - media_player.office
      - media_player.bathroom
    data: {}
  - alias: Stop kitchen
    continue_on_error: true
    action: media_player.media_stop
    target:
      entity_id: media_player.kitchen
  mode: single
- id: '1748800000002'
  alias: 'Welcome Home: Unjoin Bedroom When Unoccupied 10 Min'
  description: While welcome home is active, unjoin the bedroom speaker when the room
    has been empty for 10 minutes. The auto-join automation handles re-joining if
    someone returns.
  triggers:
  - trigger: state
    entity_id: binary_sensor.big_bedroom_sensor_group
    to: 'off'
    for:
      minutes: 10
  conditions:
  - condition: state
    entity_id: input_boolean.welcome_home_active
    state: 'on'
  actions:
  - alias: Unjoin bedroom from kitchen group
    continue_on_error: true
    action: media_player.unjoin
    target:
      entity_id: media_player.bedroom
    data: {}
  mode: single
- id: '1748800000003'
  alias: 'Welcome Home: Unjoin Office When Unoccupied 10 Min'
  description: While welcome home is active, unjoin the office speaker when the room
    has been empty for 10 minutes. The auto-join automation handles re-joining if
    someone returns.
  triggers:
  - trigger: state
    entity_id: binary_sensor.bedroom_2_sensor_group
    to: 'off'
    for:
      minutes: 10
  conditions:
  - condition: state
    entity_id: input_boolean.welcome_home_active
    state: 'on'
  actions:
  - alias: Unjoin office from kitchen group
    continue_on_error: true
    action: media_player.unjoin
    target:
      entity_id: media_player.office
    data: {}
  mode: single
- id: '1777890200001'
  alias: 'Welcome Home: Auto Join Bedroom Speakers on Motion'
  description: While welcome home music is playing in kitchen, joins bedroom speakers
    when motion is detected in those rooms.
  triggers:
  - trigger: state
    entity_id: binary_sensor.bedroom_2_sensor_group
    to: 'on'
    id: bedroom_2_motion
    enabled: true
  - trigger: state
    entity_id: binary_sensor.big_bedroom_sensor_group
    to: 'on'
    id: big_bedroom_motion
  conditions:
  - condition: state
    entity_id: input_boolean.welcome_home_active
    state: 'on'
  actions:
  - choose:
    - alias: Bedroom 2 sensor - join office speaker
      conditions:
      - condition: trigger
        id: bedroom_2_motion
      sequence:
      - action: media_player.join
        target:
          entity_id: media_player.kitchen
        data:
          group_members:
          - media_player.office
    - alias: Big bedroom sensor - join bedroom speaker
      conditions:
      - condition: trigger
        id: big_bedroom_motion
      - alias: Skip while Big Bedroom is asleep
        condition: state
        entity_id: input_boolean.big_bedroom_asleep
        state: 'off'
      sequence:
      - action: media_player.join
        target:
          entity_id: media_player.kitchen
        data:
          group_members:
          - media_player.bedroom
  mode: single
- id: '1777520160440'
  alias: 'Living Room: Unoccupied Shutoff'
  description: After 15 min of no living room presence (with dining room also empty),
    warn with color-changing lights then shut down TV, fan, and lights.
  triggers:
  - trigger: state
    entity_id: binary_sensor.living_room_sensor_group
    to: 'off'
    for:
      minutes: 8
      seconds: 30
  conditions:
  - alias: Living room must still be empty
    condition: state
    entity_id: binary_sensor.living_room_sensor_group
    state: 'off'
  - alias: Dining room must also be empty
    condition: state
    entity_id: binary_sensor.dining_room_sensor_group
    state: 'off'
  actions:
  - alias: Warning - deep blue
    action: light.turn_on
    target:
      entity_id: light.living_room
    data:
      rgb_color:
      - 0
      - 0
      - 200
      brightness_pct: 60
      transition: 1
  - alias: Hold blue - cancel if presence returns
    wait_for_trigger:
    - trigger: state
      entity_id: binary_sensor.living_room_sensor_group
      to: 'on'
    - trigger: state
      entity_id: binary_sensor.dining_room_sensor_group
      to: 'on'
    timeout:
      seconds: 30
    continue_on_timeout: true
  - alias: Abort if presence detected during blue
    if:
    - condition: template
      value_template: '{{ wait.completed == true }}'
    then:
    - action: adaptive_lighting.set_manual_control
      data:
        entity_id: switch.al_living_room
        lights:
        - light.living_room
        manual_control: false
    - stop: Presence returned during warning - aborting shutoff
  - alias: Warning - purple
    action: light.turn_on
    target:
      entity_id: light.living_room
    data:
      rgb_color:
      - 128
      - 0
      - 200
      brightness_pct: 60
      transition: 1
  - alias: Hold purple - cancel if presence returns
    wait_for_trigger:
    - trigger: state
      entity_id: binary_sensor.living_room_sensor_group
      to: 'on'
    - trigger: state
      entity_id: binary_sensor.dining_room_sensor_group
      to: 'on'
    timeout:
      seconds: 30
    continue_on_timeout: true
  - alias: Abort if presence detected during purple
    if:
    - condition: template
      value_template: '{{ wait.completed == true }}'
    then:
    - action: adaptive_lighting.set_manual_control
      data:
        entity_id: switch.al_living_room
        lights:
        - light.living_room
        manual_control: false
    - stop: Presence returned during warning - aborting shutoff
  - alias: Warning - red
    action: light.turn_on
    target:
      entity_id: light.living_room
    data:
      rgb_color:
      - 255
      - 0
      - 0
      brightness_pct: 60
      transition: 1
  - alias: Hold red - cancel if presence returns
    wait_for_trigger:
    - trigger: state
      entity_id: binary_sensor.living_room_sensor_group
      to: 'on'
    - trigger: state
      entity_id: binary_sensor.dining_room_sensor_group
      to: 'on'
    timeout:
      seconds: 30
    continue_on_timeout: true
  - alias: Abort if presence detected during red
    if:
    - condition: template
      value_template: '{{ wait.completed == true }}'
    then:
    - action: adaptive_lighting.set_manual_control
      data:
        entity_id: switch.al_living_room
        lights:
        - light.living_room
        manual_control: false
    - stop: Presence returned during warning - aborting shutoff
  - alias: Turn off TV
    action: media_player.turn_off
    target:
      entity_id: media_player.living_room_tv_2
    data: {}
  - alias: Turn off fan
    action: fan.turn_off
    target:
      entity_id: fan.living_room_fan
    data: {}
  - alias: Turn off living room lights
    action: light.turn_off
    target:
      entity_id:
      - light.living_room
      - light.galaxy_projector
    data: {}
  mode: single
- id: '1777696670196'
  alias: Volvo XC60 - Auto Lock If Left Unlocked
  description: Locks the Volvo XC60 if engine is off and doors remain unlocked for
    2 minutes.
  triggers:
  - alias: Doors unlocked for 2 minutes (engine may have been off the whole time)
    trigger: state
    entity_id:
    - lock.volvo_xc60_lock
    to:
    - unlocked
    for:
      hours: 0
      minutes: 5
      seconds: 0
  - alias: Engine off for 2 minutes (catches case of driving with doors unlocked)
    trigger: state
    entity_id:
    - binary_sensor.volvo_xc60_engine_status
    to:
    - 'off'
    for:
      hours: 0
      minutes: 5
      seconds: 0
  conditions:
  - alias: Not at home (Based on Car BT beacon)
    condition: state
    entity_id: device_tracker.bcpro_204982_08b8
    state: not_home
  - alias: Engine must be off
    condition: state
    entity_id: binary_sensor.volvo_xc60_engine_status
    state: 'off'
  - alias: Doors must still be unlocked
    condition: state
    entity_id: lock.volvo_xc60_lock
    state: unlocked
  actions:
  - alias: Lock the Volvo
    action: lock.lock
    target:
      entity_id: lock.volvo_xc60_lock
  - alias: Notify iPhone
    action: notify.mobile_app_pc_iphone
    data:
      title: Volvo Locked
      message: XC60 engine off and doors unlocked for 2 minutes — automatically locked.
  mode: single
- id: '1777796510473'
  alias: '*Good Morning Routine'
  description: Staged sunrise wake-up with 3-min light ramp, occupancy-driven music
    tail, bathroom speaker grouping on motion, and 60-min hard cap from routine start.
  triggers:
  - trigger: time
    at: 07:55:00
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  - trigger: time
    at: '10:05:00'
    weekday:
    - sat
    - sun
  conditions: []
  actions:
  - alias: Mark routine as active
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.good_morning_active
  - alias: Clear asleep flag - presence lighting allowed again
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.big_bedroom_asleep
  - alias: Turn off all sleep modes
    action: switch.turn_off
    target:
      entity_id:
      - switch.al_sleep_mode_bathroom
      - switch.al_sleep_mode_bathroom_main
      - switch.al_sleep_mode_big_bedroom
      - switch.al_sleep_mode_dining_room_bottom
      - switch.al_sleep_mode_dining_room_top
      - switch.al_sleep_mode_hallway
      - switch.al_sleep_mode_kitchen
      - switch.al_sleep_mode_kitchen_main
      - switch.al_sleep_mode_living_room
      - switch.adaptive_lighting_sleep_mode_office
  - alias: Turn off bedroom AL switches and clear manual control
    action: switch.turn_off
    target:
      entity_id:
      - switch.al_big_bedroom
      - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_color_big_bedroom_al
      - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_brightness_big_bedroom_al
  - action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.al_big_bedroom
      lights:
      - light.bedroom_ceiling_1
      - light.bedroom_ceiling_2
      - light.bedroom_lamp_1
      - light.bedroom_lamp_2
      manual_control: false
  - alias: Stage 1 - Nanoleaf Morning Sky effect at 5%
    action: light.turn_on
    target:
      entity_id: light.nano_sand_dune
    data:
      effect: Morning Sky
      brightness_pct: 5
      transition: 1
  - alias: Run all sunrise stages in parallel
    parallel:
    - sequence:
      - alias: Nanoleaf ramps to 100% over 3 minutes
        repeat:
          count: 20
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.nano_sand_dune
            data:
              brightness_pct: '{{ [5 + (repeat.index * 4.75), 100] | min | round(0)
                }}'
              transition: 3
          - delay:
              seconds: 9
    - sequence:
      - alias: Wait 15 seconds then bring in ceiling lights
        delay:
          seconds: 15
      - alias: Ceiling lights start at 1% warm white
        action: light.turn_on
        target:
          entity_id:
          - light.bedroom_ceiling_1
          - light.bedroom_ceiling_2
        data:
          color_temp_kelvin: 2700
          brightness_pct: 1
          transition: 3
      - alias: Ceiling lights fade to 70% over ~2:45
        repeat:
          count: 16
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.bedroom_ceiling_1
              - light.bedroom_ceiling_2
            data:
              brightness_pct: '{{ [1 + (repeat.index * 4.3), 70] | min | round(0)
                }}'
              color_temp_kelvin: 2700
              transition: 3
          - delay:
              seconds: 10
    - sequence:
      - alias: Wait 30 seconds then bring in lamps, cut fans, start music
        delay:
          seconds: 30
      - alias: Cut bedroom fans
        action: fan.turn_off
        target:
          entity_id:
          - fan.air_circulator
          - fan.bedroom_purifier
          - fan.big_bedroom_fan
      - alias: Lamps start at 1% warm white
        action: light.turn_on
        target:
          entity_id:
          - light.bedroom_lamp_1
          - light.bedroom_lamp_2
        data:
          color_temp_kelvin: 2700
          brightness_pct: 1
          transition: 3
      - alias: Lamps fade to 94% over ~2:30
        repeat:
          count: 14
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.bedroom_lamp_1
              - light.bedroom_lamp_2
            data:
              brightness_pct: '{{ [1 + (repeat.index * 6.6), 94] | min | round(0)
                }}'
              color_temp_kelvin: 2700
              transition: 3
          - delay:
              seconds: 10
    - sequence:
      - alias: Wait 30 seconds (sync with lamp start)
        delay:
          seconds: 30
      - alias: Unjoin bedroom speaker from any group before starting
        continue_on_error: true
        action: media_player.unjoin
        target:
          entity_id: media_player.bedroom_2
      - delay:
          seconds: 3
      - action: media_player.volume_set
        target:
          entity_id: media_player.bedroom
        data:
          volume_level: 0.05
      - alias: Play morning playlist via Music Assistant
        continue_on_error: true
        action: music_assistant.play_media
        target:
          entity_id: media_player.bedroom_2
        data:
          media_id: ytmusic://playlist/VLPLrALqIYcGkyQQVGQMsNp09LW2kQNVUFx1
          media_type: playlist
      - alias: Shuffle morning playlist
        continue_on_error: true
        action: media_player.shuffle_set
        target:
          entity_id: media_player.bedroom_2
        data:
          shuffle: true
      - delay:
          seconds: 3
      - alias: Ensure playback is not paused after unjoin
        continue_on_error: true
        action: media_player.media_play
        target:
          entity_id: media_player.bedroom_2
      - alias: Wait 10 seconds then check if music is playing
        delay:
          seconds: 10
      - alias: Get today's daily forecast (high/low/expected condition) for the announcement
        continue_on_error: true
        action: weather.get_forecasts
        target:
          entity_id: weather.forecast_home
        data:
          type: daily
        response_variable: today_fc
      - if:
        - condition: or
          conditions:
          - condition: state
            entity_id: media_player.bedroom_2
            state: idle
          - condition: state
            entity_id: media_player.bedroom_2
            state: 'off'
        then:
        - alias: TTS good morning announcement (music failed)
          action: tts.speak
          target:
            entity_id: tts.piper
          data:
            cache: false
            media_player_entity_id: media_player.bedroom
            message: '{% set fc = today_fc[''weather.forecast_home''][''forecast'']
              if (today_fc is defined and today_fc and ''weather.forecast_home'' in
              today_fc) else [] %} {% set f = fc[0] if fc else none %} Good morning!
              Today is {{ now().strftime(''%A, %B %-d'') }}. Right now it''s {{ states(''weather.forecast_home'')
              | replace(''-'', '' '') }} and {{ (state_attr(''weather.forecast_home'',
              ''temperature'') | float(0)) | round | int }} degrees. {% if f %}Today
              will be {{ f.condition | replace(''-'', '' '') }}, with a high of {{
              (f.temperature | float(0)) | round | int }} and a low of {{ (f.templow
              | float(0)) | round | int }} degrees.{% endif %} Have a great day!'
        else:
        - alias: Ramp volume to 0.20 over ~2.5 minutes
          repeat:
            count: 8
            sequence:
            - delay:
                seconds: 18
            - action: media_player.volume_set
              target:
                entity_id: media_player.bedroom
              data:
                volume_level: '{{ [0.05 + (repeat.index * 0.019), 0.20] | min | round(3)
                  }}'
        - alias: Wait for bedroom motion before announcement
          wait_for_trigger:
          - trigger: state
            entity_id: binary_sensor.apollo_msr_2_big_bedroom_radar_moving_target
            to: 'on'
          timeout:
            minutes: 60
        - alias: Check if occupancy wait timed out
          if:
          - condition: template
            value_template: '{{ wait.completed == false }}'
          then:
          - action: media_player.media_stop
            target:
              entity_id: media_player.bedroom
          - continue_on_error: true
            action: media_player.unjoin
            target:
              entity_id: media_player.bathroom_2
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.good_morning_active
          - stop: Occupancy wait timed out - routine complete
          else:
          - alias: Good morning announcement via Music Assistant (sent to the MA entity
              so MA plays it as an announcement - it ducks/pauses its own queue, speaks,
              then resumes the SAME track at the SAME position. This avoids the Sonos
              TTS snapshot that used to break the MA queue and force a full playlist
              re-queue, which restarted the music from track 1.)
            action: tts.speak
            target:
              entity_id: tts.piper
            data:
              cache: false
              media_player_entity_id: media_player.bedroom_2
              message: '{% set fc = today_fc[''weather.forecast_home''][''forecast'']
                if (today_fc is defined and today_fc and ''weather.forecast_home''
                in today_fc) else [] %} {% set f = fc[0] if fc else none %} Good morning!
                Today is {{ now().strftime(''%A, %B %-d'') }}. Right now it''s {{
                states(''weather.forecast_home'') | replace(''-'', '' '') }} and {{
                (state_attr(''weather.forecast_home'', ''temperature'') | float(0))
                | round | int }} degrees. {% if f %}Today will be {{ f.condition |
                replace(''-'', '' '') }}, with a high of {{ (f.temperature | float(0))
                | round | int }} and a low of {{ (f.templow | float(0)) | round |
                int }} degrees.{% endif %} Have a great day!'
          - alias: Wait for the announcement to finish and music to resume
            wait_template: '{{ is_state(''media_player.bedroom_2'', ''playing'') }}'
            timeout:
              seconds: 30
            continue_on_timeout: true
          - alias: Restore listening volume after announcement
            action: media_player.volume_set
            target:
              entity_id: media_player.bedroom
            data:
              volume_level: 0.2
        - alias: Occupancy-driven music loop using Sensor Group
          repeat:
            while:
            - condition: state
              entity_id: input_boolean.good_morning_active
              state: 'on'
            sequence:
            - if:
              - condition: state
                entity_id: binary_sensor.big_bedroom_sensor_group
                state: 'on'
              then:
              - alias: Self-heal - re-queue playlist if Music Assistant went silent
                if:
                - condition: state
                  entity_id: media_player.bedroom_2
                  state:
                  - idle
                  - 'off'
                then:
                - continue_on_error: true
                  action: music_assistant.play_media
                  target:
                    entity_id: media_player.bedroom_2
                  data:
                    media_id: ytmusic://playlist/VLPLrALqIYcGkyQQVGQMsNp09LW2kQNVUFx1
                    media_type: playlist
                - continue_on_error: true
                  action: media_player.shuffle_set
                  target:
                    entity_id: media_player.bedroom_2
                  data:
                    shuffle: true
              - action: media_player.volume_set
                target:
                  entity_id: media_player.bedroom
                data:
                  volume_level: 0.2
              - delay:
                  seconds: 30
              else:
              - alias: Wait 15 min to confirm room is truly clear
                wait_for_trigger:
                - trigger: state
                  entity_id: binary_sensor.big_bedroom_sensor_group
                  to: 'on'
                timeout:
                  minutes: 15
                continue_on_timeout: true
              - if:
                - condition: template
                  value_template: '{{ wait.completed == true }}'
                then:
                - action: media_player.volume_set
                  target:
                    entity_id: media_player.bedroom
                  data:
                    volume_level: 0.2
                else:
                - alias: Ramp volume down over 2 minutes
                  repeat:
                    count: 8
                    sequence:
                    - action: media_player.volume_set
                      target:
                        entity_id: media_player.bedroom
                      data:
                        volume_level: '{{ [0.20 - (repeat.index * 0.019), 0.05] |
                          max | round(3) }}'
                    - delay:
                        seconds: 15
                - action: media_player.media_stop
                  target:
                    entity_id: media_player.bedroom
                - continue_on_error: true
                  action: media_player.unjoin
                  target:
                    entity_id: media_player.bathroom_2
                - action: input_boolean.turn_off
                  target:
                    entity_id: input_boolean.good_morning_active
                - stop: Room cleared for 15 minutes - routine complete
    - sequence:
      - alias: Wait 5 minutes then restore AL
        delay:
          minutes: 5
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.al_big_bedroom
          lights:
          - light.bedroom_ceiling_1
          - light.bedroom_ceiling_2
          - light.bedroom_lamp_1
          - light.bedroom_lamp_2
          manual_control: false
      - action: switch.turn_on
        target:
          entity_id:
          - switch.al_big_bedroom
          - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_color_big_bedroom_al
          - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_brightness_big_bedroom_al
      - action: input_select.select_option
        target:
          entity_id: input_select.bedroom_scene_mode
        data:
          option: al
      - action: adaptive_lighting.apply
        continue_on_error: true
        data:
          entity_id: switch.al_big_bedroom
          lights:
          - light.bedroom_ceiling_1
          - light.bedroom_ceiling_2
          - light.bedroom_lamp_1
          - light.bedroom_lamp_2
          transition: 30
          adapt_color: true
          adapt_brightness: true
          prefer_rgb_color: true
      - alias: Re-enable Big Bedroom motion automation
        action: automation.turn_on
        target:
          entity_id: automation.big_bedroom_smart_motion_presence
      - alias: Only trigger Nanoleaf if occupancy detected
        if:
        - condition: state
          entity_id: binary_sensor.big_bedroom_sensor_group
          state: 'on'
        then:
        - action: select.select_option
          target:
            entity_id: select.nanoleaf_dynamic_scenes
          data:
            option: Cocoa Beach
        - action: light.turn_on
          target:
            entity_id: light.nano_sand_dune
          data:
            brightness_pct: 80
            transition: 5
    - sequence:
      - alias: 60-minute hard cap timer
        delay:
          hours: 1
      - continue_on_error: true
        action: media_player.media_stop
        target:
          entity_id: media_player.bedroom_2
      - continue_on_error: true
        action: media_player.unjoin
        target:
          entity_id: media_player.bathroom_2
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.good_morning_active
  mode: parallel
  max: 2
- id: '1777890100001'
  alias: Heater Auto Off
  description: Keeps bathroom heater plug on all the time. Auto-shuts off for 5 seconds
    after  30 minutes of continuous use (>100W), then re-enables automatically.
  triggers:
  - trigger: time
    at: 06:00:00
    id: startup
  - trigger: numeric_state
    entity_id:
    - sensor.bathroom_heater_current_consumption
    above: 100
    for:
      hours: 0
      minutes: 20
      seconds: 0
    id: high_power_30min
  - trigger: numeric_state
    entity_id: sensor.bathroom_heater_current_consumption
    below: 100
    for:
      seconds: 5
    id: power_off_5s
  conditions: []
  actions:
  - choose:
    - alias: Startup - ensure outlet is on
      conditions:
      - condition: trigger
        id: startup
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.bathroom_heater
    - alias: High power for 30min - turn off for 5 seconds
      conditions:
      - condition: trigger
        id: high_power_30min
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.bathroom_heater
      - delay:
          seconds: 5
      - action: switch.turn_on
        target:
          entity_id: switch.bathroom_heater
    - alias: Power below 100W for 5s - turn on (safety)
      conditions:
      - condition: trigger
        id: power_off_5s
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.bathroom_heater
  mode: single
- id: '1778020278429'
  alias: Elgato Light Auto Off on PC Shutdown
  description: Turns off the Elgato Showtime light when office PC plug wattage drops
    below 20W, indicating the computer has shut down.
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.office_pc_plug_current_consumption
    below: 25
    for:
      seconds: 10
    id: low_power_detected
  conditions: []
  actions:
  - alias: Turn off Elgato light when PC powers down
    action: light.turn_off
    target:
      entity_id: light.showtime_light
  mode: single
- id: '1778194432803'
  alias: Bathroom Speaker Join on Motion v2
  description: 'Joins bathroom Sonos to the active source on motion. During welcome_home_active
    the source is the kitchen; otherwise it''s the bedroom Arc. Matches source volume,
    ramping in gracefully. Uses timer.bathroom_join_idle to track 15-minute motion-clear
    window: motion off starts the timer, motion on cancels it, timer finish ungroups.
    Also ungroups if either source goes idle/paused/off. Skipped while Good Morning
    routine is active.'
  triggers:
  - trigger: state
    entity_id: binary_sensor.bathroom_motion
    to: 'on'
    id: motion_on
  - trigger: state
    entity_id: binary_sensor.bathroom_motion
    to: 'off'
    id: motion_off
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.bathroom_join_idle
    id: idle_timer_done
  - trigger: state
    entity_id: media_player.bedroom
    to:
    - idle
    - paused
    - 'off'
    - standby
    id: bedroom_stopped
  - trigger: state
    entity_id: media_player.kitchen
    to:
    - idle
    - paused
    - 'off'
    - standby
    id: kitchen_stopped
  conditions: []
  actions:
  - variables:
      welcome_home_on: '{{ is_state(''input_boolean.welcome_home_active'', ''on'')
        }}'
      bedroom_active: "{{ states('media_player.bedroom') not in\n   ['off','idle','paused','standby','unavailable','unknown']
        }}"
      kitchen_active: "{{ states('media_player.kitchen') not in\n   ['off','idle','paused','standby','unavailable','unknown']
        }}"
      source_player: '{% if welcome_home_on and kitchen_active %} media_player.kitchen
        {% elif bedroom_active %} media_player.bedroom {% else %} none {% endif %}'
  - choose:
    - alias: Motion detected - join if eligible
      conditions:
      - condition: trigger
        id: motion_on
      - alias: A source is currently active
        condition: template
        value_template: '{{ source_player != ''none'' }}'
      sequence:
      - alias: Cancel any pending idle timer
        action: timer.cancel
        target:
          entity_id: timer.bathroom_join_idle
      - alias: Skip if Good Morning routine is active
        condition: state
        entity_id: input_boolean.good_morning_active
        state: 'off'
        enabled: false
      - alias: Skip if bathroom already in the source group
        condition: template
        value_template: "{{ state_attr(source_player, 'group_members') is not none
          and\n   'media_player.bathroom' not in\n   (state_attr(source_player, 'group_members')
          | default([])) }}"
      - variables:
          bathroom_vol_before: '{{ state_attr(''media_player.bathroom'', ''volume_level'')
            | default(0.30) }}'
          target_vol: '{{ state_attr(source_player, ''volume_level'') | default(0.20)
            | float }}'
      - alias: Store pre-join volume for later restore
        action: input_number.set_value
        target:
          entity_id: input_number.bathroom_vol_before_join
        data:
          value: '{{ bathroom_vol_before }}'
      - alias: Unmute bathroom before join
        continue_on_error: true
        action: media_player.volume_mute
        target:
          entity_id: media_player.bathroom
        data:
          is_volume_muted: false
      - alias: Set bathroom volume low before joining
        action: media_player.volume_set
        target:
          entity_id: media_player.bathroom
        data:
          volume_level: 0.05
      - alias: Join bathroom to source group
        action: media_player.join
        target:
          entity_id: '{{ source_player }}'
        data:
          group_members:
          - media_player.bathroom
      - alias: Unmute again after join
        continue_on_error: true
        action: media_player.volume_mute
        target:
          entity_id: media_player.bathroom
        data:
          is_volume_muted: false
      - alias: Ramp bathroom volume up to match source
        repeat:
          count: 5
          sequence:
          - delay:
              seconds: 6
          - action: media_player.volume_set
            target:
              entity_id: media_player.bathroom
            data:
              volume_level: "{{ [0.05 + (repeat.index * ((target_vol - 0.05) / 5)),\n
                \   target_vol] | min | round(3) }}"
    - alias: Motion cleared - start idle timer (only if grouped)
      conditions:
      - condition: trigger
        id: motion_off
      - alias: Bathroom is currently in any active source group
        condition: template
        value_template: "{{ ('media_player.bathroom' in\n    (state_attr('media_player.bedroom',
          'group_members') | default([])))\n   or\n   ('media_player.bathroom' in\n
          \   (state_attr('media_player.kitchen', 'group_members') | default([])))
          }}"
      sequence:
      - alias: Start/restart the 10-minute idle timer
        action: timer.start
        target:
          entity_id: timer.bathroom_join_idle
        data:
          duration:
            hours: 0
            minutes: 10
            seconds: 0
    - alias: Idle timer elapsed - ungroup bathroom
      conditions:
      - condition: trigger
        id: idle_timer_done
      sequence:
      - alias: Ungroup bathroom Sonos
        continue_on_error: true
        action: media_player.unjoin
        target:
          entity_id: media_player.bathroom
        data: {}
      - alias: Restore bathroom volume
        action: media_player.volume_set
        target:
          entity_id: media_player.bathroom
        data:
          volume_level: '{{ states(''input_number.bathroom_vol_before_join'') | float(0.30)
            }}'
    - alias: Source stopped - ungroup immediately
      conditions:
      - condition: trigger
        id:
        - bedroom_stopped
        - kitchen_stopped
      - alias: Bathroom is currently in the stopped source's group
        condition: template
        value_template: "{% set stopped = 'media_player.bedroom' if trigger.id ==
          'bedroom_stopped'\n   else 'media_player.kitchen' %}\n{{ 'media_player.bathroom'
          in\n   (state_attr(stopped, 'group_members') | default([])) }}"
      sequence:
      - alias: Cancel idle timer if running
        action: timer.cancel
        target:
          entity_id: timer.bathroom_join_idle
        data: {}
      - alias: Ungroup bathroom Sonos
        continue_on_error: true
        action: media_player.unjoin
        target:
          entity_id: media_player.bathroom
        data: {}
      - alias: Restore bathroom volume
        action: media_player.volume_set
        target:
          entity_id: media_player.bathroom
        data:
          volume_level: '{{ states(''input_number.bathroom_vol_before_join'') | float(0.30)
            }}'
  mode: queued
  max: 10
- id: '1778197535595'
