        - continue_on_error: true
          action: media_player.shuffle_set
          target:
            device_id: b42d3b4542fb52c759f5aef09d3f6dad
          data:
            shuffle: true
      - alias: Play afternoon music (12 PM - 5 PM)
        if:
        - condition: template
          value_template: '{{ current_hour|int >= 12 and current_hour|int < 17 }}'
        then:
        - continue_on_error: true
          action: music_assistant.play_media
          target:
            device_id: b42d3b4542fb52c759f5aef09d3f6dad
          data:
            media_id: ytmusic://album/MPREb_S3lOF926Vx1
            media_type: album
        - continue_on_error: true
          action: media_player.shuffle_set
          target:
            device_id: b42d3b4542fb52c759f5aef09d3f6dad
          data:
            shuffle: true
      - alias: Play evening music (5 PM - 8 PM)
        if:
        - condition: template
          value_template: '{{ current_hour|int >= 17 and current_hour|int < 20 }}'
        then:
        - continue_on_error: true
          action: music_assistant.play_media
          target:
            device_id: b42d3b4542fb52c759f5aef09d3f6dad
          data:
            media_id: ytmusic://album/MPREb_di7Fj3Fiafj
            media_type: album
        - continue_on_error: true
          action: media_player.shuffle_set
          target:
            device_id: b42d3b4542fb52c759f5aef09d3f6dad
          data:
            shuffle: true
      - alias: Play late night music (8 PM - 10 PM)
        if:
        - condition: template
          value_template: '{{ current_hour|int >= 20 }}'
        then:
        - continue_on_error: true
          action: music_assistant.play_media
          target:
            device_id: b42d3b4542fb52c759f5aef09d3f6dad
          data:
            media_id: ytmusic://album/MPREb_VkHTY8TFW8V
            media_type: album
        - continue_on_error: true
          action: media_player.shuffle_set
          target:
            device_id: b42d3b4542fb52c759f5aef09d3f6dad
          data:
            shuffle: true
      continue_on_error: true
