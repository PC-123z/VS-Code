          - condition: state
            entity_id: media_player.office_2
            state: playing
        then:
        - action: notify.mobile_app_pc_iphone
          data:
            title: Bedroom 2 sleep music didn't start
            message: Office/Bedroom 2 speaker didn't start playing after two tries
              - speaker may be offline.
      - alias: Let it play 40 minutes or until 11:15pm, whichever comes first
        wait_for_trigger:
        - trigger: time
          at: '23:15:00'
        timeout:
          minutes: 40
      - alias: Stop sleep music
        action: media_player.media_stop
        continue_on_error: true
        target:
          entity_id: media_player.office_2
    - conditions:
      - condition: trigger
        id: motion_detected
      - alias: Only run full setup once - skip if already occupied
        condition: state
        entity_id: input_boolean.bedroom2_occupied
        state: 'off'
      - alias: Bedtime Routine active window - 10:00pm to 6am
        condition: time
        after: '22:00:00'
        before: 06:00:00
      sequence:
      - alias: Set bedroom 2 occupied (fan and music start via occupied_set branch)
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.bedroom2_occupied
      - alias: Skip light changes if dimmer override is active
        if:
        - condition: state
          entity_id: input_boolean.bedroom2_manual_override
          state: 'off'
        then:
        - alias: Nanoleafs and office to burnt orange at 10%
          action: light.turn_on
          target:
            entity_id:
            - light.ribbon
            - light.fluttershy
            - light.office
          data:
            rgb_color:
            - 191
            - 87
            - 0
            brightness_pct: 10
            transition: 3
    - conditions:
      - condition: trigger
        id: motion_cleared
      - condition: state
        entity_id: input_boolean.bedroom2_occupied
        state: 'on'
      - alias: Bedtime Routine active window - 10:00pm to 6am
        condition: time
        after: '22:00:00'
        before: 06:00:00
      - alias: Skip if dimmer override is active
        condition: state
        entity_id: input_boolean.bedroom2_manual_override
        state: 'off'
      sequence:
      - alias: Nanoleafs and office back to dim orange
        action: light.turn_on
        target:
          entity_id:
          - light.ribbon
          - light.fluttershy
          - light.office
        data:
          rgb_color:
          - 191
          - 87
          - 0
          brightness_pct: 3
          transition: 30
    - conditions:
      - condition: trigger
        id: lights_out
      - condition: state
        entity_id: input_boolean.bedroom2_occupied
        state: 'on'
      - alias: Skip if dimmer override is active
        condition: state
        entity_id: input_boolean.bedroom2_manual_override
        state: 'off'
      sequence:
      - alias: Slow fade all lights off over 2 minutes
        action: light.turn_off
        target:
          entity_id:
          - light.ribbon
          - light.fluttershy
          - light.office
        data:
          transition: 120
    - conditions:
      - condition: trigger
        id: hard_lights_out
      sequence:
      - alias: All lights fade off at 10:45pm regardless of occupied or override state
        action: light.turn_off
        target:
          entity_id:
          - light.ribbon
          - light.fluttershy
          - light.office
          - light.bedroom_2
        data:
          transition: 60
      - delay:
          minutes: 5
      - alias: Cut power to the Nanoleaf P115 outlets so a WiFi-reconnect glitch can't
          bring Ribbon/Fluttershy back on overnight - restored by Good Morning Routine
        action: switch.turn_off
        target:
          entity_id:
          - switch.bedroom2_office_nano1
          - switch.nano2
    - conditions:
      - condition: trigger
        id: music_stop
      sequence:
      - alias: Hard music stop at 11:15pm regardless of occupied or override state
        action: media_player.media_stop
        continue_on_error: true
        target:
          entity_id: media_player.office_2
  mode: parallel
  max: 3
- id: '1776378473889'
  alias: '*Bedroom 2 Good Morning Routine'
  description: Triggers at 6:50am only if bedroom2_occupied is on. Pre-staged lights
    to prevent flash. Staged ramp, wake album, TTS on motion, fans off. Music until
    presence clears or 7:30am.
  triggers:
  - trigger: time
    at: 07:00:00
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  - trigger: time
    at: '10:30:00'
    weekday:
    - sun
    - sat
  conditions:
  - condition: state
    entity_id: input_boolean.bedroom2_occupied
    state: 'on'
  actions:
  - alias: Power the Nanoleaf P115 outlets back on first so the panels have time to
      reboot/rejoin WiFi before being commanded (see Bedtime Routine's hard_lights_out
      for where they get cut)
    action: switch.turn_on
    target:
      entity_id:
      - switch.bedroom2_office_nano1
      - switch.nano2
  - delay:
      seconds: 5
  - alias: Clear manual override so motion automation can take over after wake-up
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.bedroom2_manual_override
  - alias: Turn off AL sleep mode and office AL
    action: switch.turn_off
    target:
      entity_id:
      - switch.adaptive_lighting_sleep_mode_office
      - switch.adaptive_lighting_office
  - alias: Pre-stage Nanoleafs with Morning Sky at 1%
    action: light.turn_on
    target:
      entity_id:
      - light.ribbon
      - light.fluttershy
    data:
      effect: Morning Sky
      brightness_pct: 1
      transition: 1
  - delay:
      seconds: 2
  - alias: Pre-stage office Hue at 1% warm white
    action: light.turn_on
    target:
      entity_id:
      - light.office_2
      - light.office_1
    data:
      brightness_pct: 1
      color_temp_kelvin: 2700
      transition: 2
  - delay:
      seconds: 3
  - alias: Run all sunrise stages in parallel
    parallel:
    - sequence:
      - alias: Ribbon and Fluttershy ramp brightness to 80% over 3 minutes
        repeat:
          count: 18
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.ribbon
              - light.fluttershy
            data:
              brightness_pct: '{{ [1 + (repeat.index * 4.4), 80] | min | round(0)
                }}'
              transition: 3
          - delay:
              seconds: 10
    - sequence:
      - alias: Wait 30 seconds then bring in office light
        delay:
          seconds: 30
      - alias: Office light ramps to 100% over ~2:30
        repeat:
          count: 15
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.office
            data:
              brightness_pct: '{{ [1 + (repeat.index * 6.6), 100] | min | round(0)
                }}'
              color_temp_kelvin: 2700
              transition: 3
          - delay:
              seconds: 10
    - sequence:
      - action: fan.turn_off
        target:
          entity_id: fan.bedroom2_fan
        data: {}
    - sequence:
      - delay:
          seconds: 30
      - action: media_player.volume_set
        target:
          entity_id: media_player.office_2
        data:
          volume_level: 0.1
      - alias: Play wake album via Music Assistant
        continue_on_error: true
        action: music_assistant.play_media
        target:
          entity_id: media_player.office_2
        data:
          media_id: ytmusic://album/MPREb_eRqlXW8MAYH
          media_type: album
      - delay:
          seconds: 15
      - alias: Get today's daily forecast (high/low/expected condition) for the announcements
        continue_on_error: true
        action: weather.get_forecasts
        target:
          entity_id: weather.forecast_home
        data:
          type: daily
        response_variable: today_fc
      - if:
        - condition: or
          conditions:
          - condition: state
            entity_id: media_player.office_2
            state: idle
          - condition: state
            entity_id: media_player.office_2
            state: 'off'
        then:
        - alias: Wait for moving target before announcement (music failed path)
          wait_for_trigger:
          - trigger: state
            entity_id: binary_sensor.bedroom2_sensor_apollo_radar_moving_target
            to: 'on'
          timeout:
            minutes: 45
        - if:
          - condition: template
            value_template: '{{ wait.completed == false }}'
          then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.bedroom2_occupied
          - stop: Motion wait timed out - routine complete
        - alias: Set volume for first announcement
          action: media_player.volume_set
          target:
            entity_id: media_player.office_2
          data:
            volume_level: 0.2
        - alias: TTS announcement (music failed)
          action: tts.speak
          target:
            entity_id: tts.piper
          data:
            cache: false
            media_player_entity_id: media_player.office_2
            message: '{% set fc = today_fc[''weather.forecast_home''][''forecast'']
              if (today_fc is defined and today_fc and ''weather.forecast_home'' in
              today_fc) else [] %} {% set f = fc[0] if fc else none %} Good morning
              Lily & Caylee! Today is {{ now().strftime(''%A, %B %-d'') }} and its
              going to be a great day! The time is {{ now().strftime(''%-I:%M %p'')
              }}. The current conditions are {{ states(''weather.forecast_home'')
              | replace(''-'', '' '') }}, with a temperature of {{ (state_attr(''weather.forecast_home'',
              ''temperature'') | float(0)) | round | int }} degrees. {% if f %}Today
              will be {{ f.condition | replace(''-'', '' '') }}, with a high of {{
              (f.temperature | float(0)) | round | int }} and a low of {{ (f.templow
              | float(0)) | round | int }} degrees.{% endif %} Let''s go!!!!!'
        - delay:
            seconds: 12
        - alias: Bump volume for second announcement
          action: media_player.volume_set
          target:
            entity_id: media_player.office_2
          data:
            volume_level: 0.25
        - alias: TTS second announcement (music failed)
          action: tts.speak
          target:
            entity_id: tts.piper
          data:
            cache: false
            media_player_entity_id: media_player.office_2
            message: '{% set fc = today_fc[''weather.forecast_home''][''forecast'']
              if (today_fc is defined and today_fc and ''weather.forecast_home'' in
              today_fc) else [] %} {% set f = fc[0] if fc else none %} In case you
              missed it the first time, it seems you are really awake now. Good morning
              Lily & Caylee! Today is {{ now().strftime(''%A, %B %-d'') }} and its
              going to be a great day! The time is {{ now().strftime(''%-I:%M %p'')
              }}. The current conditions are {{ states(''weather.forecast_home'')
              | replace(''-'', '' '') }}, with a temperature of {{ (state_attr(''weather.forecast_home'',
              ''temperature'') | float(0)) | round | int }} degrees. {% if f %}Today
              will be {{ f.condition | replace(''-'', '' '') }}, with a high of {{
              (f.temperature | float(0)) | round | int }} and a low of {{ (f.templow
              | float(0)) | round | int }} degrees.{% endif %} Let''s go!!!!!'
        else:
        - alias: Ramp volume to 0.22
          repeat:
            count: 8
            sequence:
            - delay:
                seconds: 18
            - action: media_player.volume_set
              target:
                entity_id: media_player.office_2
              data:
                volume_level: '{{ [0.05 + (repeat.index * 0.021), 0.22] | min | round(3)
                  }}'
        - alias: Wait for moving target before announcement
          wait_for_trigger:
          - trigger: state
            entity_id: binary_sensor.bedroom2_sensor_apollo_radar_moving_target
            to: 'on'
          timeout:
            minutes: 45
        - if:
          - condition: template
            value_template: '{{ wait.completed == false }}'
          then:
          - action: media_player.media_stop
            target:
              entity_id: media_player.office_2
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.bedroom2_occupied
          - stop: Motion wait timed out - routine complete
        - alias: Pause music for announcement
          action: media_player.media_pause
          target:
            entity_id: media_player.office_2
        - alias: Set volume for first announcement
          action: media_player.volume_set
          target:
            entity_id: media_player.office_2
          data:
            volume_level: 0.2
        - alias: TTS good morning announcement
          action: tts.speak
          target:
            entity_id: tts.piper
          data:
            cache: false
            media_player_entity_id: media_player.office_2
            message: '{% set fc = today_fc[''weather.forecast_home''][''forecast'']
              if (today_fc is defined and today_fc and ''weather.forecast_home'' in
              today_fc) else [] %} {% set f = fc[0] if fc else none %} Good morning
              Lily & Caylee! Today is {{ now().strftime(''%A, %B %-d'') }} and its
              going to be a great day! The time is {{ now().strftime(''%-I:%M %p'')
              }}. The current conditions are {{ states(''weather.forecast_home'')
              | replace(''-'', '' '') }}, with a temperature of {{ (state_attr(''weather.forecast_home'',
              ''temperature'') | float(0)) | round | int }} degrees. {% if f %}Today
              will be {{ f.condition | replace(''-'', '' '') }}, with a high of {{
              (f.temperature | float(0)) | round | int }} and a low of {{ (f.templow
              | float(0)) | round | int }} degrees.{% endif %} Let''s go!!!!!'
        - delay:
            seconds: 12
        - alias: Bump volume for second announcement
          action: media_player.volume_set
          target:
            entity_id: media_player.office_2
          data:
            volume_level: 0.25
        - alias: TTS second announcement
          action: tts.speak
          target:
            entity_id: tts.piper
          data:
            cache: false
            media_player_entity_id: media_player.office_2
            message: '{% set fc = today_fc[''weather.forecast_home''][''forecast'']
              if (today_fc is defined and today_fc and ''weather.forecast_home'' in
              today_fc) else [] %} {% set f = fc[0] if fc else none %} In case you
              missed it the first time, it seems you are really awake now. Good morning
              Lily & Caylee! Today is {{ now().strftime(''%A, %B %-d'') }} and its
              going to be a great day! The time is {{ now().strftime(''%-I:%M %p'')
              }}. The current conditions are {{ states(''weather.forecast_home'')
              | replace(''-'', '' '') }}, with a temperature of {{ (state_attr(''weather.forecast_home'',
              ''temperature'') | float(0)) | round | int }} degrees. {% if f %}Today
              will be {{ f.condition | replace(''-'', '' '') }}, with a high of {{
              (f.temperature | float(0)) | round | int }} and a low of {{ (f.templow
              | float(0)) | round | int }} degrees.{% endif %} Let''s go!!!!!'
        - alias: Resume music after announcements
          action: media_player.media_play
          target:
            entity_id: media_player.office_2
        - alias: Restore volume to 0.22 after announcements
          action: media_player.volume_set
          target:
            entity_id: media_player.office_2
          data:
            volume_level: 0.22
        - alias: Occupancy-driven music loop
          repeat:
            while:
            - condition: state
              entity_id: input_boolean.bedroom2_occupied
              state: 'on'
            sequence:
            - if:
              - condition: or
                conditions:
                - condition: state
                  entity_id: binary_sensor.bedroom2_sensor_apollo_radar_zone_1_occupancy
                  state: 'on'
                - condition: state
                  entity_id: binary_sensor.bedroom2_sensor_apollo_radar_zone_2_occupancy
                  state: 'on'
                - condition: state
                  entity_id: binary_sensor.bedroom2_sensor_apollo_radar_zone_3_occupancy
                  state: 'on'
              then:
              - action: media_player.volume_set
                target:
                  entity_id: media_player.office_2
                data:
                  volume_level: 0.22
              - delay:
                  seconds: 30
              else:
              - repeat:
                  count: 8
                  sequence:
                  - action: media_player.volume_set
                    target:
                      entity_id: media_player.office_2
                    data:
                      volume_level: '{{ [0.22 - (repeat.index * 0.025), 0.02] | max
                        | round(3) }}'
                  - delay:
                      seconds: 15
                  - if:
                    - condition: or
                      conditions:
                      - condition: state
                        entity_id: binary_sensor.bedroom2_sensor_apollo_radar_zone_1_occupancy
                        state: 'on'
                      - condition: state
                        entity_id: binary_sensor.bedroom2_sensor_apollo_radar_zone_2_occupancy
                        state: 'on'
                      - condition: state
                        entity_id: binary_sensor.bedroom2_sensor_apollo_radar_zone_3_occupancy
                        state: 'on'
                    then:
                    - action: media_player.volume_set
                      target:
                        entity_id: media_player.office_2
                      data:
                        volume_level: 0.22
                    - stop: Occupancy returned during ramp-down
              - action: media_player.media_stop
                target:
                  entity_id: media_player.office_2
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.bedroom2_occupied
              - stop: Room cleared - routine complete
        - action: media_player.media_stop
          target:
            entity_id: media_player.office_2
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.bedroom2_occupied
    - sequence:
      - delay:
          minutes: 5
      - action: switch.turn_on
        target:
          entity_id: switch.adaptive_lighting_office
      - action: adaptive_lighting.apply
        continue_on_error: true
        data:
          entity_id: switch.adaptive_lighting_office
          lights:
          - light.office
          transition: 30
          adapt_color: true
          adapt_brightness: true
      - alias: Cocoa Beach on Nanoleafs if occupancy detected
        if:
        - condition: or
          conditions:
          - condition: state
            entity_id: binary_sensor.bedroom2_sensor_apollo_radar_zone_1_occupancy
            state: 'on'
          - condition: state
            entity_id: binary_sensor.bedroom2_sensor_apollo_radar_zone_2_occupancy
            state: 'on'
          - condition: state
            entity_id: binary_sensor.bedroom2_sensor_apollo_radar_zone_3_occupancy
            state: 'on'
        then:
        - action: light.turn_on
          target:
            entity_id:
            - light.ribbon
            - light.fluttershy
          data:
            effect: Cocoa Beach
            brightness_pct: 80
            transition: 5
      - action: automation.turn_on
        metadata: {}
        target:
          entity_id: automation.office_bedroom_2_smart_motion_presence_2
        data: {}
    - sequence:
      - delay:
          minutes: 30
      - continue_on_error: true
        action: media_player.media_stop
        target:
          entity_id: media_player.office_2
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.bedroom2_occupied
  mode: parallel
  max: 2
- id: '1776382720393'
  alias: Bedroom 2 Daily Reset
  description: Backstop reset 30 min after Good Morning Routine's trigger time (9:30am
    weekdays, 11am weekends). Turns off bedroom2_occupied if still on after the good
    morning routine should have completed. Must stay after Good Morning's own trigger
    time or it clears the flag first and Good Morning's occupied condition fails,
    skipping the whole routine (outlets, fan, wake ramp, everything) - this happened
    on weekdays from 2026-08-05 when Good Morning moved to 8:30am but this stayed
    at 8:00am.
  triggers:
  - trigger: time
    at: 09:30:00
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  - trigger: time
    at: '11:00:00'
    weekday:
    - sun
    - sat
  conditions: []
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.bedroom2_occupied
  mode: single
- id: '1776382720394'
  alias: Bedroom 2 Occupancy Latch
  description: Sets bedroom2_occupied once per night when the sensor group detects
    presence between 22:00 and midnight. Single-fire - won't retrigger if already
    occupied. Cleared by Good Morning Routine and Daily Reset.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.bedroom_2_sensor_group
    to: 'on'
  conditions:
  - condition: time
    after: '22:00:00'
    before: 00:00:00
  - condition: state
    entity_id: input_boolean.bedroom2_occupied
    state: 'off'
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.bedroom2_occupied
  mode: single
- id: '1781237174423'
  alias: '*Bedroom 2 After Midnight Lights Out'
  description: After midnight while bedroom2_occupied is on, any Bedroom 2 / Office
    light that stays on for 60 seconds fades back off. Ignores the dimmer manual override
    (same as the 11:40pm hard cutoff) so the kids can't defeat it from the wall dimmer.
    The midnight sweep trigger catches lights turned on between the 11:40pm cutoff
    and midnight, and the startup sweep catches lights already on when HA restarts
    overnight (restored states don't fire the state trigger). Window ends before the
    Good Morning sunrise ramp starts; bedroom2_occupied being cleared by Good Morning
    or Daily Reset also disables it.
  triggers:
  - trigger: state
    entity_id:
    - light.ribbon
    - light.fluttershy
    - light.office
    - light.bedroom_2
    to: 'on'
    for:
      seconds: 60
    id: light_on
  - trigger: time
    at: 00:00:30
    id: sweep
  - trigger: homeassistant
    event: start
    id: sweep
  conditions:
  - condition: state
    entity_id: input_boolean.bedroom2_occupied
    state: 'on'
  - alias: After midnight, before the morning sunrise ramp starts
    condition: or
    conditions:
    - condition: time
      after: 00:00:00
      before: 07:45:00
      weekday:
      - mon
      - tue
      - wed
      - thu
      - fri
    - condition: time
      after: 00:00:00
      before: 09:10:00
      weekday:
      - sat
      - sun
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sweep
      sequence:
      - alias: Fade off anything left on at midnight or HA startup
        action: light.turn_off
        target:
          entity_id:
          - light.ribbon
          - light.fluttershy
          - light.office
          - light.bedroom_2
        data:
          transition: 30
    - conditions:
      - condition: trigger
        id: light_on
      sequence:
      - alias: Fade the light that was turned on back off
        action: light.turn_off
        target:
          entity_id: '{{ trigger.entity_id }}'
        data:
          transition: 30
  mode: parallel
  max: 6
- id: '1776427656334'
  alias: Good Morning - Kitchen Speaker Join
  description: During the good morning routine, joins kitchen speaker on first motion
    detection and ramps to 0.15. Stays grouped until bedroom music stops or routine
    ends. Unjoins when music stops or good morning deactivates.
  triggers:
  - trigger: state
    entity_id: binary_sensor.kitchen_sensor_group
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.good_morning_active
    state: 'on'
  - alias: Skip while Big Bedroom is asleep
    condition: state
    entity_id: input_boolean.big_bedroom_asleep
    state: 'off'
  actions:
  - variables:
      already_joined: "{{ state_attr('media_player.bedroom_2', 'group_members') is
        not none and\n   'media_player.kitchen' in\n   state_attr('media_player.bedroom_2',
        'group_members') | default([]) }}"
      kitchen_vol_before: '{{ state_attr(''media_player.kitchen'', ''volume_level'')
        | default(0.10) }}'
  - alias: Join and ramp only if not already in group
    if:
    - condition: template
      value_template: '{{ not already_joined }}'
    then:
    - alias: Set kitchen volume low before joining to avoid blast
      action: media_player.volume_set
      target:
        entity_id: media_player.kitchen
      data:
        volume_level: 0.05
    - alias: Join kitchen to bedroom group
      action: media_player.join
      target:
        entity_id: media_player.bedroom_2
      data:
        group_members:
        - media_player.kitchen
    - alias: Ramp kitchen volume up to 0.15
      repeat:
        count: 5
        sequence:
        - delay:
            seconds: 6
        - action: media_player.volume_set
          target:
            entity_id: media_player.kitchen
          data:
            volume_level: '{{ [0.05 + (repeat.index * 0.022), 0.15] | min | round(3)
              }}'
  - alias: Wait for routine to end or music stops
    wait_for_trigger:
    - trigger: state
      entity_id: input_boolean.good_morning_active
      to: 'off'
    - trigger: state
      entity_id: media_player.bedroom_2
      to: idle
    - trigger: state
      entity_id: media_player.bedroom_2
      to: paused
    - trigger: state
      entity_id: binary_sensor.kitchen_sensor_group
      to: 'off'
      for:
        minutes: 5
    timeout:
      minutes: 60
  - alias: Ungroup kitchen speaker
    continue_on_error: true
    action: media_player.unjoin
    target:
      entity_id: media_player.kitchen
  - alias: Restore kitchen volume to pre-join level
    action: media_player.volume_set
    target:
      entity_id: media_player.kitchen
    data:
      volume_level: '{{ kitchen_vol_before }}'
  mode: single
  max_exceeded: silent
- id: '1776687030470'
  alias: Sonos Portable Battery Charging
  description: Turn off big bedroom pulse light when Sonos is placed on charger
  triggers:
  - entity_id: binary_sensor.portable_charging
    to: 'on'
    trigger: state
  actions:
  - target:
      entity_id: light.apollo_msr_2_big_bedroom_rgb_light
    action: light.turn_off
- id: '1747180000001'
  alias: Sonos Portable - Battery Monitor
  description: When Sonos Roam is idle/paused for 5 min, snapshot battery, alert if
    below 30%, then turn the device off. Avoids polling the battery sensor.
  triggers:
  - trigger: state
    entity_id: media_player.portable
    to:
    - idle
    - paused
    for:
      minutes: 5
  conditions:
  - alias: Skip if already on charger
    condition: state
    entity_id: binary_sensor.portable_charging
    state: 'off'
  actions:
  - alias: Snapshot battery level into helper
    action: input_number.set_value
    target:
      entity_id: input_number.portable_battery_last_seen
    data:
      value: '{{ states(''sensor.portable_battery'') | int(0) }}'
  - alias: Alert if battery below 30%
    if:
    - condition: numeric_state
      entity_id: input_number.portable_battery_last_seen
      below: 30
    then:
    - alias: Notify phone
      action: notify.mobile_app_pc_iphone
      data:
        title: Sonos Roam Battery Low
        message: Sonos Portable battery is at {{ states('input_number.portable_battery_last_seen')
          | int }}% — Please Charge.
    - alias: Pulse bedroom light
      action: light.turn_on
      target:
        entity_id: light.apollo_msr_2_big_bedroom_rgb_light
      data:
        rgb_color:
        - 0
        - 179
        - 255
        brightness_pct: 8
        effect: Slow Pulse
  - alias: Turn off the Sonos Roam
    action: media_player.turn_off
    target:
      entity_id: media_player.portable
    data: {}
  mode: single
- id: '1776722406866'
