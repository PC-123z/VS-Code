- id: '1776378416550'
  alias: '*Bedroom 2 Bedtime Routine'
  description: Triggers on motion or bedroom2_occupied turning on any time from 10:00pm
    to 6am (no more hard 10:45pm cutoff on the initial trigger - a late bedtime no
    longer skips the whole routine). Sets bedroom2_occupied, starts fan (stays on
    until Good Morning turns it off) and sleep music (stops after 30-45 min or at
    11:15pm, whichever comes first). Lights to burnt orange at setup (whenever bedtime
    starts, or by 10:00pm at the latest as a catch-up), fully off at 10:30pm. All
    lights fade off at 10:45pm (but motion after that still turns them back on).
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.bedroom2_sensor_apollo_radar_moving_target
    to: 'on'
    id: motion_detected
  - trigger: state
    entity_id:
    - binary_sensor.bedroom2_sensor_apollo_radar_moving_target
    to: 'off'
    for:
      minutes: 2
    id: motion_cleared
  - trigger: state
    entity_id: input_boolean.bedroom2_occupied
    to: 'on'
    id: occupied_set
  - trigger: time
    at: '22:00:00'
    id: window_open_catchup
  - trigger: time
    at: '22:30:00'
    id: lights_out
  - trigger: time
    at: '22:45:00'
    id: hard_lights_out
  - trigger: time
    at: '23:15:00'
    id: music_stop
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: window_open_catchup
      - alias: Occupied was latched on before the window opened (e.g. by the Occupancy
          Latch automation) - occupied_set never fired inside the window, so run setup
          now
        condition: state
        entity_id: input_boolean.bedroom2_occupied
        state: 'on'
      sequence:
      - alias: Skip if dimmer override is active
        if:
        - condition: state
          entity_id: input_boolean.bedroom2_manual_override
          state: 'off'
        then:
        - alias: Nanoleafs and office to burnt orange at 10%
          action: light.turn_on
          target:
