- id: '1776224561667'
  alias: 'Bedroom 2: Dimmer'
  description: 'Button 1: Bright 100% with time-based color temp. Button 2: brightness
    up (hold to repeat). Button 3: brightness down (hold to repeat). Button 4: off
    and restore AL.

    '
