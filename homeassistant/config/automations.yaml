- id: '1776378416550'
  alias: '*Bedroom 2 Bedtime Routine'
  description: Triggers on MOTION (not presence) after 9:45pm. Sets bedroom2_occupied,
    starts sleep lighting, fan, and music. Transitions to dim red at 10:30pm, lights
    off at 10:40pm, music stops at 11:30pm.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.bedroom2_sensor_apollo_radar_moving_target
    to: 'on'
    id: motion_detected
  - trigger: state
    entity_id:
    - binary_sensor.bedroom2_sensor_apollo_radar_moving_target
    to: 'off'
    for:
      minutes: 2
    id: motion_cleared
  - trigger: time
    at: '22:30:00'
    id: lights_to_red
  - trigger: time
    at: '22:40:00'
    id: lights_out
  - trigger: time
    at: '23:30:00'
    id: music_ramp_down
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: motion_detected
      - condition: time
        after: '21:45:00'
        before: '22:45:00'
      sequence:
      - alias: Set bedroom 2 occupied
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.bedroom2_occupied
      - alias: Fan on at 50%
        action: fan.turn_on
        data:
          percentage: 50
        target:
          entity_id: fan.bedroom2_fan
      - alias: Nanoleafs and office to burnt orange at 10%
        action: light.turn_on
        target:
          entity_id:
          - light.ribbon
          - light.fluttershy
          - light.office
        data:
          rgb_color:
          - 191
          - 87
          - 0
          brightness_pct: 10
          transition: 3
      - alias: Start sleep music if not already playing
        if:
        - condition: not
          conditions:
          - condition: state
            entity_id: media_player.office_2
            state: playing
        then:
        - action: media_player.volume_set
          target:
            entity_id: media_player.office_2
          data:
            volume_level: 0.15
        - action: music_assistant.play_media
          continue_on_error: true
          target:
            entity_id: media_player.office_2
          data:
            media_id: ytmusic://album/MPREb_V1D8jtdOxK4
            media_type: album
    - conditions:
      - condition: trigger
        id: motion_cleared
      - condition: state
        entity_id: input_boolean.bedroom2_occupied
        state: 'on'
      - condition: time
        after: '21:45:00'
        before: '22:45:00'
      sequence:
      - alias: Nanoleafs and office back to dim orange
        action: light.turn_on
        target:
          entity_id:
          - light.ribbon
          - light.fluttershy
          - light.office
        data:
          rgb_color:
          - 191
          - 87
          - 0
          brightness_pct: 3
          transition: 30
    - conditions:
      - condition: trigger
        id: lights_to_red
      - condition: state
        entity_id: input_boolean.bedroom2_occupied
        state: 'on'
      sequence:
      - alias: All lights to deep red at 2%
        action: light.turn_on
        target:
          entity_id:
          - light.ribbon
          - light.fluttershy
          - light.office
        data:
          rgb_color:
          - 139
          - 0
          - 0
          brightness_pct: 2
          transition: 60
    - conditions:
      - condition: trigger
        id: lights_out
      - condition: state
        entity_id: input_boolean.bedroom2_occupied
        state: 'on'
      sequence:
      - alias: Slow fade all lights off over 2 minutes
        action: light.turn_off
        target:
          entity_id:
          - light.ribbon
          - light.fluttershy
          - light.office
        data:
          transition: 120
    - conditions:
      - condition: trigger
        id: music_ramp_down
      - condition: state
        entity_id: input_boolean.bedroom2_occupied
        state: 'on'
      sequence:
      - alias: Ramp volume down from 0.15 to 0 over ~3 minutes
        repeat:
          count: 6
          sequence:
          - action: media_player.volume_set
            target:
              entity_id: media_player.office_2
            data:
              volume_level: '{{ [0.15 - (repeat.index * 0.025), 0.0] | max | round(3)
                }}'
          - delay:
              seconds: 30
      - action: media_player.media_stop
        target:
          entity_id: media_player.office_2
  mode: parallel
  max: 3
- id: '1776378473889'
  alias: '*Bedroom 2 Good Morning Routine'
  description: Triggers at 6:50am only if bedroom2_occupied is on. Pre-staged lights
    to prevent flash. Staged ramp, wake album, TTS on motion, fans off. Music until
    presence clears or 7:30am.
  triggers:
  - trigger: time
    at: 06:50:00
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  - trigger: time
    at: 09:15:00
    weekday:
    - sun
    - sat
  conditions:
  - condition: state
    entity_id: input_boolean.bedroom2_occupied
    state: 'on'
  actions:
  - alias: Clear manual override so motion automation can take over after wake-up
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.bedroom2_manual_override
  - alias: Turn off AL sleep mode and office AL
    action: switch.turn_off
    target:
      entity_id:
      - switch.adaptive_lighting_sleep_mode_office
      - switch.adaptive_lighting_office
  - alias: Pre-stage Nanoleafs with Morning Sky at 1%
    action: light.turn_on
    target:
      entity_id:
      - light.ribbon
      - light.fluttershy
    data:
      effect: Morning Sky
      brightness_pct: 1
      transition: 1
  - delay:
      seconds: 2
  - alias: Pre-stage office Hue at 1% warm white
    action: light.turn_on
    target:
      entity_id:
      - light.office_2
      - light.office_1
    data:
      brightness_pct: 1
      color_temp_kelvin: 2700
      transition: 2
  - delay:
      seconds: 3
  - alias: Run all sunrise stages in parallel
    parallel:
    - sequence:
      - alias: Ribbon and Fluttershy ramp brightness to 80% over 3 minutes
        repeat:
          count: 18
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.ribbon
              - light.fluttershy
            data:
              brightness_pct: '{{ [1 + (repeat.index * 4.4), 80] | min | round(0)
                }}'
              transition: 3
          - delay:
              seconds: 10
    - sequence:
      - alias: Wait 30 seconds then bring in office light
        delay:
          seconds: 30
      - alias: Office light ramps to 100% over ~2:30
        repeat:
          count: 15
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.office
            data:
              brightness_pct: '{{ [1 + (repeat.index * 6.6), 100] | min | round(0)
                }}'
              color_temp_kelvin: 2700
              transition: 3
          - delay:
              seconds: 10
    - sequence:
      - action: fan.turn_off
        target:
          entity_id: fan.bedroom2_fan
        data: {}
    - sequence:
      - delay:
          seconds: 30
      - action: media_player.volume_set
        target:
          entity_id: media_player.office_2
        data:
          volume_level: 0.1
      - alias: Play wake album via Music Assistant
        continue_on_error: true
        action: music_assistant.play_media
        target:
          entity_id: media_player.office_2
        data:
          media_id: ytmusic://album/MPREb_eRqlXW8MAYH
          media_type: album
      - delay:
          seconds: 15
      - if:
        - condition: or
          conditions:
          - condition: state
            entity_id: media_player.office_2
            state: idle
          - condition: state
            entity_id: media_player.office_2
            state: 'off'
        then:
        - alias: Wait for moving target before announcement (music failed path)
          wait_for_trigger:
          - trigger: state
            entity_id: binary_sensor.bedroom2_sensor_apollo_radar_moving_target
            to: 'on'
          timeout:
            minutes: 45
        - if:
          - condition: template
            value_template: '{{ wait.completed == false }}'
          then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.bedroom2_occupied
          - stop: Motion wait timed out - routine complete
        - alias: Set volume for first announcement
          action: media_player.volume_set
          target:
            entity_id: media_player.office_2
          data:
            volume_level: 0.2
        - alias: TTS announcement (music failed)
          action: tts.speak
          target:
            entity_id: tts.piper
          data:
            cache: false
            media_player_entity_id: media_player.office_2
            message: 'Good morning Lily & Caylee! Today is {{ now().strftime(''%A,
              %B %-d'') }} and its going to be a great day! The time is {{ now().strftime(''%-I:%M
              %p'') }}. The current conditions are {{ states(''weather.nws_38_20113654119161_85_60519204644677_klou'')
              }}, with a temperature of {{ state_attr(''weather.nws_38_20113654119161_85_60519204644677_klou'',
              ''temperature'') }} degrees. Let''s go!!!!!

              '
        - delay:
            seconds: 12
        - alias: Bump volume for second announcement
          action: media_player.volume_set
          target:
            entity_id: media_player.office_2
          data:
            volume_level: 0.25
        - alias: TTS second announcement (music failed)
          action: tts.speak
          target:
            entity_id: tts.piper
          data:
            cache: false
            media_player_entity_id: media_player.office_2
            message: 'In case you missed it the first time, it seems you are really
              awake now. Good morning Lily & Caylee! Today is {{ now().strftime(''%A,
              %B %-d'') }} and its going to be a great day! The time is {{ now().strftime(''%-I:%M
              %p'') }}. The current conditions are {{ states(''weather.nws_38_20113654119161_85_60519204644677_klou'')
              }}, with a temperature of {{ state_attr(''weather.nws_38_20113654119161_85_60519204644677_klou'',
              ''temperature'') }} degrees. Let''s go!!!!!

              '
        else:
        - alias: Ramp volume to 0.22
          repeat:
            count: 8
            sequence:
            - delay:
                seconds: 18
            - action: media_player.volume_set
              target:
                entity_id: media_player.office_2
              data:
                volume_level: '{{ [0.05 + (repeat.index * 0.021), 0.22] | min | round(3)
                  }}'
        - alias: Wait for moving target before announcement
          wait_for_trigger:
          - trigger: state
            entity_id: binary_sensor.bedroom2_sensor_apollo_radar_moving_target
            to: 'on'
          timeout:
            minutes: 45
        - if:
          - condition: template
            value_template: '{{ wait.completed == false }}'
          then:
          - action: media_player.media_stop
            target:
              entity_id: media_player.office_2
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.bedroom2_occupied
          - stop: Motion wait timed out - routine complete
        - alias: Pause music for announcement
          action: media_player.media_pause
          target:
            entity_id: media_player.office_2
        - alias: Set volume for first announcement
          action: media_player.volume_set
          target:
            entity_id: media_player.office_2
          data:
            volume_level: 0.2
        - alias: TTS good morning announcement
          action: tts.speak
          target:
            entity_id: tts.piper
          data:
            cache: false
            media_player_entity_id: media_player.office_2
            message: 'Good morning Lily & Caylee! Today is {{ now().strftime(''%A,
              %B %-d'') }} and its going to be a great day! The time is {{ now().strftime(''%-I:%M
              %p'') }}. The current conditions are {{ states(''weather.nws_38_20113654119161_85_60519204644677_klou'')
              }}, with a temperature of {{ state_attr(''weather.nws_38_20113654119161_85_60519204644677_klou'',
              ''temperature'') }} degrees. Let''s go!!!!!

              '
        - delay:
            seconds: 12
        - alias: Bump volume for second announcement
          action: media_player.volume_set
          target:
            entity_id: media_player.office_2
          data:
            volume_level: 0.25
        - alias: TTS second announcement
          action: tts.speak
          target:
            entity_id: tts.piper
          data:
            cache: false
            media_player_entity_id: media_player.office_2
            message: 'In case you missed it the first time, it seems you are really
              awake now. Good morning Lily & Caylee! Today is {{ now().strftime(''%A,
              %B %-d'') }} and its going to be a great day! The time is {{ now().strftime(''%-I:%M
              %p'') }}. The current conditions are {{ states(''weather.nws_38_20113654119161_85_60519204644677_klou'')
              }}, with a temperature of {{ state_attr(''weather.nws_38_20113654119161_85_60519204644677_klou'',
              ''temperature'') }} degrees. Let''s go!!!!!

              '
        - alias: Resume music after announcements
          action: media_player.media_play
          target:
            entity_id: media_player.office_2
        - alias: Restore volume to 0.22 after announcements
          action: media_player.volume_set
          target:
            entity_id: media_player.office_2
          data:
            volume_level: 0.22
        - alias: Occupancy-driven music loop
          repeat:
            while:
            - condition: state
              entity_id: input_boolean.bedroom2_occupied
              state: 'on'
            - condition: time
              before: 07:30:00
            sequence:
            - if:
              - condition: or
                conditions:
                - condition: state
                  entity_id: binary_sensor.bedroom2_sensor_apollo_radar_zone_1_occupancy
                  state: 'on'
                - condition: state
                  entity_id: binary_sensor.bedroom2_sensor_apollo_radar_zone_2_occupancy
                  state: 'on'
                - condition: state
                  entity_id: binary_sensor.bedroom2_sensor_apollo_radar_zone_3_occupancy
                  state: 'on'
              then:
              - action: media_player.volume_set
                target:
                  entity_id: media_player.office_2
                data:
                  volume_level: 0.22
              - delay:
                  seconds: 30
              else:
              - repeat:
                  count: 8
                  sequence:
                  - action: media_player.volume_set
                    target:
                      entity_id: media_player.office_2
                    data:
                      volume_level: '{{ [0.22 - (repeat.index * 0.025), 0.02] | max
                        | round(3) }}'
                  - delay:
                      seconds: 15
                  - if:
                    - condition: or
                      conditions:
                      - condition: state
                        entity_id: binary_sensor.bedroom2_sensor_apollo_radar_zone_1_occupancy
                        state: 'on'
                      - condition: state
                        entity_id: binary_sensor.bedroom2_sensor_apollo_radar_zone_2_occupancy
                        state: 'on'
                      - condition: state
                        entity_id: binary_sensor.bedroom2_sensor_apollo_radar_zone_3_occupancy
                        state: 'on'
                    then:
                    - action: media_player.volume_set
                      target:
                        entity_id: media_player.office_2
                      data:
                        volume_level: 0.22
                    - stop: Occupancy returned during ramp-down
              - action: media_player.media_stop
                target:
                  entity_id: media_player.office_2
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.bedroom2_occupied
              - stop: Room cleared - routine complete
        - action: media_player.media_stop
          target:
            entity_id: media_player.office_2
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.bedroom2_occupied
    - sequence:
      - delay:
          minutes: 5
      - action: switch.turn_on
        target:
          entity_id: switch.adaptive_lighting_office
      - action: adaptive_lighting.apply
        continue_on_error: true
        data:
          entity_id: switch.adaptive_lighting_office
          lights:
          - light.office
          transition: 30
          adapt_color: true
          adapt_brightness: true
      - alias: Cocoa Beach on Nanoleafs if occupancy detected
        if:
        - condition: or
          conditions:
          - condition: state
            entity_id: binary_sensor.bedroom2_sensor_apollo_radar_zone_1_occupancy
            state: 'on'
          - condition: state
            entity_id: binary_sensor.bedroom2_sensor_apollo_radar_zone_2_occupancy
            state: 'on'
          - condition: state
            entity_id: binary_sensor.bedroom2_sensor_apollo_radar_zone_3_occupancy
            state: 'on'
        then:
        - action: light.turn_on
          target:
            entity_id:
            - light.ribbon
            - light.fluttershy
          data:
            effect: Cocoa Beach
            brightness_pct: 80
            transition: 5
      - action: automation.turn_on
        metadata: {}
        target:
          entity_id: automation.office_bedroom_2_smart_motion_presence_2
        data: {}
    - sequence:
      - delay:
          minutes: 30
      - continue_on_error: true
        action: media_player.media_stop
        target:
          entity_id: media_player.office_2
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.bedroom2_occupied
  mode: parallel
  max: 2
- id: '1776382720393'
  alias: '*Bedroom 2 Daily Reset'
  description: Backstop reset at 8am daily. Turns off bedroom2_occupied if still on
    after the good morning routine should have completed.
  triggers:
  - trigger: time
    at: 08:00:00
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  - trigger: time
    at: '11:00:00'
    weekday:
    - sun
    - sat
  conditions: []
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.bedroom2_occupied
  mode: single
- id: '1776427656334'
  alias: '*Good Morning - Kitchen Speaker Join'
  description: During the good morning routine, joins kitchen speaker on first motion
    detection and ramps to 0.15. Stays grouped until bedroom music stops or routine
    ends. Unjoins when music stops or good morning deactivates.
  triggers:
  - trigger: state
    entity_id: binary_sensor.kitchen_sensor_group
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.good_morning_active
    state: 'on'
  actions:
  - variables:
      already_joined: "{{ state_attr('media_player.bedroom_2', 'group_members') is
        not none and\n   'media_player.kitchen' in\n   state_attr('media_player.bedroom_2',
        'group_members') | default([]) }}"
      kitchen_vol_before: '{{ state_attr(''media_player.kitchen'', ''volume_level'')
        | default(0.10) }}'
  - alias: Join and ramp only if not already in group
    if:
    - condition: template
      value_template: '{{ not already_joined }}'
    then:
    - alias: Set kitchen volume low before joining to avoid blast
      action: media_player.volume_set
      target:
        entity_id: media_player.kitchen
      data:
        volume_level: 0.05
    - alias: Join kitchen to bedroom group
      action: media_player.join
      target:
        entity_id: media_player.bedroom_2
      data:
        group_members:
        - media_player.kitchen
    - alias: Ramp kitchen volume up to 0.15
      repeat:
        count: 5
        sequence:
        - delay:
            seconds: 6
        - action: media_player.volume_set
          target:
            entity_id: media_player.kitchen
          data:
            volume_level: '{{ [0.05 + (repeat.index * 0.022), 0.15] | min | round(3)
              }}'
  - alias: Wait for routine to end or music stops
    wait_for_trigger:
    - trigger: state
      entity_id: input_boolean.good_morning_active
      to: 'off'
    - trigger: state
      entity_id: media_player.bedroom_2
      to: idle
    - trigger: state
      entity_id: media_player.bedroom_2
      to: paused
    - trigger: state
      entity_id: binary_sensor.kitchen_sensor_group
      to: 'off'
      for:
        minutes: 5
    timeout:
      minutes: 60
  - alias: Ungroup kitchen speaker
    continue_on_error: true
    action: media_player.unjoin
    target:
      entity_id: media_player.kitchen
  - alias: Restore kitchen volume to pre-join level
    action: media_player.volume_set
    target:
      entity_id: media_player.kitchen
    data:
      volume_level: '{{ kitchen_vol_before }}'
  mode: single
  max_exceeded: silent
- id: '1776687030470'
  alias: Sonos Portable Battery Charging
  description: Turn off big bedroom pulse light when Sonos is placed on charger
  triggers:
  - entity_id: binary_sensor.portable_charging
    to: 'on'
    trigger: state
  actions:
  - target:
      entity_id: light.apollo_msr_2_big_bedroom_rgb_light
    action: light.turn_off
- id: '1747180000001'
  alias: Sonos Portable - Battery Monitor
  description: When Sonos Roam is idle/paused for 5 min, snapshot battery, alert if
    below 30%, then turn the device off. Avoids polling the battery sensor.
  triggers:
  - trigger: state
    entity_id: media_player.portable
    to:
    - idle
    - paused
    for:
      minutes: 5
  conditions:
  - alias: Skip if already on charger
    condition: state
    entity_id: binary_sensor.portable_charging
    state: 'off'
  actions:
  - alias: Snapshot battery level into helper
    action: input_number.set_value
    target:
      entity_id: input_number.portable_battery_last_seen
    data:
      value: '{{ states(''sensor.portable_battery'') | int(0) }}'
  - alias: Alert if battery below 30%
    if:
    - condition: numeric_state
      entity_id: input_number.portable_battery_last_seen
      below: 30
    then:
    - alias: Notify phone
      action: notify.mobile_app_pc_iphone
      data:
        title: Sonos Roam Battery Low
        message: Sonos Portable battery is at {{ states('input_number.portable_battery_last_seen')
          | int }}% — Please Charge.
    - alias: Pulse bedroom light
      action: light.turn_on
      target:
        entity_id: light.apollo_msr_2_big_bedroom_rgb_light
      data:
        rgb_color:
        - 0
        - 179
        - 255
        brightness_pct: 8
        effect: Slow Pulse
  - alias: Turn off the Sonos Roam
    action: media_player.turn_off
    target:
      entity_id: media_player.portable
    data: {}
  mode: single
- id: '1776722406866'
  alias: Garage Door Auto-Close
  description: Close garage after 5 min of no person occupancy, if enabled. Uses person-only
    occupancy group (ignores parked cars).
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.garage_occupancy_group
    to:
    - 'off'
    for:
      hours: 0
      minutes: 5
      seconds: 0
  conditions:
  - condition: state
    entity_id: input_boolean.garage_auto_close_enabled
    state: 'on'
  - condition: state
    entity_id: cover.garage
    state:
    - open
  actions:
  - action: cover.close_cover
    target:
      entity_id: cover.garage
    data: {}
  mode: single
- id: '1776722452944'
  alias: Auto-Close Garage at 10PM
  description: Fail-safe close if garage is left open at 10PM
  triggers:
  - trigger: time
    at: '21:59:00'
  conditions:
  - condition: state
    entity_id: binary_sensor.garage_occupancy_group
    state: 'off'
    for:
      minutes: 1
  - condition: state
    entity_id: cover.garage
    state: open
  actions:
  - action: cover.close_cover
    target:
      entity_id: cover.garage
    data: {}
  - action: notify.mobile_app_pc_iphone
    data:
      message: Garage was open at 10PM and auto-closed. Check why earlier automations
        didn't catch this.
      title: Auto Close
  mode: single
- id: '1776828862786'
  alias: 'Pico Button 1 - Big Bedroom: Restore AL'
  description: Pico 'on' press clears all overrides, re-enables AL switches and motion
    automation, clears manual_control, and applies adaptive lighting.
  triggers:
  - device_id: 439cd94b6d0b7203c2c0e131aee2cc31
    domain: lutron_caseta
    type: press
    subtype: 'on'
    trigger: device
  conditions: []
  actions:
  - alias: Clear manual override flag
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.big_bedroom_manual_override
  - alias: Clear manual_control flag so AL can adapt freely
    action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.al_big_bedroom
      lights:
      - light.bedroom_ceiling_1
      - light.bedroom_ceiling_2
      - light.bedroom_lamp_1
      - light.bedroom_lamp_2
      manual_control: false
  - alias: Re-enable AL switches
    action: switch.turn_on
    target:
      entity_id:
      - switch.al_big_bedroom
      - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_color_big_bedroom_al
      - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_brightness_big_bedroom_al
  - alias: Set sleep mode based on time of day
    if:
    - condition: time
      after: '23:00:00'
      before: 07:00:00
    then:
    - alias: Sleep hours - turn sleep mode on
      action: switch.turn_on
      target:
        entity_id: switch.al_sleep_mode_big_bedroom
    else:
    - alias: Day hours - keep sleep mode off
      action: switch.turn_off
      target:
        entity_id: switch.al_sleep_mode_big_bedroom
  - alias: Re-enable motion/presence automation
    action: automation.turn_on
    target:
      entity_id: automation.big_bedroom_smart_motion_presence
  - alias: Reset scene mode selector to default
    action: input_select.select_option
    continue_on_error: true
    target:
      entity_id: input_select.bedroom_scene_mode
    data:
      option: al
  - alias: Turn on lights so AL has something to adapt
    action: light.turn_on
    target:
      entity_id: light.bedroom
    data:
      transition: 2
  - alias: Apply adaptive lighting now
    action: adaptive_lighting.apply
    continue_on_error: true
    data:
      entity_id: switch.al_big_bedroom
      lights:
      - light.bedroom_ceiling_1
      - light.bedroom_ceiling_2
      - light.bedroom_lamp_1
      - light.bedroom_lamp_2
      transition: 2
      adapt_color: true
      adapt_brightness: true
      prefer_rgb_color: true
  mode: single
- id: '1776829563318'
  alias: 'Pico Button 3 - Dim - Big Bedroom: TV Mode'
  description: Time-of-day adaptive TV watching lights. Hue + Nanoleaf color-matched,
    Nanoleaf brightness capped at 20%. Fan to 25%. Disables AL and presence.
  triggers:
  - device_id: 439cd94b6d0b7203c2c0e131aee2cc31
    domain: lutron_caseta
    type: press
    subtype: lower
    trigger: device
  conditions: []
  actions:
  - action: automation.turn_off
    target:
      entity_id: automation.big_bedroom_smart_motion_presence
  - action: switch.turn_off
    target:
      entity_id:
      - switch.al_big_bedroom
      - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_color_big_bedroom_al
      - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_brightness_big_bedroom_al
  - action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.al_big_bedroom
      lights:
      - light.bedroom_ceiling_1
      - light.bedroom_ceiling_2
      - light.bedroom_lamp_1
      - light.bedroom_lamp_2
      manual_control: true
  - variables:
      sun_elev: '{{ state_attr(''sun.sun'', ''elevation'') | float(0) }}'
      tv_brightness: '{% if sun_elev > 10 %}60 {% elif sun_elev > -6 %}35 {% else
        %}15 {% endif %}'
      tv_kelvin: '{% if sun_elev > 10 %}4000 {% elif sun_elev > -6 %}2700 {% else
        %}2200 {% endif %}'
      nano_brightness: '{{ [tv_brightness | int, 20] | min }}'
  - alias: Pre-stage Nanoleaf at 1% to avoid flash-to-white
    action: light.turn_on
    target:
      entity_id: light.nano_sand_dune
    data:
      brightness_pct: 1
      color_temp_kelvin: '{{ tv_kelvin | int }}'
  - parallel:
    - action: light.turn_on
      target:
        entity_id:
        - light.bedroom_ceiling_1
        - light.bedroom_ceiling_2
        - light.bedroom_lamp_1
        - light.bedroom_lamp_2
      data:
        brightness_pct: '{{ tv_brightness | int }}'
        color_temp_kelvin: '{{ tv_kelvin | int }}'
        transition: 2
    - action: light.turn_on
      target:
        entity_id: light.nano_sand_dune
      data:
        brightness_pct: '{{ nano_brightness | int }}'
        color_temp_kelvin: '{{ tv_kelvin | int }}'
        transition: 2
    - action: fan.turn_on
      target:
        entity_id: fan.big_bedroom_fan
      data:
        percentage: 25
  mode: single
- id: '1778600000000'
  alias: 'Pico Button 4 - Off - Big Bedroom: Sleep Mode'
  description: Pico 'off' press sets bedroom lights to red 2%, turns on air circulator/purifier/fan
    at 50%, and arms alarm to home mode.
  triggers:
  - device_id: 439cd94b6d0b7203c2c0e131aee2cc31
    domain: lutron_caseta
    type: press
    subtype: 'off'
    trigger: device
  conditions: []
  actions:
  - alias: Disable motion automation so lights stay as set
    action: automation.turn_off
    target:
      entity_id: automation.big_bedroom_smart_motion_presence
  - alias: Disable AL switches
    action: switch.turn_off
    target:
      entity_id:
      - switch.al_big_bedroom
      - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_color_big_bedroom_al
      - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_brightness_big_bedroom_al
  - alias: Mark lights as manually controlled
    action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.al_big_bedroom
      lights:
      - light.bedroom_ceiling_1
      - light.bedroom_ceiling_2
      - light.bedroom_lamp_1
      - light.bedroom_lamp_2
      manual_control: true
  - parallel:
    - alias: Set bedroom lights to red at 2%
      action: light.turn_on
      target:
        entity_id:
        - light.bedroom_ceiling_1
        - light.bedroom_ceiling_2
        - light.bedroom_lamp_1
        - light.bedroom_lamp_2
        - light.nano_sand_dune
      data:
        rgb_color:
        - 255
        - 0
        - 0
        brightness_pct: 2
        transition: 2
    - alias: Air circulator on at 50%
      action: fan.turn_on
      target:
        entity_id: fan.air_circulator
      data:
        percentage: 50
    - alias: Bedroom purifier on at 50%
      action: fan.turn_on
      target:
        entity_id: fan.bedroom_purifier
      data:
        percentage: 50
    - alias: Big bedroom fan on at 50%
      action: fan.turn_on
      target:
        entity_id: fan.big_bedroom_fan
      data:
        percentage: 50
    - alias: Arm alarm to home mode
      action: alarm_control_panel.alarm_arm_home
      target:
        entity_id: alarm_control_panel.3302_alarm
      data:
        code: ''
  mode: single
- id: '1776830103632'
  alias: 'Big Bedroom: TV Mode (Unified)'
  description: TV state drives bedroom lighting with time-of-day palette. Playing
    = deep dim scaled to daylight. Paused = TV setup palette. Off = restore AL and
    presence. Fan 25% during TV activity. Nanoleaf color-matched, brightness-capped
    at 20%.
  triggers:
  - trigger: state
    entity_id: media_player.bedroom_tv
    to: playing
    id: playing
  - trigger: state
    entity_id:
    - media_player.bedroom_tv
    to:
    - paused
    - idle
    id: paused
  - trigger: state
    entity_id: media_player.bedroom_tv
    to: 'off'
    id: tv_off
  - device_id: 7501054a9a45dcff214f4cf4f9c143ef
    domain: media_player
    entity_id: 3cd6130d1d36d755abf52c6ebdb4aeab
    type: playing
    trigger: device
    id: playing
  - device_id: 7501054a9a45dcff214f4cf4f9c143ef
    domain: media_player
    entity_id: 3cd6130d1d36d755abf52c6ebdb4aeab
    type: paused
    trigger: device
    id: paused
  - device_id: 7501054a9a45dcff214f4cf4f9c143ef
    domain: media_player
    entity_id: 3cd6130d1d36d755abf52c6ebdb4aeab
    type: idle
    trigger: device
    id: paused
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: playing
      - condition: or
        conditions:
        - condition: state
          entity_id: light.bedroom_ceiling_1
          state: 'on'
        - condition: state
          entity_id: light.bedroom_ceiling_2
          state: 'on'
        - condition: state
          entity_id: light.bedroom_lamp_1
          state: 'on'
        - condition: state
          entity_id: light.bedroom_lamp_2
          state: 'on'
      sequence:
      - action: automation.turn_off
        target:
          entity_id: automation.big_bedroom_smart_motion_presence
      - action: switch.turn_off
        target:
          entity_id:
          - switch.al_big_bedroom
          - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_color_big_bedroom_al
          - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_brightness_big_bedroom_al
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.al_big_bedroom
          lights:
          - light.bedroom_ceiling_1
          - light.bedroom_ceiling_2
          - light.bedroom_lamp_1
          - light.bedroom_lamp_2
          manual_control: true
      - alias: Pre-stage Nanoleaf at 1% to avoid flash-to-white
        action: light.turn_on
        target:
          entity_id: light.nano_sand_dune
        data:
          brightness_pct: 1
          color_temp_kelvin: '{{ tv_kelvin | int }}'
      - parallel:
        - action: light.turn_on
          target:
            entity_id:
            - light.bedroom_ceiling_1
            - light.bedroom_ceiling_2
            - light.bedroom_lamp_1
            - light.bedroom_lamp_2
          data:
            brightness_pct: '{{ playing_brightness | int }}'
            color_temp_kelvin: '{{ tv_kelvin | int }}'
            transition: 3
        - action: light.turn_on
          target:
            entity_id: light.nano_sand_dune
          data:
            brightness_pct: '{{ playing_nano_brightness | int }}'
            color_temp_kelvin: '{{ tv_kelvin | int }}'
            transition: 3
        - action: fan.turn_on
          target:
            entity_id: fan.big_bedroom_fan
          data:
            percentage: 25
    - conditions:
      - condition: trigger
        id: paused
      sequence:
      - alias: Pre-stage Nanoleaf at 1% to avoid flash-to-white
        action: light.turn_on
        target:
          entity_id: light.nano_sand_dune
        data:
          brightness_pct: 1
          color_temp_kelvin: '{{ tv_kelvin | int }}'
      - parallel:
        - action: light.turn_on
          target:
            entity_id:
            - light.bedroom_ceiling_1
            - light.bedroom_ceiling_2
            - light.bedroom_lamp_1
            - light.bedroom_lamp_2
          data:
            brightness_pct: '{{ paused_brightness | int }}'
            color_temp_kelvin: '{{ tv_kelvin | int }}'
            transition: 3
        - action: light.turn_on
          target:
            entity_id: light.nano_sand_dune
          data:
            brightness_pct: '{{ paused_nano_brightness | int }}'
            color_temp_kelvin: '{{ tv_kelvin | int }}'
            transition: 3
    - conditions:
      - condition: trigger
        id: tv_off
      sequence:
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.al_big_bedroom
          lights:
          - light.bedroom_ceiling_1
          - light.bedroom_ceiling_2
          - light.bedroom_lamp_1
          - light.bedroom_lamp_2
          manual_control: false
      - action: switch.turn_on
        target:
          entity_id:
          - switch.al_big_bedroom
          - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_color_big_bedroom_al
          - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_brightness_big_bedroom_al
      - action: automation.turn_on
        target:
          entity_id: automation.big_bedroom_smart_motion_presence
      - action: adaptive_lighting.apply
        continue_on_error: true
        data:
          entity_id: switch.al_big_bedroom
          lights:
          - light.bedroom_ceiling_1
          - light.bedroom_ceiling_2
          - light.bedroom_lamp_1
          - light.bedroom_lamp_2
          transition: 3
          adapt_color: true
          adapt_brightness: true
          prefer_rgb_color: true
      - action: light.turn_off
        target:
          entity_id: light.nano_sand_dune
        data:
          transition: 3
  variables:
    sun_elev: '{{ state_attr(''sun.sun'', ''elevation'') | float(0) }}'
    tv_kelvin: '{% if sun_elev > 10 %}4000 {% elif sun_elev > -6 %}2700 {% else %}2200
      {% endif %}'
    paused_brightness: '{% if sun_elev > 10 %}60 {% elif sun_elev > -6 %}35 {% else
      %}15 {% endif %}'
    playing_brightness: '{% if sun_elev > 10 %}15 {% elif sun_elev > -6 %}5 {% else
      %}2 {% endif %}'
    paused_nano_brightness: '{{ [paused_brightness | int, 20] | min }}'
    playing_nano_brightness: '{{ [playing_brightness | int, 20] | min }}'
  mode: restart
- id: '1776965023589'
  alias: 'Office/Bedroom 2: Smart Motion & Presence'
  description: AL daytime, sleep mode evening, off after 22:50. Uses moving_target
    for motion windows 22:15-22:50.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.bedroom2_sensor_apollo_radar_moving_target
    to:
    - 'on'
    id: detected
  - trigger: state
    entity_id:
    - binary_sensor.bedroom_2_sensor_group
    to:
    - 'off'
    for:
      minutes: 15
    id: stopped
  - trigger: state
    entity_id: switch.adaptive_lighting_sleep_mode_office
    to: 'on'
    id: sleep_on
  - trigger: state
    entity_id: switch.adaptive_lighting_sleep_mode_office
    to: 'off'
    id: sleep_off
  - trigger: time
    at: '22:50:00'
    id: lights_out
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sleep_on
      - alias: Skip if dimmer override is active
        condition: state
        entity_id: input_boolean.bedroom2_manual_override
        state: 'off'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.ribbon
        data:
          effect: Sleep Mode
      - action: light.turn_on
        target:
          entity_id: light.fluttershy
        data:
          effect: Sleep Mode
      - delay:
          seconds: 1
      - action: light.turn_on
        target:
          entity_id: light.ribbon
        data:
          brightness_pct: 3
      - action: light.turn_on
        target:
          entity_id: light.fluttershy
        data:
          brightness_pct: 3
    - conditions:
      - condition: trigger
        id: sleep_off
      sequence:
      - condition: state
        entity_id: input_boolean.bedroom2_occupied
        state: 'off'
      - choose:
        - conditions:
          - condition: time
            after: '15:30:00'
            before: '19:30:00'
            weekday:
            - mon
            - tue
            - wed
            - thu
            - fri
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.ribbon
            data:
              effect: Jungle
          - action: light.turn_on
            target:
              entity_id: light.fluttershy
            data:
              effect: Flow
        - conditions: []
          sequence:
          - action: light.turn_off
            target:
              entity_id:
              - light.ribbon
              - light.fluttershy
              - light.bedroom_2
            data:
              transition: 2
    - conditions:
      - condition: trigger
        id: lights_out
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.ribbon
          - light.fluttershy
          - light.office_1
          - light.office_2
        data:
          transition: 15
    - conditions:
      - condition: trigger
        id: detected
      sequence:
      - alias: Skip all light changes if manual override is active
        condition: state
        entity_id: input_boolean.bedroom2_manual_override
        state: 'off'
      - choose:
        - alias: Sleep mode active - gentle red bump only, no bright flash
          conditions:
          - condition: state
            entity_id: switch.adaptive_lighting_sleep_mode_office
            state: 'on'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.ribbon
            data:
              brightness_pct: 8
              rgb_color:
              - 255
              - 62
              - 1
              transition: 2
          - action: light.turn_on
            target:
              entity_id: light.fluttershy
            data:
              brightness_pct: 8
              rgb_color:
              - 255
              - 62
              - 1
              transition: 2
        - conditions:
          - condition: time
            after: '22:50:00'
          sequence:
          - action: light.turn_off
            target:
              entity_id:
              - light.ribbon
              - light.fluttershy
              - light.office_1
              - light.office_2
            data:
              transition: 2
        - conditions:
          - condition: time
            after: '22:35:00'
            before: '22:50:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.office
            data:
              brightness_pct: 1
              rgb_color:
              - 255
              - 62
              - 1
              transition: 2
          - action: light.turn_off
            target:
              entity_id:
              - light.ribbon
              - light.fluttershy
            data:
              transition: 2
        - conditions:
          - condition: time
            after: '22:15:00'
            before: '22:35:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.office
            data:
              brightness_pct: 4
              rgb_color:
              - 255
              - 62
              - 1
              transition: 2
          - action: light.turn_off
            target:
              entity_id:
              - light.ribbon
              - light.fluttershy
            data:
              transition: 2
        - conditions:
          - condition: time
            after: '15:30:00'
            before: '19:30:00'
            weekday:
            - mon
            - tue
            - wed
            - thu
            - fri
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.office
            data:
              transition: 2
          - if:
            - condition: state
              entity_id: switch.adaptive_lighting_office
              state: 'on'
            - condition: template
              value_template: "{{ 'light.office' not in\n   (state_attr('switch.adaptive_lighting_office',
                'manual_control') | default([])) }}\n"
            then:
            - action: adaptive_lighting.apply
              continue_on_error: true
              data:
                entity_id: switch.adaptive_lighting_office
                lights:
                - light.office
                transition: 2
                adapt_color: true
                adapt_brightness: true
          - action: light.turn_on
            target:
              entity_id: light.ribbon
            data:
              effect: Jungle
          - action: light.turn_on
            target:
              entity_id: light.fluttershy
            data:
              effect: Flow
        - conditions:
          - condition: time
            after: 06:30:00
            before: '22:15:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.office
            data:
              transition: 2
          - if:
            - condition: state
              entity_id: switch.adaptive_lighting_office
              state: 'on'
            - condition: template
              value_template: "{{ 'light.office' not in\n   (state_attr('switch.adaptive_lighting_office',
                'manual_control') | default([])) }}\n"
            then:
            - action: adaptive_lighting.apply
              continue_on_error: true
              data:
                entity_id: switch.adaptive_lighting_office
                lights:
                - light.office
                transition: 2
                adapt_color: true
                adapt_brightness: true
        - conditions: []
          sequence:
          - action: light.turn_off
            target:
              entity_id:
              - light.ribbon
              - light.fluttershy
              - light.office_1
              - light.office_2
            data:
              transition: 2
    - conditions:
      - condition: trigger
        id: stopped
      sequence:
      - alias: Clear manual override when room has been empty 15 minutes
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.bedroom2_manual_override
      - alias: Clear manual_control so AL can take over on next motion
        action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.adaptive_lighting_office
          lights:
          - light.office
          manual_control: false
      - alias: Re-enable AL switches so they're ready for next motion
        action: switch.turn_on
        target:
          entity_id:
          - switch.adaptive_lighting_office
          - switch.adaptive_lighting_adapt_color_office
          - switch.adaptive_lighting_adapt_brightness_office
      - alias: Re-enable sleep mode if it should be active (after 22:15)
        if:
        - condition: time
          after: '22:15:00'
          before: 06:30:00
        then:
        - action: switch.turn_on
          target:
            entity_id: switch.adaptive_lighting_sleep_mode_office
      - action: light.turn_off
        target:
          entity_id:
          - light.ribbon
          - light.fluttershy
          - light.office_1
          - light.office_2
        data:
          transition: 30
  mode: restart
- id: '1776981794880'
  alias: Departure - Start Window on Climatization
  description: Opens a 15-minute departure window when the climatization button is
    pressed.
  triggers:
  - trigger: state
    entity_id: button.volvo_xc60_start_climatization
    not_from:
    - unknown
    - unavailable
