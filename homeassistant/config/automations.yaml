- id: '1779800000001'
  alias: 'Welcome Home: Auto-Expire After 30 Minutes'
  description: Safety net so the welcome home routine never runs longer than 30 minutes
    - turns off input_boolean.welcome_home_active 30 minutes after it's set, unless
    it's already been turned off. It won't re-arm until the next real departure +
    arrival cycle, since only the arrival automation turns it on.
  triggers:
  - trigger: state
    entity_id: input_boolean.welcome_home_active
    to: 'on'
    for:
      minutes: 30
  conditions: []
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.welcome_home_active
  mode: single
- id: '1779800000007'
  alias: 'Welcome Home: Unjoin All Satellites on Deactivation'
  description: Catch-all so a satellite speaker can never stay stuck grouped with
    the kitchen after welcome home ends. The per-room "unjoin after N min idle" automations
    only run while welcome_home_active is still on, so any path that clears the flag
    directly (30-min auto-expire, music-paused kill switch, Big Bedroom sleep cancel)
    previously left whatever was still joined - joined, with nothing left watching
    to split it. Fires on every deactivation path uniformly and covers the _2 entities
    the older per-room unjoins miss.
  triggers:
  - trigger: state
    entity_id: input_boolean.welcome_home_active
    to: 'off'
  conditions: []
  actions:
  - alias: Unjoin every satellite from the kitchen group
    continue_on_error: true
    action: media_player.unjoin
    target:
      entity_id:
      - media_player.bedroom
      - media_player.bedroom_2
      - media_player.office
      - media_player.office_2
      - media_player.bathroom
      - media_player.bathroom_2
      - media_player.kitchen_2
    data: {}
  mode: single
- id: '1779800000002'
  alias: 'Welcome Home: Disable Immediately if Music Pauses'
  description: If any speaker involved in the welcome home group stops playing and
    stays stopped for 10s while welcome home is active, kill the routine right away.
    The 10s hold avoids a false trigger from the idle->paused->playing blip that music_assistant.play_media
    goes through while it loads the queue on arrival (was killing welcome_home_active
    ~8s after every arrival, before music even started - see 2026-08-12 incident).
    Since welcome_home_active is only re-armed by an actual departure + arrival (alarm
    must be armed away/home first), this keeps it off until the next real cycle instead
    of it lingering or re-joining rooms after a manual pause.
  triggers:
  - trigger: state
    entity_id:
    - media_player.kitchen
    - media_player.kitchen_2
    - media_player.office
    - media_player.office_2
    - media_player.bedroom
    - media_player.bedroom_2
    - media_player.bathroom
    - media_player.bathroom_2
    to:
    - paused
    - idle
    - 'off'
    - standby
    for:
      seconds: 10
  conditions:
  - condition: state
    entity_id: input_boolean.welcome_home_active
    state: 'on'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.welcome_home_active
  mode: single
- id: '1779800000003'
  alias: 'Good Morning: Auto-Expire After 45 Minutes'
  description: Safety net so the good morning routine never runs longer than 45 minutes
    - turns off input_boolean.good_morning_active 45 minutes after it's set, unless
    it's already been turned off.
  triggers:
  - trigger: state
    entity_id: input_boolean.good_morning_active
    to: 'on'
    for:
      minutes: 45
  conditions: []
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.good_morning_active
  mode: single
- id: '1779800000004'
  alias: 'Big Bedroom: Sleep Cancels Welcome Home and Good Morning'
  description: Whenever Big Bedroom goes to sleep (Hue Button 2/3 short or hold, goodnight
    routines, or any other path that sets input_boolean.big_bedroom_asleep on), immediately
    turn off welcome home and good morning so neither routine can join speakers into
    or wake the bedroom while asleep.
  triggers:
  - trigger: state
    entity_id: input_boolean.big_bedroom_asleep
    to: 'on'
  conditions: []
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.welcome_home_active
      - input_boolean.good_morning_active
  mode: single
- id: '1779800000005'
  alias: 'Big Bedroom: Sleep Audio Auto-Stop Timer Finished'
  description: Stops bedroom audio 35 minutes after Bedtime Button or White Noise
    Sleep starts timer.bedroom_sleep_audio. Runs independently of the Bedtime/White
    Noise automations (which use mode:restart and would otherwise wipe an in-progress
    delay on any re-trigger or automations.yaml reload) so the stop reliably fires
    even if bedtime was re-pressed earlier or automations were reloaded mid-wind-down.
    Stops both the Music Assistant entity and the Sonos entity directly, since Music
    Assistant can reassert playback against a bare Sonos-side stop.
  triggers:
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.bedroom_sleep_audio
  conditions: []
  actions:
  - alias: Stop bedroom audio (with verify and retry, both entities)
    repeat:
      count: 3
      sequence:
      - continue_on_error: true
        action: media_player.media_stop
        target:
          entity_id:
          - media_player.bedroom_2
          - media_player.bedroom
      - delay:
          seconds: 5
      - if:
        - condition: not
          conditions:
          - condition: state
            entity_id: media_player.bedroom_2
            state: playing
        then:
        - stop: Stop confirmed
  - alias: Notify if bedroom audio still didn't stop after retries
    if:
    - condition: state
      entity_id: media_player.bedroom_2
      state: playing
    then:
    - action: notify.mobile_app_pc_iphone
      data:
        title: Bedroom audio didn't stop
        message: Music was still playing after the 35-minute sleep timer and 3 stop
          attempts on both entities - Sonos may have lost connection to Music Assistant.
  mode: single
- id: '1787223476469'
  alias: 'Bedroom: Play Good Morning Announcement Between Songs'
  description: Companion to the Good Morning Routine. That automation no longer calls
    tts.speak on media_player.bedroom_2 directly on motion, because MA's duck/pause-resume
    mid-track was hanging Sonos playback afterward (position would freeze and the
    routine looked like it was replaying the same song). Instead it just arms input_boolean.good_morning_announcement_pending.
    This automation waits for the queue to naturally land on a new track (media_title
    change = between songs) and speaks the announcement then, so it never interrupts
    a track mid-play.
  triggers:
  - trigger: state
    entity_id: media_player.bedroom_2
    attribute: media_title
  conditions:
  - condition: state
    entity_id: input_boolean.good_morning_announcement_pending
    state: 'on'
  - condition: state
    entity_id: input_boolean.good_morning_active
    state: 'on'
  - alias: Safety cap - never more than 2 announcements per cycle (belt-and-suspenders
      alongside the counter's own maximum)
    condition: numeric_state
    entity_id: counter.good_morning_announcements
    below: 2
  actions:
  - alias: Remember whether this is the first or the second announcement, before the
      counter is incremented
    variables:
      announcement_number: '{{ (states(''counter.good_morning_announcements'') | int(0))
        + 1 }}'
  - alias: Disarm immediately so this can't double-fire on the next track change
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.good_morning_announcement_pending
  - alias: Count this announcement against the per-cycle cap
    action: counter.increment
    target:
      entity_id: counter.good_morning_announcements
  - alias: Short settle before speaking. This automation triggers on the media_title
      change, which is the exact instant the next song starts - announcing at that
      moment ducks the new song at position zero, so it replays its opening few seconds
      and sounds like the track restarting. Music Assistant resumes an announcement
      at the SAME position, so a brief wait means the song is properly underway and
      simply picks up where it was ducked. Kept short so this still lands right after
      the track change, as intended.
    delay:
      seconds: 10
  - alias: Get today's daily forecast (only needed for the full first announcement)
    if:
    - condition: template
      value_template: '{{ announcement_number == 1 }}'
    then:
    - continue_on_error: true
      action: weather.get_forecasts
      target:
        entity_id: weather.forecast_home
      data:
        type: daily
      response_variable: today_fc
  - alias: Arm the expected-pause flag so the stop-on-idle/paused watchdog doesn't
      treat this deliberate announcement pause as a manual stop
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.good_morning_expected_pause
  - alias: Pause the music properly before speaking. Music Assistant keeps the stream
      running underneath an announcement and only stops refreshing the reported position,
      so roughly twenty seconds of song get played unheard and it resumes far further
      in, sounding like a different song. An explicit pause holds the song in place,
      and parks the player in 'paused' which both track watchdogs ignore.
    continue_on_error: true
    action: media_player.media_pause
    target:
      entity_id: media_player.bedroom_2
  - alias: Give the pause a moment to take effect on the Sonos side
    delay:
      seconds: 2
  - alias: Announcement - full greeting the first time, time only the second time
    action: tts.speak
    target:
      entity_id: tts.piper
    data:
      cache: false
      media_player_entity_id: media_player.bedroom_2
      message: '{% if announcement_number == 1 %}{% set fc = today_fc[''weather.forecast_home''][''forecast'']
        if (today_fc is defined and today_fc and ''weather.forecast_home'' in today_fc)
        else [] %} {% set f = fc[0] if fc else none %} Good morning! Today is {{ now().strftime(''%A,
        %B %-d'') }} and the time is {{ now().strftime(''%-I:%M %p'') }}. Right now
        it''s {{ states(''weather.forecast_home'') | replace(''-'', '' '') }} and
        {{ (state_attr(''weather.forecast_home'', ''temperature'') | float(0)) | round
        | int }} degrees. {% if f %}Today will be {{ f.condition | replace(''-'',
        '' '') }}, with a high of {{ (f.temperature | float(0)) | round | int }} and
        a low of {{ (f.templow | float(0)) | round | int }} degrees.{% endif %} Have
        a great day!{% else %}The time is now {{ now().strftime(''%-I:%M %p'') }}.{%
        endif %}'
  - alias: Wait for the announcement to finish rather than guessing with a fixed delay.
      Music Assistant reports 'playing' while it speaks and restores the paused state
      it found afterwards, so waiting for 'paused' to return is what actually marks
      the end of the announcement.
    wait_template: '{{ is_state(''media_player.bedroom_2'', ''paused'') }}'
    timeout:
      seconds: 90
    continue_on_timeout: true
  - alias: Resume the song from exactly where it was paused
    continue_on_error: true
    action: media_player.media_play
    target:
      entity_id: media_player.bedroom_2
  - alias: Disarm the expected-pause flag now that playback has resumed
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.good_morning_expected_pause
  - alias: Restore listening volume after announcement
    action: media_player.volume_set
    target:
      entity_id: media_player.bedroom
    data:
      volume_level: 0.15
  mode: single
- id: '1787224007804'
  alias: 'Bedroom: Arm Second Good Morning Announcement'
  description: The first announcement is armed by the Good Morning Routine itself
    on the first motion of the morning. This automation arms the second (and last)
    one - it fires on any later motion, but only once the first announcement has actually
    played (counter at exactly 1) and only while nothing is already armed, so it can't
    stack a second arm before the first has fired or sneak in a third. The counter's
    own maximum plus the numeric_state condition on the companion "Between Songs"
    automation are the hard stop past two per cycle.
  triggers:
  - trigger: state
    entity_id: binary_sensor.apollo_msr_2_big_bedroom_radar_moving_target
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.good_morning_active
    state: 'on'
  - condition: state
    entity_id: counter.good_morning_announcements
    state: '1'
  - condition: state
    entity_id: input_boolean.good_morning_announcement_pending
    state: 'off'
  actions:
  - alias: Arm the second announcement - the Between Songs automation will fire it
      at the next track change
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.good_morning_announcement_pending
  mode: single
- id: '1787404648055'
  alias: 'Bedroom: Repeat-Track Watchdog'
  description: Backstop for the morning routine replaying its first song. The older
    Stuck Track Watchdog only fires when the reported position runs PAST the duration,
    so it is blind to a clean restart - on 2026-08-22 the track ended at 179 of 185
    seconds and cleanly reset to 0, and that watchdog never fired. This one detects
    the restart itself - same track title, previous position well past the end, new
    position back near zero - and skips forward, which also lets the title-change
    announcement fire. Gated on the routine being active so a deliberate replay outside
    the morning is left alone.
  triggers:
  - trigger: state
    entity_id: media_player.bedroom_2
    attribute: media_position
  conditions:
  - condition: state
    entity_id: input_boolean.good_morning_active
    state: 'on'
  - condition: template
    value_template: '{% set f = trigger.from_state %} {% set t = trigger.to_state
      %} {{ f is not none and t is not none and f.attributes.get(''media_title'')
      is not none and f.attributes.get(''media_title'') == t.attributes.get(''media_title'')
      and (f.attributes.get(''media_duration'') | float(0)) > 0 and (f.attributes.get(''media_position'')
      | float(0)) > ((f.attributes.get(''media_duration'') | float(0)) * 0.6) and
      (t.attributes.get(''media_position'') | float(999)) < 10 }}'
  actions:
  - alias: Remember which track looked like it restarted
    variables:
      suspect_title: '{{ trigger.from_state.attributes.get(''media_title'') }}'
  - alias: Confirm before acting. At a NORMAL track boundary Home Assistant briefly
      reports the new position (0) while media_title still holds the OLD track - the
      title catches up a few milliseconds later. At trigger time that artifact is
      indistinguishable from a real restart, so the first version of this watchdog
      fired at every boundary and skipped ~2 seconds early, eating the end of every
      song. Waiting lets the artifact resolve itself - a real replay still has the
      same title playing after the pause, a normal boundary does not.
    delay:
      seconds: 8
  - alias: Only a genuine replay still shows the same title at a low position
    condition: template
    value_template: '{{ is_state(''media_player.bedroom_2'', ''playing'') and state_attr(''media_player.bedroom_2'',
      ''media_title'') == suspect_title and (state_attr(''media_player.bedroom_2'',
      ''media_position'') | float(999)) < 30 }}'
  - alias: Log the confirmed self-restart
    action: logbook.log
    data:
      name: Bedroom Repeat-Track Watchdog
      message: '"{{ suspect_title }}" restarted itself instead of advancing - confirmed
        after 8s, skipping to the next track.'
      entity_id: media_player.bedroom_2
  - alias: Skip forward so the song does not play twice
    action: media_player.media_next_track
    target:
      entity_id: media_player.bedroom_2
  - alias: Cooldown so a burst of position updates cannot double-skip
    delay:
      seconds: 15
  mode: single
- id: '1787057464833'
  alias: 'Bedroom: Stuck Track Watchdog'
  description: Music Assistant occasionally fails to advance the Bedroom queue when
    a track ends (MA/Sonos end-of-track sync glitch) - repeat_mode all then just restarts
    the same track from 0 instead of moving on, which looks like the same song playing
    on a loop. Checks every minute whether the computed playback position has run
    past the track's reported duration and, if so, forces a skip to unstick it.
  triggers:
  - trigger: time_pattern
    minutes: /1
  conditions:
  - condition: state
    entity_id: media_player.bedroom_2
    state: playing
  - condition: template
    value_template: '{{ state_attr(''media_player.bedroom_2'', ''media_duration'')
      not in (none, 0) and state_attr(''media_player.bedroom_2'', ''media_position_updated_at'')
      is not none and (state_attr(''media_player.bedroom_2'', ''media_position'')
      | float(0)) + (now() - state_attr(''media_player.bedroom_2'', ''media_position_updated_at'')).total_seconds()
      > (state_attr(''media_player.bedroom_2'', ''media_duration'') | float(0) + 5)
      }}'
  actions:
  - alias: Remember which track looked stuck
    variables:
      suspect_title: '{{ state_attr(''media_player.bedroom_2'', ''media_title'') }}'
  - alias: Confirm before skipping. Music Assistant plays a TTS announcement over
      the queue and stops refreshing media_position while it speaks, so the computed
      elapsed time keeps climbing and can cross the track duration on its own - which
      looks identical to a stall at trigger time and would skip a perfectly healthy
      song. A real stall persists; an announcement resolves itself within seconds.
    delay:
      seconds: 12
  - alias: Only a genuine stall is still overrunning the same track
    condition: template
    value_template: '{{ is_state(''media_player.bedroom_2'', ''playing'') and state_attr(''media_player.bedroom_2'',
      ''media_title'') == suspect_title and state_attr(''media_player.bedroom_2'',
      ''media_duration'') not in (none, 0) and state_attr(''media_player.bedroom_2'',
      ''media_position_updated_at'') is not none and (state_attr(''media_player.bedroom_2'',
      ''media_position'') | float(0)) + (now() - state_attr(''media_player.bedroom_2'',
      ''media_position_updated_at'')).total_seconds() > (state_attr(''media_player.bedroom_2'',
      ''media_duration'') | float(0) + 5) }}'
  - alias: Log which track was stuck
    action: logbook.log
    data:
      name: Bedroom Stuck Track Watchdog
      message: Position ran past duration on "{{ suspect_title }}" - confirmed after
        12s, forcing next track.
      entity_id: media_player.bedroom_2
  - alias: Force skip to next track to unstick the queue
    action: media_player.media_next_track
    target:
      entity_id: media_player.bedroom_2
  mode: single
- id: '1779800000006'
  alias: 'Big Bedroom: Cancel Sleep Audio Timer on Wake'
  description: Cancels timer.bedroom_sleep_audio whenever Good Morning or Nap Wake
    Up starts, so a leftover bedtime auto-stop timer from earlier in the night can't
    fire mid-routine and kill the wake-up music.
  triggers:
  - trigger: state
    entity_id: input_boolean.good_morning_active
    to: 'on'
  conditions: []
  actions:
  - action: timer.cancel
    target:
      entity_id: timer.bedroom_sleep_audio
  mode: single
