- id: '1775074953242'
  alias: 'Hallway: AL Integrated Motion'
  triggers:
  - entity_id: binary_sensor.hallway_motion
    to: 'on'
    id: motion_detected
    trigger: state
  - entity_id: binary_sensor.hallway_motion
    to: 'off'
    for:
      minutes: 3
    id: motion_stopped
    trigger: state
  - entity_id: light.hallway
    to: 'on'
    for:
      minutes: 5
    id: light_stuck_on
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: motion_detected
      sequence:
      - choose:
        - alias: Sleep mode on - go straight to dim red to avoid white flash
          conditions:
          - condition: state
            entity_id: switch.al_sleep_mode_hallway
            state: 'on'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.hallway
            data:
              brightness_pct: 5
              rgb_color:
              - 255
              - 20
              - 0
              transition: 2
        default:
        - action: light.turn_on
          target:
            entity_id: light.hallway
          data:
            transition: 2
        - if:
          - condition: template
            value_template: "{{ 'light.hallway' not in\n   state_attr('switch.al_hallway',
              'manual_control') }}\n"
          then:
          - action: adaptive_lighting.apply
            continue_on_error: true
            data:
              entity_id: switch.al_hallway
              lights:
              - light.hallway
              transition: 2
              adapt_color: true
              adapt_brightness: true
              prefer_rgb_color: true
    - conditions:
      - condition: trigger
        id: motion_stopped
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.hallway
        data:
          transition: 10
    - conditions:
      - condition: trigger
        id: light_stuck_on
      - condition: state
        entity_id: binary_sensor.hallway_motion
        state: 'off'
        for:
          minutes: 5
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.hallway
        data:
          transition: 10
  mode: restart
- id: '1775348628799'
  alias: 'Kitchen: Smart Motion & Presence (Split Color/White)'
  description: 'Hue sensors trigger lights on immediately. Frigate confirmed presence
    (3 min debounce) blocks shutoff while someone is sitting still. Sleep mode overrides
    AL. Manual override flag auto-clears 10 min after motion stops (kitchen_cleared).
    Late-night dishes mode (23:45–23:55) keeps lights warm/usable when motion is active,
    right as kitchen sleep mode (kitchen_sleep_on, 23:45) is applied. Main light stays
    on normally from sun-down until 23:45. AL is disabled BEFORE manual color changes
    in ALL paths to prevent manual_control flag from triggering the override boolean
    spuriously. Mode is queued (max 10) so long transitions can''t cause dropped triggers.

    '
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.kitchen_sensor_group
    to: 'on'
    id: motion_detected
  - trigger: state
    entity_id:
    - binary_sensor.kitchen_sensor_group
    to:
    - 'off'
    for:
      hours: 0
      minutes: 1
      seconds: 0
    id: kitchen_cleared
  - trigger: state
    entity_id:
    - binary_sensor.kitchen_sensor_group
    to:
    - 'off'
    for:
      hours: 0
      minutes: 3
      seconds: 30
    id: kitchen_cleared_hue
  - trigger: state
    entity_id:
    - switch.al_sleep_mode_kitchen
    - switch.al_sleep_mode_kitchen_main
    to: 'on'
    id: sleep_on
  - trigger: template
    value_template: "{% set mc_color = state_attr('switch.al_kitchen', 'manual_control')
      | default([], true) %} {% set mc_main = state_attr('switch.al_kitchen_main',
      'manual_control') | default([], true) %} {{ ( ('light.kitchen_1_color' in mc_color\n
      \     or 'light.kitchen_2_color' in mc_color\n      or 'light.kitchen_lightstrip'
      in mc_color)\n     and is_state('switch.al_kitchen', 'on') )\n   or\n   ( 'light.kitchen_main_lights'
      in mc_main\n     and is_state('switch.al_kitchen_main', 'on') ) }}\n"
    id: al_manual_control_changed
  - device_id: 864fec31db3ec90f02e244eb717c9cd4
    domain: lutron_caseta
    type: press
    subtype: raise
    trigger: device
    id: pico_pressed
  - device_id: 864fec31db3ec90f02e244eb717c9cd4
    domain: lutron_caseta
    type: press
    subtype: lower
    trigger: device
    id: pico_pressed
  - device_id: 864fec31db3ec90f02e244eb717c9cd4
    domain: lutron_caseta
    type: press
    subtype: stop
    trigger: device
    id: pico_pressed
  - device_id: 864fec31db3ec90f02e244eb717c9cd4
    domain: lutron_caseta
    type: press
    subtype: 'on'
    trigger: device
    id: pico_pressed
  - device_id: 864fec31db3ec90f02e244eb717c9cd4
    domain: lutron_caseta
    type: press
    subtype: 'off'
    trigger: device
    id: pico_pressed
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: pico_pressed
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.kitchen_manual_override
      - alias: Disable AL so it cannot override manual lights
        action: switch.turn_off
        target:
          entity_id:
          - switch.al_kitchen
          - switch.al_kitchen_main
    - conditions:
      - condition: trigger
        id: al_manual_control_changed
      - condition: template
        value_template: "{% set mc_color = state_attr('switch.al_kitchen', 'manual_control')
          | default([], true) %} {% set mc_main = state_attr('switch.al_kitchen_main',
          'manual_control') | default([], true) %} {{ ( ('light.kitchen_1_color' in
          mc_color\n      or 'light.kitchen_2_color' in mc_color\n      or 'light.kitchen_lightstrip'
          in mc_color)\n     and is_state('switch.al_kitchen', 'on') )\n   or\n   (
          'light.kitchen_main_lights' in mc_main\n     and is_state('switch.al_kitchen_main',
          'on') ) }}\n"
      sequence:
      - delay:
          seconds: 2
      - condition: state
        entity_id: binary_sensor.kitchen_sensor_group
        state: 'on'
      - condition: template
        value_template: "{% set mc_color = state_attr('switch.al_kitchen', 'manual_control')
          | default([], true) %} {% set mc_main = state_attr('switch.al_kitchen_main',
          'manual_control') | default([], true) %} {{ ( ('light.kitchen_1_color' in
          mc_color\n      or 'light.kitchen_2_color' in mc_color\n      or 'light.kitchen_lightstrip'
          in mc_color)\n     and is_state('switch.al_kitchen', 'on') )\n   or\n   (
          'light.kitchen_main_lights' in mc_main\n     and is_state('switch.al_kitchen_main',
          'on') ) }}\n"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.kitchen_manual_override
      - alias: Disable AL so it cannot override manual lights
        action: switch.turn_off
        target:
          entity_id:
          - switch.al_kitchen
          - switch.al_kitchen_main
    - conditions:
      - condition: trigger
        id: sleep_on
      sequence:
      - condition: state
        entity_id: binary_sensor.kitchen_sensor_group
        state: 'on'
      - condition: state
        entity_id: input_boolean.kitchen_manual_override
        state: 'off'
      - action: switch.turn_off
        target:
          entity_id:
          - switch.al_kitchen
          - switch.al_kitchen_main
      - choose:
        - conditions:
          - condition: time
            after: '23:45:00'
            before: '23:55:00'
          sequence:
          - action: light.turn_off
            target:
              entity_id: light.kitchen_main_lights
          - action: light.turn_on
            target:
              entity_id:
              - light.kitchen_1_color
              - light.kitchen_2_color
              - light.kitchen_lightstrip
            data:
              brightness_pct: 60
              color_temp_kelvin: 2200
              transition: 5
        default:
        - action: light.turn_off
          target:
            entity_id: light.kitchen_main_lights
        - action: light.turn_on
          target:
            entity_id:
            - light.kitchen_1_color
            - light.kitchen_2_color
            - light.kitchen_lightstrip
          data:
            brightness_pct: 24
            rgb_color:
            - 255
            - 20
            - 0
            transition: 30
    - conditions:
      - condition: trigger
        id: motion_detected
      sequence:
      - alias: Skip all light changes if manual override is active
        condition: state
        entity_id: input_boolean.kitchen_manual_override
        state: 'off'
      - choose:
        - conditions:
          - condition: time
            after: '23:45:00'
            before: '23:55:00'
          sequence:
          - action: switch.turn_off
            target:
              entity_id:
              - switch.al_kitchen
              - switch.al_kitchen_main
          - action: light.turn_off
            target:
              entity_id: light.kitchen_main_lights
          - action: light.turn_on
            target:
              entity_id:
              - light.kitchen_1_color
              - light.kitchen_2_color
              - light.kitchen_lightstrip
            data:
              brightness_pct: 60
              color_temp_kelvin: 2200
              transition: 2
        - conditions:
          - condition: or
            conditions:
            - condition: state
              entity_id: switch.al_sleep_mode_kitchen
              state: 'on'
            - condition: state
              entity_id: switch.al_sleep_mode_kitchen_main
              state: 'on'
          sequence:
          - action: switch.turn_off
            target:
              entity_id:
              - switch.al_kitchen
              - switch.al_kitchen_main
          - action: light.turn_off
            target:
              entity_id: light.kitchen_main_lights
          - action: light.turn_on
            target:
              entity_id:
              - light.kitchen_1_color
              - light.kitchen_2_color
              - light.kitchen_lightstrip
            data:
              brightness_pct: 24
              rgb_color:
              - 255
              - 20
              - 0
              transition: 5
        - conditions:
          - condition: state
            entity_id: sun.sun
            state: below_horizon
          alias: Evening/Night (sun down, before sleep mode)
          sequence:
          - action: switch.turn_off
            target:
              entity_id:
              - switch.al_kitchen
              - switch.al_kitchen_main
          - alias: Main light on (TV dimming handled by Living Room TV Mode)
            action: light.turn_on
            target:
              entity_id: light.kitchen_main_lights
            data:
              brightness_pct: 30
              color_temp_kelvin: 2700
              transition: 2
          - action: light.turn_on
            target:
              entity_id:
              - light.kitchen_1_color
              - light.kitchen_2_color
              - light.kitchen_lightstrip
            data:
              transition: 2
          - action: switch.turn_on
            target:
              entity_id: switch.al_kitchen
          - action: adaptive_lighting.apply
            continue_on_error: true
            data:
              entity_id: switch.al_kitchen
              lights:
              - light.kitchen_1_color
              - light.kitchen_2_color
              - light.kitchen_lightstrip
              transition: 2
              adapt_color: true
              adapt_brightness: true
        - conditions:
          - condition: state
            entity_id: sun.sun
            state: above_horizon
          - condition: time
            before: '23:45:00'
          alias: Daytime (sun up, before dishes/sleep window)
          sequence:
          - action: switch.turn_off
            target:
              entity_id:
              - switch.al_kitchen
              - switch.al_kitchen_main
          - alias: Main light on via AL (TV dimming handled by Living Room TV Mode)
            action: light.turn_on
            target:
              entity_id: light.kitchen_main_lights
            data:
              transition: 2
          - action: switch.turn_on
            target:
              entity_id: switch.al_kitchen_main
          - action: adaptive_lighting.apply
            continue_on_error: true
            data:
              entity_id: switch.al_kitchen_main
              lights:
              - light.kitchen_main_lights
              transition: 2
              adapt_color: true
              adapt_brightness: true
          - action: light.turn_on
            target:
              entity_id:
              - light.kitchen_1_color
              - light.kitchen_2_color
              - light.kitchen_lightstrip
            data:
              transition: 2
          - action: switch.turn_on
            target:
              entity_id: switch.al_kitchen
          - action: adaptive_lighting.apply
            continue_on_error: true
            data:
              entity_id: switch.al_kitchen
              lights:
              - light.kitchen_1_color
              - light.kitchen_2_color
              - light.kitchen_lightstrip
              transition: 2
              adapt_color: true
              adapt_brightness: true
        default:
        - action: switch.turn_off
          target:
            entity_id:
            - switch.al_kitchen
            - switch.al_kitchen_main
        - action: light.turn_off
          target:
            entity_id: light.kitchen_main_lights
        - action: light.turn_on
          target:
            entity_id:
            - light.kitchen_1_color
            - light.kitchen_2_color
            - light.kitchen_lightstrip
          data:
            brightness_pct: 40
            transition: 2
        - action: switch.turn_on
          target:
            entity_id: switch.al_kitchen
        - action: adaptive_lighting.apply
          continue_on_error: true
          data:
            entity_id: switch.al_kitchen
            lights:
            - light.kitchen_1_color
            - light.kitchen_2_color
            - light.kitchen_lightstrip
            transition: 10
            adapt_color: true
            adapt_brightness: true
    - conditions:
      - condition: trigger
        id: kitchen_cleared
      alias: 'Cleared 60s: main light dims to 15% then turns off (Hue stays on)'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.kitchen_manual_override
      - alias: Disable main AL so it cannot fight the dim/off
        action: switch.turn_off
        target:
          entity_id: switch.al_kitchen_main
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.al_kitchen_main
          manual_control: false
      - alias: Dim main to 15% as a soft warning
        action: light.turn_on
        target:
          entity_id: light.kitchen_main_lights
        data:
          brightness_pct: 15
          transition: 2
      - delay:
          seconds: 3
      - alias: Then turn main off
        action: light.turn_off
        target:
          entity_id: light.kitchen_main_lights
        data:
          transition: 2
    - conditions:
      - condition: trigger
        id: kitchen_cleared_hue
      alias: 'Cleared 3:30: fade the 3 Hue lights off over 30s'
      sequence:
      - alias: Disable color AL so it cannot re-apply during the fade
        action: switch.turn_off
        target:
          entity_id: switch.al_kitchen
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.al_kitchen
          manual_control: false
      - alias: Fade the 3 Hue lights off over 30 seconds
        action: light.turn_off
        target:
          entity_id:
          - light.kitchen_1_color
          - light.kitchen_2_color
          - light.kitchen_lightstrip
        data:
          transition: 30
  mode: queued
  max: 10
- id: '1775368699660'
  alias: 'System: Global Sleep Mode Schedule'
  description: 'Evening: enables sleep mode for Bedroom 2 / Office at 22:15, the kitchen
    at 23:45, and the rest of the house at 23:00. Kitchen is deliberately later than
    the rest of the house so the main light stays on through late-night kitchen use;
    it still turns off earlier on its own via the Kitchen automation''s occupancy-clear
    triggers (kitchen_cleared/kitchen_cleared_hue) whenever the room actually clears,
    independent of sleep mode. Morning: catch-all that disables sleep mode and re-enables
    AL everywhere, clearing manual_control. Big Bedroom is excluded from the morning
    branch because the Good Morning Routine owns it. Bedroom 2 / Office is included
    in the morning catch-all for simplicity - it''s redundant with "Office: Daily
    AL Reset" but harmless.'
