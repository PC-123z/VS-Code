      - condition: trigger
        id: cleared
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.living_room
        data:
          transition: 15
      - action: light.turn_off
        target:
          entity_id: light.galaxy_projector
      - action: switch.turn_off
        target:
          entity_id: switch.al_living_room
    - conditions:
      - condition: trigger
        id: morning_transition
      sequence:
      - condition: state
        entity_id: binary_sensor.living_room_sensor_presence
        state: 'on'
      - action: switch.turn_on
        target:
          entity_id: switch.al_living_room
      - condition: template
        value_template: "{{ 'light.living_room' not in\n   state_attr('switch.al_living_room',
          'manual_control') }}\n"
      - action: adaptive_lighting.apply
        continue_on_error: true
        data:
          entity_id: switch.al_living_room
          lights:
          - light.living_room
          transition: 60
          adapt_color: true
          adapt_brightness: true
    - conditions:
      - condition: trigger
        id: sunset_transition
      sequence:
      - condition: state
        entity_id: binary_sensor.living_room_sensor_presence
        state: 'on'
      - action: switch.turn_off
        target:
          entity_id: switch.al_living_room
      - action: light.turn_on
        target:
          entity_id: light.living_room
        data:
          brightness_pct: 3
          rgb_color:
          - 200
          - 220
          - 255
          transition: 60
    - conditions:
      - condition: trigger
        id: night_transition
      sequence:
      - condition: state
        entity_id: binary_sensor.living_room_sensor_presence
        state: 'on'
      - action: switch.turn_off
        target:
          entity_id: switch.al_living_room
      - action: light.turn_on
        target:
          entity_id: light.living_room
        data:
          brightness_pct: 10
          rgb_color:
          - 255
          - 20
          - 0
          transition: 60
    - conditions:
      - condition: trigger
        id: detected
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: switch.al_sleep_mode_living_room
            state: 'on'
          sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.al_living_room
          - action: light.turn_on
            target:
              entity_id: light.living_room
            data:
              brightness_pct: 10
              rgb_color:
              - 255
              - 20
              - 0
              transition: 5
        - conditions:
          - condition: time
            after: 07:00:00
            before: '23:59:59'
