- id: '1777251099134'
  alias: 'Living Room: TV Mode (Unified)'
  description: TV state drives living room lighting with time-of-day palette. Playing
    = deep dim scaled to daylight. Paused/Off = restore AL and presence. Dining room
    dims during playback if occupied. Galaxy projector off during playback, on when
    paused/off.
  triggers:
  - trigger: state
    entity_id:
    - media_player.appletv_14
    to:
    - playing
    id: playing
  - trigger: state
    entity_id:
    - media_player.appletv_14
    to:
    - paused
    - idle
    id: paused
  - trigger: state
    entity_id:
    - media_player.appletv_14
    to:
    - 'off'
    id: tv_off
  - trigger: state
    entity_id:
    - media_player.appletv_5
    to:
    - playing
    id: playing
  - trigger: state
    entity_id:
    - media_player.appletv_5
    to:
    - paused
    - idle
    id: paused
  - trigger: state
    entity_id:
    - media_player.appletv_5
    to:
    - 'off'
    id: tv_off
  - trigger: state
    entity_id:
    - media_player.appletv_6
    to:
    - playing
    id: playing
  - trigger: state
    entity_id:
    - media_player.appletv_6
    to:
    - paused
    - idle
    id: paused
  - trigger: state
    entity_id:
    - media_player.appletv_6
    to:
    - 'off'
    id: tv_off
  - trigger: state
    entity_id:
    - media_player.living_room_tv
    to:
    - playing
    id: playing
  - trigger: state
    entity_id:
    - media_player.living_room_tv
    to:
    - paused
    - idle
    id: paused
    enabled: false
  - trigger: state
    entity_id:
    - media_player.living_room_tv
    to:
    - 'off'
    id: tv_off
  - trigger: state
    entity_id:
    - media_player.living_room_tv_3
    to:
    - playing
    id: playing
  - trigger: state
    entity_id:
    - media_player.living_room_tv_3
    to:
    - paused
    - idle
    id: paused
    enabled: false
  - trigger: state
    entity_id:
    - media_player.living_room_tv_3
    to:
    - 'off'
    id: tv_off
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: playing
      - condition: state
        entity_id: light.living_room
        state: 'on'
      sequence:
      - action: automation.turn_off
        target:
          entity_id: automation.living_room_smart_motion_presence
      - action: switch.turn_off
        target:
          entity_id: switch.al_living_room
      - action: adaptive_lighting.set_manual_control
