- id: '1747200000001'
  alias: Good Morning Active - Watchdog Shutoff
  description: Safety net in case HA restarts mid-routine and leaves good_morning_active
    stuck on. Turns everything off after 45 minutes regardless.
  triggers:
  - trigger: state
    entity_id: input_boolean.good_morning_active
    to: 'on'
    for:
      minutes: 45
  conditions: []
  actions:
  - continue_on_error: true
    action: media_player.media_stop
    target:
      entity_id: media_player.bedroom_2
  - continue_on_error: true
    action: media_player.unjoin
    target:
      entity_id: media_player.bathroom_2
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.good_morning_active
  mode: single
