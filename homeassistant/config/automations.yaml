- id: '1777796510473'
  alias: '*Good Morning Routine'
  description: Staged sunrise wake-up with 3-min light ramp, occupancy-driven music
    tail, bathroom speaker grouping on motion, and 60-min hard cap from routine start.
  triggers:
  - trigger: time
    at: 07:45:00
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  - trigger: time
    at: 09:05:00
    weekday:
    - sat
    - sun
  conditions: []
  actions:
  - alias: Mark routine as active
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.good_morning_active
  - alias: Arm the expected-pause flag for the whole run - the routine's own unjoin/track-swap
      at start, the opener-finished silence, and the between-songs pauses all cause
      brief idle/paused blips on the Sonos entity that the stop-on-idle watchdog would
      otherwise treat as a manual stop. Disarmed once phase 2 (the shuffled playlist)
      is solidly underway, and re-armed/disarmed around each later announcement pause.
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.good_morning_expected_pause
  - alias: Reset the per-cycle announcement count (capped at 2 announcements per morning,
      enforced by this counter's own maximum plus the arm conditions on both announcement
      automations)
    action: counter.reset
    target:
      entity_id: counter.good_morning_announcements
  - alias: Clear any left-over armed announcement. Only Arm Second turns this flag
      on and only Between Songs turns it off, so if a run ended after motion armed
      the second announcement but before a track boundary arrived (occupancy timeout,
      music stopped at the speaker, or the hard cap), the flag stayed on overnight.
      The next morning the counter resets to zero, so the first track change would
      then fire Between Songs as announcement number one - a full greeting at a boundary,
      on top of the routine's own announcement on motion.
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.good_morning_announcement_pending
  - alias: Clear asleep flag - presence lighting allowed again
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.big_bedroom_asleep
  - alias: Turn off all sleep modes
    action: switch.turn_off
    target:
      entity_id:
      - switch.al_sleep_mode_bathroom
      - switch.al_sleep_mode_bathroom_main
      - switch.al_sleep_mode_big_bedroom
      - switch.al_sleep_mode_dining_room_bottom
      - switch.al_sleep_mode_dining_room_top
      - switch.al_sleep_mode_hallway
      - switch.al_sleep_mode_kitchen
      - switch.al_sleep_mode_kitchen_main
      - switch.al_sleep_mode_living_room
      - switch.adaptive_lighting_sleep_mode_office
  - alias: Clear manual control for bathroom main so Adaptive Lighting adapts it to
      the daytime profile the next time motion turns it on. The routine deliberately
      does NOT turn the bathroom light on itself - lighting the bathroom is left to
      Bathroom Smart Motion & Presence.
    action: adaptive_lighting.set_manual_control
    continue_on_error: true
    data:
      entity_id: switch.al_bathroom_main
      manual_control: false
  - alias: Turn off bedroom AL switches and clear manual control
    action: switch.turn_off
    target:
      entity_id:
      - switch.al_big_bedroom
      - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_color_big_bedroom_al
      - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_brightness_big_bedroom_al
  - action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.al_big_bedroom
      lights:
      - light.bedroom_ceiling_1
      - light.bedroom_ceiling_2
      - light.bedroom_lamp_1
      - light.bedroom_lamp_2
      manual_control: false
  - alias: Stage 1 - Nanoleaf Morning Sky effect at 5%
    action: light.turn_on
    target:
      entity_id: light.nano_sand_dune
    data:
      effect: Morning Sky
      brightness_pct: 5
      transition: 1
  - alias: Run all sunrise stages in parallel
    parallel:
    - sequence:
      - alias: Nanoleaf ramps to 100% over 3 minutes
        repeat:
          count: 20
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.nano_sand_dune
            data:
              brightness_pct: '{{ [5 + (repeat.index * 4.75), 100] | min | round(0)
                }}'
              transition: 3
          - delay:
              seconds: 9
    - sequence:
      - alias: Wait 15 seconds then bring in ceiling lights
        delay:
          seconds: 15
      - alias: Ceiling lights start at 1% warm white
        action: light.turn_on
        target:
          entity_id:
          - light.bedroom_ceiling_1
          - light.bedroom_ceiling_2
        data:
          color_temp_kelvin: 2700
          brightness_pct: 1
          transition: 3
      - alias: Ceiling lights fade to 70% over ~2:45
        repeat:
          count: 16
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.bedroom_ceiling_1
              - light.bedroom_ceiling_2
            data:
              brightness_pct: '{{ [1 + (repeat.index * 4.3), 70] | min | round(0)
                }}'
              color_temp_kelvin: 2700
              transition: 3
          - delay:
              seconds: 10
    - sequence:
      - alias: Wait 30 seconds then bring in lamps, cut fans, start music
        delay:
          seconds: 30
      - alias: Cut bedroom fans
        action: fan.turn_off
        target:
          entity_id:
          - fan.air_circulator
          - fan.bedroom_purifier
          - fan.big_bedroom_fan
      - alias: Lamps start at 1% warm white
        action: light.turn_on
        target:
          entity_id:
          - light.bedroom_lamp_1
          - light.bedroom_lamp_2
        data:
          color_temp_kelvin: 2700
          brightness_pct: 1
          transition: 3
      - alias: Lamps fade to 94% over ~2:30
        repeat:
          count: 14
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.bedroom_lamp_1
              - light.bedroom_lamp_2
            data:
              brightness_pct: '{{ [1 + (repeat.index * 6.6), 94] | min | round(0)
                }}'
              color_temp_kelvin: 2700
              transition: 3
          - delay:
              seconds: 10
    - sequence:
      - alias: Wait 30 seconds (sync with lamp start)
        delay:
          seconds: 30
      - alias: Unjoin bedroom speaker from any group before starting
        continue_on_error: true
        action: media_player.unjoin
        target:
          entity_id: media_player.bedroom_2
      - delay:
          seconds: 3
      - action: media_player.volume_set
        target:
          entity_id: media_player.bedroom
        data:
          volume_level: 0.05
      - alias: 'PHASE 1 - Here Comes The Sun on its own. Repeat MUST be off here:
          it is persistent queue state and is normally left on ''all'', and an all-repeat
          on a one-track queue replays the same song forever, which is the original
          failure from 2026-08-18. Shuffle off too, so nothing reorders a single item.'
        continue_on_error: true
        action: media_player.repeat_set
        target:
          entity_id: media_player.bedroom_2
        data:
          repeat: 'off'
      - continue_on_error: true
        action: media_player.shuffle_set
        target:
          entity_id: media_player.bedroom_2
        data:
          shuffle: false
      - delay:
          seconds: 2
      - alias: 'Queue ONLY the opening track. A single-item queue gives Music Assistant
          no next item to pre-buffer, which is what used to go wrong: the playlist
          was loaded unshuffled so MA buffered its natural track 2 (Jack Johnson -
          Better Together), the routine then switched shuffle on, and at the boundary
          Sonos started the newly shuffled track while MA''s stream still delivered
          the buffered one - a few seconds of one song, then Better Together, every
          single morning. Nothing is pre-buffered here, so there is nothing to mismatch.'
        continue_on_error: true
        action: music_assistant.play_media
        target:
          entity_id: media_player.bedroom_2
        data:
          media_id: ytmusic://track/xUNqsfFUwhY
          media_type: track
          enqueue: replace
      - alias: Wait for the opening track to actually start
        wait_template: '{{ is_state(''media_player.bedroom_2'', ''playing'') }}'
        timeout:
          seconds: 30
        continue_on_timeout: true
      - delay:
          seconds: 3
      - alias: Ensure playback is not paused after unjoin
        continue_on_error: true
        action: media_player.media_play
        target:
          entity_id: media_player.bedroom_2
      - alias: Wait 10 seconds then check if music is playing
        delay:
          seconds: 10
      - alias: Arm the expected-pause flag - everything from here through the shuffled
          playlist starting is a deliberate silence/idle window (waiting for the opener
          to finish, then the announcement), not a manual stop. Cleared again once
          phase 2 is underway or the music-failed branch has spoken.
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.good_morning_expected_pause
      - alias: Get today's daily forecast (high/low/expected condition) for the announcement
        continue_on_error: true
        action: weather.get_forecasts
        target:
          entity_id: weather.forecast_home
        data:
          type: daily
        response_variable: today_fc
      - if:
        - condition: or
          conditions:
          - condition: state
            entity_id: media_player.bedroom_2
            state: idle
          - condition: state
            entity_id: media_player.bedroom_2
            state: 'off'
        then:
        - alias: TTS good morning announcement (music failed)
          action: tts.speak
          target:
            entity_id: tts.piper
          data:
            cache: false
            media_player_entity_id: media_player.bedroom
            message: '{% set fc = today_fc[''weather.forecast_home''][''forecast'']
              if (today_fc is defined and today_fc and ''weather.forecast_home'' in
              today_fc) else [] %} {% set f = fc[0] if fc else none %} Good morning!
              Today is {{ now().strftime(''%A, %B %-d'') }} and the time is {{ now().strftime(''%-I:%M
              %p'') }}. Right now it''s {{ states(''weather.forecast_home'') | replace(''-'',
              '' '') }} and {{ (state_attr(''weather.forecast_home'', ''temperature'')
              | float(0)) | round | int }} degrees. {% if f %}Today will be {{ f.condition
              | replace(''-'', '' '') }}, with a high of {{ (f.temperature | float(0))
              | round | int }} and a low of {{ (f.templow | float(0)) | round | int
              }} degrees.{% endif %} I hope you have a wonderful day!'
        - alias: Disarm the expected-pause flag - nothing left to wait on in this branch
          action: input_boolean.turn_off
          target:
            entity_id: input_boolean.good_morning_expected_pause
        else:
        - alias: Ramp volume to 0.20 over ~2.5 minutes
          repeat:
            count: 8
            sequence:
            - delay:
                seconds: 18
            - action: media_player.volume_set
              target:
                entity_id: media_player.bedroom
              data:
                volume_level: '{{ [0.05 + (repeat.index * 0.0125), 0.15] | min | round(3)
                  }}'
        - alias: Wait for the opening track to finish rather than for motion. With
            a one-track queue and repeat off, Music Assistant goes idle when the song
            ends, so idle is the reliable "track finished" signal. The announcement
            then lands in real silence between the two phases - nothing to duck, nothing
            to pause and resume, and no part of a song lost underneath it. Timeout
            is generously longer than the track and simply falls through.
          wait_template: '{{ is_state(''media_player.bedroom_2'', ''idle'') }}'
          timeout:
            minutes: 8
          continue_on_timeout: true
        - alias: Bail out if the routine was cancelled while the opening track played
            - Goodbye, the sleep flag, or the hard cap can all clear good_morning_active
            mid-run, and without this check the announcement and the whole shuffled
            playlist would still start up afterwards.
          if:
          - condition: state
            entity_id: input_boolean.good_morning_active
            state: 'off'
          then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.good_morning_expected_pause
          - stop: Routine was cancelled during the opening track
          else:
          - alias: Count the first announcement before speaking it, so the Between
              Songs automation knows the next one is number two and keeps it time-only.
            action: counter.increment
            target:
              entity_id: counter.good_morning_announcements
          - alias: Turn shuffle on BEFORE speaking. The player is idle here - the
              opening track has finished and the playlist has not been loaded yet
              - so there is no playback and no pre-buffered next track to invalidate,
              which is the mistake that used to put the same song second every morning.
              Doing it now rather than after the announcement gives it the entire
              spoken message to take effect, so no delay is needed before the music
              starts.
            continue_on_error: true
            action: media_player.shuffle_set
            target:
              entity_id: media_player.bedroom_2
            data:
              shuffle: true
          - alias: 'First announcement, spoken into the gap after the opening track
              has finished. No pause or resume is needed any more because nothing
              is playing - which is the whole point of splitting the morning into
              two phases. Speaking over music never worked properly: Music Assistant
              keeps the stream running underneath an announcement and only stops refreshing
              the reported position, so roughly twenty seconds of song played unheard
              and it picked up far further in, sounding like a different song.'
            action: tts.speak
            target:
              entity_id: tts.piper
            data:
              cache: false
              media_player_entity_id: media_player.bedroom_2
              message: '{% set fc = today_fc[''weather.forecast_home''][''forecast'']
                if (today_fc is defined and today_fc and ''weather.forecast_home''
                in today_fc) else [] %} {% set f = fc[0] if fc else none %} Good morning!
                Today is {{ now().strftime(''%A, %B %-d'') }} and the time is {{ now().strftime(''%-I:%M
                %p'') }}. Right now it''s {{ states(''weather.forecast_home'') | replace(''-'',
                '' '') }} and {{ (state_attr(''weather.forecast_home'', ''temperature'')
                | float(0)) | round | int }} degrees. {% if f %}Today will be {{ f.condition
                | replace(''-'', '' '') }}, with a high of {{ (f.temperature | float(0))
                | round | int }} and a low of {{ (f.templow | float(0)) | round |
                int }} degrees.{% endif %} I hope you have a wonderful day!'
          - alias: Wait for the announcement to finish speaking. The player reports
              'playing' while Piper talks and drops back to 'idle' when it is done,
              so idle returning is the end-of-announcement signal. Generous timeout
              that simply falls through.
            wait_template: '{{ is_state(''media_player.bedroom_2'', ''idle'') }}'
            timeout:
              seconds: 120
            continue_on_timeout: true
          - alias: PHASE 2 - load the shuffled playlist the moment the announcement
              stops, with no padding in between. Shuffle was already switched on before
              the announcement, so it has had the whole spoken message to take effect
              and the queue is built shuffled from the very first item. Shuffle is
              never toggled once playback is under way, which is what used to invalidate
              Music Assistant's pre-buffered next track and make the first boundary
              play a few seconds of one song before jumping to another.
            continue_on_error: true
            action: music_assistant.play_media
            target:
              entity_id: media_player.bedroom_2
            data:
              media_id: ytmusic://playlist/VLPL44SaGMZ1acgMgT2P73ksWuLK77Dh3X8H
              media_type: playlist
              enqueue: replace
          - alias: 'Repeat back on. Deliberately set AFTER the playlist loads rather
              than before: it only matters once all 770 tracks have played, so it
              needs no settling time, and leaving it until now means nothing has to
              be waited on between the announcement ending and the music starting.'
            continue_on_error: true
            action: media_player.repeat_set
            target:
              entity_id: media_player.bedroom_2
            data:
              repeat: all
          - alias: Wait for the playlist to start
            wait_template: '{{ is_state(''media_player.bedroom_2'', ''playing'') }}'
            timeout:
              seconds: 30
            continue_on_timeout: true
          - alias: Disarm the expected-pause flag - phase 2 is underway (or we gave up
              waiting), so a later stop should be treated as real again
            action: input_boolean.turn_off
            target:
              entity_id: input_boolean.good_morning_expected_pause
        - alias: Occupancy-driven music loop using Sensor Group
          repeat:
            while:
            - condition: state
              entity_id: input_boolean.good_morning_active
              state: 'on'
            sequence:
            - if:
              - condition: state
                entity_id: binary_sensor.big_bedroom_sensor_group
                state: 'on'
              then:
              - alias: Self-heal - re-queue playlist if Music Assistant went silent
                if:
                - condition: state
                  entity_id: media_player.bedroom_2
                  state:
                  - idle
                  - 'off'
                  for:
                    seconds: 20
                - condition: state
                  entity_id: input_boolean.good_morning_active
                  state: 'on'
                then:
                - alias: Set shuffle BEFORE re-queueing, never after. The player is
                    idle at this point (that is what triggered the self-heal), so
                    there is no pre-buffered next track to invalidate. Setting it
                    after play_media is what used to make the boundary play a few
                    seconds of one song before jumping to a different one.
                  continue_on_error: true
                  action: media_player.shuffle_set
                  target:
                    entity_id: media_player.bedroom_2
                  data:
                    shuffle: true
                - alias: Re-queue the playlist, already shuffled, in one replace call
                  continue_on_error: true
                  action: music_assistant.play_media
                  target:
                    entity_id: media_player.bedroom_2
                  data:
                    media_id: ytmusic://playlist/VLPL44SaGMZ1acgMgT2P73ksWuLK77Dh3X8H
                    media_type: playlist
                    enqueue: replace
              - action: media_player.volume_set
                target:
                  entity_id: media_player.bedroom
                data:
                  volume_level: 0.15
              - delay:
                  seconds: 30
              else:
              - alias: Wait 15 min to confirm room is truly clear
                wait_for_trigger:
                - trigger: state
                  entity_id: binary_sensor.big_bedroom_sensor_group
                  to: 'on'
                timeout:
                  minutes: 15
                continue_on_timeout: true
              - if:
                - condition: template
                  value_template: '{{ wait.completed == true }}'
                then:
                - action: media_player.volume_set
                  target:
                    entity_id: media_player.bedroom
                  data:
                    volume_level: 0.15
                else:
                - alias: Ramp volume down over 2 minutes
                  repeat:
                    count: 8
                    sequence:
                    - action: media_player.volume_set
                      target:
                        entity_id: media_player.bedroom
                      data:
                        volume_level: '{{ [0.15 - (repeat.index * 0.0125), 0.05] |
                          max | round(3) }}'
                    - delay:
                        seconds: 15
                - action: media_player.media_stop
                  target:
                    entity_id: media_player.bedroom
                - continue_on_error: true
                  action: media_player.unjoin
                  target:
                    entity_id: media_player.bathroom_2
                - action: input_boolean.turn_off
                  target:
                    entity_id: input_boolean.good_morning_active
                - stop: Room cleared for 15 minutes - routine complete
    - sequence:
      - alias: Wait 5 minutes then restore AL
        delay:
          minutes: 5
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.al_big_bedroom
          lights:
          - light.bedroom_ceiling_1
          - light.bedroom_ceiling_2
          - light.bedroom_lamp_1
          - light.bedroom_lamp_2
          manual_control: false
      - action: switch.turn_on
        target:
          entity_id:
          - switch.al_big_bedroom
          - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_color_big_bedroom_al
          - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_brightness_big_bedroom_al
      - action: input_select.select_option
        target:
          entity_id: input_select.bedroom_scene_mode
        data:
          option: al
      - action: adaptive_lighting.apply
        continue_on_error: true
        data:
          entity_id: switch.al_big_bedroom
          lights:
          - light.bedroom_ceiling_1
          - light.bedroom_ceiling_2
          - light.bedroom_lamp_1
          - light.bedroom_lamp_2
          transition: 30
          adapt_color: true
          adapt_brightness: true
          prefer_rgb_color: true
      - alias: Re-enable Big Bedroom motion automation
        action: automation.turn_on
        target:
          entity_id: automation.big_bedroom_smart_motion_presence
      - alias: Only trigger Nanoleaf if occupancy detected
        if:
        - condition: state
          entity_id: binary_sensor.big_bedroom_sensor_group
          state: 'on'
        then:
        - action: select.select_option
          target:
            entity_id: select.nanoleaf_dynamic_scenes
          data:
            option: Cocoa Beach
        - action: light.turn_on
          target:
            entity_id: light.nano_sand_dune
          data:
            brightness_pct: 80
            transition: 5
    - sequence:
      - alias: 60-minute hard cap timer
        delay:
          hours: 1
      - continue_on_error: true
        action: media_player.media_stop
        target:
          entity_id: media_player.bedroom_2
      - continue_on_error: true
        action: media_player.unjoin
        target:
          entity_id: media_player.bathroom_2
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.good_morning_active
  mode: single
- id: '1777890100001'
  alias: Heater Auto Off
  description: Keeps bathroom heater plug on all the time. Auto-shuts off for 5 seconds
    after  30 minutes of continuous use (>100W), then re-enables automatically.
  triggers:
  - trigger: time
    at: 06:00:00
    id: startup
  - trigger: numeric_state
    entity_id:
    - sensor.bathroom_heater_current_consumption
    above: 100
    for:
      hours: 0
      minutes: 20
      seconds: 0
    id: high_power_30min
  - trigger: numeric_state
    entity_id: sensor.bathroom_heater_current_consumption
    below: 100
    for:
      seconds: 5
    id: power_off_5s
  conditions: []
  actions:
  - choose:
    - alias: Startup - ensure outlet is on
      conditions:
      - condition: trigger
        id: startup
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.bathroom_heater
    - alias: High power for 30min - turn off for 5 seconds
      conditions:
      - condition: trigger
        id: high_power_30min
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.bathroom_heater
      - delay:
          seconds: 5
      - action: switch.turn_on
        target:
          entity_id: switch.bathroom_heater
    - alias: Power below 100W for 5s - turn on (safety)
      conditions:
      - condition: trigger
        id: power_off_5s
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.bathroom_heater
  mode: single
- id: '1778020278429'
  alias: Elgato Light Auto Off on PC Shutdown
  description: Turns off the Elgato Showtime light when office PC plug wattage drops
    below 20W, indicating the computer has shut down.
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.office_pc_plug_current_consumption
    below: 25
    for:
      seconds: 10
    id: low_power_detected
  conditions: []
  actions:
  - alias: Turn off Elgato light when PC powers down
    action: light.turn_off
    target:
      entity_id: light.showtime_light
  mode: single
- id: '1778194432803'
  alias: Bathroom Speaker Join on Motion v2
  description: 'Joins bathroom Sonos to the active source on motion. During welcome_home_active
    the source is the kitchen; otherwise it''s the bedroom Arc. Matches source volume,
    ramping in gracefully. Uses timer.bathroom_join_idle to track 15-minute motion-clear
    window: motion off starts the timer, motion on cancels it, timer finish ungroups.
    Also ungroups if either source goes idle/paused/off. Skipped while Good Morning
    routine is active.'
  triggers:
  - trigger: state
    entity_id: binary_sensor.bathroom_motion
    to: 'on'
    id: motion_on
  - trigger: state
    entity_id: binary_sensor.bathroom_motion
    to: 'off'
    id: motion_off
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.bathroom_join_idle
    id: idle_timer_done
  - trigger: state
    entity_id: media_player.bedroom
    to:
    - idle
    - paused
    - 'off'
    - standby
    id: bedroom_stopped
  - trigger: state
    entity_id: media_player.kitchen
    to:
    - idle
    - paused
    - 'off'
    - standby
    id: kitchen_stopped
  conditions: []
  actions:
  - variables:
      welcome_home_on: '{{ is_state(''input_boolean.welcome_home_active'', ''on'')
        }}'
      bedroom_active: "{{ states('media_player.bedroom') not in\n   ['off','idle','paused','standby','unavailable','unknown']
        }}"
      kitchen_active: "{{ states('media_player.kitchen') not in\n   ['off','idle','paused','standby','unavailable','unknown']
        }}"
      source_player: '{% if welcome_home_on and kitchen_active %} media_player.kitchen
        {% elif bedroom_active %} media_player.bedroom {% else %} none {% endif %}'
  - choose:
    - alias: Motion detected - join if eligible
      conditions:
      - condition: trigger
        id: motion_on
      - alias: A source is currently active
        condition: template
        value_template: '{{ source_player != ''none'' }}'
      sequence:
      - alias: Cancel any pending idle timer
        action: timer.cancel
        target:
          entity_id: timer.bathroom_join_idle
      - alias: Skip if Good Morning routine is active
        condition: state
        entity_id: input_boolean.good_morning_active
        state: 'off'
        enabled: false
      - alias: Skip if bathroom already in the source group
        condition: template
        value_template: "{{ state_attr(source_player, 'group_members') is not none
          and\n   'media_player.bathroom' not in\n   (state_attr(source_player, 'group_members')
          | default([])) }}"
      - variables:
          bathroom_vol_before: '{{ state_attr(''media_player.bathroom'', ''volume_level'')
            | default(0.30) }}'
          target_vol: '{{ state_attr(source_player, ''volume_level'') | default(0.20)
            | float }}'
      - alias: Store pre-join volume for later restore
        action: input_number.set_value
        target:
          entity_id: input_number.bathroom_vol_before_join
        data:
          value: '{{ bathroom_vol_before }}'
      - alias: Unmute bathroom before join
        continue_on_error: true
        action: media_player.volume_mute
        target:
          entity_id: media_player.bathroom
        data:
          is_volume_muted: false
      - alias: Set bathroom volume low before joining
        action: media_player.volume_set
        target:
          entity_id: media_player.bathroom
        data:
          volume_level: 0.05
      - alias: Join bathroom to source group
        action: media_player.join
        target:
          entity_id: '{{ source_player }}'
        data:
          group_members:
          - media_player.bathroom
      - alias: Unmute again after join
        continue_on_error: true
        action: media_player.volume_mute
        target:
          entity_id: media_player.bathroom
        data:
          is_volume_muted: false
      - alias: Ramp bathroom volume up to match source
        repeat:
          count: 5
          sequence:
          - delay:
              seconds: 6
          - action: media_player.volume_set
            target:
              entity_id: media_player.bathroom
            data:
              volume_level: "{{ [0.05 + (repeat.index * ((target_vol - 0.05) / 5)),\n
                \   target_vol] | min | round(3) }}"
    - alias: Motion cleared - start idle timer (only if grouped)
      conditions:
      - condition: trigger
        id: motion_off
      - alias: Bathroom is currently in any active source group
        condition: template
        value_template: "{{ ('media_player.bathroom' in\n    (state_attr('media_player.bedroom',
          'group_members') | default([])))\n   or\n   ('media_player.bathroom' in\n
          \   (state_attr('media_player.kitchen', 'group_members') | default([])))
          }}"
      sequence:
      - alias: Start/restart the 10-minute idle timer
        action: timer.start
        target:
          entity_id: timer.bathroom_join_idle
        data:
          duration:
            hours: 0
            minutes: 10
            seconds: 0
    - alias: Idle timer elapsed - ungroup bathroom
      conditions:
      - condition: trigger
        id: idle_timer_done
      sequence:
      - alias: Ungroup bathroom Sonos
        continue_on_error: true
        action: media_player.unjoin
        target:
          entity_id: media_player.bathroom
        data: {}
      - alias: Restore bathroom volume
        action: media_player.volume_set
        target:
          entity_id: media_player.bathroom
        data:
          volume_level: '{{ states(''input_number.bathroom_vol_before_join'') | float(0.30)
            }}'
    - alias: Source stopped - ungroup immediately
      conditions:
      - condition: trigger
        id:
        - bedroom_stopped
        - kitchen_stopped
      - alias: Bathroom is currently in the stopped source's group
        condition: template
        value_template: "{% set stopped = 'media_player.bedroom' if trigger.id ==
          'bedroom_stopped'\n   else 'media_player.kitchen' %}\n{{ 'media_player.bathroom'
          in\n   (state_attr(stopped, 'group_members') | default([])) }}"
      sequence:
      - alias: Cancel idle timer if running
        action: timer.cancel
        target:
          entity_id: timer.bathroom_join_idle
        data: {}
      - alias: Ungroup bathroom Sonos
        continue_on_error: true
        action: media_player.unjoin
        target:
          entity_id: media_player.bathroom
        data: {}
      - alias: Restore bathroom volume
        action: media_player.volume_set
        target:
          entity_id: media_player.bathroom
        data:
          volume_level: '{{ states(''input_number.bathroom_vol_before_join'') | float(0.30)
            }}'
  mode: queued
  max: 10
- id: '1778197535595'
  alias: 'Pico Center - Big Bedroom: Fun Button / Sexy Time'
  description: 'Center circle press sets mood mode: deep red lighting at 40% (matching
    Bedtime Button), bedroom fan to 50%, alarm to home, TV off. Music plays based
    on time of day (before midnight = upbeat playlist, after midnight = chill album).
    Raise button forces the opposite time-of-day playlist instead (was previously
    Bright White Override - removed since this remote can''t reliably do hold/multi-tap).
    After 60 minutes, automatically triggers the Bedtime Button routine for wind-down.'
  triggers:
  - device_id: 439cd94b6d0b7203c2c0e131aee2cc31
    domain: lutron_caseta
    type: press
    subtype: stop
    trigger: device
    id: press
  - device_id: 439cd94b6d0b7203c2c0e131aee2cc31
    domain: lutron_caseta
    type: press
    subtype: raise
    trigger: device
    id: hold
  conditions: []
  actions:
  - alias: Disable motion automation
    action: automation.turn_off
    target:
      entity_id: automation.big_bedroom_smart_motion_presence
    data:
      stop_actions: true
  - alias: Turn off AL switches and set manual control
    action: switch.turn_off
    target:
      entity_id:
      - switch.al_big_bedroom
      - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_color_big_bedroom_al
      - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_brightness_big_bedroom_al
  - action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.al_big_bedroom
      lights:
      - light.bedroom_ceiling_1
      - light.bedroom_ceiling_2
      - light.bedroom_lamp_1
      - light.bedroom_lamp_2
      manual_control: true
  - alias: Set deep warm red at 25% (matching Bedtime mood)
    action: light.turn_on
    target:
      entity_id:
      - light.bedroom_ceiling_1
      - light.bedroom_ceiling_2
    data:
      rgb_color:
      - 255
      - 30
      - 0
      brightness_pct: 25
      transition: 5
  - alias: Set deep warm red at 10% (matching Bedtime mood)
    action: light.turn_on
    target:
      entity_id:
      - light.bedroom_lamp_1
      - light.bedroom_lamp_2
    data:
      rgb_color:
      - 255
      - 30
      - 0
      transition: 5
      brightness_pct: 10
  - alias: Nanoleaf to deep red
    action: light.turn_on
    target:
      entity_id: light.nano_sand_dune
    data:
      rgb_color:
      - 255
      - 30
      - 0
      transition: 1
      brightness_pct: 10
  - alias: Set bedroom fan to 50%
    action: fan.turn_on
    target:
      entity_id: fan.big_bedroom_fan
    data:
      percentage: 50
  - alias: Set bedroom fan to 50%
    action: fan.turn_on
    data:
      percentage: 50
    target:
      entity_id: fan.air_circulator
  - alias: Set alarm to Home/Stay
    action: alarm_control_panel.alarm_arm_home
    target:
      entity_id: alarm_control_panel.3302_alarm
  - alias: Turn off bedroom TV
    action: media_player.turn_off
    target:
      entity_id: media_player.bedroom_tv_2
  - alias: Choose music based on time of day
    choose:
    - alias: After midnight - play chill album (or hold button to force it any time)
      conditions:
      - condition: template
        value_template: '{{ (trigger.id == ''press'' and now().hour >= 0 and now().hour
          < 6) or (trigger.id == ''hold'' and not (now().hour >= 0 and now().hour
          < 6)) }}'
      sequence:
      - alias: Set Sonos volume to 10%
        action: media_player.volume_set
        target:
          entity_id: media_player.bedroom_2
        data:
          volume_level: 0.1
      - alias: Play Chill Album via Music Assistant (with retry)
        repeat:
          sequence:
          - continue_on_error: true
            action: music_assistant.play_media
            target:
              entity_id: media_player.bedroom_2
            data:
              media_id: ytmusic://playlist/VLPLV_q9IkDBBFKI-4jQfFG5KZaWanZgd3-r
              media_type: playlist
              radio_mode: false
          - continue_on_error: true
            action: media_player.shuffle_set
            target:
              entity_id: media_player.bedroom_2
            data:
              shuffle: true
          - alias: Give playback a few seconds to start
            wait_template: '{{ is_state(''media_player.bedroom_2'', ''playing'') }}'
            timeout:
              seconds: 8
            continue_on_timeout: true
          until:
          - alias: Exit the loop once it is playing, or after two attempts. Must be
              an until condition, not a stop action - stop would end the whole automation
              run and skip every step after this repeat.
            condition: or
            conditions:
            - condition: state
              entity_id: media_player.bedroom_2
              state: playing
            - condition: template
              value_template: '{{ repeat.index >= 2 }}'
      - alias: Notify if music still isn't playing after retry
        if:
        - condition: not
          conditions:
          - condition: state
            entity_id: media_player.bedroom_2
            state: playing
        then:
        - action: notify.mobile_app_pc_iphone
          data:
            title: Fun Button music didn't start
            message: Bedroom Sonos didn't start playing after two tries - speaker
              may be offline.
    default:
    - alias: Set Sonos volume to 10%
      action: media_player.volume_set
      target:
        entity_id: media_player.bedroom_2
      data:
        volume_level: 0.1
    - alias: Play Fun Playlist via Music Assistant (with retry)
      repeat:
        sequence:
        - continue_on_error: true
          action: music_assistant.play_media
          target:
            entity_id: media_player.bedroom_2
          data:
            media_id: ytmusic://playlist/VLPLiy0XOfUv4hHOC8nCojwvnOW2vpCrj8gM
            media_type: playlist
            radio_mode: false
        - continue_on_error: true
          action: media_player.shuffle_set
          target:
            entity_id: media_player.bedroom_2
          data:
            shuffle: true
        - alias: Give playback a few seconds to start
          wait_template: '{{ is_state(''media_player.bedroom_2'', ''playing'') }}'
          timeout:
            seconds: 8
          continue_on_timeout: true
        until:
        - alias: Exit the loop once it is playing, or after two attempts. Must be
            an until condition, not a stop action - stop would end the whole automation
            run and skip every step after this repeat.
          condition: or
          conditions:
          - condition: state
            entity_id: media_player.bedroom_2
            state: playing
          - condition: template
            value_template: '{{ repeat.index >= 2 }}'
    - alias: Notify if music still isn't playing after retry
      if:
      - condition: not
        conditions:
        - condition: state
          entity_id: media_player.bedroom_2
          state: playing
      then:
      - action: notify.mobile_app_pc_iphone
        data:
          title: Fun Button music didn't start
          message: Bedroom Sonos didn't start playing after two tries - speaker may
            be offline.
  - alias: 60-minute timer before transitioning to Bedtime routine
    delay:
      minutes: 60
  - alias: Trigger Bedtime Button routine
    action: automation.trigger
    target:
      entity_id: automation.big_bedroom_bedtime_button_hue_button_2
    data:
      skip_conditions: true
  mode: restart
- id: '1747200000001'
  alias: Good Morning Active - Watchdog Shutoff
  description: Safety net in case HA restarts mid-routine and leaves good_morning_active
    stuck on. Turns everything off after 45 minutes regardless. Also runs 2 minutes
    after HA start, because a restored 'on' state never fires the 45-minute state
    trigger.
  triggers:
  - trigger: state
    entity_id: input_boolean.good_morning_active
    to: 'on'
    for:
      minutes: 45
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: input_boolean.good_morning_active
    state: 'on'
  actions:
  - alias: On HA start, wait 2 min then bail out unless the flag is still orphaned
    if:
    - condition: template
      value_template: '{{ trigger.platform == ''homeassistant'' }}'
    then:
    - delay:
        minutes: 2
    - if:
      - condition: template
        value_template: '{{ is_state(''input_boolean.good_morning_active'', ''off'')
          or (state_attr(''automation.good_morning_routine'', ''current'') or 0) >
          0 }}'
      then:
      - stop: Flag cleared or wake routine actively running - nothing to clean up
  - continue_on_error: true
    action: media_player.media_stop
    target:
      entity_id: media_player.bedroom_2
  - continue_on_error: true
    action: media_player.unjoin
    target:
      entity_id: media_player.bathroom_2
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.good_morning_active
  mode: single
- id: '1778649471818'
  alias: Auto Arm 3302 at 12:15A Daily
  description: ''
  triggers:
  - trigger: time
