  max: 10
- id: '1776224619528'
  alias: 'Office: Daily AL Reset'
  description: Every morning at 7AM M-F and 10AM Sat-Sun, restore AL switches to default
    on state. Also re-enables Smart Motion & Presence automation.
  triggers:
  - trigger: time
    at: 07:00:00
    id: weekday_reset
  - trigger: time
    at: '10:00:00'
    id: weekend_reset
  conditions:
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: trigger
        id: weekday_reset
      - condition: time
        weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
    - condition: and
      conditions:
      - condition: trigger
        id: weekend_reset
      - condition: time
        weekday:
        - sat
        - sun
  actions:
  - action: automation.turn_on
    target:
      entity_id: automation.office_bedroom_2_smart_motion_presence_2
  - alias: Clear manual override (safety net for overnight occupancy)
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.bedroom2_manual_override
  - action: switch.turn_on
    target:
      entity_id:
      - switch.adaptive_lighting_office
      - switch.adaptive_lighting_adapt_color_office
      - switch.adaptive_lighting_adapt_brightness_office
  - action: switch.turn_off
    target:
      entity_id: switch.adaptive_lighting_sleep_mode_office
  - action: input_select.select_option
    target:
      entity_id: input_select.office_scene_mode
    data:
      option: al
  - action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.adaptive_lighting_office
      lights:
      - light.office
      manual_control: false
  mode: single
