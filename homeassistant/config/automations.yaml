      hours: 0
      minutes: 14
      seconds: 30
    id: cleared
  - trigger: state
    entity_id:
    - binary_sensor.living_room_sensor_group
    to:
    - 'off'
    for:
      minutes: 5
    id: cleared_night
  - trigger: time
    at: 07:00:00
    id: morning_transition
  - trigger: sun
    event: sunset
    id: sunset_transition
  - trigger: time
    at: '23:00:00'
    id: night_transition
  - trigger: state
    entity_id: switch.al_sleep_mode_living_room
    to: 'on'
    id: sleep_on
  - device_id: 046bda673f9c3613042de9612024694e
    domain: hue
    type: initial_press
    subtype: 1
    unique_id: main_room_button_1
    trigger: device
    id: detected
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sleep_on
      sequence:
      - condition: state
        entity_id: binary_sensor.living_room_sensor_presence
        state: 'on'
      - action: switch.turn_off
        target:
          entity_id: switch.al_living_room
      - action: light.turn_on
        target:
          entity_id: light.living_room
        data:
          brightness_pct: 10
          rgb_color:
          - 255
          - 20
          - 0
          transition: 30
    - conditions:
      - condition: trigger
        id: cleared
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.living_room
        data:
          transition: 15
      - action: light.turn_off
        target:
          entity_id: light.galaxy_projector
      - action: switch.turn_off
        target:
          entity_id: switch.al_living_room
    - conditions:
      - condition: trigger
        id: cleared_night
      - condition: or
        conditions:
        - condition: state
          entity_id: switch.al_sleep_mode_living_room
          state: 'on'
        - condition: time
          after: '23:00:00'
          before: 07:00:00
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.living_room
        data:
          transition: 15
      - action: light.turn_off
        target:
          entity_id: light.galaxy_projector
      - action: switch.turn_off
        target:
          entity_id: switch.al_living_room
    - conditions:
      - condition: trigger
        id: morning_transition
      sequence:
      - condition: state
        entity_id: binary_sensor.living_room_sensor_presence
        state: 'on'
      - action: switch.turn_on
        target:
          entity_id: switch.al_living_room
      - condition: template
        value_template: "{{ 'light.living_room' not in\n   state_attr('switch.al_living_room',
          'manual_control') }}\n"
      - action: adaptive_lighting.apply
        continue_on_error: true
        data:
          entity_id: switch.al_living_room
          lights:
          - light.living_room
          transition: 60
          adapt_color: true
          adapt_brightness: true
    - conditions:
      - condition: trigger
        id: sunset_transition
      sequence:
      - condition: state
        entity_id: binary_sensor.living_room_sensor_presence
        state: 'on'
      - action: switch.turn_off
        target:
          entity_id: switch.al_living_room
      - action: light.turn_on
        target:
          entity_id: light.living_room
        data:
          brightness_pct: 3
          rgb_color:
          - 200
          - 220
          - 255
          transition: 60
    - conditions:
      - condition: trigger
        id: night_transition
      sequence:
      - condition: state
        entity_id: binary_sensor.living_room_sensor_presence
        state: 'on'
      - action: switch.turn_off
        target:
          entity_id: switch.al_living_room
      - action: light.turn_on
        target:
          entity_id: light.living_room
        data:
          brightness_pct: 10
          rgb_color:
          - 255
          - 20
          - 0
          transition: 60
    - conditions:
      - condition: trigger
        id: detected
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: switch.al_sleep_mode_living_room
            state: 'on'
          sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.al_living_room
          - action: light.turn_on
            target:
              entity_id: light.living_room
            data:
              brightness_pct: 10
              rgb_color:
              - 255
              - 20
              - 0
              transition: 5
        - conditions:
          - condition: time
            after: 07:00:00
            before: '23:59:59'
          - condition: sun
            before: sunset
          sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.al_living_room
          - action: light.turn_on
            target:
              entity_id: light.living_room
            data:
              transition: 5
          - condition: template
            value_template: "{{ 'light.living_room' not in\n   state_attr('switch.al_living_room',
              'manual_control') }}\n"
          - action: adaptive_lighting.apply
            continue_on_error: true
            data:
              entity_id: switch.al_living_room
              lights:
              - light.living_room
              transition: 5
              adapt_color: true
              adapt_brightness: true
              prefer_rgb_color: false
        - conditions:
          - condition: sun
            after: sunset
          - condition: time
            before: '23:00:00'
          sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.al_living_room
          - action: light.turn_on
            target:
              entity_id: light.living_room
            data:
              brightness_pct: 3
              rgb_color:
              - 200
              - 220
              - 255
              transition: 5
        - conditions: []
          sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.al_living_room
          - action: light.turn_on
            target:
              entity_id: light.living_room
            data:
              brightness_pct: 10
              rgb_color:
              - 255
              - 20
              - 0
              transition: 5
  mode: restart
