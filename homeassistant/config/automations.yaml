- id: '1776009870388'
  alias: 'Big Bedroom: Disable Presence When TV On'
  description: Disables bedroom presence automation when TV is on, re-enables when
    off or paused
  triggers:
  - trigger: state
    entity_id: media_player.bedroom_tv_2
    to: 'on'
    id: tv_on
  - trigger: state
    entity_id: media_player.bedroom_2_2
    to: playing
    id: tv_on
  - trigger: state
    entity_id: media_player.bedroom_tv_2
    from: 'on'
    id: tv_off
  - trigger: state
    entity_id: media_player.bedroom_2_2
    to:
    - paused
    - idle
    - standby
    - 'off'
    id: tv_off
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: tv_on
      sequence:
      - action: automation.turn_off
        target:
          entity_id: automation.big_bedroom_smart_motion_presence
        data:
          stop_actions: true
    - conditions:
      - condition: trigger
        id: tv_off
      sequence:
      - action: automation.turn_on
        target:
          entity_id: automation.big_bedroom_smart_motion_presence
        data: {}
  mode: single
- id: '1776224561667'
  alias: 'Bedroom 2: Dimmer'
  description: 'Button 1 press: restore AL and mirror presence-sensor lighting (time-of-day
    AL, dimmed/red after 10pm if sleep mode). Button 1 hold: force bright 100% with
    time-based color temp (old Button 1 behavior). Button 2: brightness up (hold to
    repeat). Button 3: brightness down (hold to repeat). Button 4: off and restore
    AL.

    '
  triggers:
  - device_id: c6078582c306e2d78ad6c4e84d2b6e7c
    domain: hue
    type: initial_press
    subtype: 1
    unique_id: office-dimmer-btn1-restore-al
    trigger: device
    id: btn1_press
  - device_id: c6078582c306e2d78ad6c4e84d2b6e7c
    domain: hue
    type: long_release
    subtype: 1
    unique_id: office-dimmer-btn1-bright-100-hold
    trigger: device
    id: btn1_hold
  - device_id: c6078582c306e2d78ad6c4e84d2b6e7c
    domain: hue
    type: initial_press
    subtype: 2
    unique_id: office-dimmer-btn2-bright-up
    trigger: device
    id: btn2_press
  - device_id: c6078582c306e2d78ad6c4e84d2b6e7c
    domain: hue
    type: repeat
    subtype: 2
    unique_id: office-dimmer-btn2-bright-up-hold
    trigger: device
    id: btn2_hold
  - device_id: c6078582c306e2d78ad6c4e84d2b6e7c
    domain: hue
    type: initial_press
    subtype: 3
    unique_id: office-dimmer-btn3-bright-down
    trigger: device
    id: btn3_press
  - device_id: c6078582c306e2d78ad6c4e84d2b6e7c
    domain: hue
    type: repeat
    subtype: 3
    unique_id: office-dimmer-btn3-bright-down-hold
    trigger: device
    id: btn3_hold
  - device_id: c6078582c306e2d78ad6c4e84d2b6e7c
    domain: hue
    type: initial_press
    subtype: 4
    unique_id: office-dimmer-btn4-off
    trigger: device
    id: btn4_press
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: btn1_press
      sequence:
      - alias: Clear manual override - restore normal automatic behavior
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.bedroom2_manual_override
      - alias: Clear manual_control flag so AL can adapt freely
        action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.adaptive_lighting_office
          lights:
          - light.office
          manual_control: false
      - alias: Re-enable AL switches
        action: switch.turn_on
        target:
          entity_id:
          - switch.adaptive_lighting_office
          - switch.adaptive_lighting_adapt_color_office
          - switch.adaptive_lighting_adapt_brightness_office
      - alias: Set sleep mode based on time of day
        if:
        - condition: time
          after: '22:00:00'
          before: 07:00:00
        then:
        - alias: 10pm or later - turn sleep mode on
          action: switch.turn_on
          target:
            entity_id: switch.adaptive_lighting_sleep_mode_office
        else:
        - alias: Day hours - keep sleep mode off
          action: switch.turn_off
          target:
            entity_id: switch.adaptive_lighting_sleep_mode_office
      - alias: Mirror presence-sensor lighting - AL for time of day, sleep mode respected
          after 10pm
        choose:
        - alias: Sleep mode active - gentle red bump only, no bright flash
          conditions:
          - condition: state
            entity_id: switch.adaptive_lighting_sleep_mode_office
            state: 'on'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.ribbon
            data:
              brightness_pct: 8
              rgb_color:
              - 255
              - 62
              - 1
              transition: 2
          - action: light.turn_on
            target:
              entity_id: light.fluttershy
            data:
              brightness_pct: 8
              rgb_color:
              - 255
              - 62
              - 1
              transition: 2
        - conditions:
          - condition: time
            after: '15:30:00'
            before: '19:30:00'
            weekday:
            - mon
            - tue
            - wed
            - thu
            - fri
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.office
            data:
              transition: 2
          - action: adaptive_lighting.apply
            continue_on_error: true
            data:
              entity_id: switch.adaptive_lighting_office
              lights:
              - light.office
              transition: 2
              adapt_color: true
              adapt_brightness: true
          - action: light.turn_on
            target:
              entity_id: light.ribbon
            data:
              effect: Jungle
          - action: light.turn_on
            target:
              entity_id: light.fluttershy
            data:
              effect: Flow
        - conditions:
          - condition: time
            after: 06:30:00
            before: '22:00:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.office
            data:
              transition: 2
          - action: adaptive_lighting.apply
            continue_on_error: true
            data:
              entity_id: switch.adaptive_lighting_office
              lights:
              - light.office
              transition: 2
              adapt_color: true
              adapt_brightness: true
        - conditions: []
          sequence:
          - action: light.turn_off
            target:
              entity_id:
              - light.ribbon
              - light.fluttershy
              - light.office_1
              - light.office_2
            data:
              transition: 2
    - conditions:
      - condition: trigger
        id: btn1_hold
      sequence:
      - alias: Set manual override - bright override
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.bedroom2_manual_override
      - alias: Disable AL and sleep mode so they cannot fight the override
        action: switch.turn_off
        target:
          entity_id:
          - switch.adaptive_lighting_office
          - switch.adaptive_lighting_sleep_mode_office
          - switch.adaptive_lighting_adapt_color_office
          - switch.adaptive_lighting_adapt_brightness_office
      - alias: Mark light as manually controlled so AL won't touch it
        action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.adaptive_lighting_office
          lights:
          - light.office
          manual_control: true
      - alias: Apply current time-of-day color temperature to ceiling
        action: adaptive_lighting.apply
        continue_on_error: true
        data:
          entity_id: switch.adaptive_lighting_office
          lights:
          - light.office
          transition: 2
          adapt_color: true
          adapt_brightness: false
      - alias: Set ceiling lights bright at 100%
        action: light.turn_on
        target:
          entity_id: light.office
        data:
          brightness_pct: 100
          transition: 2
      - alias: Set Nanoleafs to time-based scene at 100%
        choose:
        - conditions:
          - condition: time
            after: 06:30:00
            before: '10:00:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.ribbon
              - light.fluttershy
            data:
              effect: Morning Sky
              brightness_pct: 100
        - conditions:
          - condition: time
            after: '10:00:00'
            before: '12:00:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.ribbon
              - light.fluttershy
            data:
              effect: Cocoa Beach
              brightness_pct: 100
        - conditions:
          - condition: time
            after: '12:00:00'
            before: '15:30:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.ribbon
              - light.fluttershy
            data:
              effect: Lightscape
              brightness_pct: 100
        - conditions:
          - condition: time
            after: '15:30:00'
            before: '19:30:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.ribbon
            data:
              effect: Jungle
              brightness_pct: 100
          - action: light.turn_on
            target:
              entity_id: light.fluttershy
            data:
              effect: Flow
              brightness_pct: 100
        - conditions:
          - condition: time
            after: '19:30:00'
            before: '22:00:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.ribbon
              - light.fluttershy
            data:
              effect: Sundown
              brightness_pct: 100
        default:
        - action: light.turn_on
          target:
            entity_id:
            - light.ribbon
            - light.fluttershy
          data:
            effect: Starlight
            brightness_pct: 100
    - conditions:
      - condition: trigger
        id: btn2_press
      sequence:
      - alias: Set manual override - brightness up
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.bedroom2_manual_override
      - alias: Disable AL and sleep mode so changes stick
        action: switch.turn_off
        target:
          entity_id:
          - switch.adaptive_lighting_office
          - switch.adaptive_lighting_sleep_mode_office
          - switch.adaptive_lighting_adapt_color_office
          - switch.adaptive_lighting_adapt_brightness_office
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.adaptive_lighting_office
          lights:
          - light.office
          manual_control: true
      - action: light.turn_on
        target:
          entity_id:
          - light.office
          - light.ribbon
          - light.fluttershy
        data:
          brightness_step_pct: 15
          transition: 0.2
    - conditions:
      - condition: trigger
        id: btn2_hold
      sequence:
      - alias: Continuous brightness up while holding (bigger steps)
        action: light.turn_on
        target:
          entity_id:
          - light.office
          - light.ribbon
          - light.fluttershy
        data:
          brightness_step_pct: 25
          transition: 0.1
    - conditions:
      - condition: trigger
        id: btn3_press
      sequence:
      - alias: Set manual override - brightness down
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.bedroom2_manual_override
      - alias: Disable AL and sleep mode so changes stick
        action: switch.turn_off
        target:
          entity_id:
          - switch.adaptive_lighting_office
          - switch.adaptive_lighting_sleep_mode_office
          - switch.adaptive_lighting_adapt_color_office
          - switch.adaptive_lighting_adapt_brightness_office
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.adaptive_lighting_office
          lights:
          - light.office
          manual_control: true
      - action: light.turn_on
