- id: '1748800000001'
  alias: '*Big Bedroom: Reset Override When Empty'
  description: After 30 min empty, turns lights off, clears manual override, and re-enables
    motion automation + AL so presence lighting resumes on next entry. Skipped while
    asleep (Hue button 2/3/4) - only Good Morning re-arms the room then.
  triggers:
  - trigger: state
    entity_id: binary_sensor.big_bedroom_sensor_group
    to: 'off'
    for:
      minutes: 30
  conditions:
  - alias: Skip if asleep - goodnight/bedtime pressed, lights stay off until Good
      Morning
    condition: state
    entity_id: input_boolean.big_bedroom_asleep
    state: 'off'
  - condition: or
    conditions:
    - condition: state
      entity_id: input_boolean.big_bedroom_manual_override
      state: 'on'
    - condition: state
      entity_id: automation.big_bedroom_smart_motion_presence
      state: 'off'
  actions:
  - alias: Turn lights off first before re-enabling AL to prevent race condition
    action: light.turn_off
    target:
      entity_id:
      - light.nano_sand_dune
      - light.bedroom_ceiling_1
      - light.bedroom_ceiling_2
      - light.bedroom_lamp_1
      - light.bedroom_lamp_2
    data:
      transition: 15
  - alias: Wait for transition to complete before re-enabling AL
    delay:
      seconds: 16
  - alias: Clear manual override boolean
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.big_bedroom_manual_override
  - alias: Re-enable motion automation
    action: automation.turn_on
    target:
      entity_id: automation.big_bedroom_smart_motion_presence
  - alias: Re-enable AL switches
    action: switch.turn_on
    target:
      entity_id:
      - switch.al_big_bedroom
      - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_color_big_bedroom_al
      - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_brightness_big_bedroom_al
  - alias: Clear manual control on bedroom lights
    action: adaptive_lighting.set_manual_control
    data:
