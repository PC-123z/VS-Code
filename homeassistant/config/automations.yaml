- id: '1777251099134'
  alias: 'Living Room: TV Mode (Unified)'
  description: TV state drives living room lighting with time-of-day palette. Playing
    = deep dim scaled to daylight. Paused/Off = restore AL and presence. Dining room
    dims during playback if occupied. Galaxy projector off during playback, on when
    paused/off.
  triggers:
  - trigger: state
    entity_id:
    - media_player.appletv_14
    to:
    - playing
    id: playing
  - trigger: state
    entity_id:
    - media_player.appletv_14
    to:
    - paused
    - idle
    id: paused
  - trigger: state
    entity_id:
    - media_player.appletv_14
    to:
    - 'off'
    id: tv_off
  - trigger: state
    entity_id:
    - media_player.appletv_5
    to:
    - playing
    id: playing
  - trigger: state
    entity_id:
    - media_player.appletv_5
    to:
    - paused
    - idle
    id: paused
  - trigger: state
    entity_id:
    - media_player.appletv_5
    to:
    - 'off'
    id: tv_off
  - trigger: state
    entity_id:
    - media_player.appletv_6
    to:
    - playing
    id: playing
  - trigger: state
    entity_id:
    - media_player.appletv_6
    to:
    - paused
    - idle
    id: paused
  - trigger: state
    entity_id:
    - media_player.appletv_6
    to:
    - 'off'
    id: tv_off
  - trigger: state
    entity_id:
    - media_player.living_room_tv
    to:
    - playing
    id: playing
  - trigger: state
    entity_id:
    - media_player.living_room_tv
    to:
    - paused
    - idle
    id: paused
    enabled: false
  - trigger: state
    entity_id:
    - media_player.living_room_tv
    to:
    - 'off'
    id: tv_off
  - trigger: state
    entity_id:
    - media_player.living_room_tv_3
    to:
    - playing
    id: playing
  - trigger: state
    entity_id:
    - media_player.living_room_tv_3
    to:
    - paused
    - idle
    id: paused
    enabled: false
  - trigger: state
    entity_id:
    - media_player.living_room_tv_3
    to:
    - 'off'
    id: tv_off
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: playing
      - condition: state
        entity_id: light.living_room
        state: 'on'
      sequence:
      - action: automation.turn_off
        target:
          entity_id: automation.living_room_smart_motion_presence
      - action: switch.turn_off
        target:
          entity_id: switch.al_living_room
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.al_living_room
          lights:
          - light.living_room
          manual_control: true
      - action: light.turn_on
        target:
          entity_id: light.living_room
        data:
          brightness_pct: '{{ playing_brightness | int }}'
          color_temp_kelvin: '{{ tv_kelvin | int }}'
          transition: 3
      - action: light.turn_off
        target:
          entity_id: light.kitchen_main_lights
      - action: light.turn_off
        target:
          entity_id: light.galaxy_projector
      - condition: state
        entity_id: binary_sensor.dining_room_sensor_group
        state: 'on'
      - action: light.turn_on
        metadata: {}
        target:
          label_id: dining_room_top
        data:
          brightness_pct: 2
      - action: light.turn_on
        metadata: {}
        target:
          label_id: dining_room_bottom
        data:
          brightness_pct: 2
      - type: turn_off
        device_id: a239769fc8575407917d2a4a56682e94
        entity_id: d265a36c8203e2b0bc3ea9ae06afdf73
        domain: light
    - conditions:
      - condition: trigger
        id: paused
      sequence:
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.al_living_room
          lights:
          - light.living_room
          manual_control: false
      - action: switch.turn_on
        target:
          entity_id: switch.al_living_room
      - action: automation.turn_on
        target:
          entity_id: automation.living_room_smart_motion_presence
      - action: adaptive_lighting.apply
        continue_on_error: true
        data:
          entity_id: switch.al_living_room
          lights:
          - light.living_room
          transition: 3
          adapt_color: true
          adapt_brightness: true
          prefer_rgb_color: true
      - action: light.turn_on
        target:
          entity_id: light.galaxy_projector
    - conditions:
      - condition: trigger
        id: tv_off
      sequence:
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.al_living_room
          lights:
          - light.living_room
          manual_control: false
      - action: switch.turn_on
        target:
          entity_id: switch.al_living_room
      - action: automation.turn_on
        target:
          entity_id: automation.living_room_smart_motion_presence
      - alias: Only restore lights if someone is actually in the room
        if:
        - condition: state
          entity_id: binary_sensor.living_room_sensor_group
          state: 'on'
        then:
        - action: adaptive_lighting.apply
          continue_on_error: true
          data:
            entity_id: switch.al_living_room
            lights:
            - light.living_room
            transition: 3
            adapt_color: true
            adapt_brightness: true
            prefer_rgb_color: true
        - action: light.turn_on
          target:
            entity_id: light.galaxy_projector
        else:
        - action: light.turn_off
          target:
            entity_id:
            - light.living_room
            - light.galaxy_projector
          data:
            transition: 3
  variables:
    sun_elev: '{{ state_attr(''sun.sun'', ''elevation'') | float(0) }}'
    tv_kelvin: '{% if sun_elev > 10 %}4000 {% elif sun_elev > -6 %}2700 {% else %}2200
      {% endif %}'
    playing_brightness: '{% if sun_elev > 10 %}15 {% elif sun_elev > -6 %}5 {% else
      %}2 {% endif %}'
  mode: restart
- id: '1777317910121'
