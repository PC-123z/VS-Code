            before: '10:00:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.ribbon
              - light.fluttershy
            data:
              effect: Morning Sky
              brightness_pct: 100
        - conditions:
          - condition: time
            after: '10:00:00'
            before: '12:00:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.ribbon
              - light.fluttershy
            data:
              effect: Cocoa Beach
              brightness_pct: 100
        - conditions:
          - condition: time
            after: '12:00:00'
            before: '15:30:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.ribbon
              - light.fluttershy
            data:
              effect: Lightscape
              brightness_pct: 100
        - conditions:
          - condition: time
            after: '15:30:00'
            before: '19:30:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.ribbon
            data:
              effect: Jungle
              brightness_pct: 100
          - action: light.turn_on
            target:
              entity_id: light.fluttershy
            data:
              effect: Flow
              brightness_pct: 100
        - conditions:
          - condition: time
            after: '19:30:00'
            before: '22:00:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.ribbon
              - light.fluttershy
            data:
              effect: Sundown
              brightness_pct: 100
