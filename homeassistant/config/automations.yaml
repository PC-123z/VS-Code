    entity_id: switch.al_sleep_mode_living_room
    to: 'on'
    id: sleep_on
  - device_id: 046bda673f9c3613042de9612024694e
    domain: hue
    type: initial_press
    subtype: 1
    unique_id: main_room_button_1
    trigger: device
    id: detected
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sleep_on
      sequence:
      - condition: state
        entity_id: binary_sensor.living_room_sensor_presence
        state: 'on'
      - action: switch.turn_off
        target:
          entity_id: switch.al_living_room
      - action: light.turn_on
        target:
          entity_id: light.living_room
        data:
          brightness_pct: 10
          rgb_color:
          - 255
          - 20
          - 0
          transition: 30
    - conditions:
      - condition: trigger
        id: cleared
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.living_room
        data:
          transition: 15
      - action: light.turn_off
        target:
          entity_id: light.galaxy_projector
      - action: switch.turn_off
        target:
          entity_id: switch.al_living_room
