  - alias: iOS Shortcut geofence-exit failsafe (beacon backup)
    trigger: webhook
    webhook_id: paul_left_home
    allowed_methods:
    - POST
    local_only: false
    id: webhook
  conditions:
  - alias: Don't run if Departure - Monitor Garage and Arm Based on Occupancy is active
    condition: state
    entity_id: automation.departure_open_garage_on_cable_disconnect
    state:
    - 'off'
    enabled: false
  actions:
  - alias: Confirm departure (skip wait when geofence webhook already confirmed Paul
      left)
    if:
    - condition: template
      value_template: '{{ trigger.id != ''webhook'' }}'
    then:
    - alias: Wait for Paul or car to be detected away
      wait_for_trigger:
      - trigger: state
        entity_id: person.paul
        to: not_home
      - trigger: state
        entity_id: device_tracker.bcpro_204982_08b8
        to:
        - not_home
        - unavailable
      timeout:
        hours: 0
        minutes: 15
        seconds: 0
        milliseconds: 0
      continue_on_timeout: false
  - alias: Wait for motion to clear or timeout after 5 minutes
    wait_template: '{{ is_state(''binary_sensor.goodbye_motion_sensors'', ''off'')
      }}'
    timeout:
      minutes: 5
    continue_on_timeout: true
  - alias: Check if motion was detected (someone home)
    if:
    - condition: state
      entity_id: binary_sensor.goodbye_motion_sensors
      state: 'on'
    then:
    - alias: Someone is home - alert and set alarm to home
      sequence:
      - action: notify.mobile_app_pc_iphone
        data:
          title: Motion Detected
          message: Motion detected after garage closed. Setting alarm to home mode.
      - action: alarm_control_panel.alarm_arm_home
        target:
          entity_id: alarm_control_panel.3302_alarm
        data:
          code: ''
    else:
    - alias: No motion - house is empty, run goodbye routine
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.goodbye_routine_main
  mode: restart
- id: '1777484175032'
  alias: Arrival (Welcome Home) - Disarm Alarm on Garage Cycle + Arrival Latch
  description: Two-factor disarm, order-independent. Needs BOTH the garage opening
    AND an arrival signal (BT beacon, iOS Shortcut webhook, or phone geofence - all
    three set input_boolean.arrival_recent via the companion "Arrival Latch - Set
    on Phone/Beacon Arrival" automation) while armed - whichever happens first just
    latches its own flag (input_boolean.garage_open_recent or input_boolean.arrival_recent)
    and stops; whichever happens second finds the other flag already on and disarms
    and runs welcome home. Fixed 2026-07-22 - previously only triggered on garage-open
    and required the arrival latch to already be set, so a garage-open that beat the
    beacon update by a few seconds silently did nothing. Triggers on arrival_recent
    turning on (rather than duplicating the beacon/webhook triggers here) so all three
    arrival signals work as a fallback for each other, regardless of ordering with
    the garage - webhook isn't wired in directly because HA only allows one automation
    to register a given webhook_id, and the latch automation already owns paul_arrived_home.
  triggers:
  - id: garage
    trigger: state
    entity_id: cover.garage
    to: open
    enabled: true
  - id: arrival
    trigger: state
    entity_id: input_boolean.arrival_recent
    to: 'on'
  conditions:
  - alias: Alarm must be armed (confirms we departed, not just opening garage at home)
    condition: or
    conditions:
    - condition: state
      entity_id: alarm_control_panel.3302_alarm
      state: armed_away
    - condition: state
      entity_id: alarm_control_panel.3302_alarm
      state: armed_home
  actions:
  - alias: Latch this signal; only fall through to disarm if the OTHER signal already
      fired
    choose:
    - alias: Garage opened - if no arrival signal has confirmed yet, latch and wait
      conditions:
      - condition: template
        value_template: '{{ trigger.id == "garage" and is_state("input_boolean.arrival_recent",
          "off") }}'
      sequence:
      - alias: Set the garage-open latch
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.garage_open_recent
      - stop: Waiting for an arrival signal (beacon/phone/webhook) to confirm before
          disarming
    - alias: Arrival signal fired - if garage hasn't opened yet, wait
      conditions:
      - condition: template
        value_template: '{{ trigger.id == "arrival" and is_state("input_boolean.garage_open_recent",
          "off") }}'
      sequence:
      - stop: Waiting for garage to open to confirm before disarming
  - alias: Disarm the security panel
    action: alarm_control_panel.alarm_disarm
    target:
      entity_id: alarm_control_panel.3302_alarm
    data:
      code: ''
  - alias: Ungroup bedroom from kitchen
    continue_on_error: true
    action: media_player.unjoin
    target:
