      - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_brightness_big_bedroom_al
  - action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.al_big_bedroom
      lights:
      - light.bedroom_ceiling_1
      - light.bedroom_ceiling_2
      - light.bedroom_lamp_1
      - light.bedroom_lamp_2
      manual_control: true
  - alias: Set deep warm red at 40%
    action: light.turn_on
    target:
      entity_id: light.bedroom
    data:
      rgb_color:
      - 255
      - 30
      - 0
      brightness_pct: 40
      transition: 1
  - alias: Nanoleaf to deep red 2%
    action: light.turn_on
    target:
      entity_id: light.nano_sand_dune
    data:
      rgb_color:
      - 255
      - 30
      - 0
      brightness_pct: 2
      transition: 1
  - alias: Fade to 4% over 30 seconds
    action: light.turn_on
    target:
      entity_id: light.bedroom
    data:
      brightness_pct: 4
      transition: 30
  - alias: Turn off bedroom TV
    action: media_player.turn_off
    target:
      entity_id: media_player.bedroom_tv_2
  - alias: Set alarm to Home/Stay
    action: alarm_control_panel.alarm_arm_home
    target:
      entity_id: alarm_control_panel.3302_alarm
  - alias: Set bedroom fan to 25%
    action: fan.turn_on
    target:
      entity_id: fan.big_bedroom_fan
    data:
      percentage: 50
  - alias: Turn on purifier at 25%
    action: fan.turn_on
    target:
      entity_id: fan.bedroom_purifier
    data:
      percentage: 25
  - alias: Turn on air circulator at 25%
    action: fan.turn_on
    target:
      entity_id: fan.air_circulator
    data:
      percentage: 25
  - alias: Set Sonos volume to 15%
    action: media_player.volume_set
    target:
      entity_id: media_player.bedroom_2
    data:
      volume_level: 0.15
  - alias: Play Max Richter Sleep via Music Assistant
    continue_on_error: true
    action: music_assistant.play_media
    target:
      entity_id: media_player.bedroom_2
    data:
      media_id: spotify:album:0JLN7JryQ2T7lBEYIrSQF1
      radio_mode: false
  - alias: Run light stepdown, fan boost, audio stop and Nanoleaf off in parallel
    parallel:
    - sequence:
      - alias: Wait 30 seconds at 4% before stepping down
        delay:
          seconds: 30
      - alias: Step lights down 1% every 15 seconds
        repeat:
          count: 4
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.bedroom
            data:
              brightness_pct: '{{ [4 - repeat.index, 0] | max }}'
              transition: 1
          - delay:
              seconds: 15
      - alias: Turn off bedroom lights
        action: light.turn_off
        target:
          entity_id: light.bedroom
        data:
          transition: 1
    - sequence:
      - alias: Wait 15 minutes then turn off Nanoleaf
        delay:
          minutes: 15
      - action: light.turn_off
        target:
          entity_id: light.nano_sand_dune
        data:
          transition: 30
    - sequence:
      - alias: Wait 60 seconds then boost fans
        delay:
          seconds: 60
      - alias: Increase purifier to 50%
        action: fan.turn_on
        target:
          entity_id: fan.bedroom_purifier
        data:
          percentage: 50
      - alias: Increase air circulator to 50%
        action: fan.turn_on
        target:
          entity_id: fan.air_circulator
        data:
          percentage: 50
    - sequence:
      - alias: Wait 30 minutes then stop audio
        delay:
          minutes: 30
      - alias: Stop bedroom audio
        action: media_player.media_stop
        target:
          entity_id: media_player.bedroom_2
  mode: restart
