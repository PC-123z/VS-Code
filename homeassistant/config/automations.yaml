          seconds: 5
      until:
      - condition: or
        conditions:
        - condition: template
          value_template: '{{ repeat.index >= 3 }}'
        - condition: not
          conditions:
          - condition: state
            entity_id: media_player.bedroom_2
            state: playing
  - alias: Set bedroom fan to 25%
    action: fan.turn_on
    data:
      percentage: 25
    target:
      entity_id: fan.big_bedroom_fan
    enabled: true
  - alias: Set purifier to 50%
    action: fan.turn_on
    target:
      device_id: c2504c8438baeadcf59cca47e71a14b4
    data:
      percentage: 50
  - alias: Set air circulator to 50%
    action: fan.turn_on
    target:
      device_id: ca438fb682d663761f41ccdd014ee6b0
    data:
      percentage: 50
  - alias: Nanoleaf to deep red 2%
    action: light.turn_on
    target:
      entity_id: light.nano_sand_dune
    data:
      rgb_color:
      - 255
      - 30
      - 0
      brightness_pct: 2
      transition: 1
    enabled: true
  - alias: Fade all Hue lights off over 5 seconds
    action: light.turn_off
    target:
      entity_id: light.bedroom
      area_id: bathroom
    data:
      transition: 5
  - alias: Turn off Nanoleaf (retry - it frequently drops offline and misses commands)
    repeat:
      count: 3
      sequence:
      - continue_on_error: true
        action: light.turn_off
        target:
          entity_id: light.nano_sand_dune
        data:
          transition: 5
      - delay:
          seconds: 5
  - alias: Turn off Nanoleaf after 15 minutes
    delay:
      minutes: 15
    enabled: true
  mode: single
- id: '1776378416550'
  alias: '*Bedroom 2 Bedtime Routine'
  description: Triggers on motion or bedroom2_occupied turning on any time from 10:00pm
    to 6am (no more hard 10:45pm cutoff on the initial trigger - a late bedtime no
    longer skips the whole routine). Sets bedroom2_occupied, starts fan (stays on
    until Good Morning turns it off) and sleep music (volume fades to silence over
    5 minutes starting at 11:00pm, hard stop at 11:05pm). Lights to burnt orange at
    setup (whenever bedtime starts, or by 10:00pm at the latest as a catch-up), fully
    off at 10:30pm. All lights fade off at 10:45pm and the room stays dark from then
    on - see *Bedroom 2 Late Night Lights Out.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.bedroom2_sensor_apollo_radar_moving_target
    to: 'on'
    id: motion_detected
  - trigger: state
    entity_id:
    - binary_sensor.bedroom2_sensor_apollo_radar_moving_target
    to: 'off'
    for:
      minutes: 2
    id: motion_cleared
  - trigger: state
    entity_id: input_boolean.bedroom2_occupied
    to: 'on'
    id: occupied_set
  - trigger: time
    at: '22:00:00'
    id: window_open_catchup
  - trigger: time
    at: '22:30:00'
    id: lights_out
  - trigger: time
    at: '22:45:00'
    id: hard_lights_out
  - alias: Begin the sleep-music volume fade at 11:00pm
    trigger: time
    at: '23:00:00'
    id: music_fade
  - trigger: time
    at: '23:05:00'
    id: music_stop
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: window_open_catchup
      - alias: Someone is in the room as the window opens - either occupied was latched
          on before 10pm (occupied_set never fired inside the window), or the sensors
          show presence right now but never produced a fresh off->on edge to latch
          it (e.g. already lying still in bed since before 10pm)
        condition: or
        conditions:
        - condition: state
          entity_id: input_boolean.bedroom2_occupied
          state: 'on'
        - condition: state
          entity_id: binary_sensor.bedroom_2_sensor_group
          state: 'on'
      sequence:
      - alias: Skip if dimmer override is active
        if:
        - condition: state
          entity_id: input_boolean.bedroom2_manual_override
          state: 'off'
        then:
        - alias: Nanoleafs and office to burnt orange at 10%
          action: light.turn_on
          target:
            entity_id:
            - light.ribbon
            - light.fluttershy
            - light.office
          data:
            rgb_color:
            - 191
            - 87
            - 0
            brightness_pct: 10
            transition: 3
      - alias: Presence without a latch - set occupied and let the occupied_set branch
          run fan and music, so they can't both start it
        if:
        - condition: state
          entity_id: input_boolean.bedroom2_occupied
          state: 'off'
        then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.bedroom2_occupied
        - stop: Occupied set - occupied_set branch handles fan and music
      - alias: Fan on - stays on until Good Morning routine turns it off
        action: fan.turn_on
        data:
          percentage: 25
        target:
          entity_id: fan.bedroom2_fan
        enabled: true
      - alias: Unjoin office_2 from any Music Assistant group before playing sleep
          music - otherwise it plays to whatever it's currently grouped with (e.g.
          the kitchen)
        action: media_player.unjoin
        continue_on_error: true
        target:
          entity_id: media_player.office_2
      - alias: Wait for the unjoin to actually take effect before playing - otherwise
          the play command can still land in the not-yet-split group (e.g. the kitchen)
        wait_template: '{{ (state_attr(''media_player.office_2'', ''group_members'')
          | default([]) | length) <= 1 }}'
        timeout:
          seconds: 5
        continue_on_timeout: true
      - alias: Play sleep music regardless of dimmer override - a button press to
          adjust lights shouldn't silently skip the music too
        action: media_player.volume_set
        target:
          entity_id: media_player.office_2
        data:
          volume_level: 0.15
      - alias: Play sleep music via Music Assistant (with retry)
        repeat:
          sequence:
          - continue_on_error: true
            action: music_assistant.play_media
            target:
              entity_id: media_player.office_2
            data:
              media_id: ytmusic://album/MPREb_A9AHzoUYd7b
              radio_mode: false
          - continue_on_error: true
            action: media_player.shuffle_set
            target:
              entity_id: media_player.office_2
            data:
              shuffle: true
          - alias: Give playback a few seconds to start
            wait_template: '{{ is_state(''media_player.office_2'', ''playing'') }}'
            timeout:
              seconds: 8
            continue_on_timeout: true
          until:
          - alias: Exit the loop once it is playing, or after two attempts. Must be
              an until condition, not a stop action - stop would end the whole automation
              run and skip every step after this repeat.
            condition: or
            conditions:
            - condition: state
              entity_id: media_player.office_2
              state: playing
            - condition: template
              value_template: '{{ repeat.index >= 2 }}'
      - alias: Notify if sleep music still isn't playing after retry
        if:
        - condition: not
          conditions:
          - condition: state
            entity_id: media_player.office_2
            state: playing
        then:
        - action: notify.mobile_app_pc_iphone
          data:
            title: Bedroom 2 sleep music didn't start
            message: Office/Bedroom 2 speaker didn't start playing after two tries
              - speaker may be offline.
    - conditions:
      - condition: trigger
        id: occupied_set
      - alias: Bedtime Routine active window - 10:00pm to 6am
        condition: time
        after: '22:00:00'
        before: 06:00:00
      sequence:
      - alias: Fan on - stays on until Good Morning routine turns it off
        action: fan.turn_on
        data:
          percentage: 25
        target:
          entity_id: fan.bedroom2_fan
        enabled: false
      - alias: Unjoin office_2 from any Music Assistant group before playing sleep
          music - otherwise it plays to whatever it's currently grouped with (e.g.
          the kitchen)
        action: media_player.unjoin
        continue_on_error: true
        target:
          entity_id: media_player.office_2
      - alias: Wait for the unjoin to actually take effect before playing - otherwise
          the play command can still land in the not-yet-split group (e.g. the kitchen)
        wait_template: '{{ (state_attr(''media_player.office_2'', ''group_members'')
          | default([]) | length) <= 1 }}'
        timeout:
          seconds: 5
        continue_on_timeout: true
      - alias: Play sleep music regardless of dimmer override - a button press to
          adjust lights shouldn't silently skip the music too
        action: media_player.volume_set
        target:
          entity_id: media_player.office_2
        data:
          volume_level: 0.15
      - alias: Play sleep music via Music Assistant (with retry)
        repeat:
          sequence:
          - continue_on_error: true
            action: music_assistant.play_media
            target:
              entity_id: media_player.office_2
            data:
              media_id: ytmusic://album/MPREb_A9AHzoUYd7b
              radio_mode: false
          - continue_on_error: true
            action: media_player.shuffle_set
            target:
              entity_id: media_player.office_2
            data:
              shuffle: true
          - alias: Give playback a few seconds to start
            wait_template: '{{ is_state(''media_player.office_2'', ''playing'') }}'
            timeout:
              seconds: 8
            continue_on_timeout: true
          until:
          - alias: Exit the loop once it is playing, or after two attempts. Must be
              an until condition, not a stop action - stop would end the whole automation
              run and skip every step after this repeat.
            condition: or
            conditions:
            - condition: state
              entity_id: media_player.office_2
              state: playing
            - condition: template
              value_template: '{{ repeat.index >= 2 }}'
      - alias: Notify if sleep music still isn't playing after retry
        if:
        - condition: not
          conditions:
          - condition: state
            entity_id: media_player.office_2
            state: playing
        then:
        - action: notify.mobile_app_pc_iphone
          data:
            title: Bedroom 2 sleep music didn't start
            message: Office/Bedroom 2 speaker didn't start playing after two tries
              - speaker may be offline.
    - conditions:
      - condition: trigger
        id: motion_detected
      - alias: Only run full setup once - skip if already occupied
        condition: state
        entity_id: input_boolean.bedroom2_occupied
        state: 'off'
      - alias: Bedtime Routine active window - 10:00pm to 6am
        condition: time
        after: '22:00:00'
        before: 06:00:00
      sequence:
      - alias: Set bedroom 2 occupied (fan and music start via occupied_set branch)
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.bedroom2_occupied
      - alias: Skip light changes if dimmer override is active
        if:
        - condition: state
          entity_id: input_boolean.bedroom2_manual_override
          state: 'off'
        then:
        - alias: Nanoleafs and office to burnt orange at 10%
          action: light.turn_on
          target:
            entity_id:
            - light.ribbon
            - light.fluttershy
            - light.office
          data:
            rgb_color:
            - 191
            - 87
            - 0
            brightness_pct: 10
            transition: 3
    - conditions:
      - condition: trigger
        id: motion_cleared
      - condition: state
        entity_id: input_boolean.bedroom2_occupied
        state: 'on'
      - alias: Dim-down window - 10:00pm to 10:45pm only. From hard lights out at
          10:45pm the room stays dark until the Good Morning Routine restores the
          lights, so a motion-clear can no longer relight the room.
        condition: time
        after: '22:00:00'
        before: '22:45:00'
      - alias: Skip if dimmer override is active
        condition: state
        entity_id: input_boolean.bedroom2_manual_override
        state: 'off'
      sequence:
      - alias: Nanoleafs and office back to dim orange
        action: light.turn_on
        target:
          entity_id:
          - light.ribbon
          - light.fluttershy
          - light.office
        data:
          rgb_color:
          - 191
          - 87
          - 0
          brightness_pct: 3
          transition: 30
    - conditions:
      - condition: trigger
        id: lights_out
      - condition: state
        entity_id: input_boolean.bedroom2_occupied
        state: 'on'
      - alias: Skip if dimmer override is active
        condition: state
        entity_id: input_boolean.bedroom2_manual_override
        state: 'off'
      sequence:
      - alias: Slow fade all lights off over 2 minutes
        action: light.turn_off
        target:
          entity_id:
          - light.ribbon
          - light.fluttershy
          - light.office
        data:
          transition: 120
    - conditions:
      - condition: trigger
        id: hard_lights_out
      sequence:
      - alias: All lights fade off at 10:45pm regardless of occupied or override state
        action: light.turn_off
        target:
          entity_id:
          - light.ribbon
          - light.fluttershy
          - light.office
          - light.bedroom_2
        data:
          transition: 60
      - delay:
          minutes: 5
      - alias: Cut power to the Nanoleaf P115 outlets so a WiFi-reconnect glitch can't
          bring Ribbon/Fluttershy back on overnight - restored by Good Morning Routine
        action: switch.turn_off
        target:
          entity_id:
          - switch.bedroom2_office_nano1
          - switch.nano2
    - conditions:
      - condition: trigger
        id: music_fade
      - alias: Only fade if something is actually playing
        condition: state
        entity_id: media_player.office_2
        state: playing
      sequence:
      - alias: Capture whatever volume it is playing at now, so the fade still works
          if the volume was changed by hand during the night
        variables:
          start_volume: '{{ state_attr(''media_player.office_2'', ''volume_level'')
            | float(0.15) }}'
      - alias: Fade to silence over 5 minutes in 20 steps, landing at 0 just as the
          11:05pm hard stop fires
        repeat:
          count: 20
          sequence:
          - action: media_player.volume_set
            continue_on_error: true
            target:
              entity_id: media_player.office_2
            data:
              volume_level: '{{ [start_volume * (1 - repeat.index / 20), 0] | max
                | round(3) }}'
          - delay:
              seconds: 15
    - conditions:
      - condition: trigger
        id: music_stop
      sequence:
      - alias: Hard music stop at 11:05pm regardless of occupied or override state
        action: media_player.media_stop
        continue_on_error: true
        target:
          entity_id: media_player.office_2
      - alias: Restore the normal sleep-music volume so the fade's silence doesn't
          carry over to the next thing played on this speaker
        action: media_player.volume_set
        continue_on_error: true
        target:
          entity_id: media_player.office_2
        data:
          volume_level: 0.15
  mode: parallel
  max: 3
- id: '1776378473889'
  alias: '*Bedroom 2 Good Morning Routine'
  description: Triggers at 6:50am only if bedroom2_occupied is on. Pre-staged lights
    to prevent flash. Staged ramp, wake album, TTS on motion, fans off. Music until
    presence clears or 7:30am.
  triggers:
  - trigger: time
    at: 06:30:00
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  - trigger: time
    at: '10:30:00'
    weekday:
    - sun
    - sat
  conditions:
  - condition: state
    entity_id: input_boolean.bedroom2_occupied
    state: 'on'
  actions:
  - alias: Power the Nanoleaf P115 outlets back on first so the panels have time to
      reboot/rejoin WiFi before being commanded (see Bedtime Routine's hard_lights_out
      for where they get cut)
    action: switch.turn_on
    target:
      entity_id:
      - switch.bedroom2_office_nano1
      - switch.nano2
  - delay:
      seconds: 5
  - alias: Clear manual override so motion automation can take over after wake-up
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.bedroom2_manual_override
  - alias: Turn off AL sleep mode and office AL
    action: switch.turn_off
    target:
      entity_id:
      - switch.adaptive_lighting_sleep_mode_office
      - switch.adaptive_lighting_office
  - alias: Pre-stage Nanoleafs with Morning Sky at 1%
    action: light.turn_on
    target:
      entity_id:
      - light.ribbon
      - light.fluttershy
    data:
      effect: Morning Sky
      brightness_pct: 1
      transition: 1
  - delay:
      seconds: 2
  - alias: Pre-stage office Hue at 1% warm white
    action: light.turn_on
    target:
      entity_id:
      - light.office_2
      - light.office_1
    data:
      brightness_pct: 1
      color_temp_kelvin: 2700
      transition: 2
  - delay:
      seconds: 3
  - alias: Run all sunrise stages in parallel
    parallel:
    - sequence:
      - alias: Ribbon and Fluttershy ramp brightness to 80% over 3 minutes
        repeat:
          count: 18
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.ribbon
              - light.fluttershy
            data:
              brightness_pct: '{{ [1 + (repeat.index * 4.4), 80] | min | round(0)
                }}'
              transition: 3
          - delay:
              seconds: 10
    - sequence:
      - alias: Wait 30 seconds then bring in office light
        delay:
          seconds: 30
      - alias: Office light ramps to 100% over ~2:30
        repeat:
          count: 15
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.office
            data:
              brightness_pct: '{{ [1 + (repeat.index * 6.6), 100] | min | round(0)
                }}'
              color_temp_kelvin: 2700
              transition: 3
          - delay:
              seconds: 10
    - sequence:
      - action: fan.turn_off
        target:
          entity_id: fan.bedroom2_fan
        data: {}
    - sequence:
      - delay:
          seconds: 30
      - alias: Unjoin office_2 from any Music Assistant group before playing wake
          music - otherwise it plays to whatever it's currently grouped with (e.g.
          the kitchen)
        action: media_player.unjoin
        continue_on_error: true
        target:
          entity_id: media_player.office_2
      - alias: Wait for the unjoin to actually take effect before playing - otherwise
          the play command can still land in the not-yet-split group (e.g. the kitchen)
        wait_template: '{{ (state_attr(''media_player.office_2'', ''group_members'')
          | default([]) | length) <= 1 }}'
        timeout:
          seconds: 5
        continue_on_timeout: true
      - action: media_player.volume_set
        target:
          entity_id: media_player.office_2
        data:
          volume_level: 0.1
      - alias: Play wake album via Music Assistant
        continue_on_error: true
        action: music_assistant.play_media
        target:
          entity_id: media_player.office_2
        data:
          media_id: ytmusic://album/MPREb_eRqlXW8MAYH
          media_type: album
      - delay:
          seconds: 15
      - alias: Get today's daily forecast (high/low/expected condition) for the announcements
        continue_on_error: true
        action: weather.get_forecasts
        target:
          entity_id: weather.forecast_home
        data:
          type: daily
        response_variable: today_fc
      - if:
        - condition: or
          conditions:
          - condition: state
            entity_id: media_player.office_2
            state: idle
          - condition: state
            entity_id: media_player.office_2
            state: 'off'
        then:
        - alias: Wait for moving target before announcement (music failed path)
          wait_for_trigger:
          - trigger: state
            entity_id: binary_sensor.bedroom2_sensor_apollo_radar_moving_target
            to: 'on'
          timeout:
            minutes: 45
        - if:
          - condition: template
            value_template: '{{ wait.completed == false }}'
          then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.bedroom2_occupied
          - stop: Motion wait timed out - routine complete
        - alias: Set volume for first announcement
          action: media_player.volume_set
          target:
            entity_id: media_player.office_2
          data:
            volume_level: 0.2
        - alias: TTS announcement (music failed)
          action: tts.speak
          target:
            entity_id: tts.piper
          data:
            cache: false
            media_player_entity_id: media_player.office_2
            message: '{% set fc = today_fc[''weather.forecast_home''][''forecast'']
              if (today_fc is defined and today_fc and ''weather.forecast_home'' in
              today_fc) else [] %} {% set f = fc[0] if fc else none %} Good morning
              Lily & Caylee! Today is {{ now().strftime(''%A, %B %-d'') }} and its
              going to be a great day! The time is {{ now().strftime(''%-I:%M %p'')
              }}. The current conditions are {{ states(''weather.forecast_home'')
              | replace(''-'', '' '') }}, with a temperature of {{ (state_attr(''weather.forecast_home'',
              ''temperature'') | float(0)) | round | int }} degrees. {% if f %}Today
              will be {{ f.condition | replace(''-'', '' '') }}, with a high of {{
              (f.temperature | float(0)) | round | int }} and a low of {{ (f.templow
              | float(0)) | round | int }} degrees.{% endif %} Let''s go!!!!!'
        - delay:
            seconds: 12
        - alias: Bump volume for second announcement
          action: media_player.volume_set
          target:
            entity_id: media_player.office_2
          data:
            volume_level: 0.25
        - alias: TTS second announcement (music failed)
          action: tts.speak
          target:
            entity_id: tts.piper
          data:
            cache: false
            media_player_entity_id: media_player.office_2
            message: '{% set fc = today_fc[''weather.forecast_home''][''forecast'']
              if (today_fc is defined and today_fc and ''weather.forecast_home'' in
              today_fc) else [] %} {% set f = fc[0] if fc else none %} In case you
              missed it the first time, it seems you are really awake now. Good morning
              Lily & Caylee! Today is {{ now().strftime(''%A, %B %-d'') }} and its
              going to be a great day! The time is {{ now().strftime(''%-I:%M %p'')
              }}. The current conditions are {{ states(''weather.forecast_home'')
              | replace(''-'', '' '') }}, with a temperature of {{ (state_attr(''weather.forecast_home'',
              ''temperature'') | float(0)) | round | int }} degrees. {% if f %}Today
              will be {{ f.condition | replace(''-'', '' '') }}, with a high of {{
              (f.temperature | float(0)) | round | int }} and a low of {{ (f.templow
              | float(0)) | round | int }} degrees.{% endif %} Let''s go!!!!!'
        else:
        - alias: Ramp volume to 0.5
          repeat:
            count: 8
            sequence:
            - delay:
                seconds: 18
            - action: media_player.volume_set
              target:
                entity_id: media_player.office_2
              data:
                volume_level: '{{ [0.05 + (repeat.index * 0.05625), 0.5] | min | round(3)
                  }}'
        - alias: Wait for moving target before announcement
          wait_for_trigger:
          - trigger: state
            entity_id: binary_sensor.bedroom2_sensor_apollo_radar_moving_target
            to: 'on'
          timeout:
            minutes: 45
        - if:
          - condition: template
            value_template: '{{ wait.completed == false }}'
          then:
          - action: media_player.media_stop
            target:
              entity_id: media_player.office_2
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.bedroom2_occupied
          - stop: Motion wait timed out - routine complete
        - alias: No track-boundary wait before the first announcement - it is spoken
            straight away on motion so it lands mid-song and is simply ducked over.
            Waiting for a boundary instead ducked the incoming song at position zero
            and replayed its opening seconds, which sounded like the track restarting.
            The one exception is handled here - if the current song is nearly over
            the announcement would collide with the track change, so in that case
            wait for the next song first. The SECOND announcement further down still
            waits for a boundary.
          if:
          - condition: template
            value_template: '{% set p = state_attr(''media_player.office_2'', ''media_position'')
              | float(0) %} {% set u = state_attr(''media_player.office_2'', ''media_position_updated_at'')
              %} {% set d = state_attr(''media_player.office_2'', ''media_duration'')
              | float(0) %} {% set el = p + ((now() - u).total_seconds() if u is not
              none else 0) %} {{ d > 0 and (d - el) < 45 }}'
          then:
          - alias: Wait for the next track to start
            wait_for_trigger:
            - trigger: state
              entity_id: media_player.office_2
              attribute: media_title
            timeout:
              minutes: 2
            continue_on_timeout: true
          - alias: Let the new track settle so it is not ducked at position zero
            delay:
              seconds: 10
        - alias: Set volume for first announcement
          action: media_player.volume_set
          target:
            entity_id: media_player.office_2
          data:
            volume_level: 0.2
        - alias: TTS good morning announcement, fired between tracks so it can't hang
            mid-track playback
          action: tts.speak
          target:
            entity_id: tts.piper
          data:
            cache: false
            media_player_entity_id: media_player.office_2
            message: '{% set fc = today_fc[''weather.forecast_home''][''forecast'']
              if (today_fc is defined and today_fc and ''weather.forecast_home'' in
              today_fc) else [] %} {% set f = fc[0] if fc else none %} Good morning
              Lily & Caylee! Today is {{ now().strftime(''%A, %B %-d'') }} and its
              going to be a great day! The time is {{ now().strftime(''%-I:%M %p'')
              }}. The current conditions are {{ states(''weather.forecast_home'')
              | replace(''-'', '' '') }}, with a temperature of {{ (state_attr(''weather.forecast_home'',
              ''temperature'') | float(0)) | round | int }} degrees. {% if f %}Today
              will be {{ f.condition | replace(''-'', '' '') }}, with a high of {{
              (f.temperature | float(0)) | round | int }} and a low of {{ (f.templow
              | float(0)) | round | int }} degrees.{% endif %} Let''s go!!!!!'
        - alias: Wait for the announcement to finish and music to resume
          wait_template: '{{ is_state(''media_player.office_2'', ''playing'') }}'
          timeout:
            seconds: 30
          continue_on_timeout: true
        - alias: Wait for the next track boundary before the second announcement
          wait_for_trigger:
          - trigger: state
            entity_id: media_player.office_2
            attribute: media_title
          timeout:
            minutes: 3
          continue_on_timeout: true
        - alias: Let the new track settle before speaking. The wait above fires at
            the exact instant the next song starts, and announcing right then ducks
            it at position zero, so it replays its opening seconds and sounds like
            the track restarting. Matches the settle the Big Bedroom routine uses.
          delay:
            seconds: 10
        - alias: Bump volume for second announcement
          action: media_player.volume_set
          target:
            entity_id: media_player.office_2
          data:
            volume_level: 0.25
        - alias: TTS second announcement, also fired between tracks
          action: tts.speak
          target:
            entity_id: tts.piper
          data:
            cache: false
            media_player_entity_id: media_player.office_2
            message: '{% set fc = today_fc[''weather.forecast_home''][''forecast'']
              if (today_fc is defined and today_fc and ''weather.forecast_home'' in
              today_fc) else [] %} {% set f = fc[0] if fc else none %} In case you
              missed it the first time, it seems you are really awake now. Good morning
              Lily & Caylee! Today is {{ now().strftime(''%A, %B %-d'') }} and its
              going to be a great day! The time is {{ now().strftime(''%-I:%M %p'')
              }}. The current conditions are {{ states(''weather.forecast_home'')
              | replace(''-'', '' '') }}, with a temperature of {{ (state_attr(''weather.forecast_home'',
              ''temperature'') | float(0)) | round | int }} degrees. {% if f %}Today
              will be {{ f.condition | replace(''-'', '' '') }}, with a high of {{
              (f.temperature | float(0)) | round | int }} and a low of {{ (f.templow
              | float(0)) | round | int }} degrees.{% endif %} Let''s go!!!!!'
        - alias: Wait for the announcement to finish and music to resume
          wait_template: '{{ is_state(''media_player.office_2'', ''playing'') }}'
          timeout:
            seconds: 30
          continue_on_timeout: true
        - alias: Restore volume to 0.5 after announcements
          action: media_player.volume_set
          target:
            entity_id: media_player.office_2
          data:
            volume_level: 0.5
        - alias: Occupancy-driven music loop
          repeat:
            while:
            - condition: state
              entity_id: input_boolean.bedroom2_occupied
              state: 'on'
            sequence:
            - if:
              - condition: or
                conditions:
                - condition: state
                  entity_id: binary_sensor.bedroom2_sensor_apollo_radar_zone_1_occupancy
                  state: 'on'
                - condition: state
                  entity_id: binary_sensor.bedroom2_sensor_apollo_radar_zone_2_occupancy
                  state: 'on'
                - condition: state
                  entity_id: binary_sensor.bedroom2_sensor_apollo_radar_zone_3_occupancy
                  state: 'on'
              then:
              - action: media_player.volume_set
                target:
                  entity_id: media_player.office_2
                data:
                  volume_level: 0.5
              - delay:
                  seconds: 30
              else:
              - repeat:
                  count: 8
                  sequence:
                  - action: media_player.volume_set
                    target:
                      entity_id: media_player.office_2
                    data:
                      volume_level: '{{ [0.5 - (repeat.index * 0.06), 0.02] | max
                        | round(3) }}'
                  - delay:
                      seconds: 15
                  - if:
                    - condition: or
                      conditions:
                      - condition: state
                        entity_id: binary_sensor.bedroom2_sensor_apollo_radar_zone_1_occupancy
                        state: 'on'
                      - condition: state
                        entity_id: binary_sensor.bedroom2_sensor_apollo_radar_zone_2_occupancy
                        state: 'on'
                      - condition: state
                        entity_id: binary_sensor.bedroom2_sensor_apollo_radar_zone_3_occupancy
                        state: 'on'
                    then:
                    - action: media_player.volume_set
                      target:
                        entity_id: media_player.office_2
                      data:
                        volume_level: 0.5
                    - stop: Occupancy returned during ramp-down
              - action: media_player.media_stop
                target:
                  entity_id: media_player.office_2
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.bedroom2_occupied
              - stop: Room cleared - routine complete
        - action: media_player.media_stop
          target:
            entity_id: media_player.office_2
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.bedroom2_occupied
    - sequence:
      - delay:
          minutes: 5
      - action: switch.turn_on
        target:
          entity_id: switch.adaptive_lighting_office
      - action: adaptive_lighting.apply
        continue_on_error: true
        data:
          entity_id: switch.adaptive_lighting_office
          lights:
          - light.office
          transition: 30
          adapt_color: true
          adapt_brightness: true
      - alias: Cocoa Beach on Nanoleafs if occupancy detected
        if:
        - condition: or
          conditions:
          - condition: state
            entity_id: binary_sensor.bedroom2_sensor_apollo_radar_zone_1_occupancy
            state: 'on'
          - condition: state
            entity_id: binary_sensor.bedroom2_sensor_apollo_radar_zone_2_occupancy
            state: 'on'
          - condition: state
            entity_id: binary_sensor.bedroom2_sensor_apollo_radar_zone_3_occupancy
            state: 'on'
        then:
        - action: light.turn_on
          target:
            entity_id:
            - light.ribbon
            - light.fluttershy
          data:
            effect: Cocoa Beach
            brightness_pct: 80
            transition: 5
      - action: automation.turn_on
        metadata: {}
        target:
          entity_id: automation.office_bedroom_2_smart_motion_presence_2
        data: {}
    - sequence:
      - alias: 30-minute hard cap timer. Clearing input_boolean.bedroom2_occupied
          is what lets the occupancy-driven music loop above exit, so this branch
          is what guarantees the run always terminates - which is in turn what makes
          mode:single safe here. The triggers are four hours apart (06:30 and 10:30)
          and a run can now last at most about half an hour, so a run can never still
          be alive when the next trigger fires and be dropped.
        delay:
          minutes: 30
      - continue_on_error: true
        action: media_player.media_stop
        target:
          entity_id: media_player.office_2
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.bedroom2_occupied
  mode: single
- id: '1776382720393'
  alias: Bedroom 2 Daily Reset
  description: Backstop reset 30 min after Good Morning Routine's trigger time (9:30am
    weekdays, 11am weekends). Turns off bedroom2_occupied if still on after the good
    morning routine should have completed. Must stay after Good Morning's own trigger
    time or it clears the flag first and Good Morning's occupied condition fails,
    skipping the whole routine (outlets, fan, wake ramp, everything) - this happened
    on weekdays from 2026-08-05 when Good Morning moved to 8:30am but this stayed
    at 8:00am.
  triggers:
  - trigger: time
    at: 09:30:00
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  - trigger: time
    at: '11:00:00'
    weekday:
    - sun
    - sat
  conditions: []
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.bedroom2_occupied
  mode: single
- id: '1776382720394'
  alias: Bedroom 2 Occupancy Latch
  description: Sets bedroom2_occupied once per night when the sensor group detects
    presence between 22:00 and midnight. Single-fire - won't retrigger if already
    occupied. Cleared by Good Morning Routine and Daily Reset.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.bedroom_2_sensor_group
    to: 'on'
  conditions:
  - condition: time
    after: '22:00:00'
    before: 00:00:00
  - condition: state
    entity_id: input_boolean.bedroom2_occupied
    state: 'off'
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.bedroom2_occupied
  mode: single
- id: '1781237174423'
  alias: '*Bedroom 2 Late Night Lights Out'
  description: From 10:45pm onward - the Bedtime Routine's hard lights out - while
    bedroom2_occupied is on, any Bedroom 2 / Office light that stays on for 60 seconds
    fades back off, so the room stays dark until the Good Morning Routine restores
    the lights. Ignores the dimmer manual override so the kids can't defeat it from
    the wall dimmer. The 10:46:30pm and midnight sweeps catch lights already on when
    the window opens (10:46:30 rather than 10:45 so it doesn't cut short hard lights
    out's own 60-second fade), and the startup sweep catches lights already on when
    HA restarts overnight (restored states don't fire the state trigger). Window ends
    before the Good Morning sunrise ramp starts; bedroom2_occupied being cleared by
    Good Morning or Daily Reset also disables it.
  triggers:
  - trigger: state
    entity_id:
    - light.ribbon
    - light.fluttershy
    - light.office
    - light.bedroom_2
    to: 'on'
    for:
      seconds: 60
    id: light_on
  - alias: Sweep just after the window opens - 10:45pm hard lights out plus its 60-second
      fade, so this doesn't shorten that fade with its own 30s transition
    trigger: time
    at: '22:46:30'
    id: sweep
  - trigger: time
    at: 00:00:30
    id: sweep
  - trigger: homeassistant
    event: start
    id: sweep
  conditions:
  - condition: state
    entity_id: input_boolean.bedroom2_occupied
    state: 'on'
  - alias: From 11:30pm until the morning sunrise ramp starts
    condition: or
    conditions:
    - alias: Late evening - 10:45pm to midnight, every night
      condition: time
      after: '22:45:00'
      before: 00:00:00
    - condition: time
      after: 00:00:00
      before: 07:45:00
      weekday:
      - mon
      - tue
      - wed
      - thu
      - fri
    - condition: time
      after: 00:00:00
      before: 09:10:00
      weekday:
      - sat
      - sun
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sweep
      sequence:
      - alias: Fade off anything left on at midnight or HA startup
        action: light.turn_off
        target:
          entity_id:
          - light.ribbon
          - light.fluttershy
          - light.office
          - light.bedroom_2
        data:
          transition: 30
    - conditions:
      - condition: trigger
        id: light_on
      sequence:
      - alias: Fade the light that was turned on back off
        action: light.turn_off
        target:
          entity_id: '{{ trigger.entity_id }}'
        data:
          transition: 30
  mode: parallel
  max: 6
- id: '1776427656334'
  alias: Good Morning - Kitchen Speaker Join
  description: During the good morning routine, joins kitchen speaker on first motion
    detection and ramps to 0.15. Stays grouped until bedroom music stops or routine
    ends. Unjoins when music stops or good morning deactivates.
  triggers:
  - trigger: state
    entity_id: binary_sensor.kitchen_sensor_group
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.good_morning_active
    state: 'on'
  - alias: Skip while Big Bedroom is asleep
    condition: state
    entity_id: input_boolean.big_bedroom_asleep
    state: 'off'
  actions:
  - variables:
      already_joined: "{{ state_attr('media_player.bedroom_2', 'group_members') is
        not none and\n   'media_player.kitchen' in\n   state_attr('media_player.bedroom_2',
        'group_members') | default([]) }}"
      kitchen_vol_before: '{{ state_attr(''media_player.kitchen'', ''volume_level'')
        | default(0.10) }}'
  - alias: Join and ramp only if not already in group
    if:
    - condition: template
      value_template: '{{ not already_joined }}'
    then:
    - alias: Set kitchen volume low before joining to avoid blast
      action: media_player.volume_set
      target:
        entity_id: media_player.kitchen
      data:
        volume_level: 0.05
    - alias: Join kitchen to bedroom group
      action: media_player.join
      target:
        entity_id: media_player.bedroom_2
      data:
        group_members:
        - media_player.kitchen
    - alias: Ramp kitchen volume up to 0.15
      repeat:
        count: 5
        sequence:
        - delay:
            seconds: 6
        - action: media_player.volume_set
          target:
            entity_id: media_player.kitchen
          data:
            volume_level: '{{ [0.05 + (repeat.index * 0.022), 0.15] | min | round(3)
              }}'
  - alias: Wait for routine to end or music stops
    wait_for_trigger:
    - trigger: state
      entity_id: input_boolean.good_morning_active
      to: 'off'
    - trigger: state
      entity_id: media_player.bedroom_2
      to: idle
    - trigger: state
      entity_id: media_player.bedroom_2
      to: paused
    - trigger: state
      entity_id: binary_sensor.kitchen_sensor_group
      to: 'off'
      for:
        minutes: 5
    timeout:
      minutes: 60
  - alias: Ungroup kitchen speaker
    continue_on_error: true
    action: media_player.unjoin
    target:
      entity_id: media_player.kitchen
  - alias: Restore kitchen volume to pre-join level
    action: media_player.volume_set
    target:
      entity_id: media_player.kitchen
    data:
      volume_level: '{{ kitchen_vol_before }}'
  mode: single
  max_exceeded: silent
- id: '1776687030470'
  alias: Sonos Portable Battery Charging
  description: Turn off big bedroom pulse light when Sonos is placed on charger
  triggers:
  - entity_id: binary_sensor.portable_charging
    to: 'on'
    trigger: state
  actions:
  - target:
      entity_id: light.apollo_msr_2_big_bedroom_rgb_light
    action: light.turn_off
- id: '1747180000001'
  alias: Sonos Portable - Battery Monitor
  description: When Sonos Roam is idle/paused for 5 min, snapshot battery, alert if
    below 30%, then turn the device off. Avoids polling the battery sensor.
  triggers:
  - trigger: state
    entity_id: media_player.portable
    to:
    - idle
    - paused
    for:
      minutes: 5
  conditions:
  - alias: Skip if already on charger
    condition: state
    entity_id: binary_sensor.portable_charging
    state: 'off'
  actions:
  - alias: Snapshot battery level into helper
    action: input_number.set_value
    target:
      entity_id: input_number.portable_battery_last_seen
    data:
      value: '{{ states(''sensor.portable_battery'') | int(0) }}'
  - alias: Alert if battery below 30%
    if:
    - condition: numeric_state
      entity_id: input_number.portable_battery_last_seen
      below: 30
    then:
    - alias: Notify phone
      action: notify.mobile_app_pc_iphone
      data:
        title: Sonos Roam Battery Low
        message: Sonos Portable battery is at {{ states('input_number.portable_battery_last_seen')
          | int }}% — Please Charge.
    - alias: Pulse bedroom light
      action: light.turn_on
      target:
        entity_id: light.apollo_msr_2_big_bedroom_rgb_light
      data:
        rgb_color:
        - 0
        - 179
        - 255
        brightness_pct: 8
        effect: Slow Pulse
  - alias: Turn off the Sonos Roam
    action: media_player.turn_off
    target:
      entity_id: media_player.portable
    data: {}
  mode: single
- id: '1776722406866'
  alias: Garage Door Auto-Close
  description: Close garage after 5 min of no person occupancy, if enabled. Uses person-only
    occupancy group (ignores parked cars).
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.garage_occupancy_group
    to:
    - 'off'
    for:
      hours: 0
      minutes: 5
      seconds: 0
  conditions:
  - condition: state
    entity_id: input_boolean.garage_auto_close_enabled
    state: 'on'
  - condition: state
    entity_id: cover.garage
    state:
    - open
  actions:
  - action: cover.close_cover
    target:
      entity_id: cover.garage
    data: {}
  mode: single
- id: '1776722452944'
  alias: Auto-Close Garage at 10PM
  description: Fail-safe close if garage is left open at 10PM
  triggers:
  - trigger: time
    at: '21:59:00'
  conditions:
  - condition: state
    entity_id: binary_sensor.garage_occupancy_group
    state: 'off'
    for:
      minutes: 1
  - condition: state
    entity_id: cover.garage
    state: open
  actions:
  - action: cover.close_cover
    target:
      entity_id: cover.garage
    data: {}
  - action: notify.mobile_app_pc_iphone
    data:
      message: Garage was open at 10PM and auto-closed. Check why earlier automations
        didn't catch this.
      title: Auto Close
  mode: single
- id: '1776828862786'
  alias: 'Hue Button 1 - Big Bedroom: Restore AL'
  description: Pico 'on' press clears all overrides, re-enables AL switches and motion
    automation, clears manual_control, and applies adaptive lighting.
  triggers:
  - device_id: aa30217bd770e8befb593a51899cbf4b
    domain: hue
    type: initial_press
    subtype: 1
    unique_id: da34ba0c-d931-434d-8531-b8dbb4ffac2e
    trigger: device
  - device_id: aa30217bd770e8befb593a51899cbf4b
    domain: hue
    type: repeat
    subtype: 1
    unique_id: bedroom-dimmer-hold-btn1-al-toggle
    trigger: device
  conditions: []
  actions:
  - alias: Clear manual override flag
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.big_bedroom_manual_override
  - alias: Clear asleep flag - explicit wake via button 1
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.big_bedroom_asleep
  - alias: Clear manual_control flag so AL can adapt freely
    action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.al_big_bedroom
      lights:
      - light.bedroom_ceiling_1
      - light.bedroom_ceiling_2
      - light.bedroom_lamp_1
      - light.bedroom_lamp_2
      manual_control: false
  - alias: Re-enable AL switches
    action: switch.turn_on
    target:
      entity_id:
      - switch.al_big_bedroom
      - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_color_big_bedroom_al
      - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_brightness_big_bedroom_al
  - alias: Set sleep mode based on time of day
    if:
    - condition: time
      after: '23:00:00'
      before: 07:00:00
    then:
    - alias: Sleep hours - turn sleep mode on
      action: switch.turn_on
      target:
        entity_id: switch.al_sleep_mode_big_bedroom
    else:
    - alias: Day hours - keep sleep mode off
      action: switch.turn_off
      target:
        entity_id: switch.al_sleep_mode_big_bedroom
  - alias: Re-enable motion/presence automation
    action: automation.turn_on
    target:
      entity_id: automation.big_bedroom_smart_motion_presence
  - alias: Reset scene mode selector to default
    action: input_select.select_option
    continue_on_error: true
    target:
      entity_id: input_select.bedroom_scene_mode
    data:
      option: al
  - alias: Turn on lights so AL has something to adapt
    action: light.turn_on
    target:
      entity_id: light.bedroom
    data:
      transition: 2
  - alias: Apply adaptive lighting now
    action: adaptive_lighting.apply
    continue_on_error: true
    data:
      entity_id: switch.al_big_bedroom
      lights:
      - light.bedroom_ceiling_1
      - light.bedroom_ceiling_2
      - light.bedroom_lamp_1
      - light.bedroom_lamp_2
      transition: 2
      adapt_color: true
      adapt_brightness: true
      prefer_rgb_color: true
  mode: single
- id: '1776829563318'
  alias: 'Pico Button 3 - Dim - Big Bedroom: TV Mode'
  description: Time-of-day adaptive TV watching lights. Hue + Nanoleaf color-matched,
    Nanoleaf brightness capped at 20%. Fan to 25%. Disables AL and presence.
  triggers:
  - device_id: 439cd94b6d0b7203c2c0e131aee2cc31
    domain: lutron_caseta
    type: press
    subtype: lower
    trigger: device
  conditions: []
  actions:
  - action: automation.turn_off
    target:
      entity_id: automation.big_bedroom_smart_motion_presence
  - action: switch.turn_off
    target:
      entity_id:
      - switch.al_big_bedroom
      - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_color_big_bedroom_al
      - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_brightness_big_bedroom_al
  - action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.al_big_bedroom
      lights:
      - light.bedroom_ceiling_1
      - light.bedroom_ceiling_2
      - light.bedroom_lamp_1
      - light.bedroom_lamp_2
      manual_control: true
  - variables:
      sun_elev: '{{ state_attr(''sun.sun'', ''elevation'') | float(0) }}'
      tv_brightness: '{% if sun_elev > 10 %}60 {% elif sun_elev > -6 %}35 {% else
        %}15 {% endif %}'
      tv_kelvin: '{% if sun_elev > 10 %}4000 {% elif sun_elev > -6 %}2700 {% else
        %}2200 {% endif %}'
      nano_brightness: '{{ [tv_brightness | int, 20] | min }}'
  - alias: Pre-stage Nanoleaf at 1% to avoid flash-to-white
    action: light.turn_on
    target:
      entity_id: light.nano_sand_dune
    data:
      brightness_pct: 1
      color_temp_kelvin: '{{ tv_kelvin | int }}'
  - parallel:
    - action: light.turn_on
      target:
        entity_id:
        - light.bedroom_ceiling_1
        - light.bedroom_ceiling_2
        - light.bedroom_lamp_1
        - light.bedroom_lamp_2
      data:
        brightness_pct: '{{ tv_brightness | int }}'
        color_temp_kelvin: '{{ tv_kelvin | int }}'
        transition: 2
    - action: light.turn_on
      target:
        entity_id: light.nano_sand_dune
      data:
        brightness_pct: '{{ nano_brightness | int }}'
        color_temp_kelvin: '{{ tv_kelvin | int }}'
        transition: 2
    - action: fan.turn_on
      target:
        entity_id: fan.big_bedroom_fan
      data:
        percentage: 25
  mode: single
- id: '1778600000000'
  alias: 'Pico Button 4 - Off - Big Bedroom: Sleep Mode'
  description: Pico 'off' press sets bedroom lights to red 2%, turns on air circulator/purifier/fan
    at 50%, and arms alarm to home mode.
  triggers:
  - device_id: 439cd94b6d0b7203c2c0e131aee2cc31
    domain: lutron_caseta
    type: press
    subtype: 'off'
    trigger: device
  conditions: []
  actions:
  - alias: Disable motion automation so lights stay as set
    action: automation.turn_off
    target:
      entity_id: automation.big_bedroom_smart_motion_presence
  - alias: Disable AL switches
    action: switch.turn_off
    target:
      entity_id:
      - switch.al_big_bedroom
      - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_color_big_bedroom_al
      - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_brightness_big_bedroom_al
  - alias: Mark lights as manually controlled
    action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.al_big_bedroom
      lights:
      - light.bedroom_ceiling_1
      - light.bedroom_ceiling_2
      - light.bedroom_lamp_1
      - light.bedroom_lamp_2
      manual_control: true
  - parallel:
    - alias: Set bedroom lights to red at 2%
      action: light.turn_on
      target:
        entity_id:
        - light.bedroom_ceiling_1
        - light.bedroom_ceiling_2
        - light.bedroom_lamp_1
        - light.bedroom_lamp_2
        - light.nano_sand_dune
      data:
        rgb_color:
        - 255
        - 0
        - 0
        brightness_pct: 2
        transition: 2
    - alias: Air circulator on at 50%
      action: fan.turn_on
      target:
        entity_id: fan.air_circulator
      data:
        percentage: 50
    - alias: Bedroom purifier on at 50%
      action: fan.turn_on
      target:
        entity_id: fan.bedroom_purifier
      data:
        percentage: 50
    - alias: Big bedroom fan on at 50%
      action: fan.turn_on
      target:
        entity_id: fan.big_bedroom_fan
      data:
        percentage: 50
    - alias: Arm alarm to home mode
      action: alarm_control_panel.alarm_arm_home
      target:
        entity_id: alarm_control_panel.3302_alarm
      data:
        code: ''
  mode: single
- id: '1776830103632'
  alias: 'Big Bedroom: TV Mode (Unified)'
  description: TV state drives bedroom lighting with time-of-day palette. Playing
    = deep dim scaled to daylight. Paused = TV setup palette. Off = restore AL and
    presence. Fan 25% during TV activity. Nanoleaf color-matched, brightness-capped
    at 20%.
  triggers:
  - trigger: state
    entity_id: media_player.bedroom_tv
    to: playing
    id: playing
  - trigger: state
    entity_id:
    - media_player.bedroom_tv
    to:
    - paused
    - idle
    id: paused
  - trigger: state
    entity_id: media_player.bedroom_tv
    to: 'off'
    id: tv_off
  - device_id: 7501054a9a45dcff214f4cf4f9c143ef
    domain: media_player
    entity_id: 3cd6130d1d36d755abf52c6ebdb4aeab
    type: playing
    trigger: device
    id: playing
  - device_id: 7501054a9a45dcff214f4cf4f9c143ef
    domain: media_player
    entity_id: 3cd6130d1d36d755abf52c6ebdb4aeab
    type: paused
    trigger: device
    id: paused
  - device_id: 7501054a9a45dcff214f4cf4f9c143ef
    domain: media_player
    entity_id: 3cd6130d1d36d755abf52c6ebdb4aeab
    type: idle
    trigger: device
    id: paused
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: playing
      - condition: or
        conditions:
        - condition: state
          entity_id: light.bedroom_ceiling_1
          state: 'on'
        - condition: state
          entity_id: light.bedroom_ceiling_2
          state: 'on'
        - condition: state
          entity_id: light.bedroom_lamp_1
          state: 'on'
        - condition: state
          entity_id: light.bedroom_lamp_2
          state: 'on'
      sequence:
      - action: automation.turn_off
        target:
          entity_id: automation.big_bedroom_smart_motion_presence
      - action: switch.turn_off
        target:
          entity_id:
          - switch.al_big_bedroom
          - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_color_big_bedroom_al
          - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_brightness_big_bedroom_al
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.al_big_bedroom
          lights:
          - light.bedroom_ceiling_1
          - light.bedroom_ceiling_2
          - light.bedroom_lamp_1
          - light.bedroom_lamp_2
          manual_control: true
      - alias: Pre-stage Nanoleaf at 1% to avoid flash-to-white
        action: light.turn_on
        target:
          entity_id: light.nano_sand_dune
        data:
          brightness_pct: 1
          color_temp_kelvin: '{{ tv_kelvin | int }}'
      - parallel:
        - action: light.turn_on
          target:
            entity_id:
            - light.bedroom_ceiling_1
            - light.bedroom_ceiling_2
            - light.bedroom_lamp_1
            - light.bedroom_lamp_2
          data:
            brightness_pct: '{{ playing_brightness | int }}'
            color_temp_kelvin: '{{ tv_kelvin | int }}'
            transition: 3
        - action: light.turn_on
          target:
            entity_id: light.nano_sand_dune
          data:
            brightness_pct: '{{ playing_nano_brightness | int }}'
            color_temp_kelvin: '{{ tv_kelvin | int }}'
            transition: 3
        - action: fan.turn_on
          target:
            entity_id: fan.big_bedroom_fan
          data:
            percentage: 25
    - conditions:
      - condition: trigger
        id: paused
      sequence:
      - alias: Pre-stage Nanoleaf at 1% to avoid flash-to-white
        action: light.turn_on
        target:
          entity_id: light.nano_sand_dune
        data:
          brightness_pct: 1
          color_temp_kelvin: '{{ tv_kelvin | int }}'
      - parallel:
        - action: light.turn_on
          target:
            entity_id:
            - light.bedroom_ceiling_1
            - light.bedroom_ceiling_2
            - light.bedroom_lamp_1
            - light.bedroom_lamp_2
          data:
            brightness_pct: '{{ paused_brightness | int }}'
            color_temp_kelvin: '{{ tv_kelvin | int }}'
            transition: 3
        - action: light.turn_on
          target:
            entity_id: light.nano_sand_dune
          data:
            brightness_pct: '{{ paused_nano_brightness | int }}'
            color_temp_kelvin: '{{ tv_kelvin | int }}'
            transition: 3
    - conditions:
      - condition: trigger
        id: tv_off
      - alias: Skip while Big Bedroom is asleep - only Good Morning re-arms lighting
        condition: state
        entity_id: input_boolean.big_bedroom_asleep
        state: 'off'
      sequence:
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.al_big_bedroom
          lights:
          - light.bedroom_ceiling_1
          - light.bedroom_ceiling_2
          - light.bedroom_lamp_1
          - light.bedroom_lamp_2
          manual_control: false
      - action: switch.turn_on
        target:
          entity_id:
          - switch.al_big_bedroom
          - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_color_big_bedroom_al
          - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_brightness_big_bedroom_al
      - action: automation.turn_on
        target:
          entity_id: automation.big_bedroom_smart_motion_presence
      - action: adaptive_lighting.apply
        continue_on_error: true
        data:
          entity_id: switch.al_big_bedroom
          lights:
          - light.bedroom_ceiling_1
          - light.bedroom_ceiling_2
          - light.bedroom_lamp_1
          - light.bedroom_lamp_2
          transition: 3
          adapt_color: true
          adapt_brightness: true
          prefer_rgb_color: true
      - action: light.turn_off
        target:
          entity_id: light.nano_sand_dune
        data:
          transition: 3
  variables:
    sun_elev: '{{ state_attr(''sun.sun'', ''elevation'') | float(0) }}'
    tv_kelvin: '{% if sun_elev > 10 %}4000 {% elif sun_elev > -6 %}2700 {% else %}2200
      {% endif %}'
    paused_brightness: '{% if sun_elev > 10 %}60 {% elif sun_elev > -6 %}35 {% else
      %}15 {% endif %}'
    playing_brightness: '{% if sun_elev > 10 %}15 {% elif sun_elev > -6 %}5 {% else
      %}2 {% endif %}'
    paused_nano_brightness: '{{ [paused_brightness | int, 20] | min }}'
    playing_nano_brightness: '{{ [playing_brightness | int, 20] | min }}'
  mode: restart
- id: '1776965023589'
  alias: 'Office/Bedroom 2: Smart Motion & Presence'
  description: AL daytime, sleep mode evening. Handles motion 07:00-22:30 only. Stands
    down when bedroom2_occupied is on (Bedtime Routine has taken over). Hard cutoff
    at 22:30 - no motion response after that until 07:00.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.bedroom2_sensor_apollo_radar_moving_target
    to:
    - 'on'
    id: detected
  - trigger: state
    entity_id:
    - binary_sensor.bedroom_2_sensor_group
    to:
    - 'off'
    for:
      minutes: 20
    id: stopped
  - trigger: state
    entity_id: switch.adaptive_lighting_sleep_mode_office
    to: 'on'
    id: sleep_on
  - trigger: state
    entity_id: switch.adaptive_lighting_sleep_mode_office
    to: 'off'
    id: sleep_off
  - trigger: time
    at: '23:45:00'
    id: lights_out
  - trigger: time
    at: 00:00:00
    id: midnight_override_reset
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sleep_on
      - alias: Skip if dimmer override is active
        condition: state
        entity_id: input_boolean.bedroom2_manual_override
        state: 'off'
      - alias: Skip if room already occupied - avoid waking a sleeping person
        condition: state
        entity_id: input_boolean.bedroom2_occupied
        state: 'off'
      - alias: Skip if lights are already off - don't turn on lights in an empty room
        condition: state
        entity_id: light.ribbon
        state: 'on'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.ribbon
        data:
          effect: Sleep Mode
      - action: light.turn_on
        target:
          entity_id: light.fluttershy
        data:
          effect: Sleep Mode
      - delay:
          seconds: 1
      - action: light.turn_on
        target:
          entity_id: light.ribbon
        data:
          brightness_pct: 3
      - action: light.turn_on
        target:
          entity_id: light.fluttershy
        data:
          brightness_pct: 3
    - conditions:
      - condition: trigger
        id: sleep_off
      sequence:
      - condition: state
        entity_id: input_boolean.bedroom2_occupied
        state: 'off'
      - choose:
        - conditions:
          - condition: time
            after: '15:30:00'
            before: '19:30:00'
            weekday:
            - mon
            - tue
            - wed
            - thu
            - fri
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.ribbon
            data:
              effect: Jungle
          - action: light.turn_on
            target:
              entity_id: light.fluttershy
            data:
              effect: Flow
        - conditions: []
          sequence:
          - action: light.turn_off
            target:
              entity_id:
              - light.ribbon
              - light.fluttershy
              - light.bedroom_2
            data:
              transition: 2
    - conditions:
      - condition: trigger
        id: lights_out
      sequence:
      - alias: Skip lights_out if dimmer override is active (keep lights as set)
        condition: state
        entity_id: input_boolean.bedroom2_manual_override
        state: 'off'
      - action: light.turn_off
        target:
          entity_id:
          - light.ribbon
          - light.fluttershy
          - light.office_1
          - light.office_2
        data:
          transition: 15
    - conditions:
      - condition: trigger
        id: midnight_override_reset
      sequence:
      - alias: Clear override at midnight so automations resume normally
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.bedroom2_manual_override
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.adaptive_lighting_office
          lights:
          - light.office
          manual_control: false
      - alias: Do NOT re-enable AL here — it would immediately turn ribbon/fluttershy
          back on. Good Morning routine handles re-enabling AL at wake time.
        action: light.turn_off
        target:
          entity_id:
          - light.ribbon
          - light.fluttershy
          - light.office_1
          - light.office_2
        data:
          transition: 30
    - conditions:
      - condition: trigger
        id: detected
      - alias: Hard block - Smart Motion only active 07:00 to 22:30
        condition: time
        after: 07:00:00
        before: '22:30:00'
      - alias: Stand down if Bedtime Routine has taken over
        condition: state
        entity_id: input_boolean.bedroom2_occupied
        state: 'off'
      sequence:
      - alias: Skip all light changes if manual override is active
        condition: state
        entity_id: input_boolean.bedroom2_manual_override
        state: 'off'
      - choose:
        - alias: Sleep mode active - gentle red bump only, no bright flash
          conditions:
          - condition: state
            entity_id: switch.adaptive_lighting_sleep_mode_office
            state: 'on'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.ribbon
            data:
              brightness_pct: 8
              rgb_color:
              - 255
              - 62
              - 1
              transition: 2
          - action: light.turn_on
            target:
              entity_id: light.fluttershy
            data:
              brightness_pct: 8
              rgb_color:
              - 255
              - 62
              - 1
              transition: 2
        - conditions:
          - condition: time
            after: '22:15:00'
            before: '22:30:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.office
            data:
              brightness_pct: 4
              rgb_color:
              - 255
              - 62
              - 1
              transition: 2
          - action: light.turn_off
            target:
              entity_id:
              - light.ribbon
              - light.fluttershy
            data:
              transition: 2
        - conditions:
          - condition: time
            after: '15:30:00'
            before: '19:30:00'
            weekday:
            - mon
            - tue
            - wed
            - thu
            - fri
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.office
            data:
              transition: 2
          - if:
            - condition: state
              entity_id: switch.adaptive_lighting_office
              state: 'on'
            - condition: template
              value_template: "{{ 'light.office' not in\n   (state_attr('switch.adaptive_lighting_office',
                'manual_control') | default([])) }}\n"
            then:
            - action: adaptive_lighting.apply
              continue_on_error: true
              data:
                entity_id: switch.adaptive_lighting_office
                lights:
                - light.office
                transition: 2
                adapt_color: true
                adapt_brightness: true
          - action: light.turn_on
            target:
              entity_id: light.ribbon
            data:
              effect: Jungle
          - action: light.turn_on
            target:
              entity_id: light.fluttershy
            data:
              effect: Flow
        - conditions:
          - condition: time
            after: 06:30:00
            before: '22:15:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.office
            data:
              transition: 2
          - if:
            - condition: state
              entity_id: switch.adaptive_lighting_office
              state: 'on'
            - condition: template
              value_template: "{{ 'light.office' not in\n   (state_attr('switch.adaptive_lighting_office',
                'manual_control') | default([])) }}\n"
            then:
            - action: adaptive_lighting.apply
              continue_on_error: true
              data:
                entity_id: switch.adaptive_lighting_office
                lights:
                - light.office
                transition: 2
                adapt_color: true
                adapt_brightness: true
        - conditions: []
          sequence:
          - action: light.turn_off
            target:
              entity_id:
              - light.ribbon
              - light.fluttershy
              - light.office_1
              - light.office_2
            data:
              transition: 2
    - conditions:
      - condition: trigger
        id: stopped
      - alias: Skip if hard-off window (11:45 PM - 7 AM) - let Bedtime/Morning routines
          own this
        condition: time
        after: 07:00:00
        before: '23:45:00'
      sequence:
      - alias: Clear manual override when room has been empty 20 minutes
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.bedroom2_manual_override
      - alias: Clear manual_control so AL can take over on next motion
        action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.adaptive_lighting_office
          lights:
          - light.office
          manual_control: false
      - alias: Re-enable AL switches so they're ready for next motion
        action: switch.turn_on
        target:
          entity_id:
          - switch.adaptive_lighting_office
          - switch.adaptive_lighting_adapt_color_office
          - switch.adaptive_lighting_adapt_brightness_office
      - alias: Re-enable sleep mode if it should be active (after 22:15)
        if:
        - condition: time
          after: '22:15:00'
          before: 06:30:00
        then:
        - action: switch.turn_on
          target:
            entity_id: switch.adaptive_lighting_sleep_mode_office
      - action: light.turn_off
        target:
          entity_id:
          - light.ribbon
          - light.fluttershy
          - light.office_1
          - light.office_2
        data:
          transition: 30
  mode: restart
- id: '1776981794880'
  alias: Departure - Start Window on Climatization
  description: Opens a 15-minute departure window when the climatization button is
    pressed.
  triggers:
  - trigger: state
    entity_id: button.volvo_xc60_start_climatization
    not_from:
    - unknown
    - unavailable
    not_to:
    - unknown
    - unavailable
  actions:
  - action: timer.start
    data:
      duration: 00:15:00
    target:
      entity_id: timer.departure_window
  mode: restart
- id: '1776981901284'
  alias: Departure - Monitor Garage and Arm Based on Occupancy
  description: When Volvo cable is disconnected during departure window and Paul or
    the car leaves, check for motion and arm accordingly.
  triggers:
  - trigger: state
    entity_id: sensor.volvo_xc60_charging_connection_status
    to: disconnected
  conditions:
  - condition: state
    entity_id: timer.departure_window
    state: active
  actions:
  - alias: Wait for Paul or car to leave
    wait_for_trigger:
    - trigger: state
      entity_id: person.paul
      to: not_home
    - trigger: state
      entity_id: device_tracker.bcpro_204982_08b8
      to:
      - not_home
      - unavailable
    timeout:
      minutes: 15
    continue_on_timeout: false
  - alias: Wait for motion to clear or timeout after 1 minute
    wait_template: '{{ is_state(''binary_sensor.goodbye_motion_sensors'', ''off'')
      }}'
    timeout:
      hours: 0
      minutes: 1
      seconds: 0
      milliseconds: 0
    continue_on_timeout: true
  - alias: Check if motion was detected (someone home)
    if:
    - condition: state
      entity_id: binary_sensor.goodbye_motion_sensors
      state: 'on'
    then:
    - alias: Someone is home - alert and set alarm to home
      sequence:
      - action: notify.mobile_app_pc_iphone
        data:
          title: Motion Detected
          message: Motion detected after you left. Setting alarm to home mode.
      - action: alarm_control_panel.alarm_arm_home
        target:
          entity_id: alarm_control_panel.3302_alarm
        data:
          code: ''
    else:
    - alias: No motion - house is empty, run goodbye routine
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.goodbye_routine_main
  - alias: Cancel the departure window timer
    action: timer.cancel
    target:
      entity_id: timer.departure_window
  mode: single
- id: '1776983486842'
  alias: Volvo XC60 - Plug In Reminder
  description: Turns on bedroom Apollo light red when the XC60 is home, not charging,
    and battery is below 50%.
  triggers:
  - trigger: state
    entity_id: device_tracker.bcpro_204982_08b8
    to: home
    for: 00:05:00
    id: arrival
  - trigger: numeric_state
    entity_id: sensor.volvo_xc60_battery
    below: 50
    id: battery_dropped
  conditions:
  - condition: state
    entity_id: device_tracker.bcpro_204982_08b8
    state: home
  - condition: state
    entity_id: sensor.volvo_xc60_charging_connection_status
    state: disconnected
  - condition: numeric_state
    entity_id: sensor.volvo_xc60_battery
    below: 50
  actions:
  - alias: Turn on bedroom Apollo light red
    action: light.turn_on
    target:
      entity_id: light.apollo_msr_2_big_bedroom_rgb_light
    data:
      rgb_color:
      - 255
      - 0
      - 0
      brightness: 255
  - alias: Send iPhone notification
    action: notify.mobile_app_pc_iphone
    data:
      title: Car Charger
      message: Plug in XC60 — battery at {{ states('sensor.volvo_xc60_battery') }}%
  mode: single
- id: '1777125101727'
  alias: Volvo XC60 - Turn Off Light When Charging
  description: Turn off the bedroom Apollo light when the XC60 is plugged in.
  triggers:
  - trigger: state
    entity_id: sensor.volvo_xc60_charging_connection_status
    to: connected
  actions:
  - alias: Turn off bedroom Apollo light
    action: light.turn_off
    target:
      entity_id: light.apollo_msr_2_big_bedroom_rgb_light
  mode: single
- id: '1777221197720'
  alias: Bedroom 2 - Off When Empty
  description: If bedroom 2 is unoccupied for 15 continuous minutes and no one is
    sleeping there (bedroom2_occupied off), turn off all lights, fan, and music.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.bedroom_2_sensor_group
    to:
    - 'off'
    for:
      hours: 0
      minutes: 15
      seconds: 0
  conditions:
  - condition: state
    entity_id: input_boolean.bedroom2_occupied
    state: 'off'
  actions:
  - alias: Stop music
    action: media_player.media_stop
    target:
      entity_id: media_player.office_2
  - alias: Turn off all lights
    action: light.turn_off
    target:
      entity_id:
      - light.ribbon
      - light.fluttershy
      - light.office
    data: {}
  - alias: Turn off fan
    action: fan.turn_off
    target:
      entity_id: fan.bedroom2_fan
    data: {}
  mode: single
- id: '1777244189521'
  alias: Start Car - Button 3 Hold (with Weather)
  description: Hold Button 3 to Start Car
  triggers:
  - device_id: c13076677bfa148986e2e81fc777c5fe
    domain: hue
    type: repeat
    subtype: 3
    unique_id: eeba1d4c-1255-4618-af96-8a7c6d9770bd
    trigger: device
  conditions: []
  actions:
  - alias: Trigger Volvo start script
    action: script.turn_on
    target:
      entity_id: script.script_start_volvo_xc60
  mode: single
- id: '1777251099134'
  alias: 'Living Room: TV Mode (Unified)'
  description: TV state drives living room lighting with time-of-day palette. Playing
    = deep dim scaled to daylight. Paused/Off = restore AL and presence. Dining room
    dims during playback if occupied. Galaxy projector off during playback, on when
    paused/off.
  triggers:
  - trigger: state
    entity_id:
    - media_player.appletv_14
    to:
    - playing
    id: playing
  - trigger: state
    entity_id:
    - media_player.appletv_14
    to:
    - paused
    - idle
    id: paused
  - trigger: state
    entity_id:
    - media_player.appletv_14
    to:
    - 'off'
    id: tv_off
  - trigger: state
    entity_id:
    - media_player.appletv_5
    to:
    - playing
    id: playing
  - trigger: state
    entity_id:
