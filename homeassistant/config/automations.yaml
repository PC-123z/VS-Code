- id: '1777484048364'
  alias: 'AUTO AWAY: Departure - Monitor Garage and Arm Based on Occupancy'
  description: When garage opens and Paul or the car is detected away, wait for motion
    sensors to clear, then check if someone's home. If motion detected, set alarm
    to home. If empty, run goodbye routine.
  triggers:
  - trigger: state
    entity_id: cover.garage
    to: open
    id: garage
  - alias: iOS Shortcut geofence-exit failsafe (beacon backup)
    trigger: webhook
    webhook_id: paul_left_home
    allowed_methods:
    - POST
    local_only: false
    id: webhook
  conditions:
  - alias: Don't run if Departure - Monitor Garage and Arm Based on Occupancy is active
    condition: state
    entity_id: automation.departure_open_garage_on_cable_disconnect
    state:
    - 'off'
    enabled: false
  actions:
  - alias: Confirm departure (skip wait when geofence webhook already confirmed Paul
      left)
    if:
    - condition: template
      value_template: '{{ trigger.id != ''webhook'' }}'
    then:
    - alias: Wait for Paul or car to be detected away
      wait_for_trigger:
      - trigger: state
        entity_id: person.paul
        to: not_home
      - trigger: state
        entity_id: device_tracker.bcpro_204982_08b8
        to:
        - not_home
        - unavailable
      timeout:
        hours: 0
        minutes: 15
        seconds: 0
        milliseconds: 0
      continue_on_timeout: false
  - alias: Wait for motion to clear or timeout after 5 minutes
    wait_template: '{{ is_state(''binary_sensor.goodbye_motion_sensors'', ''off'')
      }}'
    timeout:
      minutes: 5
    continue_on_timeout: true
  - alias: Check if motion was detected (someone home)
    if:
    - condition: state
      entity_id: binary_sensor.goodbye_motion_sensors
      state: 'on'
    then:
    - alias: Someone is home - alert and set alarm to home
      sequence:
      - action: notify.mobile_app_pc_iphone
        data:
          title: Motion Detected
          message: Motion detected after garage closed. Setting alarm to home mode.
      - action: alarm_control_panel.alarm_arm_home
        target:
          entity_id: alarm_control_panel.3302_alarm
        data:
          code: ''
    else:
    - alias: No motion - house is empty, run goodbye routine
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.goodbye_routine_main
  mode: restart
- id: '1777484175032'
  alias: Arrival (Welcome Home) - STAGE 1 Two-Factor Arm to Pending
  description: 'STAGE 1 of 2. Two-factor arrival detection, order-independent. Needs
    BOTH the garage opening AND an arrival signal (BT beacon, iOS Shortcut webhook,
    or phone geofence - all three set input_boolean.arrival_recent via the companion
    "Arrival Latch - Set on Phone/Beacon Arrival" automation) while armed - whichever
    happens first just latches its own flag (input_boolean.garage_open_recent or input_boolean.arrival_recent)
    and stops; whichever happens second finds the other flag already on. Changed 2026-08-22
    - this automation NO LONGER disarms or plays music. It only arms input_boolean.welcome_home_pending
    (the waiting state). The Ring garage door sensor (binary_sensor.garage_door) is
    now the final gate: see "Arrival (Welcome Home) - STAGE 2" which does the actual
    disarm + lights + music. Alarm stays armed and the house stays silent until that
    sensor reports open.

    History: Fixed 2026-07-22 - previously only triggered on garage-open and required
    the arrival latch to already be set, so a garage-open that beat the beacon update
    by a few seconds silently did nothing. Triggers on arrival_recent turning on (rather
    than duplicating the beacon/webhook triggers here) so all three arrival signals
    work as a fallback for each other, regardless of ordering with the garage - webhook
    isn''t wired in directly because HA only allows one automation to register a given
    webhook_id, and the latch automation already owns paul_arrived_home. Fixed 2026-08-13
    - the smart garage cover entity silently failed to report "open" on arrival, so
    the two-factor check waited forever even though the beacon confirmed arrival and
    the security panel''s own entry sensor tripped (went to "pending"). Now the panel''s
    own pending/entry-delay state also satisfies the garage half of the check, as
    a fallback for when the smart garage integration desyncs.'
  triggers:
  - id: garage
    trigger: state
    entity_id: cover.garage
    to: open
    enabled: true
  - id: arrival
    trigger: state
    entity_id: input_boolean.arrival_recent
    to: 'on'
  - id: entry_delay
    trigger: state
    entity_id: alarm_control_panel.3302_alarm
    to: pending
  conditions:
  - alias: Alarm must be armed (confirms we departed, not just opening garage at home)
    condition: or
    conditions:
    - condition: state
      entity_id: alarm_control_panel.3302_alarm
      state: armed_away
    - condition: state
      entity_id: alarm_control_panel.3302_alarm
      state: armed_home
    - condition: state
      entity_id: alarm_control_panel.3302_alarm
      state: pending
  actions:
  - alias: Latch this signal; only fall through to disarm if the OTHER signal already
      fired
    choose:
    - alias: Garage opened (or panel's own entry-delay fired, in case the smart garage
        entity missed reporting open) - if no arrival signal has confirmed yet, latch
        and wait
      conditions:
      - condition: template
        value_template: '{{ trigger.id in ["garage", "entry_delay"] and is_state("input_boolean.arrival_recent",
          "off") }}'
      sequence:
      - alias: Set the garage-open latch
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.garage_open_recent
      - stop: Waiting for an arrival signal (beacon/phone/webhook) to confirm before
          disarming
    - alias: Arrival signal fired - if garage hasn't opened yet, wait
      conditions:
      - condition: template
        value_template: '{{ trigger.id == "arrival" and is_state("input_boolean.garage_open_recent",
          "off") }}'
      sequence:
      - stop: Waiting for garage to open to confirm before disarming
  - alias: Both factors confirmed - arm the pending state and wait for the Ring garage
      door sensor
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.welcome_home_pending
  - alias: Notify that welcome home is armed and waiting
    continue_on_error: true
    action: notify.mobile_app_pc_iphone
    data:
      title: Welcome Home armed
      message: Arrival confirmed. Waiting on the garage door sensor to disarm and
        start the routine.
  mode: queued
  max: 4
- id: '1777484175035'
  alias: Arrival (Welcome Home) - STAGE 2 Execute on Ring Garage Door Open
  description: 'STAGE 2 of 2. Added 2026-08-22. Holds the whole welcome home routine
    (disarm, hallway lights, music) until the Ring garage door sensor actually reports
    open. STAGE 1 does the two-factor arrival detection and sets input_boolean.welcome_home_pending;
    nothing here runs until that flag is on AND binary_sensor.garage_door is open,
    so the alarm stays armed and the house stays silent in the meantime.

    Triggers on both the sensor opening and the pending flag turning on, with a condition
    requiring both - the two are order-independent, because the Ring sensor can report
    open a few seconds before the beacon latch lands (the garage physically opens
    first). Requiring the sensor as a condition means it is still a hard gate either
    way: the routine can never run with the door closed.'
  triggers:
  - alias: Ring garage door sensor reports open
    trigger: state
    entity_id: binary_sensor.garage_door
    to: 'on'
  - alias: Pending flag armed (in case the door was already open when STAGE 1 finished)
    trigger: state
    entity_id: input_boolean.welcome_home_pending
    to: 'on'
  conditions:
  - alias: STAGE 1 must have confirmed arrival
    condition: state
    entity_id: input_boolean.welcome_home_pending
    state: 'on'
  - alias: Ring garage door sensor must be open - the final piece of the puzzle
    condition: state
    entity_id: binary_sensor.garage_door
    state: 'on'
  actions:
  - alias: Clear the pending flag so this only runs once per arrival
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.welcome_home_pending
  - alias: Disarm the security panel
    action: alarm_control_panel.alarm_disarm
    target:
      entity_id: alarm_control_panel.3302_alarm
    data:
      code: ''
  - alias: Ungroup bedroom from kitchen
    continue_on_error: true
    action: media_player.unjoin
    target:
      entity_id: media_player.bedroom
    data: {}
  - alias: Ungroup bedroom 2 from kitchen
    continue_on_error: true
    action: media_player.unjoin
    target:
      entity_id: media_player.bedroom_2
    data: {}
  - alias: Turn on hallway lights
    action: light.turn_on
    target:
      entity_id: light.hallway
    data:
      brightness_pct: 60
      transition: 2
  - variables:
      current_hour: '{{ now().hour }}'
      is_quiet_hours: '{{ current_hour|int < 8 or current_hour|int >= 22 }}'
  - alias: Check if quiet hours (before 8 AM or after 10 PM)
    if:
    - condition: template
      value_template: '{{ is_quiet_hours }}'
    then:
    - alias: Quiet hours - stay silent
      action: notify.mobile_app_pc_iphone
      data:
        title: Welcome Home
        message: Hallway lights on. Music skipped (quiet hours 10 PM – 8 AM).
    else:
    - alias: Before 10 PM - play appropriate music
      sequence:
      - alias: Set welcome home active flag
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.welcome_home_active
      - alias: Set kitchen volume to 0.20
        action: media_player.volume_set
        target:
          entity_id: media_player.kitchen
        data:
          volume_level: 0.2
      - alias: Set bedroom volume to 0.20
        action: media_player.volume_set
        target:
          entity_id: media_player.bedroom
        data:
          volume_level: 0.2
      - alias: Set office volume to 0.20
        action: media_player.volume_set
        target:
          entity_id: media_player.office
        data:
          volume_level: 0.2
      - alias: Play morning music (6 AM - 12 PM)
        if:
        - condition: template
          value_template: '{{ current_hour|int < 12 }}'
        then:
        - continue_on_error: true
          action: music_assistant.play_media
          target:
            device_id: b42d3b4542fb52c759f5aef09d3f6dad
          data:
            media_id: ytmusic://album/MPREb_Mxvr7f8ssSQ
            media_type: album
        - continue_on_error: true
          action: media_player.shuffle_set
          target:
            device_id: b42d3b4542fb52c759f5aef09d3f6dad
          data:
            shuffle: true
      - alias: Play afternoon music (12 PM - 5 PM)
        if:
        - condition: template
          value_template: '{{ current_hour|int >= 12 and current_hour|int < 17 }}'
        then:
        - continue_on_error: true
          action: music_assistant.play_media
          target:
            device_id: b42d3b4542fb52c759f5aef09d3f6dad
          data:
            media_id: ytmusic://album/MPREb_S3lOF926Vx1
            media_type: album
        - continue_on_error: true
          action: media_player.shuffle_set
          target:
            device_id: b42d3b4542fb52c759f5aef09d3f6dad
          data:
            shuffle: true
      - alias: Play evening music (5 PM - 8 PM)
        if:
        - condition: template
          value_template: '{{ current_hour|int >= 17 and current_hour|int < 20 }}'
        then:
        - continue_on_error: true
          action: music_assistant.play_media
          target:
            device_id: b42d3b4542fb52c759f5aef09d3f6dad
          data:
            media_id: ytmusic://album/MPREb_di7Fj3Fiafj
            media_type: album
        - continue_on_error: true
          action: media_player.shuffle_set
          target:
            device_id: b42d3b4542fb52c759f5aef09d3f6dad
          data:
            shuffle: true
      - alias: Play late night music (8 PM - 10 PM)
        if:
        - condition: template
          value_template: '{{ current_hour|int >= 20 }}'
        then:
        - continue_on_error: true
          action: music_assistant.play_media
          target:
            device_id: b42d3b4542fb52c759f5aef09d3f6dad
          data:
            media_id: ytmusic://album/MPREb_VkHTY8TFW8V
            media_type: album
        - continue_on_error: true
          action: media_player.shuffle_set
          target:
            device_id: b42d3b4542fb52c759f5aef09d3f6dad
          data:
            shuffle: true
      continue_on_error: true
  mode: queued
  max: 4
- id: '1777484175033'
  alias: Arrival Latch - Set on Phone/Beacon Arrival
  description: Sets the arrival latch when any early arrival signal fires (phone geofence,
    iOS Shortcut webhook, or BT beacon going home). These fire ~15-25s before the
    garage opens, so the latch captures them so the garage-open automation can read
    them later. Auto-clears after 15 min or on disarm (see companion automation).
  triggers:
  - alias: iPhone app person.paul arrives home
    trigger: state
    entity_id: person.paul
    from: not_home
    to: home
  - alias: BT beacon away -> home (Paul just arrived)
    trigger: state
    entity_id: device_tracker.bcpro_204982_08b8
    from:
    - not_home
    - unavailable
    to: home
  - alias: iOS Shortcut geofence webhook
    trigger: webhook
    webhook_id: paul_arrived_home
    allowed_methods:
    - POST
    local_only: false
  conditions: []
  actions:
  - alias: Set the arrival latch
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.arrival_recent
  mode: single
- id: '1777484175034'
  alias: Arrival Latch - Clear after 15 min or on Disarm
  description: Clears the arrival latches (beacon/phone, garage-open) and the welcome_home_pending
    waiting state 15 minutes after any of them was set, or as soon as the alarm is
    disarmed (so a stale latch never lingers or wrongly satisfies the two-factor check
    on some unrelated future event). Clearing pending on disarm also means that letting
    yourself in some other way - keypad, front door - cancels the waiting routine
    instead of leaving it to fire the next time the garage opens.
  triggers:
  - alias: Arrival latch has been on for 15 minutes
    trigger: state
    entity_id: input_boolean.arrival_recent
    to: 'on'
    for:
      minutes: 15
  - alias: Garage-open latch has been on for 15 minutes
    trigger: state
    entity_id: input_boolean.garage_open_recent
    to: 'on'
    for:
      minutes: 15
  - alias: Welcome home pending has been waiting 15 minutes
    trigger: state
    entity_id: input_boolean.welcome_home_pending
    to: 'on'
    for:
      minutes: 15
  - alias: Alarm disarmed
    trigger: state
    entity_id: alarm_control_panel.3302_alarm
    to: disarmed
  conditions: []
  actions:
  - alias: Clear both arrival latches and the pending waiting state
    action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.arrival_recent
      - input_boolean.garage_open_recent
      - input_boolean.welcome_home_pending
  mode: single
- id: '1748800000004'
  alias: 'Welcome Home: Stop All Music When Kitchen Unoccupied 15 Min'
  description: Kitchen is the anchor for the welcome home session. When it has been
    empty for 15 minutes, stop all music, unjoin satellite rooms, and clear the active
    flag. Bathroom handles itself via its own kitchen_stopped trigger.
  triggers:
  - trigger: state
    entity_id: binary_sensor.kitchen_sensor_group
    to: 'off'
    for:
      minutes: 15
  conditions:
  - condition: state
    entity_id: input_boolean.welcome_home_active
    state: 'on'
  actions:
  - alias: Clear welcome home flag
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.welcome_home_active
  - alias: Unjoin satellite rooms
    continue_on_error: true
    action: media_player.unjoin
    target:
      entity_id:
      - media_player.bedroom
      - media_player.bedroom_2
      - media_player.office
      - media_player.bathroom
    data: {}
  - alias: Stop kitchen
    continue_on_error: true
    action: media_player.media_stop
    target:
      entity_id: media_player.kitchen
  mode: single
- id: '1748800000002'
