- id: '1772496443457'
  alias: Goodnight-Button
  description: Big Bedroom Goodnight button. Strictly scoped - only affects Big Bedroom
    and Bathroom. Other rooms keep their own schedules.
  triggers:
  - device_id: aa30217bd770e8befb593a51899cbf4b
    domain: hue
    type: initial_press
    subtype: 3
    unique_id: da34ba0c-d931-434d-8531-b8dbb4ffac2e
    trigger: device
  conditions: []
  actions:
  - alias: Set sleep mode for Big Bedroom and Bathroom only
    action: switch.turn_on
    target:
      entity_id:
      - switch.al_sleep_mode_big_bedroom
      - switch.al_sleep_mode_bathroom
      - switch.al_sleep_mode_bathroom_main
  - alias: Arm alarm to home mode
    action: alarm_control_panel.alarm_arm_home
    target:
      entity_id: alarm_control_panel.3302_alarm
    data: {}
  - alias: Turn off Big Bedroom lights only (incl Nanoleaf and galaxy projector)
    action: light.turn_off
    target:
      entity_id:
      - light.bedroom
      - light.galaxy_projector
      - light.nano_sand_dune
    data:
      transition: 15
  - alias: Big Bedroom fan to 25%
    action: fan.turn_on
    target:
      entity_id: fan.big_bedroom_fan
    data:
      percentage: 25
  - alias: Air circulator to 25%
    action: fan.turn_on
    target:
      entity_id: fan.air_circulator
    data:
      percentage: 25
  - alias: Bedroom purifier to 25%
    action: fan.turn_on
    target:
      entity_id: fan.bedroom_purifier
    data:
      percentage: 25
  - alias: Stop audio in Big Bedroom and Bathroom only (kitchen left alone)
    action: media_player.media_stop
    target:
      entity_id:
      - media_player.bedroom
      - media_player.bathroom
    data: {}
  - alias: Disable Big Bedroom motion automation only
    action: automation.turn_off
    target:
      entity_id:
      - automation.big_bedroom_smart_motion_presence
    enabled: true
    data:
      stop_actions: true
  mode: single
- id: '1772505504350'
  alias: Kitchen Off Switch
  description: 'Kills all kitchen lights when the Pico OFF button is pressed OR when
    Kitchen Main Lights are turned off externally. Uses explicit entity IDs to avoid
    registry-UUID drift.

    '
  triggers:
  - device_id: 864fec31db3ec90f02e244eb717c9cd4
    domain: lutron_caseta
    type: press
    subtype: 'off'
    trigger: device
    id: pico_off
  - trigger: state
    entity_id: light.kitchen_main_lights
    to: 'off'
    id: main_lights_off
  conditions: []
  actions:
  - action: light.turn_off
    target:
      entity_id:
      - light.kitchen_main_lights
      - light.kitchen_1_color
      - light.kitchen_2_color
      - light.kitchen_lightstrip
    data:
      transition: 1
  - delay:
      seconds: 3
  - action: light.turn_off
    target:
      entity_id:
      - light.kitchen_1_color
      - light.kitchen_2_color
      - light.kitchen_lightstrip
  mode: single
- &id001
  id: '1772717730627'
  alias: '*Nap Wake Up Routine v3'
  description: 'Staged sunrise wake-up with 3-min light ramp. Music ramps to 0.20,
    then waits for motion in bedroom/bathroom/hallway/kitchen before announcing. If
    no motion within 5 minutes of routine start, escalates: music to 0.30, 40-second
    pause, insistent TTS naming the alarm time and current time, then music resumes
    at 0.35 while waiting for motion. Occupancy-driven music tail uses 30-min clear
    grace. 60-minute hard cap from routine start.'
  triggers:
  - trigger: time
    at: '19:15:00'
    weekday:
    - sat
  - trigger: time
    at: '18:30:00'
    weekday:
    - mon
    enabled: true
  conditions: []
  actions:
  - alias: Mark routine as active
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.good_morning_active
  - alias: Capture alarm time for escalation TTS
    variables:
      alarm_time: '{{ trigger.now.strftime(''%-I:%M %p'') if trigger is defined and
        trigger.now is defined else ''5:25 PM'' }}'
  - alias: Turn off all sleep modes
    action: switch.turn_off
    target:
      entity_id:
      - switch.al_sleep_mode_bathroom
      - switch.al_sleep_mode_bathroom_main
      - switch.al_sleep_mode_big_bedroom
      - switch.al_sleep_mode_dining_room_bottom
      - switch.al_sleep_mode_dining_room_top
      - switch.al_sleep_mode_hallway
      - switch.al_sleep_mode_kitchen
      - switch.al_sleep_mode_kitchen_main
      - switch.al_sleep_mode_living_room
      - switch.adaptive_lighting_sleep_mode_office
  - alias: Turn off bedroom AL switches and clear manual control
    action: switch.turn_off
    target:
      entity_id:
      - switch.al_big_bedroom
      - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_color_big_bedroom_al
      - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_brightness_big_bedroom_al
  - action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.al_big_bedroom
      lights:
      - light.bedroom_ceiling_1
      - light.bedroom_ceiling_2
      - light.bedroom_lamp_1
      - light.bedroom_lamp_2
      manual_control: false
  - alias: Stage 1 - Nanoleaf Morning Sky effect at 5%
    action: light.turn_on
    target:
      entity_id: light.nano_sand_dune
    data:
      effect: Morning Sky
      brightness_pct: 5
      transition: 1
  - alias: Run all sunrise stages in parallel
    parallel:
    - sequence:
      - alias: Nanoleaf ramps to 100% over 3 minutes
        repeat:
          count: 20
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.nano_sand_dune
            data:
              brightness_pct: '{{ [5 + (repeat.index * 4.75), 100] | min | round(0)
                }}'
              transition: 3
          - delay:
              seconds: 9
    - sequence:
      - alias: Wait 15 seconds then bring in ceiling lights
        delay:
          seconds: 15
      - alias: Ceiling lights start at 1% warm white
        action: light.turn_on
        target:
          entity_id:
          - light.bedroom_ceiling_1
          - light.bedroom_ceiling_2
        data:
          color_temp_kelvin: 2700
          brightness_pct: 1
          transition: 3
      - alias: Ceiling lights fade to 70% over ~2:45
        repeat:
          count: 16
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.bedroom_ceiling_1
              - light.bedroom_ceiling_2
            data:
              brightness_pct: '{{ [1 + (repeat.index * 4.3), 70] | min | round(0)
                }}'
              color_temp_kelvin: 2700
              transition: 3
          - delay:
              seconds: 10
    - sequence:
      - alias: Wait 30 seconds then bring in lamps and cut fans
        delay:
          seconds: 30
      - alias: Cut bedroom fans
        action: fan.turn_off
        target:
          entity_id:
          - fan.air_circulator
          - fan.bedroom_purifier
          - fan.big_bedroom_fan
        data: {}
      - alias: Lamps start at 1% warm white
        action: light.turn_on
        target:
          entity_id:
          - light.bedroom_lamp_1
          - light.bedroom_lamp_2
        data:
          color_temp_kelvin: 2700
          brightness_pct: 1
          transition: 3
      - alias: Lamps fade to 94% over ~2:30
        repeat:
          count: 14
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.bedroom_lamp_1
              - light.bedroom_lamp_2
            data:
              brightness_pct: '{{ [1 + (repeat.index * 6.6), 94] | min | round(0)
                }}'
              color_temp_kelvin: 2700
              transition: 3
          - delay:
              seconds: 10
    - sequence:
      - alias: Wait 30 seconds (sync with lamp start)
        delay:
          seconds: 30
      - action: media_player.volume_set
        target:
          entity_id: media_player.bedroom_2
        data:
          volume_level: 0.05
      - alias: Play Dance Pop Hits playlist via Music Assistant
        continue_on_error: true
        action: music_assistant.play_media
        target:
          entity_id: media_player.bedroom_2
        data:
          media_id: '45'
          media_type: playlist
      - alias: Wait 10 seconds then check if music is playing
        delay:
          seconds: 10
      - if:
        - condition: or
          conditions:
          - condition: state
            entity_id: media_player.bedroom_2
            state: idle
          - condition: state
            entity_id: media_player.bedroom_2
            state: 'off'
        then:
        - alias: TTS good morning announcement (music failed)
          action: tts.speak
          target:
            entity_id: tts.piper
          data:
            cache: true
            media_player_entity_id: media_player.bedroom_2
            message: 'Time to wake up! Today is {{ now().strftime(''%A, %B %-d'')
              }}. The current conditions are {{ states(''weather.nws_38_20113654119161_85_60519204644677_klou'')
              }}, with a temperature of {{ state_attr(''weather.nws_38_20113654119161_85_60519204644677_klou'',
              ''temperature'') }} degrees. Have a great evening!

              '
        else:
        - alias: Ramp volume to 0.20 over ~2.5 minutes
          repeat:
            count: 8
            sequence:
            - delay:
                seconds: 18
            - action: media_player.volume_set
              target:
                entity_id: media_player.bedroom_2
              data:
                volume_level: '{{ [0.05 + (repeat.index * 0.019), 0.20] | min | round(3)
                  }}'
        - alias: Wait for motion in bedroom/bathroom/hallway/kitchen (up to ~5 min
            from routine start)
          wait_for_trigger:
          - trigger: state
            entity_id:
            - binary_sensor.apollo_msr_2_big_bedroom_radar_moving_target
            - binary_sensor.bathroom_motion
            - binary_sensor.hallway_motion
            - binary_sensor.kitchen_sensor_group
            to: 'on'
          timeout:
            minutes: 2
          continue_on_timeout: true
        - if:
          - alias: No motion detected within 5 min - escalate
            condition: template
            value_template: '{{ wait.completed == false }}'
          then:
          - alias: Boost music to 0.30 for escalation
            action: media_player.volume_set
            target:
              entity_id: media_player.bedroom_2
            data:
              volume_level: 0.3
          - alias: Wait 40 seconds before insistent announcement
            delay:
              seconds: 40
          - alias: Pause music for escalation TTS
            action: media_player.media_pause
            target:
              entity_id: media_player.bedroom_2
            data: {}
          - alias: Escalation TTS - alarm time, current time, please wake up
            action: tts.speak
            target:
              entity_id: tts.piper
            data:
              cache: false
              media_player_entity_id: media_player.bedroom_2
              message: 'Your wake up alarm was scheduled to start at {{ alarm_time
                }}. The time is now {{ now().strftime(''%-I:%M %p'') }}. Please wake
                up.

                '
          - alias: Short pause for TTS to finish
            delay:
              seconds: 2
          - alias: Resume music
            action: media_player.media_play
            target:
              entity_id: media_player.bedroom_2
          - alias: Boost music to 0.35
            action: media_player.volume_set
            target:
              entity_id: media_player.bedroom_2
            data:
              volume_level: 0.35
          - alias: Wait for motion after escalation (remaining time budget)
            wait_for_trigger:
            - trigger: state
              entity_id:
              - binary_sensor.apollo_msr_2_big_bedroom_radar_moving_target
              - binary_sensor.bathroom_motion
              - binary_sensor.hallway_motion
              - binary_sensor.kitchen_sensor_group
              to: 'on'
            timeout:
              minutes: 30
            continue_on_timeout: true
          - if:
            - alias: Still no motion - end routine
              condition: template
              value_template: '{{ wait.completed == false }}'
            then:
            - continue_on_error: true
              action: media_player.media_stop
              target:
                entity_id: media_player.bedroom_2
            - continue_on_error: true
              action: media_player.unjoin
              target:
                entity_id: media_player.bathroom_2
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.good_morning_active
            - stop: Escalation timeout - person not waking up
          else:
          - alias: Motion detected within 5 min - regular friendly announcement
            sequence:
            - alias: Pause music for announcement
              action: media_player.media_pause
              target:
                entity_id: media_player.bedroom_2
            - alias: TTS wake up announcement
              action: tts.speak
              target:
                entity_id: tts.piper
              data:
                cache: true
                media_player_entity_id: media_player.bedroom_2
                message: 'Time to wake up! The time is now {{ now().strftime(''%-I:%M
                  %p'') }}. The current conditions are {{ states(''weather.nws_38_20113654119161_85_60519204644677_klou'')
                  }}, with a temperature of {{ state_attr(''weather.nws_38_20113654119161_85_60519204644677_klou'',
                  ''temperature'') }} degrees. Have a great evening!

                  '
            - alias: Short pause for TTS to finish then resume
              delay:
                seconds: 2
            - alias: Resume music
              action: media_player.media_play
              target:
                entity_id: media_player.bedroom_2
        - alias: Occupancy-driven music loop using Sensor Group
          repeat:
            while:
            - condition: state
              entity_id: input_boolean.good_morning_active
              state: 'on'
            sequence:
            - if:
              - condition: state
                entity_id: binary_sensor.big_bedroom_sensor_group
                state: 'on'
              then:
              - action: media_player.volume_set
                target:
                  entity_id: media_player.bedroom_2
                data:
                  volume_level: 0.2
              - delay:
                  seconds: 30
              else:
              - alias: Wait 30 min to confirm room is truly clear
                wait_for_trigger:
                - trigger: state
                  entity_id: binary_sensor.big_bedroom_sensor_group
                  to: 'on'
                timeout:
                  minutes: 30
                continue_on_timeout: true
              - if:
                - condition: template
                  value_template: '{{ wait.completed == true }}'
                then:
                - action: media_player.volume_set
                  target:
                    entity_id: media_player.bedroom_2
                  data:
                    volume_level: 0.2
                else:
                - alias: Ramp volume down over 2 minutes
                  repeat:
                    count: 8
                    sequence:
                    - action: media_player.volume_set
                      target:
                        entity_id: media_player.bedroom_2
                      data:
                        volume_level: '{{ [0.20 - (repeat.index * 0.019), 0.05] |
                          max | round(3) }}'
                    - delay:
                        seconds: 15
                - action: media_player.media_stop
                  target:
                    entity_id: media_player.bedroom_2
                - continue_on_error: true
                  action: media_player.unjoin
                  target:
                    entity_id: media_player.bathroom_2
                - action: input_boolean.turn_off
                  target:
                    entity_id: input_boolean.good_morning_active
                - stop: Room cleared for 30 minutes - routine complete
    - sequence:
      - alias: Wait 5 minutes then restore AL
        delay:
          minutes: 5
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.al_big_bedroom
          lights:
          - light.bedroom_ceiling_1
          - light.bedroom_ceiling_2
          - light.bedroom_lamp_1
          - light.bedroom_lamp_2
          manual_control: false
      - action: switch.turn_on
        target:
          entity_id:
          - switch.al_big_bedroom
          - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_color_big_bedroom_al
          - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_brightness_big_bedroom_al
      - action: input_select.select_option
        target:
          entity_id: input_select.bedroom_scene_mode
        data:
          option: al
      - action: automation.turn_on
        target:
          entity_id: automation.big_bedroom_smart_motion_presence
        data: {}
      - action: adaptive_lighting.apply
        continue_on_error: true
        data:
          entity_id: switch.al_big_bedroom
          lights:
          - light.bedroom_ceiling_1
          - light.bedroom_ceiling_2
          - light.bedroom_lamp_1
          - light.bedroom_lamp_2
          transition: 30
          adapt_color: true
          adapt_brightness: true
          prefer_rgb_color: true
      - alias: Only trigger Nanoleaf if occupancy detected
        if:
        - condition: state
          entity_id: binary_sensor.big_bedroom_sensor_group
          state: 'on'
        then:
        - action: select.select_option
          target:
            entity_id: select.nanoleaf_dynamic_scenes
          data:
            option: Cocoa Beach
        - action: light.turn_on
          target:
            entity_id: light.nano_sand_dune
          data:
            brightness_pct: 80
            transition: 5
    - sequence:
      - alias: 60-minute hard cap timer
        delay:
          minutes: 60
      - continue_on_error: true
        action: media_player.media_stop
        target:
          entity_id: media_player.bedroom_2
      - continue_on_error: true
        action: media_player.unjoin
        target:
          entity_id: media_player.bathroom_2
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.good_morning_active
  mode: parallel
  max: 2
- id: '1774818998231'
  alias: 'Dining Room Button On '
  description: Bright override - disables AL/sleep mode, holds bright until sensor
    clears for 30 min.
  triggers:
  - device_id: b553d4e94880b54012c3c4fbdec5c988
    domain: hue
    type: initial_press
    subtype: 1
    unique_id: 414b83c6-b217-4a10-88f2-bef3a3886fee
    trigger: device
  conditions: []
  actions:
  - alias: Set manual override - bright override
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.dining_room_manual_override
  - alias: Disable AL and sleep mode so they cannot fight the override
    action: switch.turn_off
    target:
      entity_id:
      - switch.al_dining_room_bottom
      - switch.al_dining_room_top
      - switch.al_sleep_mode_dining_room_bottom
      - switch.al_sleep_mode_dining_room_top
  - alias: Mark lights as manually controlled so AL won't touch them
    action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.al_dining_room_bottom
      lights:
      - light.dining_room_bottom
      manual_control: true
  - action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.al_dining_room_top
      lights:
      - light.dining_room_top
      manual_control: true
  - alias: Apply time-of-day bright scene with top/bottom color variation
    choose:
    - conditions:
      - condition: time
        after: 06:30:00
        before: '10:00:00'
      sequence:
      - action: light.turn_on
        target:
          label_id: dining_room_top
        data:
          color_temp_kelvin: 5500
          brightness_pct: 100
          transition: 2
      - action: light.turn_on
        target:
          label_id: dining_room_bottom
        data:
          color_temp_kelvin: 3200
          brightness_pct: 100
          transition: 2
    - conditions:
      - condition: time
        after: '10:00:00'
        before: '13:00:00'
      sequence:
      - action: light.turn_on
        target:
          label_id: dining_room_top
        data:
          color_temp_kelvin: 4500
          brightness_pct: 100
          transition: 2
      - action: light.turn_on
        target:
          label_id: dining_room_bottom
        data:
          color_temp_kelvin: 3800
          brightness_pct: 100
          transition: 2
    - conditions:
      - condition: time
        after: '13:00:00'
        before: '17:00:00'
      sequence:
      - action: light.turn_on
        target:
          label_id: dining_room_top
        data:
          color_temp_kelvin: 3800
          brightness_pct: 100
          transition: 2
      - action: light.turn_on
        target:
          label_id: dining_room_bottom
        data:
          rgb_color:
          - 255
          - 180
          - 130
          brightness_pct: 100
          transition: 2
    - conditions:
      - condition: time
        after: '17:00:00'
        before: '20:00:00'
      sequence:
      - action: light.turn_on
        target:
          label_id: dining_room_top
        data:
          rgb_color:
          - 238
          - 73
          - 98
          brightness_pct: 90
          transition: 2
      - action: light.turn_on
        target:
          label_id: dining_room_bottom
        data:
          rgb_color:
          - 255
          - 200
          - 140
          brightness_pct: 90
          transition: 2
    - conditions:
      - condition: time
        after: '20:00:00'
        before: '22:30:00'
      sequence:
      - action: light.turn_on
        target:
          label_id: dining_room_top
        data:
          rgb_color:
          - 0
          - 180
          - 200
          brightness_pct: 80
          transition: 2
      - action: light.turn_on
        target:
          label_id: dining_room_bottom
        data:
          rgb_color:
          - 180
          - 50
          - 150
          brightness_pct: 80
          transition: 2
    default:
    - action: light.turn_on
      target:
        label_id: dining_room_top
      data:
        rgb_color:
        - 255
        - 140
        - 50
        brightness_pct: 60
        transition: 2
    - action: light.turn_on
      target:
        label_id: dining_room_bottom
      data:
        rgb_color:
        - 255
        - 80
        - 30
        brightness_pct: 60
        transition: 2
  mode: single
- id: '1774819066797'
  alias: 'Dining Room Off Button '
  description: Lights off and restore AL/sleep mode control.
  triggers:
  - device_id: b553d4e94880b54012c3c4fbdec5c988
    domain: hue
    type: initial_press
    subtype: 4
    unique_id: 6411a323-ff74-4740-ba23-ad3506017e64
    trigger: device
  conditions: []
  actions:
  - alias: Clear manual override
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.dining_room_manual_override
  - alias: Clear manual_control flag so AL can take over again
    action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.al_dining_room_bottom
      lights:
      - light.dining_room_bottom
      manual_control: false
  - action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.al_dining_room_top
      lights:
      - light.dining_room_top
      manual_control: false
  - alias: Re-enable AL switches so next motion uses AL
    action: switch.turn_on
    target:
      entity_id:
      - switch.al_dining_room_bottom
      - switch.al_dining_room_top
  - action: light.turn_off
    metadata: {}
    target:
      area_id: dining_room
    data: {}
  mode: single
