      sequence:
      - alias: Set manual override - brightness up
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.bedroom2_manual_override
      - alias: Disable AL and sleep mode so changes stick
        action: switch.turn_off
        target:
          entity_id:
          - switch.adaptive_lighting_office
          - switch.adaptive_lighting_sleep_mode_office
          - switch.adaptive_lighting_adapt_color_office
          - switch.adaptive_lighting_adapt_brightness_office
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.adaptive_lighting_office
          lights:
          - light.office
          manual_control: true
      - action: light.turn_on
        target:
          entity_id:
          - light.office
          - light.ribbon
          - light.fluttershy
        data:
          brightness_step_pct: 15
          transition: 0.2
    - conditions:
      - condition: trigger
        id: btn2_hold
      sequence:
      - alias: Continuous brightness up while holding (bigger steps)
        action: light.turn_on
        target:
          entity_id:
          - light.office
          - light.ribbon
          - light.fluttershy
        data:
          brightness_step_pct: 25
          transition: 0.1
    - conditions:
      - condition: trigger
        id: btn3_press
      sequence:
      - alias: Set manual override - brightness down
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.bedroom2_manual_override
      - alias: Disable AL and sleep mode so changes stick
        action: switch.turn_off
        target:
          entity_id:
          - switch.adaptive_lighting_office
          - switch.adaptive_lighting_sleep_mode_office
          - switch.adaptive_lighting_adapt_color_office
          - switch.adaptive_lighting_adapt_brightness_office
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.adaptive_lighting_office
          lights:
          - light.office
          manual_control: true
      - action: light.turn_on
        target:
          entity_id:
          - light.office
          - light.ribbon
          - light.fluttershy
        data:
          brightness_step_pct: -15
          transition: 0.2
    - conditions:
      - condition: trigger
        id: btn3_hold
      sequence:
      - alias: Continuous brightness down while holding (bigger steps)
        action: light.turn_on
        target:
          entity_id:
          - light.office
          - light.ribbon
          - light.fluttershy
        data:
          brightness_step_pct: -25
          transition: 0.1
    - conditions:
      - condition: trigger
        id: btn4_press
      sequence:
      - alias: Clear manual override - lights off and restore AL
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.bedroom2_manual_override
      - alias: Clear manual_control flag so AL can take over again
        action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.adaptive_lighting_office
          lights:
          - light.office
          manual_control: false
      - alias: Re-enable AL switches so next motion uses AL
        action: switch.turn_on
        target:
          entity_id:
          - switch.adaptive_lighting_office
          - switch.adaptive_lighting_adapt_color_office
          - switch.adaptive_lighting_adapt_brightness_office
      - alias: Set sleep mode based on time of day
        if:
        - condition: time
          after: '22:15:00'
          before: 07:00:00
        then:
        - alias: Sleep hours - turn sleep mode on
          action: switch.turn_on
          target:
            entity_id: switch.adaptive_lighting_sleep_mode_office
        else:
        - alias: Day hours - keep sleep mode off
          action: switch.turn_off
          target:
            entity_id: switch.adaptive_lighting_sleep_mode_office
      - action: light.turn_off
        target:
          entity_id:
          - light.office
          - light.bedroom_2
          - light.ribbon
          - light.fluttershy
          - light.showtime_light
        data:
          transition: 2
