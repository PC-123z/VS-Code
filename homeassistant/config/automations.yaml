  - device_id: c6078582c306e2d78ad6c4e84d2b6e7c
    domain: hue
    type: initial_press
    subtype: 1
    unique_id: office-dimmer-btn1-bright-100
    trigger: device
    id: btn1_press
  - device_id: c6078582c306e2d78ad6c4e84d2b6e7c
    domain: hue
    type: initial_press
    subtype: 2
    unique_id: office-dimmer-btn2-bright-up
    trigger: device
    id: btn2_press
  - device_id: c6078582c306e2d78ad6c4e84d2b6e7c
    domain: hue
    type: repeat
    subtype: 2
    unique_id: office-dimmer-btn2-bright-up-hold
    trigger: device
    id: btn2_hold
  - device_id: c6078582c306e2d78ad6c4e84d2b6e7c
    domain: hue
    type: initial_press
    subtype: 3
    unique_id: office-dimmer-btn3-bright-down
    trigger: device
    id: btn3_press
  - device_id: c6078582c306e2d78ad6c4e84d2b6e7c
    domain: hue
    type: repeat
    subtype: 3
    unique_id: office-dimmer-btn3-bright-down-hold
    trigger: device
    id: btn3_hold
  - device_id: c6078582c306e2d78ad6c4e84d2b6e7c
    domain: hue
    type: initial_press
    subtype: 4
    unique_id: office-dimmer-btn4-off
    trigger: device
    id: btn4_press
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: btn1_press
      sequence:
      - alias: Set manual override - bright override
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.bedroom2_manual_override
      - alias: Disable AL and sleep mode so they cannot fight the override
        action: switch.turn_off
        target:
          entity_id:
          - switch.adaptive_lighting_office
          - switch.adaptive_lighting_sleep_mode_office
          - switch.adaptive_lighting_adapt_color_office
          - switch.adaptive_lighting_adapt_brightness_office
      - alias: Mark light as manually controlled so AL won't touch it
        action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.adaptive_lighting_office
          lights:
          - light.office
          manual_control: true
      - alias: Apply current time-of-day color temperature to ceiling
        action: adaptive_lighting.apply
        continue_on_error: true
        data:
          entity_id: switch.adaptive_lighting_office
          lights:
          - light.office
          transition: 2
          adapt_color: true
          adapt_brightness: false
      - alias: Set ceiling lights bright at 100%
        action: light.turn_on
        target:
          entity_id: light.office
        data:
          brightness_pct: 100
          transition: 2
      - alias: Set Nanoleafs to time-based scene at 100%
        choose:
        - conditions:
          - condition: time
            after: 06:30:00
            before: '10:00:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.ribbon
              - light.fluttershy
            data:
              effect: Morning Sky
              brightness_pct: 100
        - conditions:
          - condition: time
            after: '10:00:00'
            before: '12:00:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.ribbon
              - light.fluttershy
            data:
              effect: Cocoa Beach
              brightness_pct: 100
        - conditions:
          - condition: time
            after: '12:00:00'
            before: '15:30:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.ribbon
              - light.fluttershy
            data:
              effect: Lightscape
              brightness_pct: 100
        - conditions:
          - condition: time
            after: '15:30:00'
            before: '19:30:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.ribbon
            data:
              effect: Jungle
              brightness_pct: 100
          - action: light.turn_on
            target:
              entity_id: light.fluttershy
            data:
              effect: Flow
              brightness_pct: 100
        - conditions:
          - condition: time
            after: '19:30:00'
            before: '22:00:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.ribbon
              - light.fluttershy
            data:
              effect: Sundown
              brightness_pct: 100
        default:
        - action: light.turn_on
          target:
            entity_id:
            - light.ribbon
            - light.fluttershy
          data:
            effect: Starlight
            brightness_pct: 100
    - conditions:
      - condition: trigger
        id: btn2_press
      sequence:
      - alias: Set manual override - brightness up
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.bedroom2_manual_override
      - alias: Disable AL and sleep mode so changes stick
        action: switch.turn_off
        target:
          entity_id:
          - switch.adaptive_lighting_office
          - switch.adaptive_lighting_sleep_mode_office
          - switch.adaptive_lighting_adapt_color_office
          - switch.adaptive_lighting_adapt_brightness_office
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.adaptive_lighting_office
          lights:
          - light.office
          manual_control: true
      - action: light.turn_on
        target:
          entity_id:
          - light.office
          - light.ribbon
          - light.fluttershy
        data:
          brightness_step_pct: 15
          transition: 0.2
    - conditions:
      - condition: trigger
        id: btn2_hold
      sequence:
      - alias: Continuous brightness up while holding (bigger steps)
        action: light.turn_on
        target:
          entity_id:
          - light.office
          - light.ribbon
          - light.fluttershy
        data:
          brightness_step_pct: 25
          transition: 0.1
    - conditions:
      - condition: trigger
        id: btn3_press
      sequence:
      - alias: Set manual override - brightness down
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.bedroom2_manual_override
      - alias: Disable AL and sleep mode so changes stick
        action: switch.turn_off
        target:
          entity_id:
          - switch.adaptive_lighting_office
          - switch.adaptive_lighting_sleep_mode_office
          - switch.adaptive_lighting_adapt_color_office
          - switch.adaptive_lighting_adapt_brightness_office
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.adaptive_lighting_office
          lights:
          - light.office
          manual_control: true
      - action: light.turn_on
        target:
          entity_id:
          - light.office
          - light.ribbon
          - light.fluttershy
        data:
          brightness_step_pct: -15
          transition: 0.2
    - conditions:
      - condition: trigger
        id: btn3_hold
      sequence:
      - alias: Continuous brightness down while holding (bigger steps)
        action: light.turn_on
        target:
          entity_id:
          - light.office
          - light.ribbon
          - light.fluttershy
        data:
          brightness_step_pct: -25
          transition: 0.1
    - conditions:
      - condition: trigger
        id: btn4_press
      sequence:
      - alias: Clear manual override - lights off and restore AL
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.bedroom2_manual_override
      - alias: Clear manual_control flag so AL can take over again
        action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.adaptive_lighting_office
          lights:
          - light.office
          manual_control: false
      - alias: Re-enable AL switches so next motion uses AL
        action: switch.turn_on
        target:
          entity_id:
          - switch.adaptive_lighting_office
          - switch.adaptive_lighting_adapt_color_office
          - switch.adaptive_lighting_adapt_brightness_office
      - alias: Set sleep mode based on time of day
        if:
        - condition: time
          after: '22:15:00'
          before: 07:00:00
        then:
        - alias: Sleep hours - turn sleep mode on
          action: switch.turn_on
          target:
            entity_id: switch.adaptive_lighting_sleep_mode_office
        else:
        - alias: Day hours - keep sleep mode off
          action: switch.turn_off
          target:
            entity_id: switch.adaptive_lighting_sleep_mode_office
      - action: light.turn_off
        target:
          entity_id:
          - light.office
          - light.bedroom_2
          - light.ribbon
          - light.fluttershy
          - light.showtime_light
        data:
          transition: 2
  mode: parallel
  max: 10
- id: '1776224619528'
  alias: 'Office: Daily AL Reset'
  description: Every morning at 7AM M-F and 10AM Sat-Sun, restore AL switches to default
    on state. Also re-enables Smart Motion & Presence automation.
  triggers:
  - trigger: time
    at: 07:00:00
    id: weekday_reset
  - trigger: time
    at: '10:00:00'
    id: weekend_reset
  conditions:
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: trigger
        id: weekday_reset
      - condition: time
        weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
    - condition: and
      conditions:
      - condition: trigger
        id: weekend_reset
      - condition: time
        weekday:
        - sat
        - sun
  actions:
  - action: automation.turn_on
    target:
      entity_id: automation.office_bedroom_2_smart_motion_presence_2
  - alias: Clear manual override (safety net for overnight occupancy)
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.bedroom2_manual_override
  - action: switch.turn_on
    target:
      entity_id:
      - switch.adaptive_lighting_office
      - switch.adaptive_lighting_adapt_color_office
      - switch.adaptive_lighting_adapt_brightness_office
  - action: switch.turn_off
    target:
      entity_id: switch.adaptive_lighting_sleep_mode_office
  - action: input_select.select_option
    target:
      entity_id: input_select.office_scene_mode
    data:
      option: al
  - action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.adaptive_lighting_office
      lights:
      - light.office
      manual_control: false
  mode: single
