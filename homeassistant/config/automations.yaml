- id: '1775471409248'
  alias: '*Big Bedroom: Smart Motion & Presence'
  description: Presence-based lighting with time-based Nanoleaf scenes and 30-minute
    timeout.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.big_bedroom_sensor_group
    to:
    - 'on'
    id: detected
  - trigger: state
    entity_id:
    - binary_sensor.big_bedroom_sensor_group
    to:
    - 'off'
    for:
      hours: 0
      minutes: 10
      seconds: 0
    id: stopped
  - trigger: state
    entity_id:
    - switch.al_sleep_mode_big_bedroom
    to: 'on'
    id: sleep_on
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sleep_on
      sequence:
      - alias: Clear manual override - explicit sleep mode always wins
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.big_bedroom_manual_override
      - condition: state
        entity_id: binary_sensor.big_bedroom_sensor_group
        state: 'on'
      - action: switch.turn_off
        target:
          entity_id: switch.al_big_bedroom
      - action: light.turn_on
        target:
          entity_id: light.bedroom
        data:
          brightness_pct: 10
          rgb_color:
          - 255
          - 30
          - 0
          transition: 30
      - action: light.turn_on
        target:
          entity_id: light.nano_sand_dune
        data:
          brightness_pct: 10
          rgb_color:
          - 255
          - 30
          - 0
          transition: 30
    - conditions:
      - condition: trigger
        id: detected
      - alias: Skip if dimmer override is active
        condition: state
        entity_id: input_boolean.big_bedroom_manual_override
        state: 'off'
      - alias: Skip if still asleep - only Good Morning re-arms lighting
        condition: state
        entity_id: input_boolean.big_bedroom_asleep
        state: 'off'
      sequence:
      - choose:
        - conditions:
          - condition: time
            after: 07:00:00
            before: '10:00:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.bedroom
            data:
              transition: 5
          - action: adaptive_lighting.apply
            continue_on_error: true
            data:
              entity_id: switch.al_big_bedroom
              lights:
              - light.bedroom_ceiling_1
              - light.bedroom_ceiling_2
              - light.bedroom_lamp_1
              - light.bedroom_lamp_2
              transition: 5
              adapt_color: true
              adapt_brightness: true
              prefer_rgb_color: true
          - action: select.select_option
            target:
              entity_id: select.nanoleaf_dynamic_scenes
            data:
              option: Cocoa Beach
          - action: light.turn_on
            target:
              entity_id: light.nano_sand_dune
            data:
              brightness_pct: 80
              transition: 5
        - conditions:
          - condition: time
            after: '10:00:00'
            before: '12:00:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.bedroom
            data:
              transition: 5
          - action: adaptive_lighting.apply
            continue_on_error: true
            data:
              entity_id: switch.al_big_bedroom
              lights:
              - light.bedroom_ceiling_1
              - light.bedroom_ceiling_2
              - light.bedroom_lamp_1
              - light.bedroom_lamp_2
              transition: 5
              adapt_color: true
              adapt_brightness: true
              prefer_rgb_color: true
          - action: select.select_option
            target:
              entity_id: select.nanoleaf_dynamic_scenes
            data:
              option: Northern Lights
          - action: light.turn_on
            target:
              entity_id: light.nano_sand_dune
            data:
              brightness_pct: 80
              transition: 5
        - conditions:
          - condition: time
            after: '12:00:00'
            before: '15:00:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.bedroom
            data:
              transition: 5
          - action: adaptive_lighting.apply
            continue_on_error: true
            data:
              entity_id: switch.al_big_bedroom
              lights:
              - light.bedroom_ceiling_1
              - light.bedroom_ceiling_2
              - light.bedroom_lamp_1
              - light.bedroom_lamp_2
              transition: 5
              adapt_color: true
              adapt_brightness: true
              prefer_rgb_color: true
          - action: select.select_option
            target:
              entity_id: select.nanoleaf_dynamic_scenes
            data:
              option: Lightscape
          - action: light.turn_on
            target:
              entity_id: light.nano_sand_dune
            data:
              brightness_pct: 70
              transition: 5
        - conditions:
          - condition: time
            after: '15:00:00'
            before: '18:00:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.bedroom
            data:
              transition: 5
          - action: adaptive_lighting.apply
            continue_on_error: true
            data:
              entity_id: switch.al_big_bedroom
              lights:
              - light.bedroom_ceiling_1
              - light.bedroom_ceiling_2
              - light.bedroom_lamp_1
              - light.bedroom_lamp_2
              transition: 5
              adapt_color: true
              adapt_brightness: true
              prefer_rgb_color: true
          - action: select.select_option
            target:
              entity_id: select.nanoleaf_dynamic_scenes
            data:
              option: Jungle
          - action: light.turn_on
            target:
              entity_id: light.nano_sand_dune
            data:
              brightness_pct: 70
              transition: 5
        - conditions:
          - condition: time
            after: '18:00:00'
            before: '20:00:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.bedroom
            data:
              transition: 5
          - action: adaptive_lighting.apply
            continue_on_error: true
            data:
              entity_id: switch.al_big_bedroom
              lights:
              - light.bedroom_ceiling_1
              - light.bedroom_ceiling_2
              - light.bedroom_lamp_1
              - light.bedroom_lamp_2
              transition: 5
              adapt_color: true
              adapt_brightness: true
              prefer_rgb_color: true
          - action: select.select_option
            target:
              entity_id: select.nanoleaf_dynamic_scenes
            data:
              option: Sundown
          - action: light.turn_on
            target:
              entity_id: light.nano_sand_dune
            data:
              brightness_pct: 50
              transition: 5
        - conditions:
          - condition: time
            after: '20:00:00'
            before: '22:00:00'
          sequence:
          - action: scene.turn_on
            target:
              entity_id: scene.bedroom_starlight
            data:
              transition: 5
          - action: select.select_option
            target:
              entity_id: select.nanoleaf_dynamic_scenes
            data:
              option: Starlight
          - action: light.turn_on
            target:
              entity_id: light.nano_sand_dune
            data:
              brightness_pct: 50
              transition: 5
        - conditions:
          - condition: time
            after: '22:00:00'
            before: '23:00:00'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.bedroom
            data:
              transition: 30
          - action: adaptive_lighting.apply
            continue_on_error: true
            data:
              entity_id: switch.al_big_bedroom
              lights:
              - light.bedroom_ceiling_1
              - light.bedroom_ceiling_2
              - light.bedroom_lamp_1
              - light.bedroom_lamp_2
              transition: 30
              adapt_color: true
              adapt_brightness: true
              prefer_rgb_color: true
          - action: light.turn_on
            target:
              entity_id: light.nano_sand_dune
            data:
              rgb_color:
              - 255
              - 100
              - 0
              brightness_pct: 30
              transition: 5
        - conditions:
          - condition: time
            after: '23:00:00'
            before: 07:00:00
          sequence:
          - choose:
            - alias: Sleep mode already on - go straight to red to avoid white flash
              conditions:
              - condition: state
                entity_id: switch.al_sleep_mode_big_bedroom
                state: 'on'
              sequence:
              - action: light.turn_on
                target:
                  entity_id: light.bedroom
                data:
                  brightness_pct: 10
                  rgb_color:
                  - 255
                  - 30
                  - 0
                  transition: 30
              - action: light.turn_on
                target:
                  entity_id: light.nano_sand_dune
                data:
                  brightness_pct: 10
                  rgb_color:
                  - 255
                  - 30
                  - 0
                  transition: 30
            default:
            - action: light.turn_on
              target:
                entity_id: light.bedroom
              data:
                transition: 30
            - action: adaptive_lighting.apply
              continue_on_error: true
              data:
                entity_id: switch.al_big_bedroom
                lights:
                - light.bedroom_ceiling_1
                - light.bedroom_ceiling_2
                - light.bedroom_lamp_1
                - light.bedroom_lamp_2
                transition: 30
                adapt_color: true
                adapt_brightness: true
                prefer_rgb_color: true
            - action: light.turn_on
              target:
                entity_id: light.nano_sand_dune
              data:
                rgb_color:
                - 255
                - 30
                - 0
                brightness_pct: '{{ [50 - ((now().hour * 60 + now().minute - 23 *
                  60) / 60 * 48) | round(0), 2] | max }}'
                transition: 30
    - conditions:
      - condition: trigger
        id: stopped
      - alias: Skip if override is active - overridden lights hold until the 30-min
          reset
        condition: state
        entity_id: input_boolean.big_bedroom_manual_override
        state: 'off'
      sequence:
      - alias: Turn lights off first before re-enabling AL to prevent race condition
        action: light.turn_off
        target:
          entity_id:
          - light.nano_sand_dune
          - light.bedroom_ceiling_1
          - light.bedroom_ceiling_2
          - light.bedroom_lamp_1
          - light.bedroom_lamp_2
        data:
          transition: 15
      - alias: Wait for transition to complete before re-enabling AL
        delay:
          seconds: 16
      - alias: Clear manual_control so AL can take over on next motion
        action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.al_big_bedroom
          lights:
          - light.bedroom_ceiling_1
          - light.bedroom_ceiling_2
          - light.bedroom_lamp_1
          - light.bedroom_lamp_2
          manual_control: false
      - alias: Re-enable AL switches so they're ready for next motion
        action: switch.turn_on
        target:
          entity_id:
          - switch.al_big_bedroom
          - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_color_big_bedroom_al
          - switch.adaptive_lighting_big_bedroom_al_adaptive_lighting_adapt_brightness_big_bedroom_al
      - alias: Re-enable sleep mode if it should be active (after 23:00)
        if:
        - condition: time
          after: '23:00:00'
          before: 07:00:00
        then:
        - action: switch.turn_on
          target:
            entity_id: switch.al_sleep_mode_big_bedroom
      - action: input_select.select_option
        target:
          entity_id: input_select.bedroom_scene_mode
        data:
          option: al
        enabled: false
  mode: restart
- id: '1775504917028'
  alias: 'Living Room: Smart Motion & Presence'
  description: Presence-based lighting with AL day, moonlight evening, deep red night
    mode, and sleep mode override.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.living_room_sensor_group
    to:
    - 'on'
    id: detected
  - trigger: state
    entity_id:
    - binary_sensor.living_room_sensor_group
    to:
    - 'off'
