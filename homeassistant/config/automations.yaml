- id: '1775504917028'
  alias: 'Living Room: Smart Motion & Presence'
  description: Presence-based lighting with AL day, moonlight evening, deep red night
    mode, and sleep mode override.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.living_room_sensor_group
    to:
    - 'on'
    id: detected
  - trigger: state
    entity_id:
    - binary_sensor.living_room_sensor_group
    to:
    - 'off'
    for:
      hours: 0
      minutes: 14
      seconds: 30
    id: cleared
  - trigger: time
    at: 07:00:00
    id: morning_transition
  - trigger: sun
    event: sunset
    id: sunset_transition
  - trigger: time
    at: '23:00:00'
    id: night_transition
  - trigger: state
    entity_id: switch.al_sleep_mode_living_room
    to: 'on'
    id: sleep_on
