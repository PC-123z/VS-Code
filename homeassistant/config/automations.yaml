      sequence:
      - action: script.turn_on
        target:
          entity_id: script.goodbye_routine_main
  mode: single
- id: '1777484175032'
  alias: Arrival (Welcome Home) - Disarm Alarm on Garage Cycle and Engine Off
  description: When garage opens and alarm is armed (confirming departure happened),
    wait for engine transition off OR BT beacon transition to home, then disarm and
    run welcome home routine.
  triggers:
  - trigger: state
    entity_id: cover.garage
    to: open
    enabled: true
  conditions:
  - alias: Alarm must be armed (confirms we departed, not just opening garage at home)
    condition: or
    conditions:
    - condition: state
      entity_id: alarm_control_panel.3302_alarm
      state: armed_away
    - condition: state
      entity_id: alarm_control_panel.3302_alarm
      state: armed_home
  actions:
  - alias: Wait for engine to transition off, Home Assistant App to Arrive Home OR
      BT beacon to transition home
    wait_for_trigger:
    - alias: Engine running -> off (just parked)
      trigger: state
      entity_id: binary_sensor.volvo_xc60_engine_status
      from: 'on'
      to: 'off'
    - alias: BT beacon away -> home (Paul just walked in)
      trigger: state
      entity_id: device_tracker.bcpro_204982_08b8
      from: not_home
      to: home
    - alias: iPhone app person.paul arrives home
      trigger: state
      entity_id: person.paul
      from: not_home
      to: home
    timeout:
      minutes: 5
    continue_on_timeout: false
  - alias: Disarm the security panel
    action: alarm_control_panel.alarm_disarm
    target:
      entity_id: alarm_control_panel.3302_alarm
    data:
      code: ''
  - alias: Ungroup bedroom from kitchen
    continue_on_error: true
    action: media_player.unjoin
    target:
      entity_id: media_player.bedroom
    data: {}
  - alias: Ungroup bedroom 2 from kitchen
    continue_on_error: true
    action: media_player.unjoin
    target:
      entity_id: media_player.bedroom_2
    data: {}
  - alias: Turn on hallway lights
    action: light.turn_on
    target:
      entity_id: light.hallway
    data:
      brightness_pct: 60
      transition: 2
  - variables:
      current_hour: '{{ now().hour }}'
      is_after_10pm: '{{ current_hour|int >= 22 }}'
  - alias: Check if after 10 PM
    if:
    - condition: template
      value_template: '{{ is_after_10pm }}'
    then:
    - alias: After 10 PM - stay quiet
      action: notify.mobile_app_pc_iphone
      data:
        title: Welcome Home
        message: Hallway lights on. Music skipped (after 10 PM quiet time).
    else:
    - alias: Before 10 PM - play appropriate music
      sequence:
      - alias: Set welcome home active flag
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.welcome_home_active
      - alias: Set kitchen volume to 0.20
        action: media_player.volume_set
        target:
          entity_id: media_player.kitchen
        data:
          volume_level: 0.2
      - alias: Set bedroom volume to 0.20
        action: media_player.volume_set
        target:
          entity_id: media_player.bedroom
        data:
          volume_level: 0.2
      - alias: Set office volume to 0.20
        action: media_player.volume_set
        target:
          entity_id: media_player.office
        data:
          volume_level: 0.2
      - alias: Play morning music (6 AM - 12 PM)
        if:
        - condition: template
          value_template: '{{ current_hour|int < 12 }}'
        then:
        - continue_on_error: true
          action: music_assistant.play_media
          target:
            device_id: b42d3b4542fb52c759f5aef09d3f6dad
          data:
            media_id: spotify://album/1dQDdZKvdJ5gNhUF56S8Qu
            media_type: album
      - alias: Play afternoon music (12 PM - 5 PM)
        if:
        - condition: template
          value_template: '{{ current_hour|int >= 12 and current_hour|int < 17 }}'
        then:
        - continue_on_error: true
          action: music_assistant.play_media
          target:
            device_id: b42d3b4542fb52c759f5aef09d3f6dad
          data:
            media_id: spotify://album/2Av4Xv5YejHwvSAnXpxKIt
            media_type: album
      - alias: Play evening music (5 PM - 8 PM)
        if:
        - condition: template
          value_template: '{{ current_hour|int >= 17 and current_hour|int < 20 }}'
        then:
        - continue_on_error: true
          action: music_assistant.play_media
          target:
            device_id: b42d3b4542fb52c759f5aef09d3f6dad
          data:
            media_id: spotify://album/3G6nqR94e5sVk67SXcKKsW
            media_type: album
      - alias: Play late night music (8 PM - 10 PM)
        if:
        - condition: template
          value_template: '{{ current_hour|int >= 20 }}'
        then:
        - continue_on_error: true
          action: music_assistant.play_media
          target:
            device_id: b42d3b4542fb52c759f5aef09d3f6dad
          data:
            media_id: spotify://album/4ZIOCYviEphLj1EpwXXvHy
            media_type: album
      continue_on_error: true
  - alias: Minimum 5 minutes of music before room-clear logic kicks in
    delay:
      minutes: 5
  - alias: Monitor each room independently and stop music when clear for 5 min
    parallel:
    - alias: Safety timeout - clear boolean and stop all music after 30 minutes no
        matter what
      sequence:
      - delay:
          minutes: 30
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.welcome_home_active
      - continue_on_error: true
        action: media_player.media_stop
        target:
          entity_id: media_player.kitchen
      - continue_on_error: true
        action: media_player.media_stop
        target:
          entity_id: media_player.bedroom
      - continue_on_error: true
        action: media_player.media_stop
        target:
          entity_id: media_player.office
      - continue_on_error: true
        action: media_player.unjoin
        target:
          entity_id:
          - media_player.bedroom
          - media_player.office
          - media_player.bathroom
        data: {}
    - alias: Kitchen - stop when clear for 5 minutes
      sequence:
      - wait_template: '{{ is_state(''binary_sensor.kitchen_sensor_group'', ''off'')
          }}'
        timeout:
          minutes: 30
        continue_on_timeout: true
      - wait_template: '{{ is_state(''binary_sensor.kitchen_sensor_group'', ''on'')
          }}'
        timeout:
          minutes: 5
        continue_on_timeout: true
      - if:
        - condition: template
          value_template: '{{ wait.timed_out }}'
        then:
        - continue_on_error: true
          action: media_player.media_stop
          target:
            entity_id: media_player.kitchen
    - alias: Bedroom - stop and unjoin when clear for 5 minutes
      sequence:
      - wait_template: '{{ is_state(''binary_sensor.big_bedroom_sensor_group'', ''off'')
          }}'
        timeout:
          minutes: 30
        continue_on_timeout: true
      - wait_template: '{{ is_state(''binary_sensor.big_bedroom_sensor_group'', ''on'')
          }}'
        timeout:
          minutes: 5
        continue_on_timeout: true
      - if:
        - condition: template
          value_template: '{{ wait.timed_out }}'
        then:
        - continue_on_error: true
          action: media_player.unjoin
          target:
            entity_id: media_player.bedroom
        - continue_on_error: true
          action: media_player.media_stop
          target:
            entity_id: media_player.bedroom
    - alias: Bedroom 2 / Office - stop and unjoin when clear for 5 minutes
      sequence:
      - wait_template: '{{ is_state(''binary_sensor.bedroom_2_sensor_group'', ''off'')
          }}'
        timeout:
          minutes: 30
        continue_on_timeout: true
      - wait_template: '{{ is_state(''binary_sensor.bedroom_2_sensor_group'', ''on'')
          }}'
        timeout:
          minutes: 5
        continue_on_timeout: true
      - if:
        - condition: template
          value_template: '{{ wait.timed_out }}'
        then:
        - continue_on_error: true
          action: media_player.unjoin
          target:
            entity_id: media_player.office
        - continue_on_error: true
          action: media_player.media_stop
          target:
            entity_id: media_player.office
  mode: single
- id: '1777890200001'
  alias: 'Welcome Home: Auto Join Bedroom Speakers on Motion'
  description: While welcome home music is playing in kitchen, joins bedroom speakers
    when motion is detected in those rooms.
  triggers:
  - trigger: state
    entity_id: binary_sensor.bedroom_2_sensor_group
    to: 'on'
    id: bedroom_2_motion
    enabled: true
  - trigger: state
    entity_id: binary_sensor.big_bedroom_sensor_group
    to: 'on'
    id: big_bedroom_motion
  conditions:
  - condition: state
    entity_id: input_boolean.welcome_home_active
    state: 'on'
  actions:
  - choose:
    - alias: Bedroom 2 sensor - join office speaker
      conditions:
      - condition: trigger
        id: bedroom_2_motion
      sequence:
      - action: media_player.join
        target:
          entity_id: media_player.kitchen
        data:
          group_members:
          - media_player.office
    - alias: Big bedroom sensor - join bedroom speaker
      conditions:
      - condition: trigger
        id: big_bedroom_motion
      sequence:
      - action: media_player.join
        target:
          entity_id: media_player.kitchen
        data:
          group_members:
          - media_player.bedroom
  mode: single
- id: '1777520160440'
  alias: 'Living Room: Unoccupied Shutoff'
  description: After 15 min of no living room presence (with dining room also empty),
    warn with color-changing lights then shut down TV, fan, and lights.
  triggers:
  - trigger: state
    entity_id: binary_sensor.living_room_sensor_group
    to: 'off'
    for:
      minutes: 8
      seconds: 30
  conditions:
  - alias: Living room must still be empty
    condition: state
    entity_id: binary_sensor.living_room_sensor_group
    state: 'off'
  - alias: Dining room must also be empty
    condition: state
    entity_id: binary_sensor.dining_room_sensor_group
    state: 'off'
  actions:
  - alias: Warning - deep blue
    action: light.turn_on
    target:
      entity_id: light.living_room
    data:
      rgb_color:
      - 0
      - 0
      - 200
      brightness_pct: 60
      transition: 1
  - alias: Hold blue - cancel if presence returns
    wait_for_trigger:
    - trigger: state
      entity_id: binary_sensor.living_room_sensor_group
      to: 'on'
    - trigger: state
      entity_id: binary_sensor.dining_room_sensor_group
      to: 'on'
    timeout:
      seconds: 30
    continue_on_timeout: true
  - alias: Abort if presence detected during blue
    if:
    - condition: template
      value_template: '{{ wait.completed == false }}'
    then:
    - action: adaptive_lighting.set_manual_control
      data:
        entity_id: switch.al_living_room
        lights:
        - light.living_room
        manual_control: false
    - stop: Presence returned during warning - aborting shutoff
  - alias: Warning - purple
    action: light.turn_on
    target:
      entity_id: light.living_room
    data:
      rgb_color:
      - 128
      - 0
      - 200
      brightness_pct: 60
      transition: 1
  - alias: Hold purple - cancel if presence returns
    wait_for_trigger:
    - trigger: state
      entity_id: binary_sensor.living_room_sensor_group
      to: 'on'
    - trigger: state
      entity_id: binary_sensor.dining_room_sensor_group
      to: 'on'
    timeout:
      seconds: 30
    continue_on_timeout: true
  - alias: Abort if presence detected during purple
    if:
    - condition: template
      value_template: '{{ wait.completed == false }}'
    then:
    - action: adaptive_lighting.set_manual_control
      data:
        entity_id: switch.al_living_room
        lights:
        - light.living_room
        manual_control: false
    - stop: Presence returned during warning - aborting shutoff
  - alias: Warning - red
    action: light.turn_on
    target:
      entity_id: light.living_room
    data:
      rgb_color:
      - 255
      - 0
      - 0
      brightness_pct: 60
      transition: 1
  - alias: Hold red - cancel if presence returns
    wait_for_trigger:
    - trigger: state
      entity_id: binary_sensor.living_room_sensor_group
      to: 'on'
    - trigger: state
      entity_id: binary_sensor.dining_room_sensor_group
      to: 'on'
    timeout:
      seconds: 30
    continue_on_timeout: true
  - alias: Abort if presence detected during red
    if:
    - condition: template
      value_template: '{{ wait.completed == false }}'
    then:
    - action: adaptive_lighting.set_manual_control
      data:
        entity_id: switch.al_living_room
        lights:
        - light.living_room
        manual_control: false
    - stop: Presence returned during warning - aborting shutoff
  - alias: Turn off TV
    action: media_player.turn_off
    target:
      entity_id: media_player.living_room_tv_2
    data: {}
  - alias: Turn off fan
    action: fan.turn_off
    target:
      entity_id: fan.living_room_fan
    data: {}
  - alias: Turn off living room lights
    action: light.turn_off
    target:
      entity_id:
      - light.living_room
      - light.galaxy_projector
    data: {}
  mode: single
- id: '1777696670196'
  alias: Volvo XC60 - Auto Lock If Left Unlocked
  description: Locks the Volvo XC60 if engine is off and doors remain unlocked for
    2 minutes.
  triggers:
  - alias: Doors unlocked for 2 minutes (engine may have been off the whole time)
    trigger: state
    entity_id:
    - lock.volvo_xc60_lock
    to:
    - unlocked
    for:
      hours: 0
      minutes: 5
      seconds: 0
  - alias: Engine off for 2 minutes (catches case of driving with doors unlocked)
    trigger: state
    entity_id:
    - binary_sensor.volvo_xc60_engine_status
    to:
    - 'off'
    for:
      hours: 0
      minutes: 5
      seconds: 0
  conditions:
  - alias: Not at home
    condition: state
    entity_id: person.paul
    state: not_home
  - alias: Engine must be off
    condition: state
    entity_id: binary_sensor.volvo_xc60_engine_status
    state: 'off'
  - alias: Doors must still be unlocked
    condition: state
    entity_id: lock.volvo_xc60_lock
    state: unlocked
  actions:
  - alias: Lock the Volvo
    action: lock.lock
    target:
      entity_id: lock.volvo_xc60_lock
  - alias: Notify iPhone
    action: notify.mobile_app_pc_iphone
    data:
      title: Volvo Locked
      message: XC60 engine off and doors unlocked for 2 minutes — automatically locked.
  mode: single
