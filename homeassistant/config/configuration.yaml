# Loads default set of integrations. Do not remove.
default_config:

# Enable Wake on LAN service
wake_on_lan:

frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

logger:
  default: warning
  logs:
    homeassistant: warning
    aiohomekit.controller.ip.connection: critical
    homeassistant.components.homekit_controller: critical
    asyncio: critical
    custom_components.localtuya: error

# go2rtc: HA uses its bundled go2rtc (Frigate 0.17.2 ships 1.9.10, below HA minimum 1.9.13).
# HomeKit camera bridge pulls RTSP from Frigate directly and does not depend on this.
# go2rtc:
#   url: http://192.168.70.155:1984

homekit:
  - name: Cameras
    port: 51828
    filter:
      include_entities:
        - camera.driveway_2
        - camera.front_door_2
        - camera.garage
        - camera.kitchen
        - camera.living_room
    entity_config:
      camera.driveway_2:
        name: Driveway
        stream_source: rtsp://192.168.70.155:8554/driveway_sub
        video_codec: copy
      camera.front_door_2:
        name: Front Door
        stream_source: rtsp://192.168.70.155:8554/front_door
      camera.garage:
        name: Garage
        stream_source: rtsp://192.168.70.155:8554/garage
        video_codec: copy
      camera.kitchen:
        name: Kitchen
        stream_source: rtsp://192.168.70.155:8554/kitchen
        video_codec: copy
      camera.living_room:
        name: Living Room
        stream_source: rtsp://192.168.70.155:8554/living_room
        video_codec: copy

