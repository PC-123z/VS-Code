# Template switches + sensors
template:
  # Big Bedroom presence with a 45 s off-delay. Replaces the group helper of the same
  # entity id: the radar's zones flap 1-3 s at a time (pedestal fan under the sensor),
  # which re-fired every presence automation. 2026-10-01
  # Also occupied whenever the asleep flag is on: with the fans running a still sleeper
  # is indistinguishable from an empty room on the radar. 2026-10-08
  - binary_sensor:
      - name: "Big Bedroom Sensor Group"
        unique_id: big_bedroom_sensor_group_debounced
        icon: mdi:bed-king-outline
        delay_off:
          seconds: 45
        state: >
          {{ is_state('input_boolean.big_bedroom_asleep', 'on')
             or is_state('binary_sensor.apollo_msr_2_big_bedroom_radar_zone_1_occupancy', 'on')
             or is_state('binary_sensor.apollo_msr_2_big_bedroom_radar_zone_2_occupancy', 'on')
             or is_state('binary_sensor.apollo_msr_2_big_bedroom_radar_zone_3_occupancy', 'on') }}
  - switch:
      - name: "Volvo Climatization"
        unique_id: volvo_climatization_voice
        state: "{{ states('input_boolean.volvo_trigger') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.volvo_trigger
          - action: script.script_start_volvo_xc60
          - delay:
              seconds: 3
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.volvo_trigger
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.volvo_trigger
      - name: "Good Morning"
        unique_id: good_morning_switch
        state: "{{ states('input_boolean.good_morning_trigger') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.good_morning_trigger
          - action: script.good_morning_routine
          - delay:
              seconds: 3
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.good_morning_trigger
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.good_morning_trigger

  - binary_sensor:
      - name: "PS5 Living Room"
        unique_id: ps5_living_room_power
        device_class: running
        state: >
          {{ states('sensor.ps5_current_consumption') | float(0) > 10 }}

      - name: "Kitchen Person Occupancy Confirmed"
        unique_id: kitchen_person_occupancy_confirmed
        device_class: occupancy
        delay_on:
          minutes: 3
        state: "{{ is_state('binary_sensor.kitchen_person_occupancy', 'on') }}"

      - name: "Living Room TV On"
        unique_id: living_room_tv_on
        device_class: running
        state: >
          {{ (integration_entities('jellyfin') | select('match', '^media_player\.')
             | select('in', area_entities('living_room')) | map('states')
             | reject('in', ['off', 'unavailable', 'unknown']) | list | count > 0)
             or (states('sensor.jellyfin_tiny_living_room_state') not in
                 ['off', 'unavailable', 'unknown'])
             or (states('media_player.living_room_tv') not in
                 ['off', 'unavailable', 'unknown'])
             or (states('media_player.living_room_tv_3') in
                 ['playing', 'paused', 'buffering'])
             or (states('media_player.living_room') not in
                 ['off', 'unavailable', 'unknown']) }}

# Jellyfin Tiny (jellyfin-tiny.pc) doesn't fit the native jellyfin integration
# (HA's config flow dedupes by a broken "unique id" that collides across separate
# servers/accounts), so its playback state is pulled directly via the Sessions API.
# jelly.pc (Jellyswarrm) just proxies to this server and jellyfin.pc, so no separate
# entry is needed for it.
rest:
  - resource: http://jellyfin-tiny.pc/Sessions
    method: GET
    headers:
      # Jellyfin 12 dropped legacy X-Emby-Token / api_key auth; Authorization header required
      Authorization: !secret jellyfin_tiny_auth_header
    scan_interval: 10
    sensor:
      - name: "Jellyfin Tiny Living Room State"
        unique_id: jellyfin_tiny_living_room_state
        value_template: >
          {% set sessions = value_json | selectattr('NowPlayingItem', 'defined') | list %}
          {% if sessions | selectattr('PlayState.IsPaused', 'eq', false) | list | count > 0 %}
            playing
          {% elif sessions | count > 0 %}
            paused
          {% else %}
            off
          {% endif %}

# Music Assistant JSON-RPC API. The HA integration exposes no service for the
# queue's Autoplay ("Don't stop the music") toggle, which the Good Morning routine
# must switch off while its single opening track plays - otherwise MA appends a
# similar track and the Sonos rolls gaplessly into it before HA can react.
rest_command:
  ma_bedroom_autoplay:
    url: http://192.168.70.155:8095/api
    method: POST
    headers:
      Authorization: !secret music_assistant_api_bearer
    content_type: application/json
    payload: >-
      {"command": "player_queues/autoplay", "args": {"queue_id": "RINCON_48A6B80529D101400",
      "autoplay_enabled": {{ 'true' if enabled | bool else 'false' }}}}
  # Starts the Good Morning playlist as ONE playlist item at a chosen track (start_item is
  # a track URI from the playlist). The HA integration's play_media has no start_item, and
  # expanding the playlist into per-track URIs hung the call on 2026-09-19. With an empty
  # start_item it simply starts at the top.
  ma_bedroom_play_from:
    url: http://192.168.70.155:8095/api
    method: POST
    headers:
      Authorization: !secret music_assistant_api_bearer
    content_type: application/json
    payload: >-
      {"command": "player_queues/play_media", "args": {"queue_id": "RINCON_48A6B80529D101400",
      "media": "ytmusic://playlist/VLPL44SaGMZ1acgMgT2P73ksWuLK77Dh3X8H", "option": "replace",
      "radio_mode": false{% if start_item | default('') | length > 0 %}, "start_item": "{{ start_item }}"{% endif %}}}

  # Welcome Home late-night (9 PM+) playlist: The Piano Guys - Most Popular (YT Music, 120 tracks),
  # started as ONE playlist item at a saved position so each arrival resumes where the last ended.
  ma_kitchen_night_play_from:
    url: http://192.168.70.155:8095/api
    method: POST
    headers:
      Authorization: !secret music_assistant_api_bearer
    content_type: application/json
    payload: >-
      {"command": "player_queues/play_media", "args": {"queue_id": "RINCON_347E5CA0960A01400",
      "media": "ytmusic://playlist/VLPL7j5iXGSdMweXm56WEjskhCT5oAeEZJQF", "option": "replace",
      "radio_mode": false{% if start_item | default('') | length > 0 %}, "start_item": "{{ start_item }}"{% endif %}}}

