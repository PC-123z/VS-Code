script_start_volvo_xc60:
  alias: 'Script: Start Volvo XC60'
  description: Start climatization with immediate Alexa feedback, announce via Sonos
    Piper, activate scenes. Main wrapper script that triggers core routine in background.
  icon: mdi:car
  sequence:
  - alias: Set Volvo start active (immediate Alexa feedback)
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.volvo_start_active
    continue_on_error: true
  - alias: Run Volvo climatization sequence in background
    action: script.turn_on
    target:
      entity_id: script.script_volvo_start_core
    data: {}
    continue_on_error: true
  mode: single
good_morning_routine:
  alias: 'Script: Good Morning Routine'
  description: Staged sunrise wake-up with immediate Alexa feedback, occupancy-driven
    music tail, and 30-min hard cap. Main wrapper that triggers core routine in background.
  icon: mdi:alarm-check
  sequence:
  - alias: Mark routine as active (immediate Alexa feedback)
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.good_morning_active
    continue_on_error: true
  - alias: Run Good Morning sequence in background
    action: script.turn_on
    target:
      entity_id: script.script_good_morning_routine_core
    data: {}
    continue_on_error: true
  mode: single
script_volvo_start_core:
  alias: 'Script: Volvo Start Core'
  description: Core climatization routine - starts car, activates scenes, announces
    via Sonos, sends notifications. Runs in background after main script provides
    Alexa feedback.
  icon: mdi:car
  sequence:
  - alias: Verify car is home before proceeding
    if:
    - condition: not
      conditions:
      - condition: state
        entity_id: device_tracker.bcpro_204982_08b8
        state: home
    then:
    - alias: Notify car not home error
      action: notify.mobile_app_pc_iphone
      data:
        title: Volvo Start Error
        message: Volvo start aborted - car is not detected as home.
    - stop: Car is not home
  - alias: Turn on garage lights (Garage - AL sets brightness; Garage Lights automation
      turns them off 5 min after presence clears once this start cycle ends)
    action: light.turn_on
    target:
      entity_id: light.garage_lights
    data: {}
    continue_on_error: true
  - alias: Press climatization button
    action: button.press
    target:
      entity_id: button.volvo_xc60_start_climatization
    data: {}
  - alias: Run main sequence and garage in parallel
    parallel:
    - sequence:
      - alias: Activate initial scene (Malibu Pink)
        action: hue.activate_scene
        target:
          entity_id: scene.hallway_malibu_pink
        data:
          transition: 15
      - alias: Announce departure with weather
        action: notify.send_message
        target:
          entity_id:
          - notify.paul_s_sonos_arc_announce
          - notify.echo_show_kitchen_announce
          - notify.office_speaker_announce
          - notify.living_room_dot_announce
          - notify.paul_s_sonos_one_second_edition_announce
        data:
          message: XC60 will be Ready to Depart in 5 Minutes. Current conditions are
            {{ states('weather.forecast_home') }}, {{ state_attr('weather.forecast_home',
            'temperature') }} degrees.
        continue_on_error: true
      - alias: Send departure iPhone notification
        action: notify.mobile_app_pc_iphone
        data:
          message: XC60 will be Ready to Depart in 5 Minutes
          title: Volvo XC60
      - alias: Wait 4 minutes
        delay:
          minutes: 4
      - alias: Activate final scene (Energize)
        action: hue.activate_scene
        target:
          entity_id: scene.hallway_energize
        data:
          transition: 60
      - alias: Announce ready
        action: notify.send_message
        target:
          entity_id:
          - notify.paul_s_sonos_arc_announce
          - notify.echo_show_kitchen_announce
          - notify.office_speaker_announce
          - notify.living_room_dot_announce
          - notify.paul_s_sonos_one_second_edition_announce
        data:
          message: 'Vehicle Ready, Time to Go!!!!  '
        continue_on_error: true
      - alias: Send ready iPhone notification
        action: notify.mobile_app_pc_iphone
        data:
          message: XC60 is Ready to Depart
          title: Car Remote
      - alias: Clear Volvo start active flag
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.volvo_start_active
    - sequence:
      - alias: Open garage if Volvo start active, between 6:30AM-10:50PM, not opened
          recently
        choose:
        - conditions:
          - condition: state
            entity_id: input_boolean.volvo_start_active
            state: 'on'
          - condition: time
            after: 06:30:00
            before: '22:50:00'
          - condition: template
            value_template: '{{ (now() - states.cover.garage.last_changed).total_seconds()
              > 600 }}'
          - condition: not
            conditions:
            - condition: state
              entity_id: cover.garage
              state: open
          sequence:
          - alias: Wait for the garage man-door to open (up to 10 minutes) - confirms
              someone actually walked into the garage before arming presence-based
              open. Once it opens, the flag below stays on for the rest of this cycle
              - opening no longer has to coincide with presence at that exact instant
              (on 2026-09-11, door-open and presence-on didn't line up, so the old
              same-moment check never fired).
            wait_for_trigger:
            - trigger: state
              entity_id: binary_sensor.garage_door
              to: 'on'
            timeout:
              minutes: 10
            continue_on_timeout: false
          - alias: Latch - door opened this cycle. A separate automation (Garage -
              Open on Presence During Volvo Start) watches presence and opens the
              cover any time this flag and volvo_start_active are both on, with no
              hold-time requirement.
            action: input_boolean.turn_on
            target:
              entity_id: input_boolean.volvo_garage_door_opened_this_cycle
            data: {}
    - sequence:
      - alias: Unlock immediately if the garage door contact sensor is already on
          when this run starts (e.g. door was jostled right before climatization was
          pressed)
        if:
        - condition: state
          entity_id: binary_sensor.garage_door
          state: 'on'
        then:
        - action: lock.unlock
          target:
            entity_id: lock.volvo_xc60_lock
          data: {}
      - alias: Re-unlock on every subsequent garage_door blip - the charge cable needs
          a fresh unlock press to release from the terminal, and the door can blip
          on/off several times before the garage actually opens - until the garage
          cover itself opens (real departure, no more cable-release blips expected)
          or 10 minutes of inactivity pass. Driven solely by binary_sensor.garage_door
          - no occupancy gate (it lagged the door blip and silently blocked the unlock
          on 2026-09-03).
        repeat:
          until:
          - condition: template
            value_template: '{{ is_state(''cover.garage'', ''open'') or not wait.completed
              }}'
          sequence:
          - wait_for_trigger:
            - trigger: state
              entity_id: binary_sensor.garage_door
              to: 'on'
            - trigger: state
              entity_id: cover.garage
              to: open
            timeout:
              minutes: 10
            continue_on_timeout: true
          - if:
            - condition: template
              value_template: '{{ wait.completed and wait.trigger is not none and
                wait.trigger.entity_id == ''binary_sensor.garage_door'' }}'
            then:
            - action: lock.unlock
              target:
                entity_id: lock.volvo_xc60_lock
              data: {}
  mode: single
script_good_morning_routine_core:
  alias: 'Script: Good Morning Routine Core'
  description: Delegates to the *Good Morning Routine automation (automation.good_morning_routine_3)
    so the Alexa path and the scheduled sunrise share one source of truth and never
    drift out of sync. All routine logic (sunrise ramp, music, announcement, occupancy
    tail, AL restoration, hard cap) lives in that automation.
  icon: mdi:alarm-check
  sequence:
  - alias: Trigger the canonical Good Morning automation
    action: automation.trigger
    target:
      entity_id: automation.good_morning_routine_3
    data:
      skip_condition: true
  mode: single
goodbye_routine_main:
  alias: Goodbye Routine - Main
  description: Runs after Paul leaves. Nothing in the house is touched until occupancy
    is decided - if anyone is home the alarm goes to Stay and lights/TVs/music are
    left alone; only a confirmed-empty house gets armed Away and powered down.
  sequence:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.goodbye_routine_active
  - action: script.goodbye_routine_motion_tracking
    response_variable: occupancy
  - if:
    - condition: template
      value_template: '{{ occupancy.someone_home }}'
    then:
    - action: script.goodbye_routine_someone_home_arm_stay
      data:
        detected: '{{ occupancy.detected }}'
    else:
    - action: script.goodbye_routine_all_clear_arm_and_power_off
  mode: single
  max_exceeded: silent
  icon: mdi:logout
goodbye_routine_motion_tracking:
  alias: Goodbye Routine - Motion Tracking
  description: Decides home vs empty. First allows up to 5 min for Paul's own exit
    motion to clear, then runs 5 consecutive 2-minute checks. Motion at any point during the checks
    = someone is home. Returns {someone_home, detected}.
  sequence:
  - alias: Settle - let departure motion clear (still-on after 5 min fails check 1)
    wait_template: '{{ is_state(''binary_sensor.goodbye_motion_sensors'', ''off'') }}'
    timeout:
      minutes: 5
    continue_on_timeout: true
  - repeat:
      count: 5
      sequence:
      - wait_template: '{{ is_state(''binary_sensor.goodbye_motion_sensors'', ''on'') }}'
        timeout:
          minutes: 2
        continue_on_timeout: true
      - if:
        - condition: template
          value_template: '{{ wait.completed }}'
        then:
        - variables:
            result:
              someone_home: true
              detected: '{{ expand(state_attr(''binary_sensor.goodbye_motion_sensors'',
                ''entity_id'')) | selectattr(''state'', ''eq'', ''on'') | map(attribute=''name'')
                | join('', '') }}'
        - stop: Motion detected - someone is home
          response_variable: result
  - variables:
      result:
        someone_home: false
        detected: ''
  - stop: No motion across 5 checks - house is empty
    response_variable: result
  mode: single
  icon: mdi:motion-sensor
goodbye_routine_someone_home_arm_stay:
  alias: Goodbye Routine - Someone Home, Arm Stay
  description: Someone is still home after Paul left - arm Stay and leave lights,
    TVs, music and fans exactly as they are.
  fields:
    detected:
      description: Sensors that detected motion
  sequence:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.goodbye_routine_active
  - alias: Paul came back before the decision - do nothing
    condition: not
    conditions:
    - condition: state
      entity_id: device_tracker.bcpro_204982_08b8
      state: home
  - if:
    - condition: state
      entity_id: alarm_control_panel.3302_alarm
      state: disarmed
    then:
    - action: alarm_control_panel.alarm_arm_home
      target:
        entity_id: alarm_control_panel.3302_alarm
      data:
        code: ''
  - action: notify.mobile_app_pc_iphone
    data:
      title: Someone's Home
      message: 'Motion after you left ({{ detected }}). Alarm set to Stay - lights,
        TVs and music left alone.'
  mode: single
  icon: mdi:home-account
goodbye_routine_all_clear_arm_and_power_off:
  alias: Goodbye Routine - All Clear, Arm and Power Off
  description: House confirmed empty by motion tracking - arm Away, then power down.
  sequence:
  - alias: Abort if car beacon shows Paul is actually home (stale/premature away trigger)
    if:
    - condition: state
      entity_id: device_tracker.bcpro_204982_08b8
      state: home
    then:
    - action: script.goodbye_routine_abort_and_restore
      data: {}
    - stop: Beacon confirms Paul is home - not arming
  - alias: Failsafe - leaving the house confirms awake, clear stuck asleep flag
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.big_bedroom_asleep
  - data:
      code: ''
    target:
      entity_id: alarm_control_panel.3302_alarm
    action: alarm_control_panel.alarm_arm_away
  - delay:
      seconds: 2
  - continue_on_error: true
    target:
      entity_id:
      - media_player.living_room_tv_2
      - media_player.bedroom_tv_2
    action: media_player.turn_off
  - continue_on_error: true
    target:
      entity_id:
      - media_player.bathroom
      - media_player.kitchen
      - media_player.bedroom
      - media_player.office
    action: media_player.media_stop
  - continue_on_error: true
    target:
      entity_id:
      - light.indoor
      - light.hallway
      - light.galaxy_projector
      - light.garage_lights
      - light.kitchen_1_color
      - light.kitchen_2_color
      - light.hue_datura_top_1
      - light.hue_datura_bottom_1
      - light.dining_room_bottom
      - light.dining_room_top
      - light.ribbon
      - light.nano_sand_dune
      - light.fluttershy
      - light.office
      - light.office_1
      - light.office_2
      - light.hue_white_lamp_1
      - light.living_room
      - light.bathroom_main_lights
      - light.bathroom_shower
      - light.bathroom_back
      - light.showtime_light
      - light.bedroom
      - light.bedroom_2
      - light.bedroom_ceiling_1
      - light.bedroom_ceiling_2
      - light.bedroom_lamp_1
      - light.bedroom_lamp_2
    action: light.turn_off
    data: {}
  - continue_on_error: true
    target:
      entity_id:
      - fan.air_circulator
      - fan.bedroom_purifier
      - fan.big_bedroom_fan
      - fan.kitchen_purifier
      - fan.living_room_fan
      - fan.bedroom2_fan
    action: fan.turn_off
    data: {}
  - target:
      entity_id: input_boolean.goodbye_routine_active
    action: input_boolean.turn_off
    data: {}
  mode: single
  icon: mdi:shield-lock
goodbye_routine_abort_and_restore:
  alias: Goodbye Routine - Abort
  description: Shared by the beacon-home checks (the gate in "All Clear, Arm and Power
    Off" and the "Beacon Home - Abort In-Progress Goodbye Routine" automation). The
    routine no longer changes anything before the empty-house decision, so there is
    nothing to restore - just cancel and clear the flag.
  sequence:
  - action: notify.mobile_app_pc_iphone
    data:
      title: Goodbye Routine Aborted
      message: Car beacon shows home - cancelled goodbye routine before arming. Nothing
        in the house was changed.
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.goodbye_routine_active
  mode: single
  icon: mdi:restore
goodbye_routine_alexa:
  alias: Goodbye Routine - Alexa
  sequence:
  - data: {}
    action: script.goodbye_routine_main
  mode: single
  icon: mdi:amazon-alexa
  description: ''
funtime_play_playlist:
  alias: Funtime - Play Playlist (with retry)
  description: Shared by the Fun Button automations - sets bedroom volume, plays the
    given Music Assistant media_id on media_player.bedroom_2, retries once if playback
    doesn't start, and notifies if it still hasn't started after two tries.
  fields:
    media_id:
      description: Music Assistant media_id URI to play (e.g. spotify://playlist/...
        or ytmusic://playlist/...)
      example: spotify://playlist/1GrWlZZ7Kb49epRDuiXUCz
  sequence:
  - alias: Set Sonos volume to 20%
    action: media_player.volume_set
    target:
      entity_id: media_player.bedroom_2
    data:
      volume_level: 0.2
  - alias: Play playlist via Music Assistant (with retry)
    repeat:
      sequence:
      - continue_on_error: true
        action: music_assistant.play_media
        target:
          entity_id: media_player.bedroom_2
        data:
          media_id: '{{ media_id }}'
          media_type: playlist
          radio_mode: false
      - continue_on_error: true
        action: media_player.shuffle_set
        target:
          entity_id: media_player.bedroom_2
        data:
          shuffle: true
      - alias: Give playback a few seconds to start
        wait_template: '{{ is_state(''media_player.bedroom'', ''playing'') }}'
        timeout:
          seconds: 8
        continue_on_timeout: true
      until:
      - alias: Exit the loop once it is playing, or after two attempts. Must be an
          until condition, not a stop action - stop would end the whole script run
          and skip every step after this repeat.
        condition: or
        conditions:
        - condition: state
          entity_id: media_player.bedroom
          state: playing
        - condition: template
          value_template: '{{ repeat.index >= 2 }}'
  - alias: Notify if music still isn't playing after retry
    if:
    - condition: not
      conditions:
      - condition: state
        entity_id: media_player.bedroom
        state: playing
    then:
    - action: notify.mobile_app_pc_iphone
      data:
        title: Fun Button music didn't start
        message: Bedroom Sonos didn't start playing after two tries - speaker may
          be offline.
  mode: queued
  max: 3
  icon: mdi:playlist-music
kitchen_up_light_apply:
  alias: 'Kitchen - Up Light: Apply Mode Color'
  description: 'Sets the Datura up light (light.hue_datura_top_1) for the current
    kitchen mode. Normal: the complementary color of the white Adaptive Lighting is
    giving the rest of the kitchen (warm white -> twilight indigo/blue, neutral ->
    blush rose, cool daylight -> peach/amber; soft saturation, brightness 50% of AL,
    min 10%), drifting slowly through 3 related colors: the complement, +35 deg hue,
    -35 deg hue (18 min cycle, eased so it lingers on each; position is derived from
    the clock so every caller lands on the same point of the cycle). Reads switch.al_kitchen, falling back to switch.al_garage (same 2000-5500K
    / 40-100% curve) when Kitchen AL is momentarily off. Dishes window 23:45-23:55:
    dim indigo 15%. Sleep mode: "Ember" deep amber-red 35% (up light is the prominent
    night light; Kitchen - Down drops to 5% red in the Smart Motion automation). Turns
    the light on - callers decide whether it should be on. Skips while kitchen manual
    override is on.'
  icon: mdi:ceiling-light-multiple
  mode: restart
  fields:
    transition:
      name: Transition
      description: Seconds
      default: 5
      selector:
        number:
          min: 0
          max: 300
  sequence:
  - condition: state
    entity_id: input_boolean.kitchen_manual_override
    state: 'off'
  - variables:
      sleep_mode: '{{ is_state(''switch.al_sleep_mode_kitchen'', ''on'') }}'
      dishes_window: '{{ today_at(''23:45'') <= now() < today_at(''23:55'') }}'
      al_source: '{{ ''switch.al_kitchen'' if state_attr(''switch.al_kitchen'', ''color_temp_kelvin'')
        is number else ''switch.al_garage'' }}'
      al_ct: '{{ state_attr(al_source, ''color_temp_kelvin'') | float(2700) }}'
      al_bri: '{{ state_attr(al_source, ''brightness_pct'') | float(70) }}'
      t: '{{ [[(al_ct - 2000) / 3500, 0] | max, 1] | min }}'
      complement_hs: "{% set k = [[0, 240, 75], [0.2, 225, 55], [0.57, 340, 45], [1,
        390, 55]] %}\n{% set ns = namespace(h=240, s=75) %}\n{% for i in range(k |
        length - 1) %}\n  {% set a = k[i] %}{% set b = k[i + 1] %}\n  {% if t >= a[0]
        and t <= b[0] %}\n    {% set f = (t - a[0]) / (b[0] - a[0]) %}\n    {% set
        ns.h = a[1] + (b[1] - a[1]) * f %}{% set ns.s = a[2] + (b[2] - a[2]) * f %}\n
        \ {% endif %}\n{% endfor %}\n{{ [(ns.h % 360) | round(1), ns.s | round(1)]
        }}"
      drift_hs: "{% set base = complement_hs %}\n{% set offs = [0, 35, -35] %}\n{%
        set cycle = 1080 %}\n{% set p = (now().timestamp() % cycle) / cycle * 3 %}\n{%
        set i = p | int %}\n{% set f = p - i %}\n{% set e = (1 - cos(pi * f)) / 2
        %}\n{% set a = offs[i] %}{% set b = offs[(i + 1) % 3] %}\n{% set h = base[0]
        + a + (b - a) * e %}\n{{ [(h % 360) | round(1), base[1]] }}"
      complement_bri: '{{ [(al_bri * 0.5) | round(0), 10] | max }}'
      fade: '{{ transition | default(5) }}'
  - choose:
    - alias: Dishes window - dim indigo
      conditions:
      - condition: template
        value_template: '{{ dishes_window }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.hue_datura_top_1
        data:
          hs_color:
          - 240
          - 75
          brightness_pct: 15
          transition: '{{ fade }}'
    - alias: Sleep mode - Ember
      conditions:
      - condition: template
        value_template: '{{ sleep_mode }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.hue_datura_top_1
        data:
          hs_color:
          - 18
          - 100
          brightness_pct: 35
          transition: '{{ fade }}'
    default:
    - alias: Complement of the AL white, drifting through 3 colors
      action: light.turn_on
      target:
        entity_id: light.hue_datura_top_1
      data:
        hs_color: '{{ drift_hs }}'
        brightness_pct: '{{ complement_bri }}'
        transition: '{{ fade }}'
