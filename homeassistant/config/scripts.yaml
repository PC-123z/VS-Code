script_start_volvo_xc60:
  alias: 'Script: Start Volvo XC60'
  description: Start climatization with immediate Alexa feedback, announce via Sonos
    Piper, activate scenes. Main wrapper script that triggers core routine in background.
  icon: mdi:car
  sequence:
  - alias: Set Volvo start active (immediate Alexa feedback)
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.volvo_start_active
    continue_on_error: true
  - alias: Run Volvo climatization sequence in background
    action: script.turn_on
    target:
      entity_id: script.script_volvo_start_core
    data: {}
    continue_on_error: true
  mode: single
good_morning_routine:
  alias: 'Script: Good Morning Routine'
  description: Staged sunrise wake-up with immediate Alexa feedback, occupancy-driven
    music tail, and 30-min hard cap. Main wrapper that triggers core routine in background.
  icon: mdi:alarm-check
  sequence:
  - alias: Mark routine as active (immediate Alexa feedback)
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.good_morning_active
    continue_on_error: true
  - alias: Run Good Morning sequence in background
    action: script.turn_on
    target:
      entity_id: script.script_good_morning_routine_core
    data: {}
    continue_on_error: true
  mode: single
script_volvo_start_core:
  alias: 'Script: Volvo Start Core'
  description: Core climatization routine - starts car, activates scenes, announces
    via Sonos, sends notifications. Runs in background after main script provides
    Alexa feedback.
  icon: mdi:car
  sequence:
  - alias: Verify car is home before proceeding
    if:
    - condition: not
      conditions:
      - condition: state
        entity_id: device_tracker.bcpro_204982_08b8
        state: home
    then:
    - alias: Notify car not home error
      action: notify.mobile_app_pc_iphone
      data:
        title: Volvo Start Error
        message: Volvo start aborted - car is not detected as home.
    - stop: Car is not home
  - alias: Press climatization button
    action: button.press
    target:
      entity_id: button.volvo_xc60_start_climatization
    data: {}
  - alias: Run main sequence and garage in parallel
    parallel:
    - sequence:
      - alias: Activate initial scene (Malibu Pink)
        action: hue.activate_scene
        target:
          entity_id: scene.hallway_malibu_pink
        data:
          transition: 15
      - alias: Announce departure with weather
        action: notify.send_message
        target:
          entity_id:
          - notify.paul_s_sonos_arc_announce
          - notify.echo_show_kitchen_announce
          - notify.office_speaker_announce
          - notify.living_room_dot_announce
          - notify.paul_s_sonos_one_second_edition_announce
        data:
          message: XC60 will be Ready to Depart in 5 Minutes. Current conditions are
            {{ states('weather.forecast_home') }}, {{ state_attr('weather.forecast_home',
            'temperature') }} degrees.
        continue_on_error: true
      - alias: Send departure iPhone notification
        action: notify.mobile_app_pc_iphone
        data:
          message: XC60 will be Ready to Depart in 5 Minutes
          title: Volvo XC60
      - alias: Wait 4 minutes
        delay:
          minutes: 4
      - alias: Activate final scene (Energize)
        action: hue.activate_scene
        target:
          entity_id: scene.hallway_energize
        data:
          transition: 60
      - alias: Announce ready
        action: notify.send_message
        target:
          entity_id:
          - notify.paul_s_sonos_arc_announce
          - notify.echo_show_kitchen_announce
          - notify.office_speaker_announce
          - notify.living_room_dot_announce
          - notify.paul_s_sonos_one_second_edition_announce
        data:
          message: 'Vehicle Ready, Time to Go!!!!  '
        continue_on_error: true
      - alias: Send ready iPhone notification
        action: notify.mobile_app_pc_iphone
        data:
          message: XC60 is Ready to Depart
          title: Car Remote
      - alias: Clear Volvo start active flag
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.volvo_start_active
    - sequence:
      - alias: Open garage if Volvo start active, between 7AM-9PM, not opened recently
        choose:
        - conditions:
          - condition: state
            entity_id: input_boolean.volvo_start_active
            state: 'on'
          - condition: time
            after: 07:00:00
            before: '21:00:00'
          - condition: template
            value_template: '{{ (now() - states.cover.garage.last_changed).total_seconds()
              > 600 }}'
          - condition: not
            conditions:
            - condition: state
              entity_id: cover.garage
              state: open
          sequence:
          - alias: Wait for sustained person detection in garage (up to 10 minutes)
              - requires 3 continuous seconds of occupancy so a brief Frigate
              false-positive blip can't arm the garage open on its own
            wait_for_trigger:
            - trigger: state
              entity_id: binary_sensor.garage_occupancy_group
              to: 'on'
              for:
                seconds: 3
            timeout:
              minutes: 10
            continue_on_timeout: false
          - alias: Open garage only if person is still actually there right now,
              not just at some point during the wait
            if:
            - condition: template
              value_template: '{{ wait.completed }}'
            - condition: state
              entity_id: binary_sensor.garage_occupancy_group
              state: 'on'
            then:
            - action: cover.open_cover
              target:
                entity_id: cover.garage
              data: {}
    - sequence:
      - alias: Unlock doors - immediately if the garage door contact sensor
          is already on, otherwise unlock the instant it blips on (up to 10
          minutes). Driven solely by binary_sensor.garage_door - no occupancy
          gate (it lagged the door blip and silently blocked the unlock on
          2026-09-03) and no dependency on cover.garage.
        choose:
        - conditions:
          - condition: state
            entity_id: binary_sensor.garage_door
            state: 'on'
          sequence:
          - action: lock.unlock
            target:
              entity_id: lock.volvo_xc60_lock
            data: {}
        default:
        - alias: Wait for garage door contact sensor to blip on (up to 10 minutes)
          wait_for_trigger:
          - trigger: state
            entity_id: binary_sensor.garage_door
            to: 'on'
          timeout:
            minutes: 10
          continue_on_timeout: true
        - alias: Unlock doors if the wait actually completed (not a timeout)
          if:
          - condition: template
            value_template: '{{ wait.completed }}'
          then:
          - action: lock.unlock
            target:
              entity_id: lock.volvo_xc60_lock
            data: {}
  mode: single
script_good_morning_routine_core:
  alias: 'Script: Good Morning Routine Core'
  description: Delegates to the *Good Morning Routine automation (automation.good_morning_routine_3)
    so the Alexa path and the scheduled sunrise share one source of truth and never
    drift out of sync. All routine logic (sunrise ramp, music, announcement, occupancy
    tail, AL restoration, hard cap) lives in that automation.
  icon: mdi:alarm-check
  sequence:
  - alias: Trigger the canonical Good Morning automation
    action: automation.trigger
    target:
      entity_id: automation.good_morning_routine_3
    data:
      skip_condition: true
  mode: single
goodbye_routine_main:
  alias: Goodbye Routine - Main
  sequence:
  - action: script.goodbye_routine_immediate_actions
    data: {}
  - action: script.goodbye_routine_motion_tracking
    data: {}
  - action: script.goodbye_routine_all_clear_arm_and_power_off
    data: {}
  mode: single
  icon: mdi:logout
  description: ''
goodbye_routine_immediate_actions:
  alias: Goodbye Routine - Immediate Actions
  sequence:
  - continue_on_error: true
    target:
      entity_id:
      - fan.air_circulator
      - fan.bedroom_purifier
      - fan.big_bedroom_fan
      - fan.kitchen_purifier
      - fan.living_room_fan
      - fan.bedroom2_fan
    action: fan.turn_off
    data: {}
  - continue_on_error: true
    target:
      entity_id:
      - media_player.living_room_tv_2
      - media_player.bedroom_tv_2
    action: media_player.turn_off
  - continue_on_error: true
    data:
      with_group: true
    target:
      entity_id:
      - media_player.bathroom
      - media_player.kitchen
      - media_player.bedroom
      - media_player.office
    action: sonos.snapshot
  - continue_on_error: true
    target:
      entity_id:
      - media_player.bathroom
      - media_player.kitchen
      - media_player.bedroom
      - media_player.office
    action: media_player.media_stop
  - continue_on_error: true
    target:
      entity_id:
      - light.galaxy_projector
      - light.kitchen_main_lights
      - light.kitchen_1_color
      - light.kitchen_2_color
      - light.dining_room_bottom
      - light.dining_room_top
      - light.ribbon
      - light.fluttershy
      - light.nano_sand_dune
      - light.office
      - light.office_1
      - light.office_2
      - light.living_room
      - light.bathroom_main_lights
      - light.bathroom_shower
      - light.bathroom_back
      - light.showtime_light
      - light.bedroom
      - light.bedroom_2
      - light.bedroom_ceiling_1
      - light.bedroom_ceiling_2
      - light.bedroom_lamp_1
      - light.bedroom_lamp_2
    action: light.turn_off
  - continue_on_error: true
    data:
      transition: 15
    target:
      entity_id: light.indoor
    action: light.turn_off
  - continue_on_error: true
    target:
      entity_id: switch.al_hallway
    action: switch.turn_off
  - continue_on_error: true
    data:
      brightness_pct: 20
    target:
      entity_id: light.hallway
    action: light.turn_on
  - target:
      entity_id: input_boolean.goodbye_routine_active
    action: input_boolean.turn_on
  mode: single
  icon: mdi:power
  description: ''
goodbye_routine_motion_tracking:
  alias: Goodbye Routine - Motion Tracking
  sequence:
  - repeat:
      count: 3
      sequence:
      - wait_template: '{{ is_state(''binary_sensor.goodbye_motion_sensors'', ''off'')
          }}

          '
        timeout:
          minutes: 2
        continue_on_timeout: true
      - wait_template: '{{ is_state(''binary_sensor.goodbye_motion_sensors'', ''on'')
          }}

          '
        timeout:
          minutes: 2
        continue_on_timeout: true
      - if:
        - condition: state
          entity_id: binary_sensor.goodbye_motion_sensors
          state: 'off'
        then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.goodbye_routine_active
        - stop: All clear confirmed
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.goodbye_routine_active
  mode: restart
  icon: mdi:motion-sensor
  description: ''
goodbye_routine_all_clear_arm_and_power_off:
  alias: Goodbye Routine - All Clear, Arm and Power Off
  sequence:
  - wait_template: '{{ is_state(''input_boolean.goodbye_routine_active'', ''off'')
      }}

      '
    timeout:
      minutes: 5
    continue_on_timeout: false
  - alias: Failsafe - leaving the house confirms awake, clear stuck asleep flag
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.big_bedroom_asleep
  - data:
      code: ''
    target:
      entity_id: alarm_control_panel.3302_alarm
    action: alarm_control_panel.alarm_arm_away
  - delay:
      seconds: 2
  - target:
      entity_id:
      - light.indoor
      - light.hallway
      - light.galaxy_projector
      - light.kitchen_main_lights
      - light.kitchen_1_color
      - light.kitchen_2_color
      - light.dining_room_bottom
      - light.dining_room_top
      - light.ribbon
      - light.nano_sand_dune
      - light.fluttershy
      - light.office
      - light.office_1
      - light.office_2
      - light.living_room
      - light.bathroom_main_lights
      - light.bathroom_shower
      - light.bathroom_back
      - light.showtime_light
      - light.bedroom
      - light.bedroom_2
      - light.bedroom_ceiling_1
      - light.bedroom_ceiling_2
      - light.bedroom_lamp_1
      - light.bedroom_lamp_2
    action: light.turn_off
    data: {}
  - target:
      entity_id:
      - fan.air_circulator
      - fan.bedroom_purifier
      - fan.big_bedroom_fan
      - fan.kitchen_purifier
      - fan.living_room_fan
      - fan.bedroom2_fan
    action: fan.turn_off
    data: {}
  - target:
      entity_id: input_boolean.goodbye_routine_active
    action: input_boolean.turn_off
    data: {}
  - target:
      entity_id: switch.al_hallway
    action: switch.turn_on
    data: {}
  mode: single
  icon: mdi:shield-lock
  description: ''
goodbye_routine_alexa:
  alias: Goodbye Routine - Alexa
  sequence:
  - data: {}
    action: script.goodbye_routine_main
  mode: single
  icon: mdi:amazon-alexa
  description: ''
funtime_play_playlist:
  alias: 'Funtime - Play Playlist (with retry)'
  description: Shared by the Fun Button automations - sets bedroom volume, plays
    the given Music Assistant media_id on media_player.bedroom_2, retries once if
    playback doesn't start, and notifies if it still hasn't started after two tries.
  fields:
    media_id:
      description: Music Assistant media_id URI to play (e.g. spotify://playlist/... or ytmusic://playlist/...)
      example: spotify://playlist/1GrWlZZ7Kb49epRDuiXUCz
  sequence:
  - alias: Set Sonos volume to 10%
    action: media_player.volume_set
    target:
      entity_id: media_player.bedroom_2
    data:
      volume_level: 0.1
  - alias: Play playlist via Music Assistant (with retry)
    repeat:
      sequence:
      - continue_on_error: true
        action: music_assistant.play_media
        target:
          entity_id: media_player.bedroom_2
        data:
          media_id: '{{ media_id }}'
          media_type: playlist
          radio_mode: false
      - continue_on_error: true
        action: media_player.shuffle_set
        target:
          entity_id: media_player.bedroom_2
        data:
          shuffle: true
      - alias: Give playback a few seconds to start
        wait_template: '{{ is_state(''media_player.bedroom'', ''playing'') }}'
        timeout:
          seconds: 8
        continue_on_timeout: true
      until:
      - alias: Exit the loop once it is playing, or after two attempts. Must be
          an until condition, not a stop action - stop would end the whole script
          run and skip every step after this repeat.
        condition: or
        conditions:
        - condition: state
          entity_id: media_player.bedroom
          state: playing
        - condition: template
          value_template: '{{ repeat.index >= 2 }}'
  - alias: Notify if music still isn't playing after retry
    if:
    - condition: not
      conditions:
      - condition: state
        entity_id: media_player.bedroom
        state: playing
    then:
    - action: notify.mobile_app_pc_iphone
      data:
        title: Fun Button music didn't start
        message: Bedroom Sonos didn't start playing after two tries - speaker may
          be offline.
  mode: queued
  max: 3
  icon: mdi:playlist-music
