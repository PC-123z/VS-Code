script_start_volvo_xc60:
  alias: 'Script: Start Volvo XC60'
  description: Start climatization with immediate Alexa feedback, announce via Sonos
    Piper, activate scenes. Main wrapper script that triggers core routine in background.
  icon: mdi:car
  sequence:
  - alias: Set Volvo start active (immediate Alexa feedback)
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.volvo_start_active
    continue_on_error: true
  - alias: Run Volvo climatization sequence in background
    action: script.turn_on
    target:
      entity_id: script.script_volvo_start_core
    data: {}
    continue_on_error: true
  mode: single
good_morning_routine:
  alias: 'Script: Good Morning Routine'
  description: Staged sunrise wake-up with immediate Alexa feedback, occupancy-driven
    music tail, and 30-min hard cap. Main wrapper that triggers core routine in background.
  icon: mdi:alarm-check
  sequence:
  - alias: Mark routine as active (immediate Alexa feedback)
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.good_morning_active
    continue_on_error: true
  - alias: Run Good Morning sequence in background
    action: script.turn_on
    target:
      entity_id: script.script_good_morning_routine_core
    data: {}
    continue_on_error: true
  mode: single
script_volvo_start_core:
  alias: 'Script: Volvo Start Core'
  description: Core climatization routine - starts car, activates scenes, announces
    via Sonos, sends notifications. Runs in background after main script provides
    Alexa feedback.
  icon: mdi:car
  sequence:
  - alias: Press climatization button
    action: button.press
    target:
      entity_id: button.volvo_xc60_start_climatization
    data: {}
  - alias: Run main sequence and garage in parallel
    parallel:
    - sequence:
      - alias: Activate initial scene (Malibu Pink)
        action: hue.activate_scene
        target:
          entity_id: scene.hallway_malibu_pink
        data:
          transition: 15
      - alias: Announce departure with weather
        action: notify.send_message
        target:
          entity_id:
          - notify.paul_s_sonos_arc_announce
          - notify.echo_show_kitchen_announce
          - notify.office_speaker_announce
          - notify.living_room_dot_announce
          - notify.paul_s_sonos_one_second_edition_announce
        data:
          message: XC60 will be Ready to Depart in 5 Minutes. Current conditions are
            {{ states('weather.forecast_home') }}, {{ state_attr('weather.forecast_home',
            'temperature') }} degrees.
        continue_on_error: true
      - alias: Send departure iPhone notification
        action: notify.mobile_app_pc_iphone
        data:
          message: XC60 will be Ready to Depart in 5 Minutes
          title: Volvo XC60
      - alias: Wait 4 minutes
        delay:
          minutes: 4
      - alias: Activate final scene (Energize)
        action: hue.activate_scene
        target:
          entity_id: scene.hallway_energize
        data:
          transition: 60
      - alias: Announce ready
        action: notify.send_message
        target:
          entity_id:
          - notify.paul_s_sonos_arc_announce
          - notify.echo_show_kitchen_announce
          - notify.office_speaker_announce
          - notify.living_room_dot_announce
          - notify.paul_s_sonos_one_second_edition_announce
        data:
          message: 'Vehicle Ready, Time to Go!!!!  '
        continue_on_error: true
      - alias: Send ready iPhone notification
        action: notify.mobile_app_pc_iphone
        data:
          message: XC60 is Ready to Depart
          title: Car Remote
      - alias: Clear Volvo start active flag
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.volvo_start_active
    - sequence:
      - alias: Open garage if Volvo start active, between 7AM-9PM, not opened recently
        choose:
        - conditions:
          - condition: state
            entity_id: input_boolean.volvo_start_active
            state: 'on'
          - condition: time
            after: 07:00:00
            before: '21:00:00'
          - condition: template
            value_template: '{{ (now() - states.cover.garage.last_changed).total_seconds()
              > 600 }}'
          - condition: not
            conditions:
            - condition: state
              entity_id: cover.garage
              state: open
          sequence:
          - alias: Wait for person detected in garage (up to 10 minutes)
            wait_for_trigger:
            - trigger: state
              entity_id: binary_sensor.garage_occupancy_group
              to: 'on'
            timeout:
              minutes: 10
            continue_on_timeout: false
          - alias: Open garage only if person was detected
            if:
            - condition: template
              value_template: '{{ wait.completed }}'
            then:
            - action: cover.open_cover
              target:
                entity_id: cover.garage
              data: {}
  mode: single
script_good_morning_routine_core:
  alias: 'Script: Good Morning Routine Core'
  description: Delegates to the *Good Morning Routine automation (automation.good_morning_routine_3)
    so the Alexa path and the scheduled sunrise share one source of truth and never
    drift out of sync. All routine logic (sunrise ramp, music, announcement, occupancy
    tail, AL restoration, hard cap) lives in that automation.
  icon: mdi:alarm-check
  sequence:
  - alias: Trigger the canonical Good Morning automation
    action: automation.trigger
    target:
      entity_id: automation.good_morning_routine_3
    data:
      skip_condition: true
  mode: single
goodbye_routine_main:
  alias: Goodbye Routine - Main
  sequence:
  - action: script.goodbye_routine_immediate_actions
    data: {}
  - action: script.goodbye_routine_motion_tracking
    data: {}
  - action: script.goodbye_routine_all_clear_arm_and_power_off
    data: {}
  mode: single
  icon: mdi:logout
  description: ''
goodbye_routine_immediate_actions:
  alias: Goodbye Routine - Immediate Actions
  sequence:
  - continue_on_error: true
    target:
      entity_id:
      - fan.air_circulator
      - fan.bedroom_purifier
      - fan.big_bedroom_fan
      - fan.kitchen_purifier
      - fan.living_room_fan
      - fan.bedroom2_fan
    action: fan.turn_off
    data: {}
  - continue_on_error: true
    target:
      entity_id:
      - media_player.living_room_tv_2
      - media_player.bedroom_tv_2
    action: media_player.turn_off
  - continue_on_error: true
    data:
      with_group: true
    target:
      entity_id:
      - media_player.bathroom
      - media_player.kitchen
      - media_player.bedroom
      - media_player.office
    action: sonos.snapshot
  - continue_on_error: true
    target:
      entity_id:
      - media_player.bathroom
      - media_player.kitchen
      - media_player.bedroom
      - media_player.office
    action: media_player.media_stop
  - continue_on_error: true
    target:
      entity_id:
      - light.galaxy_projector
      - light.kitchen_main_lights
      - light.kitchen_1_color
      - light.kitchen_2_color
      - light.dining_room_bottom
      - light.dining_room_top
      - light.ribbon
      - light.fluttershy
      - light.nano_sand_dune
      - light.office
      - light.office_1
      - light.office_2
      - light.living_room
      - light.bathroom_main_lights
      - light.bathroom_shower
      - light.bathroom_back
      - light.showtime_light
      - light.bedroom
      - light.bedroom_2
      - light.bedroom_ceiling_1
      - light.bedroom_ceiling_2
      - light.bedroom_lamp_1
      - light.bedroom_lamp_2
    action: light.turn_off
  - continue_on_error: true
    data:
      transition: 15
    target:
      entity_id: light.indoor
    action: light.turn_off
  - continue_on_error: true
    target:
      entity_id: switch.al_hallway
    action: switch.turn_off
  - continue_on_error: true
    data:
      brightness_pct: 20
    target:
      entity_id: light.hallway
    action: light.turn_on
  - target:
      entity_id: input_boolean.goodbye_routine_active
    action: input_boolean.turn_on
  mode: single
  icon: mdi:power
  description: ''
goodbye_routine_motion_tracking:
  alias: Goodbye Routine - Motion Tracking
  sequence:
  - repeat:
      count: 3
      sequence:
      - wait_template: '{{ is_state(''binary_sensor.goodbye_motion_sensors'', ''off'')
          }}

          '
        timeout:
          minutes: 2
        continue_on_timeout: true
      - wait_template: '{{ is_state(''binary_sensor.goodbye_motion_sensors'', ''on'')
          }}

          '
        timeout:
          minutes: 2
        continue_on_timeout: true
      - if:
        - condition: state
          entity_id: binary_sensor.goodbye_motion_sensors
          state: 'off'
        then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.goodbye_routine_active
        - stop: All clear confirmed
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.goodbye_routine_active
  mode: restart
  icon: mdi:motion-sensor
  description: ''
goodbye_routine_all_clear_arm_and_power_off:
  alias: Goodbye Routine - All Clear, Arm and Power Off
  sequence:
  - wait_template: '{{ is_state(''input_boolean.goodbye_routine_active'', ''off'')
      }}

      '
    timeout:
      minutes: 5
    continue_on_timeout: false
  - data:
      code: ''
    target:
      entity_id: alarm_control_panel.3302_alarm
    action: alarm_control_panel.alarm_arm_away
  - delay:
      seconds: 2
  - target:
      entity_id:
      - light.indoor
      - light.hallway
      - light.galaxy_projector
      - light.kitchen_main_lights
      - light.kitchen_1_color
      - light.kitchen_2_color
      - light.dining_room_bottom
      - light.dining_room_top
      - light.ribbon
      - light.nano_sand_dune
      - light.fluttershy
      - light.office
      - light.office_1
      - light.office_2
      - light.living_room
      - light.bathroom_main_lights
      - light.bathroom_shower
      - light.bathroom_back
      - light.showtime_light
      - light.bedroom
      - light.bedroom_2
      - light.bedroom_ceiling_1
      - light.bedroom_ceiling_2
      - light.bedroom_lamp_1
      - light.bedroom_lamp_2
    action: light.turn_off
    data: {}
  - target:
      entity_id:
      - fan.air_circulator
      - fan.bedroom_purifier
      - fan.big_bedroom_fan
      - fan.kitchen_purifier
      - fan.living_room_fan
      - fan.bedroom2_fan
    action: fan.turn_off
    data: {}
  - target:
      entity_id: input_boolean.goodbye_routine_active
    action: input_boolean.turn_off
    data: {}
  - target:
      entity_id: switch.al_hallway
    action: switch.turn_on
    data: {}
  mode: single
  icon: mdi:shield-lock
  description: ''
goodbye_routine_alexa:
  alias: Goodbye Routine - Alexa
  sequence:
  - data: {}
    action: script.goodbye_routine_main
  mode: single
  icon: mdi:amazon-alexa
  description: ''
welcome_home_routine:
  alias: Welcome Home Routine
  description: Turns on hallway lights and plays time-appropriate music in the kitchen
    at low volume. Adds bedroom speakers if motion detected. No music after 10 PM.
  sequence:
  - variables:
      current_hour: '{{ now().hour }}'
      is_after_10pm: '{{ current_hour|int >= 22 }}'
  - alias: Turn on hallway lights
    action: light.turn_on
    target:
      entity_id: light.hallway
    data:
      brightness_pct: 60
      transition: 2
  - alias: Check if after 10 PM
    if:
    - condition: template
      value_template: '{{ is_after_10pm }}'
    then:
    - alias: After 10 PM - stay quiet
      action: notify.mobile_app_pc_iphone
      data:
        title: Welcome Home
        message: Hallway lights on. Music skipped (after 10 PM quiet time).
    else:
    - alias: Before 10 PM - play appropriate music
      sequence:
      - alias: Set kitchen volume to 0.10
        action: media_player.volume_set
        target:
          entity_id: media_player.kitchen
        data:
          volume_level: 0.1
      - alias: Play morning music (6 AM - 12 PM)
        if:
        - condition: template
          value_template: '{{ current_hour|int < 12 }}'
        then:
        - continue_on_error: true
          action: music_assistant.play_media
          target:
            entity_id: media_player.kitchen
          data:
            media_id: ytmusic://playlist/VLPLeYXn7QucDIqvGb-zK5u60jWul27Or_YD
            media_type: playlist
        - continue_on_error: true
          action: media_player.shuffle_set
          target:
            entity_id: media_player.kitchen
          data:
            shuffle: true
      - alias: Play afternoon music (12 PM - 5 PM)
        if:
        - condition: template
          value_template: '{{ current_hour|int >= 12 and current_hour|int < 17 }}'
        then:
        - continue_on_error: true
          action: music_assistant.play_media
          target:
            entity_id: media_player.kitchen
          data:
            media_id: ytmusic://playlist/VLPLqJFE8veuwhCu4i1bnYp3ieZ8k9lBNd_q
            media_type: playlist
        - continue_on_error: true
          action: media_player.shuffle_set
          target:
            entity_id: media_player.kitchen
          data:
            shuffle: true
      - alias: Play evening music (5 PM - 10 PM)
        if:
        - condition: template
          value_template: '{{ current_hour|int >= 17 }}'
        then:
        - continue_on_error: true
          action: music_assistant.play_media
          target:
            entity_id: media_player.kitchen
          data:
            media_id: ytmusic://playlist/VLPLiGCyKsnHRzXOPv0c4iO5MAdYGpREZ24y
            media_type: playlist
        - continue_on_error: true
          action: media_player.shuffle_set
          target:
            entity_id: media_player.kitchen
          data:
            shuffle: true
      - alias: Start 45-minute music auto-stop timer
        continue_on_error: true
        action: script.turn_on
        target:
          entity_id: script.welcome_home_music_timeout
  - alias: Check if bedroom motion detected
    if:
    - condition: state
      entity_id: binary_sensor.bedroom_motion
      state: 'on'
    then:
    - alias: Add bedroom to kitchen speaker group
      action: media_player.join
      target:
        entity_id: media_player.kitchen
      data:
        group_members:
        - media_player.bedroom
  - alias: Check if bedroom 2 motion detected
    if:
    - condition: state
      entity_id: binary_sensor.big_bedroom_motion
      state: 'on'
    then:
    - alias: Add bedroom 2 to kitchen speaker group
      action: media_player.join
      target:
        entity_id: media_player.kitchen
      data:
        group_members:
        - media_player.bedroom_2
  mode: single
  icon: mdi:human-greeting
welcome_home_music_timeout:
  alias: Welcome Home Music Timeout
  description: Fades out and stops the kitchen speaker 45 minutes after Welcome
    Home starts music, if it's still playing. Restarts the timer on every new
    Welcome Home trigger.
  sequence:
  - delay:
      minutes: 45
  - condition: state
    entity_id: media_player.kitchen
    state: playing
  - alias: Fade out over ~10 seconds
    repeat:
      count: 5
      sequence:
      - action: media_player.volume_set
        target:
          entity_id: media_player.kitchen
        data:
          volume_level: '{{ [(state_attr(''media_player.kitchen'', ''volume_level'')
            | float(0)) - 0.02, 0] | max }}'
      - delay:
          seconds: 2
  - action: media_player.media_pause
    target:
      entity_id: media_player.kitchen
  mode: restart
  icon: mdi:volume-off
