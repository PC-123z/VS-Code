ui:
  timezone: America/Kentucky/Louisville

version: 0.16-0

auth:
  enabled: false

mqtt:
  enabled: true
  host: 192.168.70.155
  user: mqtt_user
  password: mqtt_user50221

detectors:
  ov_0:
    type: openvino
    device: GPU
    num_threads: 2
  ov_1:
    type: openvino
    device: GPU
    num_threads: 2

model:
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr

ffmpeg:
  hwaccel_args: -hwaccel vaapi -hwaccel_device /dev/dri/renderD128 -hwaccel_output_format vaapi
  input_args: preset-rtsp-restream-low-latency
  output_args:
    record: -f segment -segment_time 10 -segment_format mp4 -reset_timestamps 1 
      -strftime 1 -c copy -an

objects:
  track:
    - person
    - car

record:
  enabled: true
  alerts:
    pre_capture: 5
    post_capture: 30
    retain:
      days: 7
      mode: active_objects
  detections:
    pre_capture: 5
    post_capture: 30
    retain:
      days: 7
      mode: active_objects

snapshots:
  enabled: true
  clean_copy: true
  retain:
    default: 7

go2rtc:
  rtsp:
    listen: :8554
  webrtc:
    listen: :8555
    candidates:
      - 192.168.70.155:8555
  streams:
    driveway_main:
      - rtsp://admin:Cameron20778@192.168.70.98:554/h264Preview_01_main
      - '#restream'
    driveway_sub:
      - rtsp://admin:Cameron20778@192.168.70.98:554/h264Preview_01_sub
      - '#restream'

    front_door:
      - ffmpeg:http://192.168.70.99/flv?port=1935&app=bcs&stream=channel0_main.bcs&user=admin&password=Cameron20778#video=copy#audio=copy#audio=opus
      - '#restream'
    front_door_sub:
      - ffmpeg:http://192.168.70.99/flv?port=1935&app=bcs&stream=channel0_ext.bcs&user=admin&password=Cameron20778
      - '#restream'

    garage:
      - rtsp://admin:Cameron20778@192.168.70.101:554/h264Preview_01_main
      - '#restream'
    garage_sub:
      - rtsp://admin:Cameron20778@192.168.70.101:554/h264Preview_01_sub
      - '#restream'

    kitchen:
      - rtsp://admin:Cameron20778@192.168.70.97:554/h264Preview_01_main
      - '#restream'
    kitchen_sub:
      - rtsp://admin:Cameron20778@192.168.70.97:554/h264Preview_01_sub
      - '#restream'

    living_room:
      - rtsp://admin:Cameron20778@192.168.70.102:554/h264Preview_01_main
      - '#restream'
    living_room_sub:
      - rtsp://admin:Cameron20778@192.168.70.102:554/h264Preview_01_sub
      - '#restream'

cameras:
  driveway:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/driveway_main
          roles: [record]
          input_args: >-
            -rtsp_transport tcp
            -fflags +genpts+discardcorrupt
            -flags low_delay
        - path: rtsp://127.0.0.1:8554/driveway_sub
          roles: [detect]
          input_args: >-
            -rtsp_transport tcp
            -fflags +genpts+discardcorrupt
            -flags low_delay
    detect:
      width: 1920
      height: 576
      fps: 4
    objects:
      mask: 
        0.257,0.988,0.387,0.596,0.385,0.541,0.403,0.468,0.414,0.434,0.607,0.407,0.667,0.602,0.762,0.92,0.783,0.991
    zones:
      Mail:
        coordinates: 0.625,0.446,0.668,0.44,0.663,0.269,0.605,0.26,0.611,0.446
        loitering_time: 3
      Trash:
        coordinates: 0.404,0.477,0.453,0.474,0.467,0.394,0.417,0.385
        loitering_time: 3
      Driveway:
        coordinates: 
          0.784,0.985,0.757,0.557,0.682,0.575,0.63,0.468,0.404,0.483,0.385,0.535,0.388,0.609,0.255,0.994
        loitering_time: 0
    review:
      alerts:
        required_zones:
          - Mail
          - Trash
          - Driveway
      detections:
        required_zones:
          - Mail
          - Trash
          - Driveway
    motion:
      threshold: 40
      contour_area: 20
      improve_contrast: true

  front_door:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/front_door
          roles: [record]
          input_args: >-
            -rtsp_transport tcp
            -fflags +genpts+discardcorrupt
            -flags low_delay
        - path: rtsp://127.0.0.1:8554/front_door_sub
          roles: [detect]
          input_args: >-
            -rtsp_transport tcp
            -fflags +genpts+discardcorrupt
            -flags low_delay
    detect:
      width: 640
      height: 480
      fps: 7

  garage:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/garage
          roles: [record]
          input_args: >-
            -rtsp_transport tcp
            -use_wallclock_as_timestamps 1
            -fflags +genpts+discardcorrupt
            -flags low_delay
        - path: rtsp://127.0.0.1:8554/garage_sub
          roles: [detect]
          input_args: >-
            -rtsp_transport tcp
            -use_wallclock_as_timestamps 1
            -fflags +genpts+discardcorrupt
            -flags low_delay
    detect:
      width: 1280
      height: 720
      fps: 5
    objects:
      filters:
        person:
          min_score: 0.65
          threshold: 0.75
          min_area: 5000

  kitchen:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/kitchen
          roles: [record]
          input_args: >-
            -rtsp_transport tcp
            -use_wallclock_as_timestamps 1
            -fflags +genpts+discardcorrupt
            -flags low_delay
        - path: rtsp://127.0.0.1:8554/kitchen_sub
          roles: [detect]
          input_args: >-
            -rtsp_transport tcp
            -use_wallclock_as_timestamps 1
            -fflags +genpts+discardcorrupt
            -flags low_delay
    detect:
      width: 1280
      height: 720
      fps: 5
    objects:
      filters:
        person:
          min_score: 0.65
          threshold: 0.75
          min_area: 5000
    motion:
      threshold: 55
      contour_area: 10
      improve_contrast: true

  living_room:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/living_room
          roles: [record]
          input_args: >-
            -rtsp_transport tcp
            -use_wallclock_as_timestamps 1
            -fflags +genpts+discardcorrupt
            -flags low_delay
        - path: rtsp://127.0.0.1:8554/living_room_sub
          roles: [detect]
          input_args: >-
            -rtsp_transport tcp
            -use_wallclock_as_timestamps 1
            -fflags +genpts+discardcorrupt
            -flags low_delay
    detect:
      width: 1280
      height: 720
      fps: 5
    objects:
      filters:
        person:
          min_score: 0.65
          threshold: 0.75
          min_area: 5000

detect:
  enabled: true
semantic_search:
  enabled: true
  model_size: small
face_recognition:
  enabled: false
  model_size: small
lpr:
  enabled: false
classification:
  bird:
    enabled: false
